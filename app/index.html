    const {w, h} = newSize(), where = st.at === 0 ? '文件最前面' : `第 ${st.at} 頁之後`;
    $b('#apSum').innerHTML = `將在<b>${where}</b>加入 <b>${st.count}</b> 頁空白頁（${mm(w)} × ${mm(h)} mm），完成後新頁為第 <b>${st.at + 1}${st.count > 1 ? '–' + (st.at + st.count) : ''}</b> 頁，文件共 <b>${n + st.count}</b> 頁。`;
    if (okBtn) okBtn.textContent = `確定加入 ${st.count} 頁`;
    if (scroll) grp.scrollIntoView({inline:'center', block:'nearest'});
  };
  const setCount = v => { v = parseInt(v, 10); if (v >= 1 && v <= 200) { st.count = v; update({scroll:false}); } };
  body.querySelectorAll('[data-st]').forEach(b => b.onclick = () => setCount(clamp(st.count + +b.dataset.st, 1, 200)));
  $b('#apCount').oninput = () => setCount($b('#apCount').value);
  $b('#apCount').onblur = () => { $b('#apCount').value = st.count; };
  $b('#apChips').onclick = e => { const b = e.target.closest('[data-k]'); if (b) setCount(b.dataset.k); };
  $b('#apSize').onchange = () => { st.size = $b('#apSize').value; update({scroll:false}); };
  $b('#apOri').onchange = () => { st.ori = $b('#apOri').value; update({scroll:false}); };
  $b('#apPos').onchange = () => {
    const v = $b('#apPos').value;
    if (v === 'after') st.at = cur + 1; else if (v === 'before') st.at = cur; else if (v === 'start') st.at = 0; else if (v === 'end') st.at = n;
    update();
  };
  $b('#apAt').oninput = () => { const k = parseInt($b('#apAt').value, 10); if (k >= 0 && k <= n) { st.at = k; update(); } };
  // click a page: insert after it
  strip.addEventListener('click', e => { const c = e.target.closest('.ap-pg'); if (c && !dragMoved) { st.at = +c.dataset.i + 1; update(); } });
  // drag the new-page block
  let drag = null, dragMoved = false;
  const gapAt = x => { for (let k = 0; k < n; k++) { const r = cards[k].getBoundingClientRect(); if (x < r.left + r.width / 2) return k; } return n; };
  const showMark = gap => {
    const sr = strip.getBoundingClientRect();
    let x;
    if (gap < n) x = cards[gap].getBoundingClientRect().left - 6; else x = cards[n - 1].getBoundingClientRect().right + 6;
    mark.style.left = (x - sr.left + strip.scrollLeft) + 'px'; mark.style.display = 'block';
  };
  grp.addEventListener('pointerdown', e => {
    e.preventDefault(); grp.setPointerCapture(e.pointerId);
    dragMoved = false;
    drag = {x0:e.clientX, y0:e.clientY, x:e.clientX, gap:st.at, ghost:null, raf:0};
  });
  grp.addEventListener('pointermove', e => {
    if (!drag) return;
    drag.x = e.clientX;
    if (!dragMoved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 5) return;
    if (!dragMoved) {
      dragMoved = true;
      drag.ghost = grp.querySelector('.stack').cloneNode(true); drag.ghost.classList.add('ap-ghost'); document.body.appendChild(drag.ghost);
      grp.classList.add('dragging');
      const tick = () => {   // auto-scroll near the edges of the strip
        if (!drag) return;
        const r = strip.getBoundingClientRect();
        if (drag.x < r.left + 60) strip.scrollLeft -= 14; else if (drag.x > r.right - 60) strip.scrollLeft += 14;
        drag.gap = gapAt(drag.x); showMark(drag.gap);
        drag.raf = requestAnimationFrame(tick);
      };
      drag.raf = requestAnimationFrame(tick);
    }
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
    drag.gap = gapAt(e.clientX); showMark(drag.gap);
  });
  const endDrag = () => {
    if (!drag) return;
    cancelAnimationFrame(drag.raf);
    if (drag.ghost) drag.ghost.remove();
    grp.classList.remove('dragging'); mark.style.display = 'none';
    const moved = dragMoved, gap = drag.gap; drag = null;
    if (moved) { st.at = gap; update(); setTimeout(() => { dragMoved = false; }, 0); }
  };
  grp.addEventListener('pointerup', endDrag); grp.addEventListener('pointercancel', endDrag);
  const res = await openModal({title:'新增空白頁', body, width:Math.min(920, innerWidth - 40), buttons:[
    {label:'取消', value:null},
    {label:'確定加入 1 頁', primary:true, id:'apOk', handler:() => ({...st, ...newSize()})}],
    onOpen:(mb, mf) => { okBtn = mf.querySelector('#apOk'); update(); }});
  obs.disconnect();
  if (!res) return;
  const {at, count, w, h, size} = res;
  await mutate(`已在${at === 0 ? '文件最前面' : `第 ${at} 頁之後`}加入 ${count} 頁空白頁`, doc => {
    const ref = doc.getPage(cur), rot = ref.getRotation().angle;
    // "same size" copies the reference page's media box and rotation; standard sizes are upright
    const base = size === 'same' ? ref.getSize() : {width:w, height:h};
    for (let k = 0; k < count; k++) {
      const np = doc.insertPage(at + k, [base.width, base.height]);
      if (size === 'same' && rot) np.setRotation(degrees(rot));
    }
    S.current = at;
  }, {scrollToCurrent:true, highlight:{from:at, count, label:'新增的空白頁'}});
}

// 排列頁面: all pages in a grid; drag them into a new order, then apply it in one step (undo puts it back)
async function openArrange(){
  if (!S.pdf || S.pages.length < 2) return;
  const n = S.pages.length, H = 120, ord = [...Array(n).keys()];   // ord[p] = the page (old index) now at place p
  const body = document.createElement('div');
  body.innerHTML = `<div class="ar-top"><div class="flab">🖱 用滑鼠<b>拖曳頁面</b>到想放的位置；底下會顯示新的頁碼和原本是第幾頁</div>
      <button class="btn" id="arReset">還原原本順序</button></div>
    <div class="ar-grid" id="arGrid"><div class="ar-mark" id="arMark"></div></div>
    <div class="ar-sum" id="arSum"></div>`;
  const grid = body.querySelector('#arGrid'), mark = body.querySelector('#arMark');
  const cards = S.pages.map((pg, i) => {
    const d = document.createElement('div'); d.className = 'ar-pg'; d.dataset.i = i;
    d.innerHTML = `<div class="b" style="width:${Math.round(H * pg.w / pg.h)}px;height:${H}px"></div><span class="lb"></span>`;
    grid.appendChild(d); return d;
  });
  const obs = new IntersectionObserver(ents => ents.forEach(en => {
    if (!en.isIntersecting) return; obs.unobserve(en.target);
    pageThumb(+en.target.dataset.i, H).then(u => { if (u) { const im = new Image(); im.src = u; im.draggable = false; en.target.querySelector('.b').appendChild(im); } });
  }), {root:grid, rootMargin:'300px 0px'});
  cards.forEach(c => obs.observe(c));
  let okBtn = null;
  const moved = () => ord.filter((i, p) => i !== p).length;
  const update = () => {
    ord.forEach((i, p) => {
      const c = cards[i]; grid.appendChild(c);
      c.classList.toggle('moved', i !== p);
      c.querySelector('.lb').textContent = `第 ${p + 1} 頁${i !== p ? `（原 ${i + 1}）` : ''}`;
    });
    const m = moved();
    body.querySelector('#arSum').innerHTML = m ? `已調整 <b>${m}</b> 頁的順序，按「套用新順序」完成。` : `文件共 <b>${n}</b> 頁，目前是原本的順序。`;
    body.querySelector('#arReset').disabled = !m;
    if (okBtn) okBtn.disabled = !m;
  };
  body.querySelector('#arReset').onclick = () => { ord.splice(0, n, ...[...Array(n).keys()]); update(); };
  // where a drop at (x, y) goes: in the row under the pointer, before the first card whose middle is right of x
  // (or after the row's last card); returns the place and that row's top
  const rectAt = p => cards[ord[p]].getBoundingClientRect();
  const gapAt = (x, y) => {
    const rs = ord.map((_, p) => rectAt(p)), tops = [...new Set(rs.map(r => Math.round(r.top)))].sort((a, b) => a - b);
    let row = tops[0]; for (const t of tops) if (y >= t - 9) row = t;
    let last = -1;
    for (let p = 0; p < rs.length; p++) {
      if (Math.round(rs[p].top) !== row) continue;
      if (x < rs[p].left + rs[p].width / 2) return {gap:p, row};
      last = p;
    }
    return {gap:last + 1, row};
  };
  // the red line: left of the card that will follow, or right of the row's last card
  const showMark = ({gap, row}) => {
    const gr = grid.getBoundingClientRect(), next = gap < n ? rectAt(gap) : null, before = next && Math.round(next.top) === row;
    const r = before ? next : rectAt(gap - 1), x = before ? r.left - 7 : r.right + 7;
    mark.style.left = (x - gr.left + grid.scrollLeft) + 'px'; mark.style.top = (r.top - gr.top + grid.scrollTop) + 'px';
    mark.style.height = r.height + 'px'; mark.style.display = 'block';
  };
  let drag = null;
  grid.addEventListener('pointerdown', e => {
    const c = e.target.closest('.ar-pg'); if (!c || e.button !== 0) return;
    e.preventDefault(); grid.setPointerCapture(e.pointerId);
    drag = {i:+c.dataset.i, card:c, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, on:false, at:null, ghost:null, raf:0};
  });
  grid.addEventListener('pointermove', e => {
    if (!drag) return;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.on) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 5) return;
      drag.on = true; drag.card.classList.add('dragging');
      const b = drag.card.querySelector('.b'); drag.ghost = b.cloneNode(true); drag.ghost.className = 'ar-ghost';
      drag.ghost.style.width = b.style.width; drag.ghost.style.height = b.style.height; document.body.appendChild(drag.ghost);
      const tick = () => {   // scroll near the top and bottom edges
        if (!drag) return;
        const r = grid.getBoundingClientRect();
        if (drag.y < r.top + 50) grid.scrollTop -= 14; else if (drag.y > r.bottom - 50) grid.scrollTop += 14;
        drag.at = gapAt(drag.x, drag.y); showMark(drag.at);
        drag.raf = requestAnimationFrame(tick);
      };
      drag.raf = requestAnimationFrame(tick);
    }
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
    drag.at = gapAt(e.clientX, e.clientY); showMark(drag.at);

/* ---------------- writing back to the opened file ----------------
   When the browser supports the File System Access API, a PDF opened through the
   picker (or dragged in) keeps a handle, and every edit is written straight back
   into that same file. Otherwise saving downloads a file with the original name. */
const canPick = () => !!DESK || typeof window.showOpenFilePicker === 'function';
function desktopHandle(p, name){
  return {kind:'file', name, path:p,
    queryPermission: async () => 'granted', requestPermission: async () => 'granted',
    getFile: async () => { const r = await DESK.readFile(p); return new File([r.data], r.name, {type:'application/pdf'}); },
    createWritable: async () => { const parts = []; return {
      write: async b => { parts.push(b); },
      close: async () => { await DESK.writeFile(p, new Uint8Array(await new Blob(parts).arrayBuffer())); },
    }; },
  };
}
async function openPath(p){
  try {
    const r = await DESK.readFile(p);
    await openFile(new File([r.data], r.name, {type:'application/pdf'}), desktopHandle(p, r.name));
  } catch (e) { toast('無法開啟檔案：' + (e.message || e), 'err'); }
}
let permAsk = null;
function primeWrite(){
  // must run synchronously inside the click so the permission prompt is allowed
  if (!S.handle || !S.autoWrite || !S.handle.requestPermission) return null;
  permAsk = S.handle.queryPermission({mode:'readwrite'})
    .then(st => st === 'granted' ? st : S.handle.requestPermission({mode:'readwrite'}))
    .catch(() => 'denied');
  return permAsk;
}
async function writeBack(bytes, {quiet = false} = {}){
  if (!S.handle) return false;
  const h = S.handle, doc = activeDoc();
  const run = async () => {
    let st = permAsk ? await permAsk : await h.queryPermission({mode:'readwrite'}).catch(() => 'denied');
    permAsk = null;
    if (st !== 'granted') st = await h.requestPermission({mode:'readwrite'}).catch(() => 'denied');
    if (st !== 'granted') throw new Error('沒有寫入原檔的權限');
    const w = await h.createWritable();
    await w.write(new Blob([bytes], {type:'application/pdf'}));
    await w.close();
  };
  // serialize writes so a fast series of edits never interleaves
  const prev = S.writing || Promise.resolve();
  const job = prev.catch(() => {}).then(run);
  S.writing = job;
  try {
    await job;
    if (doc === activeDoc()) { if (S.bytes === bytes) S.dirty = false; }
    else if (doc && doc.bytes === bytes) doc.dirty = false;
    updateUI();
    if (!quiet) toast('已存回原檔 ' + S.name);
    return true;
  } catch (e) {
    console.error(e);
    toast('無法寫回原檔：' + (e.message || e) + '，可按「儲存」另存', 'err');
    return false;
  }
}

/* ---------------- page picker (shared by 減頁 and 插入PDF) ---------------- */
function parseRange(txt, n){
  const out = new Set();
  txt = String(txt).replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/～/g, '~')
    .replace(/\s*([-~－–])\s*/g, '$1');   // 「1 - 3」 is one range, not 1, a dash, 3
  for (const part of txt.replace(/[，、；;\s]+/g, ',').split(',')) {
    if (!part) continue;
    const m = /^(\d*)[-~－–](\d*)$/.exec(part);
    if (m && !m[1] && !m[2]) return null;   // a dash alone
    if (m) {
      const a = m[1] ? +m[1] : 1, b = m[2] ? +m[2] : n;
      for (let k = Math.min(a, b); k <= Math.max(a, b); k++) if (k >= 1 && k <= n) out.add(k - 1);
    } else if (/^\d+$/.test(part)) { const k = +part; if (k >= 1 && k <= n) out.add(k - 1); }
    else return null;
  }
  return out;
}
function rangeText(sel){
  const a = [...sel].sort((x, y) => x - y), out = [];
  for (let k = 0; k < a.length; k++) {
    let j = k; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++;
    out.push(j > k ? `${a[k] + 1}-${a[j] + 1}` : `${a[k] + 1}`); k = j;
  }
  return out.join(', ');
}
// groups: [{label, start, count}] — the pages come from several files, one after another; each gets a heading

async function pagePicker({title, mode, count, initial = [], current = -1, getPage, okLabel, note, warn, validate, footer, sizes, groups = null}){
  const sel = new Set(initial);
  const body = document.createElement('div');
  body.innerHTML = `${warn ? `<div class="note warn" style="margin-bottom:10px">${esc(warn)}</div>` : ''}${note ? `<div class="note" style="margin-bottom:10px;white-space:pre-line">${esc(note)}</div>` : ''}
    <div class="pp-bar">
      <button class="mini" data-b="all">全選</button><button class="mini" data-b="none">全不選</button><button class="mini" data-b="inv">反向選取</button>

      h.textContent = `${g.label} · 第 ${g.start + 1}${g.count > 1 ? '–' + (g.start + g.count) : ''} 頁`;
      grid.appendChild(h);
    }

    const ar = sizes && sizes[i] ? sizes[i].h / sizes[i].w : 1.414;
    c.innerHTML = `<span class="ck">✓</span><div class="th" style="aspect-ratio:${1 / ar}">${i + 1}</div><span class="num">第 ${i + 1} 頁</span>`;
    grid.appendChild(c); cards.push(c);
  }
  let last = -1, okBtn = null;

    cards.forEach((c, i) => c.classList.toggle('on', sel.has(i)));
    body.querySelector('#ppCnt').innerHTML = `已選 <b>${sel.size}</b> / ${count} 頁`;
    if (okBtn) { okBtn.textContent = okLabel(sel.size); okBtn.disabled = !!(validate && validate([...sel])); okBtn.title = validate ? validate([...sel]) : ''; }
    const ri = body.querySelector('#ppRange'); if (document.activeElement !== ri) ri.value = rangeText(sel);
  };
  grid.addEventListener('click', e => {
    const c = e.target.closest('.pp-card'); if (!c) return;
    const i = +c.dataset.i;
    if (e.shiftKey && last >= 0) { const on = !sel.has(i); for (let k = Math.min(last, i); k <= Math.max(last, i); k++) on ? sel.add(k) : sel.delete(k); }
    else sel.has(i) ? sel.delete(i) : sel.add(i);
    last = i; sync();
  });
  const applyRange = () => {
    const r = parseRange(body.querySelector('#ppRange').value, count);
    if (!r) { toast('頁碼範圍格式不正確，例如：1-3, 5, 8-', 'err'); return; }
    sel.clear(); r.forEach(k => sel.add(k)); body.querySelector('#ppRange').blur(); sync();
  };
  body.querySelector('.pp-bar').addEventListener('click', e => {
    const b = e.target.dataset.b; if (!b) return;
    if (b === 'all') for (let k = 0; k < count; k++) sel.add(k);
    if (b === 'none') sel.clear();
    if (b === 'inv') for (let k = 0; k < count; k++) sel.has(k) ? sel.delete(k) : sel.add(k);
    if (b === 'range') { applyRange(); return; }
    sync();
  });
  body.querySelector('#ppRange').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyRange(); } });
  body.querySelector('#ppSize').addEventListener('input', e => grid.style.setProperty('--tw', e.target.value + 'px'));

  const done = new Set();
  const obs = new IntersectionObserver(ents => ents.forEach(async en => {
    if (!en.isIntersecting) return;
    const c = en.target, i = +c.dataset.i; obs.unobserve(c); if (done.has(i)) return; done.add(i);
    try {
      const page = await getPage(i), th = c.querySelector('.th');
      const dpr = window.devicePixelRatio || 1, vp1 = page.getViewport({scale:1});
      const vp = page.getViewport({scale:Math.min(3, 240 * dpr / vp1.width)});
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;

      await page.render({canvasContext:cv.getContext('2d'), viewport:vp, annotationMode:pdfjsLib.AnnotationMode.ENABLE}).promise;
      th.textContent = ''; th.appendChild(cv);
    } catch (_) {}
  }), {root:grid, rootMargin:'300px'});
  cards.forEach(c => obs.observe(c));
  const res = await openModal({title, body, width:Math.min(1000, innerWidth - 40), buttons:[
    {label:'取消', value:null},
    {label:okLabel(sel.size), primary:true, id:'ppOk', handler:() => {
      const err = validate && validate([...sel]); if (err) { toast(err, 'err'); return; }
      const extra = {}; body.querySelectorAll('[data-x]').forEach(el => extra[el.dataset.x] = el.value);
      return {sel:[...sel].sort((a, b) => a - b), extra};
    }}],
    onOpen:(mb, mf) => {
      okBtn = mf.querySelector('#ppOk'); sync();
      if (current >= 0) setTimeout(() => cards[current] && cards[current].scrollIntoView({block:'center'}), 30);
    }});

$('#fInsert').addEventListener('change', async e => {

// one source of pages for the insert picker: the chosen file, or a PDF inside it. 「限制編輯」 files are decrypted (their
// pages could not be copied otherwise); one encrypted in a way that cannot be decrypted is refused
async function insertSource(raw, name, worker){
  const rd = await readablePdf(raw), bytes = rd.bytes;
  const src = await pdfjsLib.getDocument({...PDF_OPTS, data:bytes.slice(), worker}).promise;
  try {
    if (rd.state === 'unsupported') {
      const m = await src.getMetadata().catch(() => null);
      if (m && m.info && m.info.EncryptFilterName) { const e = new Error('encryption'); e.name = 'UnsupportedEncryption'; throw e; }
    }
    const sizes = [];
    for (let i = 1; i <= Math.min(src.numPages, 400); i++) { const pg = await src.getPage(i), v = pg.getViewport({scale:1}); sizes.push({w:v.width, h:v.height}); }
    return {name, bytes, src, n:src.numPages, sizes};
  } catch (e) { src.destroy(); throw e; }
}
// a dynamic XFA form: its pages are made by Adobe's reader from the form; the PDF only holds a placeholder page
async function needsRendering(bytes){
  try { const d = await PDFDocument.load(bytes, {ignoreEncryption:true, updateMetadata:false}), v = d.catalog.lookup(PDFName.of('NeedsRendering')); return v instanceof PDFLib.PDFBool && v.asBoolean(); }
  catch (_) { return false; }
}
const XFA_WARN = '這個檔案是 XFA 動態表單：表單真正的內容要用 Adobe Acrobat 或 Adobe Reader 開啟才看得到，這裡只讀得到預留的頁面。'
  + '請先用 Adobe Reader 開啟它，按「列印」、印表機選「Microsoft Print to PDF」另存成一般 PDF，再插入存出來的檔案。';
async function insertFromPdf(file){
  if (!S.pdf) return;
  busy(true, '讀取 PDF…');
  // the file's own pages, then the PDFs inside it: a PDF portfolio (PDF 包) keeps its documents as attached files and
  // shows only a cover page; any PDF can carry attached PDFs
  const srcs = [], skipped = [], worker = new pdfjsLib.PDFWorker();   // (one pdf.js worker for all of them)
  const done = () => Promise.all(srcs.map(x => x.src.destroy().catch(() => {}))).then(() => worker.destroy());
  let portfolio = false, xfa = false;
  try {
    srcs.push(await insertSource(new Uint8Array(await file.arrayBuffer()), file.name, worker));
    const meta = await srcs[0].src.getMetadata().catch(() => null), info = (meta && meta.info) || {};
    portfolio = !!info.IsCollectionPresent;
    xfa = !!info.IsXFAPresent && await needsRendering(srcs[0].bytes);
    const atts = Object.values((await srcs[0].src.getAttachments().catch(() => null)) || {})
      .sort((a, b) => String(a.filename).localeCompare(String(b.filename), 'zh-Hant', {numeric:true}));
    for (const a of atts) {
      if (!isPdfBytes(a.content)) { skipped.push(`${a.filename}（不是 PDF）`); continue; }
      try { srcs.push(await insertSource(new Uint8Array(a.content), a.filename, worker)); }
      catch (e) { skipped.push(`${a.filename}（${e && e.name === 'PasswordException' ? '需要密碼' : e && e.name === 'UnsupportedEncryption' ? '加密方式無法處理' : '讀不到'}）`); }
    }
  } catch (e) {
    busy(false); done();
    toast(e && e.name === 'PasswordException' ? '此 PDF 受密碼保護，無法匯入' : e && e.name === 'UnsupportedEncryption' ? '這份 PDF 的加密方式無法處理，不能插入它的頁面'
      : '無法讀取此 PDF：' + (e.message || e), 'err');

  const n = start, inner = srcs.length - 1, cur = S.current + 1, tot = S.pages.length;
  const where = i => { let k = groups.length - 1; while (k > 0 && groups[k].start > i) k--; return {x:groups[k].x, p:i - groups[k].start}; };
  // ticked at first: a portfolio's documents (not its cover); otherwise the file's own pages; nothing for an XFA form
  const initial = [];
  groups.forEach((g, k) => { if (k ? portfolio : !(portfolio && inner) && !xfa) for (let i = 0; i < g.count; i++) initial.push(g.start + i); });
  const notes = [portfolio && inner ? `這是 PDF 包：下面依序列出封面和裡面 ${inner} 個 PDF 的頁面，預設勾選 PDF 的頁面（不含封面）。`
    : inner ? `這個 PDF 附有 ${inner} 個 PDF 檔：它們的頁面列在後面，預設沒有勾選。` : '',
    `勾選要匯入的頁面${inner || xfa ? '' : '（預設全選'}${inner || xfa ? '（' : '，'}可按住 Shift 連續選取），並選擇要插入的位置。`,
    skipped.length ? `不能插入：${skipped.join('、')}。` : ''].filter(Boolean);
  const footer = `<span class="flab">插入位置</span>
    <select data-x="pos">
      <option value="after" selected>目前頁（第 ${cur} 頁）之後</option>
      <option value="before">目前頁（第 ${cur} 頁）之前</option>
      <option value="start">文件最前面</option>
      <option value="end">文件最後面（第 ${tot} 頁之後）</option>
      <option value="at">指定頁碼之後…</option>
    </select>
    <span id="atWrap" style="display:none">第 <input type="text" data-x="at" value="${cur}" style="width:56px;font:inherit;border:1px solid var(--line2);border-radius:7px;padding:5px 8px;text-align:center"> 頁之後（0 = 最前面）</span>
    <span class="flab" style="margin-left:auto">來源：${esc(file.name)}${portfolio && inner ? `（PDF 包，內含 ${inner} 個 PDF）` : inner ? `（附有 ${inner} 個 PDF）` : ''} · 共 ${n} 頁</span>`;
  const picker = pagePicker({
    title:'從其他 PDF 插入頁面', mode:'insert', count:n, initial,
    getPage:i => { const w = where(i); return w.x.src.getPage(w.p + 1); },
    sizes:groups.flatMap(g => Array.from({length:g.count}, (_, i) => g.x.sizes[i])), groups:groups.length > 1 ? groups : null,
    okLabel:k => k ? `插入 ${k} 頁` : '插入',
    note:notes.join('\n'), warn:xfa ? XFA_WARN : '',
    validate:sel => sel.length ? '' : '請至少勾選一頁', footer,
  });
  setTimeout(() => {
    const ps = document.querySelector('select[data-x=pos]');
    if (ps) ps.onchange = () => { $('#atWrap').style.display = ps.value === 'at' ? '' : 'none'; };
  }, 0);
  const res = await picker;
  setTimeout(done, 300);
  if (!res) return;
  const pos = res.extra.pos;
  let at;
  if (pos === 'after') at = S.current + 1;
  else if (pos === 'before') at = S.current;
  else if (pos === 'start') at = 0;
  else if (pos === 'end') at = tot;
  else { const k = parseInt(res.extra.at, 10); if (!(k >= 0 && k <= tot)) { toast(`頁碼需介於 0 到 ${tot}`, 'err'); return; } at = k; }
  const picked = res.sel.map(where);   // in page order, each from its own source
  await mutate(`已從「${file.name}」插入 ${res.sel.length} 頁`, async doc => {
    const copies = new Map();
    for (const x of srcs) {

}

window.addEventListener('pointermove', e => { PTR = {x:e.clientX, y:e.clientY}; }, {passive:true});
function updateClipUI(){
  const el = $('#stClip'); if (!el) return;
  if (LAST_CLIP === 'note' && NOTE_CLIP) {
    const t = NOTE_CLIP.contents.replace(/\s+/g, ' ').trim();
    el.innerHTML = `<span title="按 Ctrl+V 貼到滑鼠所在的位置">📋 剪貼簿：便利貼「${esc(t.slice(0, 12))}${t.length > 12 ? '…' : ''}」</span>`;
  } else el.innerHTML = PAGE_CLIP ? `<span title="可在任何分頁按 Ctrl+V 貼上">📋 剪貼簿：${PAGE_CLIP.count} 頁（${esc(PAGE_CLIP.from)} 第 ${esc(PAGE_CLIP.range)} 頁）</span>` : '';
  const b = $('#bPaste'); if (b) { b.disabled = !S.pdf || !PAGE_CLIP; b.title = '貼上頁面到目前頁之後' + (LAST_CLIP === 'note' ? '' : ' (Ctrl+V)'); }
}
function copyNote(i, a, msg = '已複製便利貼，按 Ctrl+V 貼到滑鼠所在的位置'){

// on the page under the mouse, the icon centred on it; with the mouse elsewhere, on the current page a little right of
// and below where the copied note was. The author stays who wrote it; one undo step.
async function pasteNote(){
  const clip = NOTE_CLIP; if (!clip || !S.pdf) return;
  let i = -1, icon = null;
  const over = PTR && document.elementFromPoint(PTR.x, PTR.y), pel = over && over.closest && over.closest('.page');
  if (pel && pagesEl.contains(pel)) {
    i = +pel.dataset.i;
    const pg = S.pages[i], p = pagePointXY(i, PTR.x, PTR.y);
    icon = {x:clamp(p.x - 10, 0, pg.w - 20), y:clamp(p.y - 10, 0, pg.h - 20), w:20, h:20};
  } else {
    i = S.current;
    const pg = S.pages[i];
    icon = {x:clamp(clip.x + 16, 0, pg.w - 20), y:clamp(clip.y + 16, 0, pg.h - 20), w:20, h:20};
  }
  const box = {...noteDefaults(icon, S.pages[i]), w:clip.pw, h:clip.ph};
  await createNote(i, icon, clip.contents, box, {author:clip.author, label:'已貼上便利貼'});
}
async function copySelected(cut){
  if (!S.pdf) return;
  const sel = selectedPages(), n = S.pages.length;
  if (cut && sel.length >= n) { toast('不能剪下全部頁面，文件至少要保留一頁', 'err'); return; }
  busy(true, cut ? '剪下頁面中…' : '複製頁面中…');
  try {
    const src = await PDFDocument.load(S.bytes, {ignoreEncryption:true, updateMetadata:false});
    const out = await PDFDocument.create();
    (await out.copyPages(src, sel)).forEach(p => out.addPage(p));
    PAGE_CLIP = {bytes:await out.save(), count:sel.length, from:S.name, range:rangeText(sel)}; LAST_CLIP = 'pages';
  } catch (e) { console.error(e); toast('複製失敗：' + (e.message || e), 'err'); return; }
  finally { busy(false); }
  updateClipUI();
  if (!cut) { toast(`已複製 ${sel.length} 頁（第 ${rangeText(sel)} 頁），可在任何分頁按 Ctrl+V 貼上`); return; }
  await mutate(`已剪下 ${sel.length} 頁（第 ${rangeText(sel)} 頁），可在任何分頁貼上`, doc => {
    [...sel].sort((a, b) => b - a).forEach(i => doc.removePage(i));
    S.current = clamp(sel[0], 0, doc.getPageCount() - 1); S.thumbSel = new Set([S.current]);
  });
}
async function pasteClip(at){
  if (!S.pdf) return;
  if (!PAGE_CLIP) { toast('剪貼簿裡沒有頁面，請先複製或剪下頁面', 'err'); return; }
  const clip = PAGE_CLIP;
  if (at == null) at = S.current + 1;
  at = clamp(at, 0, S.pages.length);
  await mutate(`已貼上 ${clip.count} 頁（來自「${clip.from}」）`, async doc => {
    const src = await PDFDocument.load(clip.bytes, {ignoreEncryption:true, updateMetadata:false});
    (await doc.copyPages(src, src.getPageIndices())).forEach((p, k) => doc.insertPage(at + k, p));
    S.current = at;
  }, {scrollToCurrent:true, highlight:{from:at, count:clip.count, label:'貼上的頁面'}});
}

// the sticky note under a point of page i: its icon, at least 20 × 20 pt (and as large as an icon drawn at a fixed size)
async function noteAt(i, cx, cy){
  const p = pagePointXY(i, cx, cy), min = Math.max(20, 20 / S.scale), list = (await getAnns(i)).filter(a => a.subtype === 'Text');
  for (let k = list.length - 1; k >= 0; k--) {
    const a = list[k];
    if (p.x >= a.x && p.x <= a.x + Math.max(a.w, min) && p.y >= a.y && p.y <= a.y + Math.max(a.h, min)) return a;
  }
  return null;
}

const STEPS = [10, 25, 33, 50, 67, 75, 90, 100, 110, 125, 150, 175, 200, 250, 300, 400, 500, 600, 800];
function nextZoom(dir){
  const cur = S.scale / PX * 100;
  const v = dir > 0 ? STEPS.find(s => s > cur + 0.5) ?? 800 : [...STEPS].reverse().find(s => s < cur - 0.5) ?? 10;
  return v / 100 * PX;
}
function rotate(delta){
  const sel = selectedPages();
  return mutate(`第 ${rangeText(sel)} 頁已${delta < 0 ? '向左' : '向右'}旋轉`, doc => {
    sel.forEach(i => { const p = doc.getPage(i); p.setRotation(degrees((((p.getRotation().angle + delta) % 360) + 360) % 360)); });
  });
}

function wrapText(ctx, text, maxW){
  const lines = [];
  text.split('\n').forEach(par => {
    const toks = par.match(/[A-Za-z0-9_\-.,:;'"!?()@#%&*+=/\\]+|\s+|./gu) || [''];
    let line = '';
    for (const t of toks) {
      const test = line + t;
      if (ctx.measureText(test).width <= maxW || !line) {
        if (ctx.measureText(test).width > maxW && !line) {
          // a single long token: hard-break it
          let part = '';
          for (const ch of t) { if (ctx.measureText(part + ch).width > maxW && part) { lines.push(part); part = ch; } else part += ch; }
          line = part;
        } else line = test;
      } else { lines.push(line.replace(/\s+$/, '')); line = t.trimStart(); }
    }
    lines.push(line);
  });
  return lines;
}

/* ====================================================================
   System fonts (字型清單): every font family installed on this computer (queryLocalFonts), with the name a
   Taiwanese user knows it by (read from the font file: 微軟正黑體, not Microsoft JhengHei) and whether it is a
   Chinese font. Reading a font file can take a while (Chinese fonts are 10–30 MB), so it happens in the
   background, one file at a time, and the result is cached in localStorage.
   ==================================================================== */
const FONTCAT = {ok:null, fams:[], busy:false, done:0, total:0, gen:0, subs:new Set()};   // gen: bumps when the list itself changes
const FONTCAT_KEY = 'pdfeditor.fontcat.v2';   // v2 adds embed / vert / bytes
const FONT_FACES = new Map();   // family → its FontData faces from queryLocalFonts (to read a face's file later)
const TEST_FONTS = new Map();   // (tests) fonts given as bytes: 'family|Regular' / 'family|Bold' → Uint8Array
const FONT_LANGS = ['zh-TW', 'zh-HK', 'zh-MO', 'zh', 'zh-SG', 'en'];
let fontListing = null, fontAnalysing = Promise.resolve(), fontNotify = 0;
const fontCache = () => { try { return JSON.parse(localStorage.getItem(FONTCAT_KEY)) || {}; } catch (_) { return {}; } };
function fontChanged(){
  if (fontNotify) return;
  fontNotify = requestAnimationFrame(() => { fontNotify = 0; FONTCAT.subs.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); });
}
// the family name in the preferred language; in each language the typographic family (name ID 16) before the
// family (name ID 1), so a Chinese name is never hidden behind an English-only typographic name
function fontFileName(font, fallback){
  const rec = font.name && font.name.records || {};
  for (const l of FONT_LANGS) for (const ids of [rec.preferredFamily, rec.fontFamily]) {
    const v = ids && ids[l] && String(ids[l]).trim(); if (v) return v;
  }
  return fallback;
}
// read a face's file: a single font (.ttf/.otf), or in a collection (.ttc) the face with this PostScript name,
// else one of this family; null when the file cannot be read (then nothing is cached and it is tried again).
// embed: what the font's licence (OS/2 fsType) allows in a PDF: 'ok', 'full' (no subsetting: the whole font goes
// in) or 'no' (restricted, or bitmaps only); vert: it has vertical metrics and vertical forms (vhea, vmtx, GSUB vert);
// bytes: how much the font adds when embedded whole
async function analyseFont(fam, face){
  try {
    const bytes = new Uint8Array(await (await face.blob()).arrayBuffer());
    let font = fontkit.create(bytes), size = bytes.length;
    if (font && Array.isArray(font.fonts)) {
      font = font.fonts.find(f => f.postscriptName === fam.ps) || font.fonts.find(f => f.familyName === fam.family) || font.fonts[0];
      size = font ? Object.values(font.directory.tables).reduce((t, x) => t + (x.length || 0), 0) : 0;
    }
    if (!font || !font.name) return null;
    const fsType = (font['OS/2'] && font['OS/2'].fsType) || {}, tb = font.directory.tables;
    let vertForms = false; try { vertForms = !!(font.GSUB && font.GSUB.featureList.some(f => f.tag === 'vert')); } catch (_) {}
    return {name:fontFileName(font, fam.family), cjk:[...'中文字體'].every(ch => font.hasGlyphForCodePoint(ch.codePointAt(0))),
      embed:fsType.noEmbedding || fsType.bitmapOnly ? 'no' : fsType.noSubsetting ? 'full' : 'ok', vert:!!(tb.vhea && tb.vmtx) && vertForms, bytes:size,
      variable:!!tb.fvar, weight:(font['OS/2'] && font['OS/2'].usWeightClass) || 400};
  } catch (_) { return null; }
}
// (tests) a font given as bytes behaves like an installed one: the page can draw it, the catalogue lists it, and
// systemFontBytes hands out its bytes
async function registerTestFont({family, b64, style = 'Regular'}){
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0)), bold = /bold/i.test(style);
  const ff = new FontFace(family, bytes, {weight:bold ? '700' : '400'}); await ff.load(); document.fonts.add(ff);
  TEST_FONTS.set(family + '|' + (bold ? 'Bold' : 'Regular'), bytes);
  let fam = FONTCAT.fams.find(f => f.family === family);
  if (!fam) { fam = {family, ps:'', name:family, cjk:false, embed:null, vert:null, bytes:0, faces:[]}; FONTCAT.fams.push(fam); FONTCAT.fams.sort((a, b) => a.family.localeCompare(b.family)); }
  if (!bold) { const r = await analyseFont({family, ps:''}, {blob:async () => new Blob([bytes])}); if (r) Object.assign(fam, r); }
  fam.faces.push({ps:'', style, full:family + ' ' + style});
  FONTCAT.gen++; fontChanged();
}
// list the fonts (resolves as soon as the list is known; the files are read afterwards)
function loadFontCatalog(){
  if (fontListing) return fontListing;
  fontListing = (async () => {
    let faces = [];
    try {
      if (typeof window.queryLocalFonts !== 'function') throw new Error('no queryLocalFonts');
      faces = await window.queryLocalFonts();
    } catch (e) { FONTCAT.ok = false; FONTCAT.fams = []; FONTCAT.gen++; fontListing = null; fontChanged(); return; }   // tried again next time
    const byFam = new Map(); FONT_FACES.clear();
    for (const f of faces) {
      if (!f.family) continue;
      if (!FONT_FACES.has(f.family)) FONT_FACES.set(f.family, []);
      FONT_FACES.get(f.family).push(f);
      const cur = byFam.get(f.family), regular = /^(regular|normal|book|roman)$/i.test(f.style || '');
      if (!cur || (regular && !cur.regular)) byFam.set(f.family, {face:f, regular});
    }
    const cache = fontCache(), todo = [];
    FONTCAT.fams = [...byFam.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([family, {face}]) => {
      const fam = {family, ps:face.postscriptName || '', name:family, cjk:null, embed:null, vert:null, bytes:0,
        faces:FONT_FACES.get(family).map(x => ({ps:x.postscriptName || '', style:x.style || '', full:x.fullName || ''}))}, c = cache[family + '|' + fam.ps];
      if (c) Object.assign(fam, {name:c.name || family, cjk:!!c.cjk, embed:c.embed || 'ok', vert:!!c.vert, bytes:c.bytes || 0}); else todo.push([fam, face]);
      return fam;
    });
    FONTCAT.ok = true; FONTCAT.gen++; FONTCAT.done = 0; FONTCAT.total = todo.length; FONTCAT.busy = !!todo.length; fontChanged();
    if (todo.length) {
      fontAnalysing = (async () => {
        for (const [fam, face] of todo) {
          const r = await analyseFont(fam, face);
          if (r) {
            Object.assign(fam, r);
            const c = fontCache(); c[fam.family + '|' + fam.ps] = r;
            try { localStorage.setItem(FONTCAT_KEY, JSON.stringify(c)); } catch (_) {}
          } else fam.cjk = false;   // unreadable this time: listed under 其他字型, not cached
          FONTCAT.done++; fontChanged();
        }
        FONTCAT.busy = false; FONTCAT.gen++; fontChanged();
      })();

    if (o instanceof PDFArray) { for (let i = 0; i < o.size(); i++) if (visit(o.get(i))) return true; return false; }
    if (!(o instanceof PDFDict) || seen.has(o)) return false;
    seen.add(o);

    if (!rights.has(o) && (o.has(N_('ByteRange')) || t === N_('Sig') || t === N_('DocTimeStamp'))) return true;

// where a new picture goes for the command d (page view): the area (what could be seen of the old picture; a picture set at
// an angle on purpose: its own sides) and that angle. Quarter turns and flips that only stood the stored pixels up are not
// kept: the new picture is upright on screen.
function replaceArea(d){
  const V = S.pages[d.i].vp1.transform, o = MPT(V, ...MPT(d.M, 0, 0)), px = MPT(V, ...MPT(d.M, 1, 0)), py = MPT(V, ...MPT(d.M, 0, 1));
  const ex = [px[0] - o[0], px[1] - o[1]], ey = [py[0] - o[0], py[1] - o[1]], th = Math.atan2(ex[1], ex[0]) * 180 / Math.PI;
  let tilt = th - Math.round(th / 90) * 90; if (Math.abs(tilt) < 1) tilt = 0;
  if (!tilt) { const b = d.box; return {cx:b.x + b.w / 2, cy:b.y + b.h / 2, aw:b.w, ah:b.h, tilt}; }
  const c = MPT(V, ...MPT(d.M, .5, .5));
  return {cx:c[0], cy:c[1], aw:Math.hypot(ex[0], ex[1]), ah:Math.hypot(ey[0], ey[1]), tilt};

// the matrix T that draws the new picture img (its pixel size w × h) in place of command d: `q T cm /Name Do Q` where d was;

function openReplaceDialog(img, area, n){

    <div class="rp-opts"><div class="rp-h">放法</div>
      <label><input type="radio" name="rfit" value="contain" checked>保持比例，放在原本範圍的中間</label>
      <label><input type="radio" name="rfit" value="fill">填滿原本的範圍（可能變形）</label>
      <div class="rp-turn"><button class="btn" data-turn="-90" title="向左轉 90°">↺</button><button class="btn" data-turn="90" title="向右轉 90°">↻</button></div>

  let turn = 0;

    let w, h;

/* ---------------- embedding system fonts ----------------

const SYS_BYTES = new Map();   // 'family|Regular' / 'family|Bold' → Promise<{bytes, synthetic}>
async function systemFontBytes(family, bold){
  const key = family + '|' + (bold ? 'Bold' : 'Regular');
  if (TEST_FONTS.has(key)) return {bytes:TEST_FONTS.get(key), synthetic:false};
  if (TEST_FONTS.has(family + '|Regular')) return {bytes:TEST_FONTS.get(family + '|Regular'), synthetic:bold};
  if (!SYS_BYTES.has(key)) SYS_BYTES.set(key, (async () => {
    if (!FONT_FACES.size) await loadFontCatalog();

    const upright = faces.filter(f => !/italic|oblique/i.test(f.style || ''));
    const boldFace = bold ? upright.find(f => /^bold$/i.test(f.style || '')) || upright.find(f => /bold/i.test(f.style || '') && !/semi|demi|extra|ultra/i.test(f.style || '')) : null;
    const face = boldFace || upright.find(f => /^(regular|normal|book|roman)$/i.test(f.style || '')) || upright[0] || faces[0];
    let bytes = new Uint8Array(await (await face.blob()).arrayBuffer());

    if (k < 0 && family) k = fonts.findIndex(f => f.familyName === family);

  const out = new Uint8Array(size), ov = new DataView(out.buffer);
  ov.setUint32(0, dv.getUint32(at)); for (let k = 4; k < 12; k += 2) ov.setUint16(k, dv.getUint16(at + k));
  recs.forEach((r, k) => { const o = 12 + 16 * k; ov.setUint32(o, r.tag); ov.setUint32(o + 4, r.sum); ov.setUint32(o + 8, pos[k]); ov.setUint32(o + 12, r.len); out.set(bytes.subarray(r.off, r.off + r.len), pos[k]); });

  if (fkPatched) return;

/* ---------------- writing text into the page itself (真正的文字) ----------------

   used are embedded), so every reader can show, find, select and copy it. Each piece is one block

/* ---------------- 插入圖片 ---------------- */
let PENDING_IMG = null;   // {png|jpg bytes, kind, w, h, name, url}
async function loadImageFile(file){
  const url = URL.createObjectURL(file);
  const img = new Image(); img.src = url;
  try { await img.decode(); } catch (_) { URL.revokeObjectURL(url); throw new Error('無法讀取這張圖片'); }
  let w = img.naturalWidth || 300, h = img.naturalHeight || 200;
  const isJpg = /jpe?g$/i.test(file.type) || /\.jpe?g$/i.test(file.name);
  let bytes, kind;
  if (isJpg && Math.max(w, h) <= 6000) { bytes = new Uint8Array(await file.arrayBuffer()); kind = 'jpg'; }   // keep the original JPEG data
  else {
    const k = Math.min(1, 4000 / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    bytes = new Uint8Array(await (await blobOf(c, 'image/png')).arrayBuffer()); kind = 'png';
  }
  return {bytes, kind, w, h, name:file.name, url};
}
// ask for a picture file and read it (null: none chosen or not readable, with a message)
function pickImage(){
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml,.png,.jpg,.jpeg,.webp,.gif,.bmp,.svg';
    inp.onchange = async () => {
      const f = inp.files[0]; if (!f) return res(null);
      try { res(await loadImageFile(f)); } catch (e) { toast(e.message || '無法讀取圖片', 'err'); res(null); }
    };
    inp.oncancel = () => res(null);
    inp.click();
  });
}
async function chooseImage(){
  const img = await pickImage(); if (!img) return;
  PENDING_IMG = img; setTool('image'); toast('在頁面上點一下放置圖片，或拖曳決定大小');
}
// a picture's appearance: img (loadImageFile) filling box b
async function pictureAP(doc, img, b, rot){
  const emb = img.kind === 'jpg' ? await doc.embedJpg(img.bytes) : await doc.embedPng(img.bytes);
  return formAP(doc, `q ${b.w.toFixed(3)} 0 0 ${b.h.toFixed(3)} 0 0 cm /Im0 Do Q`, b.w, b.h, rot, {XObject:{Im0:emb.ref}});
}
// a selected picture replaced by img: as large as fits in its frame without stretching, centred; angle and opacity kept
async function replaceImage(i, id, img){
  return mutate('已更換圖片', async doc => {
    const ref = findAnnotRef(doc, i, id); if (!ref) { toast('找不到此註解', 'err'); return false; }
    const dict = doc.context.lookup(ref, PDFDict), fr = ownFrame(doc, dict); if (!fr) return false;
    const k = Math.min(fr.w / img.w, fr.h / img.h), emb = img.kind === 'jpg' ? await doc.embedJpg(img.bytes) : await doc.embedPng(img.bytes);
    const {ap, rect} = ownPicture(doc, fr, emb.ref, img.w * k, img.h * k);
    setUpright(doc, dict, fadeAP(doc, ap, readAnnStyle(dict).opacity), rect);
    dict.set(N_('Contents'), PDFHexString.fromText(img.name || '圖片')); dict.set(N_('M'), nowStr());
  });
}
function defaultImgSize(pg, img){
  let w = img.w * .75, h = img.h * .75;   // 96 dpi pixels → points
  const k = Math.min(1, pg.w * .6 / w, pg.h * .6 / h); return {w:w * k, h:h * k};

  return {b, ops:`${strokePrefix(st)}` + strokes.map(s => s.map((p, k) => `${loc(b, p).join(' ')} ${k ? 'l' : 'm'}`).join(' ') + (s.length === 1 ? ` ${loc(b, s[0]).join(' ')} l` : '') + ' S').join(' ')};
}
async function addGeomAnnot(i, label, geom, dict, res){

}

/* ---------- live preview layer (SVG in page units) ---------- */

}
const ptsAttr = pts => pts.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');
function previewMarkup(t, data){
  const st = STYLES[t], def = DRAW_TOOLS[t];
  if (def.kind === 'line') {
    const g = geomLine(data.p0, data.p1, st, def.arrow);
    return `<line x1="${data.p0.x}" y1="${data.p0.y}" x2="${data.p1.x}" y2="${data.p1.y}" ${svgStyle(st)}/>` +
      g.svg.heads.map(h => `<polyline points="${ptsAttr(h)}" ${svgStyle({...st, dash:false}, st.head === 'closed' ? st.color : '')}/>`).join('');
  }
  if (def.kind === 'box') {
    const r = data.r;
    if (def.shape === 'rect') return `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" ${svgStyle(st, st.fill)}/>`;
    if (def.shape === 'ellipse') return `<ellipse cx="${r.x + r.w / 2}" cy="${r.y + r.h / 2}" rx="${r.w / 2}" ry="${r.h / 2}" ${svgStyle(st, st.fill)}/>`;
    const segs = cloudSegments(r, st); if (!segs.length) return '';
    return `<path d="M${segs[0][0].x},${segs[0][0].y} ${segs.map(([, a, b, q]) => `C${a.x},${a.y} ${b.x},${b.y} ${q.x},${q.y}`).join(' ')}Z" ${svgStyle(st, st.fill)}/>`;
  }
  if (def.kind === 'poly') {
    const pts = data.pts.concat(data.hover ? [data.hover] : []);
    const close = def.closed && pts.length > 2;
    return `<${close ? 'polygon' : 'polyline'} points="${ptsAttr(pts)}" ${svgStyle(st, def.closed ? st.fill : '')}/>` +
      data.pts.map((p, k) => `<circle cx="${p.x}" cy="${p.y}" r="${(k === 0 && def.closed ? 4 : 2.5) / S.scale * PX}" fill="#fff" stroke="${st.color}" stroke-width="${1 / S.scale * PX}"/>`).join('');
  }

}

/* ---------- text markup: character boxes from the text layer ---------- */
const charCache = new Map();
async function pageChars(i){
  const key = S.version + ':' + i; if (charCache.has(key)) return charCache.get(key);
  const p = (async () => {
    const pg = S.pages[i], tc = await pg.page.getTextContent(), U = pdfjsLib.Util, out = [];
    tc.items.forEach((it, k) => {
      if (!it.str || !it.str.trim() && it.str.length < 2) return;
      const tx = U.transform(pg.vp1.transform, it.transform);
      const fh = Math.hypot(tx[2], tx[3]) || it.height || 10, ang = Math.atan2(tx[1], tx[0]);
      const dir = {x:Math.cos(ang), y:Math.sin(ang)}, up = {x:Math.sin(ang), y:-Math.cos(ang)};
      const total = it.width * Math.hypot(pg.vp1.transform[0], pg.vp1.transform[1]) || fh * it.str.length * .5;
      const chars = [...it.str], cw = total / chars.length;
      chars.forEach((ch, c) => {
        const b0 = {x:tx[4] + dir.x * cw * c, y:tx[5] + dir.y * cw * c}, b1 = {x:b0.x + dir.x * cw, y:b0.y + dir.y * cw};
        const A = .82 * fh, D = .2 * fh;
        const q = [{x:b0.x + up.x * A, y:b0.y + up.y * A}, {x:b1.x + up.x * A, y:b1.y + up.y * A}, {x:b0.x - up.x * D, y:b0.y - up.y * D}, {x:b1.x - up.x * D, y:b1.y - up.y * D}];
        const xs = q.map(p => p.x), ys = q.map(p => p.y);
        out.push({ch, item:k, q, x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys)});
      });
    });
    return out;
  })().catch(() => []);
  charCache.set(key, p); return p;
}
function nearestChar(chars, p, maxDist = 24){
  let best = -1, bd = Infinity;
  chars.forEach((c, k) => {
    const dx = Math.max(c.x0 - p.x, 0, p.x - c.x1), dy = Math.max(c.y0 - p.y, 0, p.y - c.y1), d = dx * dx * .3 + dy * dy;
    if (d < bd) { bd = d; best = k; }

}
function selectionQuads(chars, a, b){
  const lo = Math.min(a, b), hi = Math.max(a, b), runs = [];
  for (let k = lo; k <= hi; k++) {
    const c = chars[k]; if (!c.ch.trim() && (k === lo || k === hi)) continue;
    const last = runs[runs.length - 1];
    if (last && last.item === c.item) { last.q[1] = c.q[1]; last.q[3] = c.q[3]; }
    else runs.push({item:c.item, q:[...c.q]});

}
async function createTextMark(i, quads, t){
  const st = STYLES[t], def = DRAW_TOOLS[t], {b, ops, res} = markupGeom(def.sub, quads, st);
  const qp = quads.flatMap(q => toPdfPts(i, q));
  await addGeomAnnot(i, def.label.replace('文字工具', '').replace('工具', ''), {b, ops}, baseDict(def.sub, def.label.replace('工具', ''), st, {QuadPoints:qp}), res);

// highlight / underline / strike-out over quads ([tl, tr, bl, br] in page view points)
function markupGeom(sub, quads, st){
  const b = bboxOf(quads.flat(), 2);
  let ops;
  if (sub === 'Highlight') {
    ops = `/GS1 gs ${hexRgb(st.color)} rg ` + quads.map(([tl, tr, bl, br]) => `${loc(b, tl).join(' ')} m ${loc(b, tr).join(' ')} l ${loc(b, br).join(' ')} l ${loc(b, bl).join(' ')} l h f`).join(' ');
  } else {
    ops = `${(st.opacity ?? 1) < 1 ? '/GS0 gs ' : ''}${hexRgb(st.color)} RG 1 J ` + quads.map(([tl, tr, bl, br]) => {
      const h = Math.hypot(tl.x - bl.x, tl.y - bl.y), w = Math.max(.8, h * .07).toFixed(2);
      const f = sub === 'StrikeOut' ? .5 : .9;

      return `${w} w ${loc(b, a).join(' ')} m ${loc(b, z).join(' ')} l S`;
    }).join(' ');
  }
  const res = sub === 'Highlight' ? {ExtGState:{GS1:{Type:'ExtGState', BM:'Multiply', CA:st.opacity ?? 1, ca:st.opacity ?? 1}}} : gsRes(st);

/* ---------- pen: strokes are buffered and committed together ---------- */
const PEN = {i:-1, strokes:[], timer:0, busy:null};
function smooth(pts){
  if (pts.length < 4) return pts;
  return pts.map((p, k) => k === 0 || k === pts.length - 1 ? p : {x:(pts[k - 1].x + p.x * 2 + pts[k + 1].x) / 4, y:(pts[k - 1].y + p.y * 2 + pts[k + 1].y) / 4});
}
async function flushPen(){
  clearTimeout(PEN.timer);
  if (PEN.busy) await PEN.busy;
  if (!PEN.strokes.length) return;
  const {i} = PEN, strokes = PEN.strokes.map(smooth), st = {...STYLES.pen};
  PEN.strokes = []; PEN.i = -1;
  PEN.busy = mutate(`已加入 ${strokes.length} 筆畫筆筆跡`, doc => { strokes.forEach(s => inkAnnotParts(doc, i, [s], st, '畫筆')); }, {fromPen:true});
  await PEN.busy; PEN.busy = null;
}

/* ---------- eraser: removes only the parts of ink strokes it passes over ---------- */
function densify(pts, step){
  const out = [];
  for (let k = 0; k < pts.length; k++) {
    if (k) { const a = pts[k - 1], b = pts[k], d = Math.hypot(b.x - a.x, b.y - a.y), n = Math.floor(d / step);
      for (let j = 1; j < n; j++) out.push({x:a.x + (b.x - a.x) * j / n, y:a.y + (b.y - a.y) * j / n}); }
    out.push(pts[k]);
  }
  return out;
}
async function eraseInk(i, path, radius){
  const anns = (await getAnns(i)).filter(a => a.subtype === 'Ink' && a.ink && a.ink.length);
  if (!anns.length) { toast('此頁沒有可擦除的筆跡（橡皮擦只擦畫筆筆跡）'); return; }
  const er = densify(path, radius / 3), plan = [];
  for (const a of anns) {
    let changed = false;
    const rr = radius + (a.inkWidth || 1) / 2, keep = [];
    for (const s of a.ink) {
      const pts = densify(s, Math.max(.5, rr / 3));
      let cur = [];
      for (const p of pts) {
        const hit = er.some(e => (e.x - p.x) ** 2 + (e.y - p.y) ** 2 <= rr * rr);
        if (hit) { changed = true; if (cur.length > 1) keep.push(cur); cur = []; } else cur.push(p);
      }
      if (cur.length > 1) keep.push(cur);
    }
    if (changed) plan.push({a, keep});
  }
  if (!plan.length) return;
  await mutate('已擦除筆跡', async doc => {
    for (const {a, keep} of plan) {
      const ref = findAnnotRef(doc, i, a.id); if (!ref) continue;
      await keepPlace(doc, i, ref, () => {   // what is left of the stroke stays where it was
        removeAnnotRefs(doc, i, ref);
        if (keep.length) inkAnnotParts(doc, i, keep, {color:a.inkColor || '#000000', width:a.inkWidth || 1, opacity:a.inkOpacity ?? 1}, '畫筆');
      });
    }
  }, {fromPen:true});
}
function removeAnnotRefs(doc, i, ref){
  const annots = doc.getPage(i).node.lookupMaybe(PDFName.of('Annots'), PDFArray); if (!annots) return;
  for (let k = annots.size() - 1; k >= 0; k--) {
    const r = annots.get(k); if (!(r instanceof PDFRef)) continue;
    if (r.objectNumber === ref.objectNumber) { annots.remove(k); continue; }
    const d = doc.context.lookup(r);
    const par = d instanceof PDFDict ? d.get(PDFName.of('Parent')) : null;   // the note's popup goes with it
    if (par instanceof PDFRef && par.objectNumber === ref.objectNumber) annots.remove(k);
  }
}

/* ---------- stamps ---------- */
const STAMP_COLORS = {red:'#d6336c', crimson:'#c92a2a', green:'#2b8a3e', blue:'#1864ab', purple:'#6741d9', black:'#212529'};
const STAMPS = {
  standard:[['核准', 'green'], ['不核准', 'crimson'], ['已審閱', 'blue'], ['草稿', 'blue'], ['定稿', 'green'], ['機密', 'crimson'],

    ['已收訖', 'green'], ['僅供參考', 'blue'], ['徵求意見', 'green'], ['不得外流', 'crimson'], ['可公開發佈', 'green'], ['已過期', 'crimson']]
    .map(([t, c]) => ({t, c, kind:'box'})),
  dynamic:[['核准', 'green'], ['已審閱', 'blue'], ['已收件', 'blue'], ['不核准', 'crimson'], ['已完成', 'green'], ['待修改', 'crimson']]
    .map(([t, c]) => ({t, c, kind:'dyn'})).concat([{t:'收文', c:'crimson', kind:'round'}, {t:'發文', c:'blue', kind:'round'}]),
};
const STAMP_NAMES = {'核准':'Approved', '不核准':'NotApproved', '草稿':'Draft', '定稿':'Final', '機密':'Confidential', '極機密':'TopSecret', '已過期':'Expired', '徵求意見':'ForComment', '可公開發佈':'ForPublicRelease', '不得外流':'NotForPublicRelease'};

const STAMP_FONT = '"Noto Sans TC","Microsoft JhengHei","PingFang TC","Noto Sans CJK TC",sans-serif';
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

async function removeAttachment(name){
  await mutate('已移除附件', doc => {
    const names = doc.catalog.lookupMaybe(PDFName.of('Names'), PDFDict);
    const ef = names && names.lookupMaybe(PDFName.of('EmbeddedFiles'), PDFDict);
    const arr = ef && ef.lookupMaybe(PDFName.of('Names'), PDFArray);
    if (!arr) { toast('此附件位於較複雜的結構中，暫不支援移除', 'err'); return false; }
    for (let k = 0; k < arr.size(); k += 2) {
      const key = arr.lookup(k);
      const s = key && key.decodeText ? key.decodeText() : '';
      if (s === name) { arr.remove(k); arr.remove(k); return; }
    }
    // fall back to matching the file spec's filename
    for (let k = 0; k < arr.size(); k += 2) {
      const spec = arr.lookup(k + 1, PDFDict);
      const uf = spec && (spec.lookupMaybe(PDFName.of('UF'), PDFString, PDFHexString) || spec.lookupMaybe(PDFName.of('F'), PDFString, PDFHexString));
      if (uf && uf.decodeText() === name) { arr.remove(k); arr.remove(k); return; }
    }
    toast('找不到此附件', 'err'); return false;
  });
}

      <div class="field"><label>下裁切 (px)</label><input type="number" min="0" data-s="b" value="0"></div>
      <div class="field"><label>左裁切 (px)</label><input type="number" min="0" data-s="l" value="0"></div>
      <div class="field"><label>右裁切 (px)</label><input type="number" min="0" data-s="r" value="0"></div>
    </div>
    <div class="cropinfo" id="cinfo"></div>`;
  const wrap = body.querySelector('.cropwrap');
  src.style.width = dw + 'px'; src.style.height = dh + 'px';
  wrap.insertBefore(src, wrap.firstChild);
  const cbox = body.querySelector('#cbox');
  const handles = {nw:[0, 0], n:[50, 0], ne:[100, 0], e:[100, 50], se:[100, 100], s:[50, 100], sw:[0, 100], w:[0, 50]};
  body.querySelectorAll('.h').forEach(h => { const [x, y] = handles[h.dataset.d]; h.style.left = x + '%'; h.style.top = y + '%'; });

    body.querySelectorAll('input[data-s]').forEach(inp => { if (document.activeElement !== inp) inp.value = Math.round(cr[inp.dataset.s]); });
    body.querySelector('#cinfo').textContent = `來源：第 ${i + 1} 頁${k >= 0 ? ' · 圖片 ' + (k + 1) : ' · 框選區域'}　｜　原始 ${W} × ${H} px　→　輸出 ${Math.round(W - cr.l - cr.r)} × ${Math.round(H - cr.t - cr.b)} px`;
  };
  const fix = () => {
    cr.l = clamp(cr.l, 0, W - MIN); cr.r = clamp(cr.r, 0, W - MIN - cr.l);
    cr.t = clamp(cr.t, 0, H - MIN); cr.b = clamp(cr.b, 0, H - MIN - cr.t);
  };
  body.querySelectorAll('input[data-s]').forEach(inp => inp.addEventListener('input', () => { cr[inp.dataset.s] = Math.max(0, +inp.value || 0); fix(); draw(); }));
  cbox.addEventListener('pointerdown', e => {
    e.preventDefault(); const d = e.target.dataset.d || 'move';
    const s0 = {...cr}, x0 = e.clientX, y0 = e.clientY;

        if (d.includes('w')) cr.l = clamp(s0.l + dx, 0, W - s0.r - MIN);
        if (d.includes('e')) cr.r = clamp(s0.r - dx, 0, W - s0.l - MIN);
        if (d.includes('n')) cr.t = clamp(s0.t + dy, 0, H - s0.b - MIN);
        if (d.includes('s')) cr.b = clamp(s0.b - dy, 0, H - s0.t - MIN);
      }
      draw();
    };
    const up = () => { cbox.removeEventListener('pointermove', mv); cbox.removeEventListener('pointerup', up); };
    cbox.addEventListener('pointermove', mv); cbox.addEventListener('pointerup', up);
  });

    const o = document.createElement('canvas'); o.width = Math.round(W - cr.l - cr.r); o.height = Math.round(H - cr.t - cr.b);

  };

    const d = src.getContext('2d').getImageData(0, 0, W, H).data;
    const ink = (x, y) => { const p = (y * W + x) * 4; return d[p] < 244 || d[p + 1] < 244 || d[p + 2] < 244; };
    let t = 0, b = H - 1, l = 0, r = W - 1;
    const rowInk = y => { for (let x = 0; x < W; x += 1) if (ink(x, y)) return true; return false; };
    const colInk = x => { for (let y = t; y <= b; y += 1) if (ink(x, y)) return true; return false; };
    while (t < b && !rowInk(t)) t++; while (b > t && !rowInk(b)) b--;
    while (l < r && !colInk(l)) l++; while (r > l && !colInk(r)) r--;

    cr.t = t; cr.b = H - 1 - b; cr.l = l; cr.r = W - 1 - r; draw();
  };
  const base = S.name.replace(/\.pdf$/i, '') + `_p${i + 1}_${k >= 0 ? 'img' + (k + 1) : 'region'}`;
  await openModal({title:'擷取圖片', body, width:Math.max(560, dw + 70), buttons:[
    {label:'重設', handler:() => { cr.l = cr.t = cr.r = cr.b = 0; draw(); }},
    {label:'自動去白邊', handler:() => { autoTrim(); }},
    {spacer:true},
    {label:'複製', handler:async () => {
      try { const blob = await new Promise(r => cropped().toBlob(r, 'image/png')); await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]); toast('已複製到剪貼簿'); }
      catch (_) { toast('此環境不允許複製圖片，請改用下載', 'err'); }
    }},
    {label:'下載 JPG', handler:async () => { const blob = await new Promise(r => cropped().toBlob(r, 'image/jpeg', 0.92)); await saveFile(base + '.jpg', blob); }},
    {label:'下載 PNG', primary:true, handler:async () => { const blob = await new Promise(r => cropped().toBlob(r, 'image/png')); await saveFile(base + '.png', blob); }},
  ], onOpen:draw});
}

/* ====================================================================
   Digital signature (PKCS#7 detached, adbe.pkcs7.detached)
   ==================================================================== */
function u8ToBin(u8){ let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return s; }
function genKeys(){ return new Promise((res, rej) => forge.pki.rsa.generateKeyPair({bits:2048, e:0x10001}, (err, kp) => err ? rej(err) : res(kp))); }
async function selfSignedCert(name, org, email){
  const keys = await genKeys();
  const cert = forge.pki.createCertificate();
  cert.publicKey = keys.publicKey;
  cert.serialNumber = '01' + forge.util.bytesToHex(forge.random.getBytesSync(8));
  cert.validity.notBefore = new Date(Date.now() - 60000);
  cert.validity.notAfter = new Date(); cert.validity.notAfter.setFullYear(cert.validity.notAfter.getFullYear() + 3);
  const U8 = forge.asn1.Type.UTF8;
  const attrs = [{name:'commonName', value:name, valueTagClass:U8}];
  if (org) attrs.push({name:'organizationName', value:org, valueTagClass:U8});
  if (email && /^[\x21-\x7e]+@[\x21-\x7e]+$/.test(email)) attrs.push({name:'emailAddress', value:email});
  cert.setSubject(attrs); cert.setIssuer(attrs);
  cert.setExtensions([{name:'basicConstraints', cA:false}, {name:'keyUsage', digitalSignature:true, nonRepudiation:true}, {name:'extKeyUsage', emailProtection:true}]);
  cert.sign(keys.privateKey, forge.md.sha256.create());
  return {key:keys.privateKey, cert, chain:[cert]};
}
function loadP12(bytes, password){
  const p12 = forge.pkcs12.pkcs12FromAsn1(forge.asn1.fromDer(u8ToBin(bytes)), false, password);
  const kb = (p12.getBags({bagType:forge.pki.oids.pkcs8ShroudedKeyBag})[forge.pki.oids.pkcs8ShroudedKeyBag] || [])
    .concat(p12.getBags({bagType:forge.pki.oids.keyBag})[forge.pki.oids.keyBag] || []);
  const certs = (p12.getBags({bagType:forge.pki.oids.certBag})[forge.pki.oids.certBag] || []).map(b => b.cert).filter(Boolean);
  if (!kb.length || !kb[0].key) throw new Error('憑證檔中找不到私鑰');
  if (!certs.length) throw new Error('憑證檔中找不到憑證');
  const key = kb[0].key;
  const cert = certs.find(c => c.publicKey && c.publicKey.n && c.publicKey.n.compareTo(key.n) === 0) || certs[0];
  return {key, cert, chain:certs};
}
function certName(cert){
  const cn = cert.subject.getField('CN'); if (!cn) return '';
  try { return forge.util.decodeUtf8(cn.value); } catch (_) { return cn.value; }
}
async function sigAppearancePng(b, {name, reason, location, date, withHand}){
  try { await document.fonts.load('500 12px "Noto Sans TC"', name + reason + '數位簽署日期原因地點'); } catch (_) {}
  const K = 4, c = document.createElement('canvas'); c.width = Math.ceil(b.w * K); c.height = Math.ceil(b.h * K);
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(255,255,255,0.0)'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.strokeStyle = '#c8371d'; ctx.lineWidth = 1.2 * K; ctx.strokeRect(K, K, c.width - 2 * K, c.height - 2 * K);
  let left = 6 * K;
  if (withHand && S.sigImg) {
    const img = new Image(); img.src = S.sigImg; await img.decode();
    const hh = c.height - 10 * K, hw = Math.min(c.width * 0.45, hh * S.sigAspect), h2 = hw / S.sigAspect;
    ctx.drawImage(img, 5 * K, (c.height - h2) / 2, hw, h2); left = hw + 10 * K;
  }
  const lines = [[`數位簽署：${name}`, 700], [`日期：${date}`, 400]];
  if (reason) lines.push([`原因：${reason}`, 400]);
  if (location) lines.push([`地點：${location}`, 400]);
  const avail = c.width - left - 5 * K;
  let fs = Math.min(11, (b.h - 8) / (lines.length * 1.35)) * K;
  ctx.textBaseline = 'top'; ctx.fillStyle = '#1f2328';
  const fit = (t, w) => { ctx.font = `${w} ${fs}px ${FONT}`; while (ctx.measureText(t).width > avail && fs > 4 * K) { fs -= 0.5 * K; ctx.font = `${w} ${fs}px ${FONT}`; } };
  lines.forEach(([t, w]) => fit(t, w));
  const totalH = lines.length * fs * 1.35; let y = (c.height - totalH) / 2;
  lines.forEach(([t, w], k) => { ctx.font = `${w} ${fs}px ${FONT}`; ctx.fillStyle = k === 0 ? '#9d2a14' : '#1f2328'; ctx.fillText(t, left, y); y += fs * 1.35; });
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return new Uint8Array(await blob.arrayBuffer());
}
async function signPdf(bytes, {pageIndex, box, cred, name, reason, location, contact, apPng}){
  const SIG_BYTES = 16384;
  const doc = await PDFDocument.load(bytes, {ignoreEncryption:true, updateMetadata:false});
  const ctx = doc.context, page = doc.getPage(pageIndex);
  const br = PDFArray.withContext(ctx);
  br.push(PDFNumber.of(0)); br.push(PDFName.of('**********')); br.push(PDFName.of('**********')); br.push(PDFName.of('**********'));
  const sigLit = {Type:'Sig', Filter:'Adobe.PPKLite', SubFilter:'adbe.pkcs7.detached', ByteRange:br,
    Contents:PDFHexString.of('0'.repeat(SIG_BYTES * 2)), M:nowStr(), Name:PDFHexString.fromText(name)};
  if (reason) sigLit.Reason = PDFHexString.fromText(reason);
  if (location) sigLit.Location = PDFHexString.fromText(location);
  if (contact) sigLit.ContactInfo = PDFHexString.fromText(contact);
  const sigRef = ctx.register(ctx.obj(sigLit));
  const g = visToPdf(pageIndex, box);
  const ap = await imageAP(doc, apPng, box.w, box.h, g.rot);
  const widgetRef = addAnnot(doc, pageIndex, {Type:'Annot', Subtype:'Widget', FT:'Sig', Rect:g.rect, V:sigRef,
    T:PDFHexString.fromText('Signature' + Date.now()), F:132, AP:{N:ap}});
  let af = doc.catalog.lookupMaybe(PDFName.of('AcroForm'), PDFDict);
  if (!af) { af = ctx.obj({}); doc.catalog.set(PDFName.of('AcroForm'), ctx.register(af)); }
  let fields = af.lookupMaybe(PDFName.of('Fields'), PDFArray);
  if (!fields) { fields = ctx.obj([]); af.set(PDFName.of('Fields'), fields); }
  fields.push(widgetRef); af.set(PDFName.of('SigFlags'), PDFNumber.of(3));
  const pdf = await doc.save({useObjectStreams:false, updateFieldAppearances:false});
  // locate placeholders
  const s = new TextDecoder('latin1').decode(pdf);
  const m = /\/ByteRange\s*\[\s*0\s+\/\*{10}\s+\/\*{10}\s+\/\*{10}\s*\]/.exec(s);
  const zeros = '<' + '0'.repeat(SIG_BYTES * 2) + '>';
  const cs = s.indexOf(zeros); const ce = cs + zeros.length;
  if (!m || cs < 0) throw new Error('無法建立簽章欄位');
  const range = [0, cs, ce, pdf.length - ce];
  let brs = `/ByteRange [${range.join(' ')}]`;
  if (brs.length > m[0].length) throw new Error('ByteRange 空間不足');
  brs = brs.padEnd(m[0].length, ' ');
  for (let k = 0; k < brs.length; k++) pdf[m.index + k] = brs.charCodeAt(k);
  const signed = new Uint8Array(pdf.length - (ce - cs));
  signed.set(pdf.subarray(0, cs), 0); signed.set(pdf.subarray(ce), cs);
  const p7 = forge.pkcs7.createSignedData();
  p7.content = forge.util.createBuffer(u8ToBin(signed));
  cred.chain.forEach(c => p7.addCertificate(c));
  p7.addSigner({key:cred.key, certificate:cred.cert, digestAlgorithm:forge.pki.oids.sha256, authenticatedAttributes:[
    {type:forge.pki.oids.contentType, value:forge.pki.oids.data}, {type:forge.pki.oids.messageDigest}, {type:forge.pki.oids.signingTime, value:new Date()}]});
  p7.sign({detached:true});
  const hex = forge.util.bytesToHex(forge.asn1.toDer(p7.toAsn1()).getBytes());
  if (hex.length > SIG_BYTES * 2) throw new Error('簽章資料過大');
  for (let k = 0; k < hex.length; k++) pdf[cs + 1 + k] = hex.charCodeAt(k);
  return pdf;
}
