/* ---------------- writing back to the opened file ----------------
   When the browser supports the File System Access API, a PDF opened through the
   picker (or dragged in) keeps a handle, and every edit is written straight back
   into that same file. Otherwise saving downloads a file with the original name. */
const canPick = () => !!DESK || typeof window.showOpenFilePicker === 'function';
function desktopHandle(p, name){
  return {kind:'file', name, path:p,
    queryPermission: async () => 'granted', requestPermission: async () => 'granted',
    getFile: async () => { const r = await DESK.readFile(p); return new File([r.data], r.name, {type:'application/pdf'}); },
    createWritable: async () => { const parts = []; return {
      write: async b => { parts.push(b); },
      close: async () => { await DESK.writeFile(p, new Uint8Array(await new Blob(parts).arrayBuffer())); },
    }; },
  };
}
async function openPath(p){
  try {
    const r = await DESK.readFile(p);
    await openFile(new File([r.data], r.name, {type:'application/pdf'}), desktopHandle(p, r.name));
  } catch (e) { toast('無法開啟檔案：' + (e.message || e), 'err'); }
}
let permAsk = null;
function primeWrite(){
  // must run synchronously inside the click so the permission prompt is allowed
  if (!S.handle || !S.autoWrite || !S.handle.requestPermission) return null;
  permAsk = S.handle.queryPermission({mode:'readwrite'})
    .then(st => st === 'granted' ? st : S.handle.requestPermission({mode:'readwrite'}))
    .catch(() => 'denied');
  return permAsk;
}
async function writeBack(bytes, {quiet = false} = {}){
  if (!S.handle) return false;
  const h = S.handle, doc = activeDoc();
  const run = async () => {
    let st = permAsk ? await permAsk : await h.queryPermission({mode:'readwrite'}).catch(() => 'denied');
    permAsk = null;
    if (st !== 'granted') st = await h.requestPermission({mode:'readwrite'}).catch(() => 'denied');
    if (st !== 'granted') throw new Error('沒有寫入原檔的權限');
    const w = await h.createWritable();
    await w.write(new Blob([bytes], {type:'application/pdf'}));
    await w.close();
  };
  // serialize writes so a fast series of edits never interleaves
  const prev = S.writing || Promise.resolve();
  const job = prev.catch(() => {}).then(run);
  S.writing = job;
  try {
    await job;
    if (doc === activeDoc()) { if (S.bytes === bytes) S.dirty = false; }
    else if (doc && doc.bytes === bytes) doc.dirty = false;
    updateUI();
    if (!quiet) toast('已存回原檔 ' + S.name);
    return true;
  } catch (e) {
    console.error(e);
    toast('無法寫回原檔：' + (e.message || e) + '，可按「儲存」另存', 'err');
    return false;
  }
}
async function afterEdit(){ if (S.handle && S.autoWrite) await writeBack(S.bytes, {quiet:true}); }

/* ---------------- page picker (shared by 減頁 and 插入PDF) ---------------- */
function parseRange(txt, n){
  const out = new Set();
  for (const part of String(txt).replace(/[，、；;\s]+/g, ',').split(',')) {
    if (!part) continue;
    const m = /^(\d*)\s*[-~－–]\s*(\d*)$/.exec(part);
    if (m) {
      const a = m[1] ? +m[1] : 1, b = m[2] ? +m[2] : n;
      for (let k = Math.min(a, b); k <= Math.max(a, b); k++) if (k >= 1 && k <= n) out.add(k - 1);
    } else if (/^\d+$/.test(part)) { const k = +part; if (k >= 1 && k <= n) out.add(k - 1); }
    else return null;
  }
  return out;
}
function rangeText(sel){
  const a = [...sel].sort((x, y) => x - y), out = [];
  for (let k = 0; k < a.length; k++) {
    let j = k; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++;
    out.push(j > k ? `${a[k] + 1}-${a[j] + 1}` : `${a[k] + 1}`); k = j;
  }
  return out.join(', ');
}
async function pagePicker({title, mode, count, initial = [], current = -1, getPage, okLabel, note, validate, footer, sizes}){
  const sel = new Set(initial);
  const body = document.createElement('div');
  body.innerHTML = `${note ? `<div class="note" style="margin-bottom:10px">${esc(note)}</div>` : ''}
    <div class="pp-bar">
      <button class="mini" data-b="all">全選</button><button class="mini" data-b="none">全不選</button><button class="mini" data-b="inv">反向選取</button>
      <span class="sep"></span>
      <input type="text" id="ppRange" placeholder="頁碼範圍，例如 1-3, 5, 8-">
      <button class="mini" data-b="range">套用</button>
      <span class="sep"></span>
      <span class="flab">縮圖</span><input type="range" id="ppSize" min="90" max="240" step="10" value="130">
      <span class="cnt" id="ppCnt"></span>
    </div>
    <div class="pp-grid ${mode === 'delete' ? 'pp-del' : ''}" id="ppGrid"></div>
    ${footer ? `<div class="pp-foot">${footer}</div>` : ''}`;
  const grid = body.querySelector('#ppGrid');
  const cards = [];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div'); c.className = 'pp-card' + (i === current ? ' cur' : ''); c.dataset.i = i;
    const ar = sizes && sizes[i] ? sizes[i].h / sizes[i].w : 1.414;
    c.innerHTML = `<span class="ck">✓</span><div class="th" style="aspect-ratio:${1 / ar}">${i + 1}</div><span class="num">第 ${i + 1} 頁</span>`;
    grid.appendChild(c); cards.push(c);
  }
  let last = -1, okBtn = null;
  const sync = () => {
    cards.forEach((c, i) => c.classList.toggle('on', sel.has(i)));
    body.querySelector('#ppCnt').innerHTML = `已選 <b>${sel.size}</b> / ${count} 頁`;
    if (okBtn) { okBtn.textContent = okLabel(sel.size); okBtn.disabled = !!(validate && validate([...sel])); okBtn.title = validate ? validate([...sel]) : ''; }
    const ri = body.querySelector('#ppRange'); if (document.activeElement !== ri) ri.value = rangeText(sel);
  };
  grid.addEventListener('click', e => {
    const c = e.target.closest('.pp-card'); if (!c) return;
    const i = +c.dataset.i;
    if (e.shiftKey && last >= 0) { const on = !sel.has(i); for (let k = Math.min(last, i); k <= Math.max(last, i); k++) on ? sel.add(k) : sel.delete(k); }
    else sel.has(i) ? sel.delete(i) : sel.add(i);
    last = i; sync();
  });
  const applyRange = () => {
    const r = parseRange(body.querySelector('#ppRange').value, count);
    if (!r) { toast('頁碼範圍格式不正確，例如：1-3, 5, 8-', 'err'); return; }
    sel.clear(); r.forEach(k => sel.add(k)); body.querySelector('#ppRange').blur(); sync();
  };
  body.querySelector('.pp-bar').addEventListener('click', e => {
    const b = e.target.dataset.b; if (!b) return;
    if (b === 'all') for (let k = 0; k < count; k++) sel.add(k);
    if (b === 'none') sel.clear();
    if (b === 'inv') for (let k = 0; k < count; k++) sel.has(k) ? sel.delete(k) : sel.add(k);
    if (b === 'range') { applyRange(); return; }
    sync();
  });
  body.querySelector('#ppRange').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyRange(); } });
  body.querySelector('#ppSize').addEventListener('input', e => grid.style.setProperty('--tw', e.target.value + 'px'));
  // lazy thumbnails
  const done = new Set();
  const obs = new IntersectionObserver(ents => ents.forEach(async en => {
    if (!en.isIntersecting) return;
    const c = en.target, i = +c.dataset.i; obs.unobserve(c); if (done.has(i)) return; done.add(i);
    try {
      const page = await getPage(i), th = c.querySelector('.th');
      const dpr = window.devicePixelRatio || 1, vp1 = page.getViewport({scale:1});
      const vp = page.getViewport({scale:Math.min(3, 240 * dpr / vp1.width)});
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      th.style.aspectRatio = vp1.width / vp1.height;
      await page.render({canvasContext:cv.getContext('2d'), viewport:vp, annotationMode:pdfjsLib.AnnotationMode.ENABLE}).promise;
      th.textContent = ''; th.appendChild(cv);
    } catch (_) {}
  }), {root:grid, rootMargin:'300px'});
  cards.forEach(c => obs.observe(c));
  const res = await openModal({title, body, width:Math.min(1000, innerWidth - 40), buttons:[
    {label:'取消', value:null},
    {label:okLabel(sel.size), primary:true, id:'ppOk', handler:() => {
      const err = validate && validate([...sel]); if (err) { toast(err, 'err'); return; }
      const extra = {}; body.querySelectorAll('[data-x]').forEach(el => extra[el.dataset.x] = el.value);
      return {sel:[...sel].sort((a, b) => a - b), extra};
    }}],
    onOpen:(mb, mf) => {
      okBtn = mf.querySelector('#ppOk'); sync();
      if (current >= 0) setTimeout(() => cards[current] && cards[current].scrollIntoView({block:'center'}), 30);
    }});
  obs.disconnect();
  return res || null;
}

$('#fInsert').addEventListener('change', async e => {

async function insertFromPdf(file){
  if (!S.pdf) return;
  busy(true, '讀取 PDF…');
  let bytes, src, sizes = [];
  try {
    bytes = new Uint8Array(await file.arrayBuffer());
    src = await pdfjsLib.getDocument({...PDF_OPTS, data:bytes.slice()}).promise;
    for (let i = 1; i <= Math.min(src.numPages, 400); i++) { const pg = await src.getPage(i), v = pg.getViewport({scale:1}); sizes.push({w:v.width, h:v.height}); }
  } catch (e) {
    busy(false);
    toast(e && e.name === 'PasswordException' ? '此 PDF 受密碼保護，無法匯入' : '無法讀取此 PDF：' + (e.message || e), 'err'); return;
  }
  busy(false);
  const n = src.numPages, cur = S.current + 1, tot = S.pages.length;
  const footer = `<span class="flab">插入位置</span>
    <select data-x="pos">
      <option value="after" selected>目前頁（第 ${cur} 頁）之後</option>
      <option value="before">目前頁（第 ${cur} 頁）之前</option>
      <option value="start">文件最前面</option>
      <option value="end">文件最後面（第 ${tot} 頁之後）</option>
      <option value="at">指定頁碼之後…</option>
    </select>
    <span id="atWrap" style="display:none">第 <input type="text" data-x="at" value="${cur}" style="width:56px;font:inherit;border:1px solid var(--line2);border-radius:7px;padding:5px 8px;text-align:center"> 頁之後（0 = 最前面）</span>
    <span class="flab" style="margin-left:auto">來源：${esc(file.name)} · 共 ${n} 頁</span>`;
  const picker = pagePicker({
    title:'從其他 PDF 插入頁面', mode:'insert', count:n, initial:[...Array(n).keys()],
    getPage:i => src.getPage(i + 1), sizes,
    okLabel:k => k ? `插入 ${k} 頁` : '插入',
    note:'勾選要匯入的頁面（預設全選，可按住 Shift 連續選取），並選擇要插入的位置。',
    validate:sel => sel.length ? '' : '請至少勾選一頁', footer,
  });
  setTimeout(() => {
    const ps = document.querySelector('select[data-x=pos]');
    if (ps) ps.onchange = () => { $('#atWrap').style.display = ps.value === 'at' ? '' : 'none'; };
  }, 0);
  const res = await picker;
  setTimeout(() => src.destroy(), 300);
  if (!res) return;
  const pos = res.extra.pos;
  let at;
  if (pos === 'after') at = S.current + 1;
  else if (pos === 'before') at = S.current;
  else if (pos === 'start') at = 0;
  else if (pos === 'end') at = tot;
  else { const k = parseInt(res.extra.at, 10); if (!(k >= 0 && k <= tot)) { toast(`頁碼需介於 0 到 ${tot}`, 'err'); return; } at = k; }
  await mutate(`已從「${file.name}」插入 ${res.sel.length} 頁`, async doc => {
    const srcDoc = await PDFDocument.load(bytes, {ignoreEncryption:true, updateMetadata:false});
    const copied = await doc.copyPages(srcDoc, res.sel);
    copied.forEach((pg, k) => doc.insertPage(at + k, pg));
    S.current = clamp(at, 0, doc.getPageCount() - 1);
  }, {scrollToCurrent:true, highlight:{from:at, count:res.sel.length, label:'插入的頁面'}});
}

  el.innerHTML = PAGE_CLIP ? `<span title="可在任何分頁按 Ctrl+V 貼上">📋 剪貼簿：${PAGE_CLIP.count} 頁（${esc(PAGE_CLIP.from)} 第 ${esc(PAGE_CLIP.range)} 頁）</span>` : '';
  const b = $('#bPaste'); if (b) b.disabled = !S.pdf || !PAGE_CLIP;
}
async function copySelected(cut){
  if (!S.pdf) return;
  const sel = selectedPages(), n = S.pages.length;
  if (cut && sel.length >= n) { toast('不能剪下全部頁面，文件至少要保留一頁', 'err'); return; }
  busy(true, cut ? '剪下頁面中…' : '複製頁面中…');
  try {
    const src = await PDFDocument.load(S.bytes, {ignoreEncryption:true, updateMetadata:false});
    const out = await PDFDocument.create();
    (await out.copyPages(src, sel)).forEach(p => out.addPage(p));
    PAGE_CLIP = {bytes:await out.save(), count:sel.length, from:S.name, range:rangeText(sel)};
  } catch (e) { console.error(e); toast('複製失敗：' + (e.message || e), 'err'); return; }
  finally { busy(false); }
  updateClipUI();
  if (!cut) { toast(`已複製 ${sel.length} 頁（第 ${rangeText(sel)} 頁），可在任何分頁按 Ctrl+V 貼上`); return; }
  await mutate(`已剪下 ${sel.length} 頁（第 ${rangeText(sel)} 頁），可在任何分頁貼上`, doc => {
    [...sel].sort((a, b) => b - a).forEach(i => doc.removePage(i));
    S.current = clamp(sel[0], 0, doc.getPageCount() - 1); S.thumbSel = new Set([S.current]);
  });
}
async function pasteClip(at){
  if (!S.pdf) return;
  if (!PAGE_CLIP) { toast('剪貼簿裡沒有頁面，請先複製或剪下頁面', 'err'); return; }
  const clip = PAGE_CLIP;
  if (at == null) at = S.current + 1;
  at = clamp(at, 0, S.pages.length);
  await mutate(`已貼上 ${clip.count} 頁（來自「${clip.from}」）`, async doc => {
    const src = await PDFDocument.load(clip.bytes, {ignoreEncryption:true, updateMetadata:false});
    (await doc.copyPages(src, src.getPageIndices())).forEach((p, k) => doc.insertPage(at + k, p));
    S.current = at;
  }, {scrollToCurrent:true, highlight:{from:at, count:clip.count, label:'貼上的頁面'}});
}

const STEPS = [10, 25, 33, 50, 67, 75, 90, 100, 110, 125, 150, 175, 200, 250, 300, 400, 500, 600, 800];
function nextZoom(dir){
  const cur = S.scale / PX * 100;

function rotate(delta){

  });

function wrapText(ctx, text, maxW){
  const lines = [];
  text.split('\n').forEach(par => {
    const toks = par.match(/[A-Za-z0-9_\-.,:;'"!?()@#%&*+=/\\]+|\s+|./gu) || [''];
    let line = '';
    for (const t of toks) {
      const test = line + t;
      if (ctx.measureText(test).width <= maxW || !line) {
        if (ctx.measureText(test).width > maxW && !line) {
          // a single long token: hard-break it
          let part = '';
          for (const ch of t) { if (ctx.measureText(part + ch).width > maxW && part) { lines.push(part); part = ch; } else part += ch; }
          line = part;
        } else line = test;
      } else { lines.push(line.replace(/\s+$/, '')); line = t.trimStart(); }
    }
    lines.push(line);
  });
  return lines;
}
async function textToPng(text, wPt, {size, color, bold, bg}){
  try { await document.fonts.load(`${bold ? 700 : 400} ${size}px "Noto Sans TC"`, text); } catch (_) {}
  const K = 4, pad = 4;
  const m = document.createElement('canvas').getContext('2d');
  m.font = `${bold ? 700 : 400} ${size * K}px ${FONT}`;
  const lines = wrapText(m, text, (wPt - pad * 2) * K);
  const lh = size * 1.4;
  const hPt = Math.max(size * 1.4 + pad * 2, lines.length * lh + pad * 2);
  const c = document.createElement('canvas'); c.width = Math.ceil(wPt * K); c.height = Math.ceil(hPt * K);
  const ctx = c.getContext('2d');
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height); ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = K * 0.75; ctx.strokeRect(K * 0.4, K * 0.4, c.width - K * 0.8, c.height - K * 0.8); }
  ctx.font = m.font; ctx.fillStyle = color; ctx.textBaseline = 'middle';
  lines.forEach((ln, k) => ctx.fillText(ln, pad * K, (pad + lh * k + lh / 2) * K));
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return {png:new Uint8Array(await blob.arrayBuffer()), hPt};
}

async function textToPngFixed(opt, b){
  // re-render at the final box height so the image is not stretched
  try { await document.fonts.load(`${opt.bold ? 700 : 400} ${opt.size}px "Noto Sans TC"`, opt.text); } catch (_) {}
  const K = 4, pad = 4, lh = opt.size * 1.4;
  const c = document.createElement('canvas'); c.width = Math.ceil(b.w * K); c.height = Math.ceil(b.h * K);
  const ctx = c.getContext('2d');
  if (opt.bg) { ctx.fillStyle = opt.bg; ctx.fillRect(0, 0, c.width, c.height); ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = K * 0.75; ctx.strokeRect(K * 0.4, K * 0.4, c.width - K * 0.8, c.height - K * 0.8); }
  ctx.font = `${opt.bold ? 700 : 400} ${opt.size * K}px ${FONT}`; ctx.fillStyle = opt.color; ctx.textBaseline = 'middle';
  wrapText(ctx, opt.text, (b.w - pad * 2) * K).forEach((ln, k) => ctx.fillText(ln, pad * K, (pad + lh * k + lh / 2) * K));
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return {png:new Uint8Array(await blob.arrayBuffer())};
}

function positionNote(){
  if (!NP) return;

function closeNote(save = true){

async function createNote(i, icon, text, box){
  await mutate('已新增註解', doc => {
    const g = visToPdf(i, icon), now = nowStr();
    const ap = formAP(doc, NOTE_ICON_OPS, 20, 20, g.rot);
    const ref = addAnnot(doc, i, {Type:'Annot', Subtype:'Text', Rect:g.rect, Contents:PDFHexString.fromText(text), T:PDFHexString.fromText(AUTHOR),
      M:now, CreationDate:now, Name:'Comment', Subj:PDFHexString.fromText('便利貼'), C:[1, 0.92, 0.23], F:4, Open:false, AP:{N:ap}});
    addPopupAnnot(doc, i, ref, box);
  });
}
function findAnnotRef(doc, i, id){
  const num = parseInt(id, 10), annots = doc.getPage(i).node.lookupMaybe(PDFName.of('Annots'), PDFArray);
  if (!annots) return null;
  for (let k = 0; k < annots.size(); k++) { const r = annots.get(k); if (r instanceof PDFRef && r.objectNumber === num) return r; }
  return null;
}
async function updateNote(i, id, text, box){
  await mutate('已更新註解', doc => {
    const ref = findAnnotRef(doc, i, id); if (!ref) { toast('找不到此註解', 'err'); return false; }
    const dict = doc.context.lookup(ref, PDFDict);
    dict.set(PDFName.of('Contents'), PDFHexString.fromText(text)); dict.set(PDFName.of('M'), nowStr());
    const pref = dict.get(PDFName.of('Popup'));
    if (pref instanceof PDFRef) doc.context.lookup(pref, PDFDict).set(PDFName.of('Rect'), doc.context.obj(visToPdf(i, box).rect));
    else addPopupAnnot(doc, i, ref, box);
  });
}
async function openNoteById(i, id){
  await noteSaving;
  const a = (await getAnns(i)).find(x => x.id === id); if (!a) return;
  openNotePopup(i, {id:a.id, icon:{x:a.x, y:a.y, w:a.w, h:a.h}, contents:a.contents, author:a.author, date:pdfDate(a.mdate), popupBox:a.popupBox});
}
function newNoteAt(i, x, y){
  const pg = S.pages[i];
  const icon = {x:clamp(x - 10, 0, pg.w - 20), y:clamp(y - 10, 0, pg.h - 20), w:20, h:20};
  openNotePopup(i, {id:null, icon, contents:'', author:AUTHOR, date:new Date(), popupBox:null});
}

  const presets = (PRESETS[k] || []).map((p, n) => `<button class="pchip" data-p="${n}" title="${p.n}"><i style="${k === 'text' ? `background:${p.color}` : `border:${Math.min(3, p.width || 1) + 1}px ${p.dash ? 'dashed' : 'solid'} ${p.color};background:${p.fill || 'transparent'};opacity:${p.opacity || 1};box-shadow:0 0 0 1px rgba(0,0,0,.15)`}"></i>${p.n}</button>`).join('');

  if (k === 'box' || k === 'poly') h = `<span class="sb-g">${presets}</span><span class="sb-h">框線</span>${sw('color')}${(k === 'box' || def.closed) ? `<span class="sb-h">填色</span>${sw('fill', true)}` : ''}${widthSel}${dash}${opSel}`;

/* ---------- geometry → appearance stream + annotation dict ---------- */
function gsRes(st){ return (st.opacity ?? 1) < 1 ? {ExtGState:{GS0:{Type:'ExtGState', CA:st.opacity, ca:st.opacity}}} : null; }
function strokePrefix(st){
  return `${(st.opacity ?? 1) < 1 ? '/GS0 gs ' : ''}${hexRgb(st.color)} RG ${(+st.width || 1).toFixed(2)} w 1 J 1 j ${st.dash ? `[${(3 * (+st.width || 1)).toFixed(1)} ${(2.2 * (+st.width || 1)).toFixed(1)}] 0 d ` : ''}`;
}
function bboxOf(pts, pad){
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x = Math.min(...xs) - pad, y = Math.min(...ys) - pad;
  return {x, y, w:Math.max(1, Math.max(...xs) + pad - x), h:Math.max(1, Math.max(...ys) + pad - y)};
}
const loc = (b, p) => [(p.x - b.x).toFixed(2), (b.y + b.h - p.y).toFixed(2)];
const toPdfPts = (i, pts) => pts.flatMap(p => S.pages[i].vp1.convertToPdfPoint(p.x, p.y));
function bsDict(st){ return {W:+st.width || 1, S:st.dash ? 'D' : 'S', ...(st.dash ? {D:[3 * (+st.width || 1), 2.2 * (+st.width || 1)]} : {})}; }
function baseDict(sub, label, st, extra = {}){
  return {Type:'Annot', Subtype:sub, T:PDFHexString.fromText(AUTHOR), M:nowStr(), CreationDate:nowStr(), Subj:PDFHexString.fromText(label), F:4, PDFE:true,
    ...(st.color ? {C:hexColor(st.color)} : {}), ...((st.opacity ?? 1) < 1 ? {CA:st.opacity} : {}), ...extra};
}
function arrowHead(tip, from, st){
  const w = +st.width || 1, len = Math.max(8, w * 4.5), ang = Math.atan2(tip.y - from.y, tip.x - from.x), a = 0.45;
  return [{x:tip.x - len * Math.cos(ang - a), y:tip.y - len * Math.sin(ang - a)}, tip, {x:tip.x - len * Math.cos(ang + a), y:tip.y - len * Math.sin(ang + a)}];
}
function geomLine(p0, p1, st, arrow){
  const heads = [];
  if (arrow) { heads.push(arrowHead(p1, p0, st)); if (st.head === 'both') heads.push(arrowHead(p0, p1, st)); }
  const b = bboxOf([p0, p1, ...heads.flat()], (+st.width || 1) + 2);
  let ops = `${strokePrefix(st)}${loc(b, p0).join(' ')} m ${loc(b, p1).join(' ')} l S `;
  heads.forEach(hd => {
    const [l, t, r] = hd.map(p => loc(b, p).join(' '));
    ops += st.head === 'closed' ? `[] 0 d ${hexRgb(st.color)} rg ${l} m ${t} l ${r} l h B ` : `[] 0 d ${l} m ${t} l ${r} l S `;
  });
  return {b, ops, svg:{line:[p0, p1], heads, closed:st.head === 'closed'}};
}
function ellipsePath(b, r){
  const k = 0.5523, cx = r.x + r.w / 2, cy = r.y + r.h / 2, rx = r.w / 2, ry = r.h / 2;
  const P = (x, y) => loc(b, {x, y}).join(' ');
  return `${P(cx + rx, cy)} m ${P(cx + rx, cy + ry * k)} ${P(cx + rx * k, cy + ry)} ${P(cx, cy + ry)} c ${P(cx - rx * k, cy + ry)} ${P(cx - rx, cy + ry * k)} ${P(cx - rx, cy)} c ` +
    `${P(cx - rx, cy - ry * k)} ${P(cx - rx * k, cy - ry)} ${P(cx, cy - ry)} c ${P(cx + rx * k, cy - ry)} ${P(cx + rx, cy - ry * k)} ${P(cx + rx, cy)} c h `;
}
function cloudSegments(r, st){
  // scalloped outline along the rectangle, bumps pointing outwards
  const d = Math.max(9, (+st.width || 1) * 6), out = [];
  const edges = [[{x:r.x, y:r.y}, {x:r.x + r.w, y:r.y}, {x:0, y:-1}], [{x:r.x + r.w, y:r.y}, {x:r.x + r.w, y:r.y + r.h}, {x:1, y:0}],
                 [{x:r.x + r.w, y:r.y + r.h}, {x:r.x, y:r.y + r.h}, {x:0, y:1}], [{x:r.x, y:r.y + r.h}, {x:r.x, y:r.y}, {x:-1, y:0}]];
  for (const [A, B, N] of edges) {
    const L = Math.hypot(B.x - A.x, B.y - A.y), m = Math.max(1, Math.round(L / d));
    for (let k = 0; k < m; k++) {
      const p = {x:A.x + (B.x - A.x) * k / m, y:A.y + (B.y - A.y) * k / m}, q = {x:A.x + (B.x - A.x) * (k + 1) / m, y:A.y + (B.y - A.y) * (k + 1) / m};
      const bul = Math.hypot(q.x - p.x, q.y - p.y) * 0.62;
      out.push([p, {x:p.x + (q.x - p.x) * .05 + N.x * bul, y:p.y + (q.y - p.y) * .05 + N.y * bul}, {x:q.x - (q.x - p.x) * .05 + N.x * bul, y:q.y - (q.y - p.y) * .05 + N.y * bul}, q]);
    }
  }
  return out;
}
function geomBox(r, st, shape){
  const extra = shape === 'cloud' ? Math.max(9, (+st.width || 1) * 6) * .62 : 0;
  const b = {x:r.x - extra - (+st.width || 1), y:r.y - extra - (+st.width || 1), w:r.w + 2 * (extra + (+st.width || 1)), h:r.h + 2 * (extra + (+st.width || 1))};
  const paint = st.fill ? 'B' : 'S';
  let path;
  if (shape === 'rect') { const [x, y] = loc(b, {x:r.x, y:r.y + r.h}); path = `${x} ${y} ${r.w.toFixed(2)} ${r.h.toFixed(2)} re `; }
  else if (shape === 'ellipse') path = ellipsePath(b, r);
  else { const segs = cloudSegments(r, st); path = `${loc(b, segs[0][0]).join(' ')} m ` + segs.map(([, c1, c2, q]) => `${loc(b, c1).join(' ')} ${loc(b, c2).join(' ')} ${loc(b, q).join(' ')} c`).join(' ') + ' h '; }
  return {b, ops:`${strokePrefix(st)}${st.fill ? hexRgb(st.fill) + ' rg ' : ''}${path}${paint}`};
}
function geomPoly(pts, st, closed){
  const b = bboxOf(pts, (+st.width || 1) + 2);
  return {b, ops:`${strokePrefix(st)}${st.fill && closed ? hexRgb(st.fill) + ' rg ' : ''}${pts.map((p, k) => `${loc(b, p).join(' ')} ${k ? 'l' : 'm'}`).join(' ')} ${closed ? 'h ' + (st.fill ? 'B' : 'S') : 'S'}`};
}
function geomInk(strokes, st){
  const b = bboxOf(strokes.flat(), (+st.width || 1) + 2);
  return {b, ops:`${strokePrefix(st)}` + strokes.map(s => s.map((p, k) => `${loc(b, p).join(' ')} ${k ? 'l' : 'm'}`).join(' ') + (s.length === 1 ? ` ${loc(b, s[0]).join(' ')} l` : '') + ' S').join(' ')};
}
async function addGeomAnnot(i, label, geom, dict, res){
  return mutate(`已加入${label}`, doc => {
    const g = visToPdf(i, geom.b);
    const ap = formAP(doc, geom.ops, geom.b.w, geom.b.h, g.rot, res);
    addAnnot(doc, i, {...dict, Rect:g.rect, AP:{N:ap}});
  });
}
async function createLine(i, p0, p1, t){
  const st = STYLES[t], def = DRAW_TOOLS[t], geom = geomLine(p0, p1, st, def.arrow);
  const LE = def.arrow ? [st.head === 'both' ? 'OpenArrow' : 'None', st.head === 'closed' ? 'ClosedArrow' : 'OpenArrow'] : ['None', 'None'];
  await addGeomAnnot(i, def.label.replace('工具', ''), geom, baseDict('Line', def.label.replace('工具', ''), st, {L:toPdfPts(i, [p0, p1]), LE, BS:bsDict(st), ...(st.head === 'closed' ? {IC:hexColor(st.color)} : {})}), gsRes(st));
}
async function createBox(i, r, t){
  const st = STYLES[t], def = DRAW_TOOLS[t], geom = geomBox(r, st, def.shape);
  const sub = def.shape === 'ellipse' ? 'Circle' : 'Square';
  await addGeomAnnot(i, def.label.replace('工具', ''), geom, baseDict(sub, def.label.replace('工具', ''), st, {BS:bsDict(st), ...(st.fill ? {IC:hexColor(st.fill)} : {}), ...(def.shape === 'cloud' ? {BE:{S:'C', I:1}} : {})}), gsRes(st));
}
async function createPoly(i, pts, t){
  const st = STYLES[t], def = DRAW_TOOLS[t], geom = geomPoly(pts, st, def.closed);
  await addGeomAnnot(i, def.label.replace('工具', ''), geom, baseDict(def.closed ? 'Polygon' : 'PolyLine', def.label.replace('工具', ''), st, {Vertices:toPdfPts(i, pts), BS:bsDict(st), ...(st.fill && def.closed ? {IC:hexColor(st.fill)} : {})}), gsRes(st));
}
function inkAnnotParts(doc, i, strokes, st, label){
  const geom = geomInk(strokes, st), g = visToPdf(i, geom.b);
  const ap = formAP(doc, geom.ops, geom.b.w, geom.b.h, g.rot, gsRes(st));
  addAnnot(doc, i, {...baseDict('Ink', label, st, {InkList:strokes.map(s => toPdfPts(i, s)), BS:{W:+st.width || 1}}), Rect:g.rect, AP:{N:ap}});
}

/* ---------- live preview layer (SVG in page units) ---------- */
function svgLayer(i){
  const el = S.els[i], pg = S.pages[i];
  let s = el.querySelector('svg.dsvg');
  if (!s) { s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'dsvg'); s.setAttribute('preserveAspectRatio', 'none'); el.appendChild(s); }
  s.setAttribute('viewBox', `0 0 ${pg.w} ${pg.h}`);
  return s;
}
function svgStyle(st, fill){
  return `stroke="${st.color}" stroke-width="${+st.width || 1}" stroke-linecap="round" stroke-linejoin="round" ${st.dash ? `stroke-dasharray="${3 * (+st.width || 1)} ${2.2 * (+st.width || 1)}"` : ''} fill="${fill || 'none'}" opacity="${st.opacity ?? 1}"`;
}
const ptsAttr = pts => pts.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');
function previewMarkup(t, data){
  const st = STYLES[t], def = DRAW_TOOLS[t];
  if (def.kind === 'line') {
    const g = geomLine(data.p0, data.p1, st, def.arrow);
    return `<line x1="${data.p0.x}" y1="${data.p0.y}" x2="${data.p1.x}" y2="${data.p1.y}" ${svgStyle(st)}/>` +
      g.svg.heads.map(h => `<polyline points="${ptsAttr(h)}" ${svgStyle({...st, dash:false}, st.head === 'closed' ? st.color : '')}/>`).join('');
  }
  if (def.kind === 'box') {
    const r = data.r;
    if (def.shape === 'rect') return `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" ${svgStyle(st, st.fill)}/>`;

      let last = null, lastW = 3;
      const pt = e => { const b = c.getBoundingClientRect(); return {x:(e.clientX - b.left) * c.width / b.width, y:(e.clientY - b.top) * c.height / b.height, t:performance.now()}; };

function trimCanvas(c){
  const ctx = c.getContext('2d'), d = ctx.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const pad = 6, o = document.createElement('canvas');
  o.width = x1 - x0 + 1 + pad * 2; o.height = y1 - y0 + 1 + pad * 2;
  o.getContext('2d').drawImage(c, x0 - pad, y0 - pad, o.width, o.height, 0, 0, o.width, o.height);
  return o;
}

async function removeAttachment(name){
  await mutate('已移除附件', doc => {
    const names = doc.catalog.lookupMaybe(PDFName.of('Names'), PDFDict);

    const arr = ef && ef.lookupMaybe(PDFName.of('Names'), PDFArray);

      const s = key && key.decodeText ? key.decodeText() : '';
      if (s === name) { arr.remove(k); arr.remove(k); return; }

  });

  if (email && /^[\x21-\x7e]+@[\x21-\x7e]+$/.test(email)) attrs.push({name:'emailAddress', value:email});

    .concat(p12.getBags({bagType:forge.pki.oids.keyBag})[forge.pki.oids.keyBag] || []);
  const certs = (p12.getBags({bagType:forge.pki.oids.certBag})[forge.pki.oids.certBag] || []).map(b => b.cert).filter(Boolean);
  if (!kb.length || !kb[0].key) throw new Error('憑證檔中找不到私鑰');
  if (!certs.length) throw new Error('憑證檔中找不到憑證');
  const key = kb[0].key;

    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint32(16, crc, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);

$('#pgIn').addEventListener('keydown', e => { if (e.key === 'Enter') { const n = parseInt(e.target.value, 10); if (n >= 1) scrollToPage(n - 1); e.target.blur(); } });
$('#pgIn').addEventListener('focus', e => e.target.select());
$('#pgIn').addEventListener('blur', updatePager);
$('#zIn').addEventListener('keydown', e => { if (e.key === 'Enter') { const n = parseFloat(e.target.value); if (n > 0) zoomTo(n / 100 * PX); e.target.blur(); } });
$('#zIn').addEventListener('focus', e => e.target.select());
$('#zIn').addEventListener('blur', updateZoomUI);
['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); viewer.classList.add('drop'); }));
['dragleave', 'drop'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); if (ev === 'dragleave' && e.relatedTarget) return; viewer.classList.remove('drop'); }));
window.addEventListener('drop', e => {
  const f = [...(e.dataTransfer && e.dataTransfer.files || [])];
  const isPdf = x => /\.pdf$/i.test(x.name) || x.type === 'application/pdf';
  const pdfs = f.filter(isPdf);
  if (pdfs.length > 1) { (async () => { for (const x of pdfs) { const fp = DESK && DESK.pathForFile(x); if (fp) await openPath(fp); else await openFile(x); } })(); return; }
  const idx = f.findIndex(isPdf);
  const pdf = f[idx];
  const item = idx >= 0 && e.dataTransfer.items ? [...e.dataTransfer.items].filter(it => it.kind === 'file')[idx] : null;
  const hp = item && item.getAsFileSystemHandle ? item.getAsFileSystemHandle().catch(() => null) : Promise.resolve(null);
  if (pdf && DESK) { const fp = DESK.pathForFile(pdf); if (fp) openPath(fp); else openFile(pdf); }
  else if (pdf) hp.then(h => openFile(pdf, h && h.kind === 'file' ? h : null)); else if (f.length && S.pdf) { const dt = new DataTransfer(); f.forEach(x => dt.items.add(x)); $('#fAttach').files = dt.files; $('#fAttach').dispatchEvent(new Event('change')); }
});
window.addEventListener('beforeunload', e => { if (anyDirty()) { e.preventDefault(); e.returnValue = ''; } });
$$('[data-need]').forEach(b => b.disabled = true);
updateUI();

/* ====================================================================
   Custom key / mouse-button bindings
   ==================================================================== */
const BIND_ACTIONS = [
  {id:'prevPage', label:'上一頁', run:() => goPage(-1)},
  {id:'nextPage', label:'下一頁', run:() => goPage(1)},
  {id:'firstPage', label:'第一頁', run:() => scrollToPage(0)},
  {id:'lastPage', label:'最後一頁', run:() => scrollToPage(S.pages.length - 1)},
  {id:'prevTab', label:'上一個分頁', run:() => docs.length > 1 && switchTab((active - 1 + docs.length) % docs.length)},
  {id:'nextTab', label:'下一個分頁', run:() => docs.length > 1 && switchTab((active + 1) % docs.length)},
];
const K = (code, label, m = {}) => ({type:'key', code, label, ctrl:!!m.ctrl, shift:!!m.shift, alt:!!m.alt});
const MB = button => ({type:'mouse', button});
const DEFAULT_BINDS = {
  prevPage:[K('ArrowLeft', '←'), K('PageUp', 'Page Up'), MB(3)],
  nextPage:[K('ArrowRight', '→'), K('PageDown', 'Page Down'), MB(4)],
  firstPage:[K('Home', 'Home')], lastPage:[K('End', 'End')],
  prevTab:[], nextTab:[],
};
const MAX_BINDS = 3;
const BIND_KEY = 'pdfeditor.bindings.v1';
let BINDS = (() => {
  try { const b = JSON.parse(localStorage.getItem(BIND_KEY)); if (b && typeof b === 'object') return {...structuredClone(DEFAULT_BINDS), ...b}; } catch (_) {}
  return structuredClone(DEFAULT_BINDS);
})();
const MOUSE_NAMES = {1:'滑鼠中鍵', 3:'滑鼠側鍵（後退）', 4:'滑鼠側鍵（前進）'};
function bindLabel(b){
  if (!b) return '';
  if (b.type === 'mouse') return MOUSE_NAMES[b.button] || `滑鼠按鍵 ${b.button + 1}`;
  return [b.ctrl && 'Ctrl', b.alt && 'Alt', b.shift && 'Shift', b.label].filter(Boolean).join(' + ');
}
const sameBind = (a, b) => a && b && a.type === b.type && (a.type === 'mouse' ? a.button === b.button : a.code === b.code && a.ctrl === b.ctrl && a.shift === b.shift && a.alt === b.alt);
const KEY_LABELS = {ArrowLeft:'←', ArrowRight:'→', ArrowUp:'↑', ArrowDown:'↓', PageUp:'Page Up', PageDown:'Page Down', Home:'Home', End:'End',
  Insert:'Insert', Delete:'Delete', Backspace:'Backspace', Enter:'Enter', Tab:'Tab', Space:'空白鍵', Escape:'Esc', Backquote:'`', Minus:'-', Equal:'=',
  BracketLeft:'[', BracketRight:']', Backslash:'\\', Semicolon:';', Quote:"'", Comma:',', Period:'.', Slash:'/'};
function keyFromEvent(e){
  let label = KEY_LABELS[e.code];
  if (!label) {
    if (/^Key[A-Z]$/.test(e.code)) label = e.code.slice(3);
    else if (/^Digit\d$/.test(e.code)) label = e.code.slice(5);
    else if (/^Numpad/.test(e.code)) label = '數字鍵盤 ' + e.code.slice(6);
    else if (/^F\d+$/.test(e.code)) label = e.code;
    else label = e.key && e.key.length === 1 ? e.key.toUpperCase() : (e.key || e.code);
  }
  return K(e.code, label, {ctrl:e.ctrlKey || e.metaKey, shift:e.shiftKey, alt:e.altKey});
}
// shortcuts the app already uses; a custom binding may not take them over
const RESERVED = [K('KeyO', 'O', {ctrl:1}), K('KeyS', 'S', {ctrl:1}), K('KeyZ', 'Z', {ctrl:1}), K('KeyY', 'Y', {ctrl:1}), K('KeyZ', 'Z', {ctrl:1, shift:1}),
  K('KeyC', 'C', {ctrl:1}), K('KeyX', 'X', {ctrl:1}), K('KeyV', 'V', {ctrl:1}), K('KeyW', 'W', {ctrl:1}), K('KeyA', 'A', {ctrl:1}),
  K('Tab', 'Tab', {ctrl:1}), K('Tab', 'Tab', {ctrl:1, shift:1}), K('Digit0', '0', {ctrl:1}), K('Equal', '=', {ctrl:1}), K('Minus', '-', {ctrl:1}),
  K('Space', '空白鍵'), K('Escape', 'Esc'), K('Delete', 'Delete'), K('KeyR', 'R', {ctrl:1}), K('Enter', 'Enter')];
const isReserved = b => b.type === 'key' && RESERVED.some(r => sameBind(r, b));
function findBinding(b){ for (const a of BIND_ACTIONS) if ((BINDS[a.id] || []).some(x => sameBind(x, b))) return a; return null; }
const mouseBound = button => !!findBinding(MB(button));

// dispatch: keyboard (called from the main keydown handler) and mouse buttons
function runKeyBinding(e){
  if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return false;
  const a = findBinding(keyFromEvent(e)); if (!a) return false;
  e.preventDefault(); a.run(); return true;
}
let lastMouseBind = 0;
window.addEventListener('mousedown', e => {
  if (capture || !S.pdf || $('#mask').classList.contains('show') || e.button === 0 || e.button === 2) return;
  const a = findBinding(MB(e.button)); if (!a) return;
  e.preventDefault(); e.stopPropagation(); lastMouseBind = performance.now(); a.run();
}, true);
// stop the browser's own back/forward handling of side buttons
window.addEventListener('mouseup', e => { if (e.button === 3 || e.button === 4) e.preventDefault(); }, true);
window.addEventListener('auxclick', e => { if (e.button === 3 || e.button === 4) e.preventDefault(); }, true);
if (DESK && DESK.onAppCommand) DESK.onAppCommand(cmd => {
  const button = cmd === 'browser-backward' ? 3 : cmd === 'browser-forward' ? 4 : -1;
  if (button < 0) return;
  if (capture) { capture(MB(button)); return; }
  if (performance.now() - lastMouseBind < 400 || !S.pdf || $('#mask').classList.contains('show')) return;   // already handled as a mouse event
  const a = findBinding(MB(button)); if (a) a.run();
});

// recording a new binding
let capture = null;
async function openKeySettings(){
  const work = structuredClone(BINDS);
  const body = document.createElement('div');
  body.innerHTML = `<div class="note" style="margin-bottom:12px">點選格子後，按下想要的<b>鍵盤按鍵</b>（可搭配 Ctrl / Alt / Shift）或<b>滑鼠按鍵</b>（例如側鍵、中鍵）即可設定。每個動作最多 ${MAX_BINDS} 組。</div>
    <table class="kb"><thead><tr><th>動作</th>${Array.from({length:MAX_BINDS}, (_, k) => `<th>按鍵 ${k + 1}</th>`).join('')}</tr></thead><tbody id="kbBody"></tbody></table>
    <div class="ex-warn" id="kbMsg" style="margin-top:8px"></div>`;
  const tb = body.querySelector('#kbBody'), msg = body.querySelector('#kbMsg');
  const draw = () => {
    tb.innerHTML = '';
    BIND_ACTIONS.forEach(a => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="act">${a.label}</td>` + Array.from({length:MAX_BINDS}, (_, k) => {
        const b = (work[a.id] || [])[k];
        return `<td><div class="kcell${b ? '' : ' empty'}" data-a="${a.id}" data-k="${k}" tabindex="0"><span>${b ? esc(bindLabel(b)) : '未設定'}</span>${b ? '<button class="kx" title="清除">×</button>' : ''}</div></td>`;
      }).join('');
      tb.appendChild(tr);
    });
  };
  const stopCapture = () => {
    capture = null;
    window.removeEventListener('keydown', onKey, true); window.removeEventListener('mousedown', onMouse, true);
    window.removeEventListener('contextmenu', onCtx, true);
    body.querySelectorAll('.kcell.rec').forEach(c => c.classList.remove('rec'));
  };
  let target = null;
  const assign = b => {
    const {a, k} = target; stopCapture();
    if (isReserved(b)) { msg.textContent = `「${bindLabel(b)}」是程式內建的快捷鍵，請換一個。`; draw(); return; }
    // a binding belongs to one action only: take it away from wherever it was
    let moved = '';
    BIND_ACTIONS.forEach(x => { const list = work[x.id] || []; const i = list.findIndex(y => sameBind(y, b)); if (i >= 0 && !(x.id === a && i === k)) { list.splice(i, 1); if (x.id !== a) moved = x.label; } });
    const list = work[a] = (work[a] || []);
    if (k < list.length) list[k] = b; else list.push(b);
    work[a] = list.slice(0, MAX_BINDS);
    msg.textContent = moved ? `「${bindLabel(b)}」原本設定給「${moved}」，已改為「${BIND_ACTIONS.find(x => x.id === a).label}」。` : '';
    draw();
  };
  const onKey = e => {
    e.preventDefault(); e.stopPropagation();
    if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;   // wait for the real key
    if (e.key === 'Escape' && !e.ctrlKey && !e.shiftKey && !e.altKey) { stopCapture(); msg.textContent = ''; draw(); return; }
    if (e.key === 'Backspace' && !e.ctrlKey && !e.shiftKey && !e.altKey) { const {a, k} = target; stopCapture(); (work[a] || []).splice(k, 1); draw(); return; }
    assign(keyFromEvent(e));
  };
  const onMouse = e => {
    if (e.button === 0) {   // left click: cancel unless it is on the cell being recorded
      if (!e.target.closest('.kcell.rec')) { stopCapture(); draw(); }
      return;
    }
    e.preventDefault(); e.stopPropagation();
    if (e.button === 2) { msg.textContent = '滑鼠右鍵用於選單，無法設定。'; return; }
    assign(MB(e.button));
  };
  const onCtx = e => { e.preventDefault(); e.stopPropagation(); };
  tb.addEventListener('click', e => {
    const x = e.target.closest('.kx');
    const c = e.target.closest('.kcell'); if (!c) return;
    const a = c.dataset.a, k = +c.dataset.k;
    if (x) { (work[a] || []).splice(k, 1); stopCapture(); draw(); return; }
    stopCapture(); draw();
    const cell = tb.querySelector(`.kcell[data-a="${a}"][data-k="${Math.min(k, (work[a] || []).length)}"]`);
    target = {a, k:Math.min(k, (work[a] || []).length)};
    cell.classList.add('rec'); cell.querySelector('span').textContent = '請按下按鍵或滑鼠按鍵…'; msg.textContent = 'Esc 取消、Backspace 清除這一格';
    capture = assign;
    window.addEventListener('keydown', onKey, true); window.addEventListener('mousedown', onMouse, true);
    window.addEventListener('contextmenu', onCtx, true);
  });
  draw();
  const r = await openModal({title:'按鍵設定', body, width:720, buttons:[
    {label:'恢復預設', handler:() => { stopCapture(); Object.keys(work).forEach(k => delete work[k]); Object.assign(work, structuredClone(DEFAULT_BINDS)); msg.textContent = '已恢復預設，按「儲存」套用。'; draw(); }},
    {spacer:true}, {label:'取消', value:false}, {label:'儲存', primary:true, value:true}]});
  stopCapture();
  if (!r) return;
  BINDS = work;
  try { localStorage.setItem(BIND_KEY, JSON.stringify(BINDS)); } catch (_) {}
  toast('按鍵設定已儲存');
}

/* ====================================================================
   Desktop: open-with, updates
   ==================================================================== */
const UPD = {state:{state:'idle'}, info:null, modalOpen:false, dismissed:null};
function renderUpdate(){
  const s = UPD.state, bar = $('#updBar'), dot = $('#updDot'), txt = $('#bUpdTxt');
  dot.classList.toggle('on', s.state === 'ready');
  txt.textContent = s.state === 'ready' ? '立即更新' : s.state === 'downloading' ? `下載中 ${s.percent || 0}%` : s.state === 'checking' ? '檢查中…' : '檢查更新';
  if (s.state === 'ready' && UPD.dismissed !== s.version) {
    bar.innerHTML = `<span>新版本 <b>v${esc(s.version)}</b> 已下載完成，重新啟動即可完成更新。</span><span class="sp"></span>
      ${s.notes ? '<button data-u="notes">查看更新內容</button>' : ''}<button data-u="later">稍後</button><button class="go" data-u="install">立即重新啟動並更新</button>`;
    bar.classList.add('show');
  } else if (s.state === 'downloading') {
    bar.innerHTML = `<span>正在下載新版本 <b>v${esc(s.version || '')}</b>…</span><span class="bar"><i style="width:${s.percent || 0}%"></i></span><span>${s.percent || 0}%</span><span class="sp"></span>`;
    bar.classList.add('show');
  } else bar.classList.remove('show');
  if (UPD.modalOpen) { const m = $('#updMsg'); if (m) m.innerHTML = updateMessage(); }
}
function updateMessage(){
  const s = UPD.state, v = UPD.info ? UPD.info.version : '';
  switch (s.state) {
    case 'checking': return '<span class="spin" style="display:inline-block;vertical-align:-3px;margin-right:8px"></span>正在檢查新版本…';
    case 'latest': return `目前已是最新版本 <b>v${esc(v)}</b>。`;
    case 'available': return `發現新版本 <b>v${esc(s.version)}</b>，正在背景下載…`;
    case 'downloading': return `正在下載新版本 <b>v${esc(s.version || '')}</b>… ${s.percent || 0}%<div class="updbar show" style="background:transparent;padding:8px 0 0"><span class="bar" style="background:#e6e2d9;width:100%"><i style="width:${s.percent || 0}%;background:#2f9e62"></i></span></div>`;
    case 'ready': return `新版本 <b>v${esc(s.version)}</b> 已下載完成。${s.notes ? `<div class="note" style="margin-top:10px;white-space:pre-wrap;max-height:220px;overflow:auto">${esc(s.notes)}</div>` : ''}`;
    case 'error': return `檢查更新時發生問題：${esc(s.message || '')}<div class="note" style="margin-top:10px">請確認網路連線後再試一次。也可以到 GitHub 的版本頁面手動下載最新安裝檔。</div>`;
    case 'dev': return '目前是開發模式，不會自動更新。';
    case 'unsupported': return '這個安裝方式不支援自動更新，請到 GitHub 版本頁面下載最新安裝檔。';
    default: return '';
  }
}
async function installUpdate(){
  if (anyDirty() && !(await confirmDlg('安裝更新', '文件有尚未儲存的修改，重新啟動後這些修改會遺失。要繼續更新嗎？（建議先按「儲存」）', '仍要更新'))) return;
  S.dirty = false; docs.forEach(d => d.dirty = false);
  toast('正在重新啟動並安裝更新…');
  await DESK.update.install();
}
actions.checkUpdate = async () => {
  if (!DESK) return;
  if (UPD.state.state === 'ready') return showUpdateModal();
  DESK.update.check().then(st => { if (st) { UPD.state = st; renderUpdate(); } });
  if (UPD.state.state !== 'downloading') { UPD.state = {state:'checking'}; renderUpdate(); }
  showUpdateModal();
};
async function showUpdateModal(){
  UPD.modalOpen = true;
  const ready = UPD.state.state === 'ready';
  const r = await openModal({title:'軟體更新', width:460,
    body:`<div style="margin-bottom:8px;color:var(--ink2)">目前版本：v${esc(UPD.info ? UPD.info.version : '')}</div><div id="updMsg">${updateMessage()}</div>`,
    buttons:[{label:'版本記錄', value:'page'}, {spacer:true}, {label:ready ? '稍後' : '關閉', value:false}].concat(ready ? [{label:'立即重新啟動並更新', primary:true, value:'install'}] : [])});
  UPD.modalOpen = false;
  if (r === 'install') installUpdate();
  if (r === 'page') DESK.openExternal('https://github.com/Tsukiinuhibi/PDFEditor/releases');
}
$('#updBar').addEventListener('click', e => {
  const u = e.target.dataset.u; if (!u) return;
  if (u === 'install') installUpdate();
  if (u === 'later') { UPD.dismissed = UPD.state.version; renderUpdate(); }
  if (u === 'notes') showUpdateModal();
});
if (DESK) {
  $('#grpApp').style.display = '';
  DESK.info().then(info => { UPD.info = info; if (info.user) AUTHOR = info.user; $('#stVer').textContent = 'v' + info.version; $('#stVer').title = '檢查更新'; });
  $('#stVer').addEventListener('click', () => actions.checkUpdate());
  DESK.update.on(st => {
    const prev = UPD.state.state; UPD.state = st; renderUpdate();
    if (st.state === 'ready' && prev !== 'ready') toast(`新版本 v${st.version} 已下載完成`);
  });
  DESK.update.state().then(st => { if (st) { UPD.state = st; renderUpdate(); } });
  DESK.onOpenPath(p => openPath(p));
  DESK.ready().then(async list => { for (const p of (list || [])) await openPath(p); });
}
paintSplitButtons();
window.__pdfapp = {S, actions, scrollToPage, makeSample, pageChars:i => pageChars(i), sel:() => AS && {id:AS.a.id, sub:AS.a.subtype, box:AS.box}};
</script>
