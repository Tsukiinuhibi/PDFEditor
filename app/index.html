        case O.paintImageXObject: add(a[1], a[2]); break;
        case O.paintInlineImageXObject: add(a[0] && a[0].width, a[0] && a[0].height); break;
        case O.paintImageMaskXObject: add(a[0] && a[0].width, a[0] && a[0].height); break;
      }
    }
    return out;
  })().then(out => { imgResolved.set(key, out); return out; }).catch(e => { console.warn(e); return []; });

}

  if (!S.pdf) return;

    e.preventDefault();

  }

    // single / two-page: wheel past the edge flips to the next spread

    const now = performance.now();

      flipAcc += e.deltaY;

function drawPageAids(i){

  const pg = S.pages[i], grd = el.querySelector('.grd'), gdl = el.querySelector('.gdl');
  if (grd) {
    const g = gridPt(), sx = g / pg.w * 100, sy = g / pg.h * 100, M = 5;
    grd.style.backgroundSize = `${sx}% ${sy}%, ${sx}% ${sy}%, ${sx * M}% ${sy * M}%, ${sx * M}% ${sy * M}%`;
  }
  if (!gdl) return;
  gdl.querySelectorAll('.guide').forEach(n => n.remove());
  if (!VIEW.guides) return;
  S.guides.h.forEach((y, k) => gdl.appendChild(guideEl('h', k, y / pg.h * 100)));
  S.guides.v.forEach((x, k) => gdl.appendChild(guideEl('v', k, x / pg.w * 100)));
}
function guideEl(dir, k, pct){
  const d = document.createElement('div'); d.className = 'guide ' + dir; d.dataset.k = k;
  if (dir === 'h') d.style.top = pct + '%'; else d.style.left = pct + '%';
  d.title = '拖曳移動；拖出頁面即可刪除';
  d.addEventListener('pointerdown', e => { if (e.button !== 0 || S.spaceDown) return; e.preventDefault(); e.stopPropagation(); dragGuide(dir, k, e); });
  d.addEventListener('dblclick', e => { e.stopPropagation(); S.guides[dir].splice(k, 1); applyViewAids(); toast('已刪除輔助線'); });
  return d;
}
const fmtMm = pt => (pt / MM).toFixed(1).replace(/\.0$/, '') + ' mm';
function pageAt(cx, cy){
  const hit = document.elementsFromPoint(cx, cy).find(n => n.classList && n.classList.contains('page'));
  return hit ? +hit.dataset.i : -1;
}
// create (k < 0) or move a guide; it applies to every page of the document
function dragGuide(dir, k, e){
  const ghost = document.createElement('div'); ghost.className = 'guide-ghost ' + dir; document.body.appendChild(ghost);
  const lab = document.createElement('div'); lab.className = 'guide-lab'; document.body.appendChild(lab);
  let val = null, page = -1;
  const move = ev => {
    page = pageAt(ev.clientX, ev.clientY);
    const vr = viewer.getBoundingClientRect();
    if (dir === 'h') { ghost.style.top = ev.clientY + 'px'; ghost.style.left = vr.left + 'px'; ghost.style.width = vr.width + 'px'; }
    else { ghost.style.left = ev.clientX + 'px'; ghost.style.top = vr.top + 'px'; ghost.style.height = vr.height + 'px'; }
    if (page >= 0) {
      const r = S.els[page].getBoundingClientRect();
      let v = dir === 'h' ? (ev.clientY - r.top) / S.scale : (ev.clientX - r.left) / S.scale;
      if (VIEW.snap && VIEW.grid) { const g = gridPt(), s = Math.round(v / g) * g; if (Math.abs(s - v) * S.scale < 7) v = s; }
      val = v;
      lab.textContent = (dir === 'h' ? '↕ ' : '↔ ') + fmtMm(v);
      ghost.classList.remove('del');
    } else { val = null; lab.textContent = k >= 0 ? '放開即刪除' : '拖到頁面上'; ghost.classList.add('del'); }
    lab.style.left = (ev.clientX + 14) + 'px'; lab.style.top = (ev.clientY + 14) + 'px';
  };
  const up = () => {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
    ghost.remove(); lab.remove();
    if (k >= 0) S.guides[dir].splice(k, 1);
    if (val != null && page >= 0 && val >= 0 && val <= (dir === 'h' ? S.pages[page].h : S.pages[page].w)) S.guides[dir].push(val);
    else if (k >= 0) toast('已刪除輔助線');
    if (!VIEW.guides) VIEW.guides = true;
    applyViewAids();
  };
  move(e);
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
}

/* rulers: millimetres, origin at the top-left corner of the page under the mouse (or the current page) */
let rulerRaf = 0, rulerPtr = null, rulerPage = -1;
function drawRulers(){ cancelAnimationFrame(rulerRaf); rulerRaf = requestAnimationFrame(paintRulers); }
function paintRulers(){
  if (!VIEW.rulers) return;
  const H = $('#rulerH'), V = $('#rulerV'), dpr = window.devicePixelRatio || 1, T = 20;
  const vr = viewer.getBoundingClientRect();
  const w = vr.width, h = vr.height;
  [[H, w, T], [V, T, h]].forEach(([c, cw, ch]) => { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); c.style.width = cw + 'px'; c.style.height = ch + 'px'; });
  const i = rulerPage >= 0 && S.pos[rulerPage] ? rulerPage : S.current;
  const p = S.pos[i];
  const draw = (c, horiz) => {
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const len = horiz ? w : h;
    const cs = getComputedStyle(document.documentElement), cv = k => cs.getPropertyValue(k).trim();
    g.fillStyle = cv('--ruler-bg'); g.fillRect(0, 0, horiz ? w : T, horiz ? T : h);
    g.strokeStyle = cv('--line2'); g.beginPath();
    if (horiz) { g.moveTo(0, T - .5); g.lineTo(w, T - .5); } else { g.moveTo(T - .5, 0); g.lineTo(T - .5, h); } g.stroke();
    if (!p || !S.pages[i]) return;
    const pg = S.pages[i];
    const origin = horiz ? p.x - viewer.scrollLeft : p.y - viewer.scrollTop;   // px in ruler space
    const extent = (horiz ? pg.w : pg.h) * S.scale;
    // page extent band
    g.fillStyle = cv('--ruler-band'); if (horiz) g.fillRect(origin, 0, extent, T - 1); else g.fillRect(0, origin, T - 1, extent);
    const pxPerMm = MM * S.scale;
    const steps = [1, 2, 5, 10, 20, 50, 100, 200, 500];
    const major = steps.find(s => s * pxPerMm >= 50) || 1000;
    const minor = major / (major % 5 === 0 ? 5 : 2);
    const first = Math.floor(-origin / pxPerMm / minor) * minor, last = (len - origin) / pxPerMm;
    g.fillStyle = cv('--ruler-ink'); g.strokeStyle = cv('--ruler-tick'); g.font = '9px ' + FONT; g.textBaseline = 'top';
    g.beginPath();
    for (let mm = first; mm <= last; mm += minor) {
      const v = Math.round(origin + mm * pxPerMm) + .5;
      const isMajor = Math.abs(mm / major - Math.round(mm / major)) < 1e-6;
      const tl = isMajor ? 9 : 4;
      if (horiz) { g.moveTo(v, T - 1); g.lineTo(v, T - 1 - tl); } else { g.moveTo(T - 1, v); g.lineTo(T - 1 - tl, v); }
      if (isMajor) {
        const t = String(Math.round(mm));
        if (horiz) g.fillText(t, v + 2, 2);
        else { g.save(); g.translate(2, v + 2); g.rotate(Math.PI / 2); g.fillText(t, 0, -9); g.restore(); }
      }
    }
    g.stroke();
    // guides on the ruler
    if (VIEW.guides) {
      g.fillStyle = '#00a3ff';
      (horiz ? S.guides.v : S.guides.h).forEach(val => { const v = origin + val * S.scale; if (horiz) g.fillRect(v - 1, T - 6, 3, 6); else g.fillRect(T - 6, v - 1, 6, 3); });
    }
    // mouse position
    if (rulerPtr) {
      const v = horiz ? rulerPtr.x - vr.left : rulerPtr.y - vr.top;
      g.strokeStyle = '#c8371d'; g.beginPath();
      if (horiz) { g.moveTo(v + .5, 0); g.lineTo(v + .5, T); } else { g.moveTo(0, v + .5); g.lineTo(T, v + .5); } g.stroke();
    }
  };
  draw(H, true); draw(V, false);
}
viewer.addEventListener('scroll', drawRulers);
viewer.addEventListener('pointermove', e => {
  if (!VIEW.rulers) return;
  rulerPtr = {x:e.clientX, y:e.clientY};
  const pel = e.target.closest && e.target.closest('.page'); rulerPage = pel ? +pel.dataset.i : rulerPage;
  drawRulers();
});
viewer.addEventListener('pointerleave', () => { rulerPtr = null; drawRulers(); });
new ResizeObserver(drawRulers).observe(viewer);
['rulerH', 'rulerV'].forEach(id => $('#' + id).addEventListener('pointerdown', e => {

$('#rulerH').title = '從尺規往頁面拖曳，即可建立水平輔助線';
$('#rulerV').title = '從尺規往頁面拖曳，即可建立垂直輔助線';

/* snapping: page edges, grid, guides, plus extra candidates (e.g. detected image edges) */
let snapMarks = [];
function clearSnapMarks(){ snapMarks.forEach(n => n.remove()); snapMarks = []; }
function snapValue(v, cands){
  let best = null, d = 7 / S.scale;
  for (const c of cands) { const dd = Math.abs(c - v); if (dd < d) { d = dd; best = c; } }
  return best;
}
function snapCands(i, axis, extra = []){
  const pg = S.pages[i], out = [0, axis === 'x' ? pg.w : pg.h, ...extra];
  if (VIEW.guides) out.push(...(axis === 'x' ? S.guides.v : S.guides.h));
  return out;
}
function snapAxis(i, axis, v, extra){
  if (!VIEW.snap) return {v, hit:null};
  const cands = snapCands(i, axis, extra);
  if (VIEW.grid) { const g = gridPt(); cands.push(Math.round(v / g) * g); }
  const hit = snapValue(v, cands);
  return {v:hit ?? v, hit};
}
function markSnap(i, xs, ys){
  clearSnapMarks();
  const el = S.els[i], pg = S.pages[i]; if (!el) return;
  const gdl = el.querySelector('.gdl');
  xs.filter(v => v != null).forEach(x => { const d = document.createElement('div'); d.className = 'snapline v'; d.style.left = x / pg.w * 100 + '%'; gdl.appendChild(d); snapMarks.push(d); });
  ys.filter(v => v != null).forEach(y => { const d = document.createElement('div'); d.className = 'snapline h'; d.style.top = y / pg.h * 100 + '%'; gdl.appendChild(d); snapMarks.push(d); });
}
function imageEdges(i){
  const r = imgResolved.get(S.version + ':' + i) || [];
  return {x:r.flatMap(b => [b.x, b.x + b.w]), y:r.flatMap(b => [b.y, b.y + b.h])};
}
function snapPoint(i, p, {images = false, mark = true} = {}){
  const ex = images ? imageEdges(i) : {x:[], y:[]};
  const sx = snapAxis(i, 'x', p.x, ex.x), sy = snapAxis(i, 'y', p.y, ex.y);
  if (mark) markSnap(i, [sx.hit], [sy.hit]);
  return {x:sx.v, y:sy.v};
}

/* auto-scroll near the viewer edges and, after a short hold, a slow zoom-in around the pointer */
function dragAssist(getPtr, onFrame, {zoom = false, boxPx = null} = {}){
  let raf = 0, alive = true;
  const t0 = performance.now(), maxScale = Math.min(MAX_Z * PX, S.scale * 4);
  const tick = () => {
    if (!alive) return;
    const p = getPtr();
    if (p) {
      const r = viewer.getBoundingClientRect(), edge = 40;
      let dx = 0, dy = 0;
      if (p.x < r.left + edge) dx = p.x - (r.left + edge); else if (p.x > r.left + viewer.clientWidth - edge) dx = p.x - (r.left + viewer.clientWidth - edge);
      if (p.y < r.top + edge) dy = p.y - (r.top + edge); else if (p.y > r.top + viewer.clientHeight - edge) dy = p.y - (r.top + viewer.clientHeight - edge);
      if (dx || dy) { viewer.scrollLeft += clamp(dx * .45, -28, 28); viewer.scrollTop += clamp(dy * .45, -28, 28); onFrame(); }
      else if (zoom && performance.now() - t0 > 350 && S.scale < maxScale) {
        const b = boxPx && boxPx();
        if (!b || (b.w < viewer.clientWidth * .6 && b.h < viewer.clientHeight * .6)) { zoomTo(S.scale * 1.006, p.x, p.y); onFrame(); }
      }
    }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  return () => { alive = false; cancelAnimationFrame(raf); };
}

/* ---------------- image extraction: draw → adjust with handles → confirm ---------------- */
let XS = null;   // {i, box, meta:{view0, ppt, k}, el, bar}
const saveViewState = () => ({scale:S.scale, zoomMode:S.zoomMode, top:viewer.scrollTop, left:viewer.scrollLeft});
function restoreViewState(v){
  if (!v || Math.abs(S.scale - v.scale) < 1e-9) return;
  S.scale = v.scale; S.zoomMode = v.zoomMode; layout(); viewer.scrollTop = v.top; viewer.scrollLeft = v.left; updateZoomUI(); scheduleRender(60);
}
function cancelXSel(restore = true){
  if (!XS) return;
  const v = XS.meta.view0;
  XS.el.remove(); XS.bar.remove(); if (S.els[XS.i]) S.els[XS.i].style.zIndex = '';
  XS = null; clearSnapMarks();
  if (restore) restoreViewState(v);
}
function drawXSel(){
  if (!XS) return;
  const {i, box} = XS, pg = S.pages[i];
  Object.assign(XS.el.style, {left:box.x / pg.w * 100 + '%', top:box.y / pg.h * 100 + '%', width:box.w / pg.w * 100 + '%', height:box.h / pg.h * 100 + '%'});
  const ppt = XS.meta.ppt || nativeScale(box);
  XS.bar.querySelector('.dim').textContent = `${fmtMm(box.w)} × ${fmtMm(box.h)}　約 ${Math.round(box.w * ppt)} × ${Math.round(box.h * ppt)} px`;
  const below = (box.y + box.h) / pg.h < .9;
  XS.bar.style.left = box.x / pg.w * 100 + '%';
  XS.bar.style.top = (below ? (box.y + box.h) : box.y) / pg.h * 100 + '%';
  XS.bar.style.transform = below ? 'translateY(8px)' : 'translateY(calc(-100% - 8px))';
}
function showXSel(i, box, meta){
  cancelXSel(false);
  const ovl = S.els[i].querySelector('.ovl');
  const el = document.createElement('div'); el.className = 'xsel';
  el.innerHTML = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].map(d => `<div class="h" data-d="${d}"></div>`).join('');
  const bar = document.createElement('div'); bar.className = 'xbar';
  bar.innerHTML = `<span class="dim"></span><button data-x="ok">確定擷取 (Enter)</button><button data-x="cancel">取消</button>`;
  ovl.appendChild(el); ovl.appendChild(bar);
  S.els[i].style.zIndex = 4;
  XS = {i, box:{...box}, meta, el, bar};
  const hp = {nw:[0, 0], n:[50, 0], ne:[100, 0], e:[100, 50], se:[100, 100], s:[50, 100], sw:[0, 100], w:[0, 50]};
  el.querySelectorAll('.h').forEach(h => { const [x, y] = hp[h.dataset.d]; h.style.left = x + '%'; h.style.top = y + '%'; });
  el.addEventListener('pointerdown', e => { if (e.button !== 0 || S.spaceDown) return; e.preventDefault(); e.stopPropagation(); adjustXSel(e, e.target.dataset.d || 'move'); });
  bar.addEventListener('pointerdown', e => e.stopPropagation());
  bar.addEventListener('click', e => { const x = e.target.dataset.x; if (x === 'ok') confirmXSel(); if (x === 'cancel') cancelXSel(); });
  drawXSel();
}
function adjustXSel(e, d){
  const {i} = XS, pg = S.pages[i], s0 = {...XS.box}, MIN = 4;
  let ptr = {x:e.clientX, y:e.clientY};
  const p0 = pagePointXY(i, ptr.x, ptr.y);
  const upd = () => {
    if (!XS) return;
    const p = pagePointXY(i, ptr.x, ptr.y), b = {...s0}, ex = imageEdges(i);
    let hx = null, hy = null;
    if (d === 'move') {
      let nx = clamp(s0.x + p.x - p0.x, 0, pg.w - s0.w), ny = clamp(s0.y + p.y - p0.y, 0, pg.h - s0.h);
      // snap whichever edge is closer to a target
      const L = snapAxis(i, 'x', nx, ex.x), R = snapAxis(i, 'x', nx + s0.w, ex.x);
      if (L.hit != null) { nx = L.v; hx = L.hit; } else if (R.hit != null) { nx = R.v - s0.w; hx = R.hit; }
      const T = snapAxis(i, 'y', ny, ex.y), B = snapAxis(i, 'y', ny + s0.h, ex.y);
      if (T.hit != null) { ny = T.v; hy = T.hit; } else if (B.hit != null) { ny = B.v - s0.h; hy = B.hit; }
      b.x = clamp(nx, 0, pg.w - s0.w); b.y = clamp(ny, 0, pg.h - s0.h);
    } else {
      const sx = snapAxis(i, 'x', p.x, ex.x), sy = snapAxis(i, 'y', p.y, ex.y);
      if (d.includes('w')) { const x = Math.min(sx.v, s0.x + s0.w - MIN); b.x = x; b.w = s0.x + s0.w - x; hx = sx.hit; }
      if (d.includes('e')) { b.w = Math.max(MIN, sx.v - s0.x); hx = sx.hit; }
      if (d.includes('n')) { const y = Math.min(sy.v, s0.y + s0.h - MIN); b.y = y; b.h = s0.y + s0.h - y; hy = sy.hit; }
      if (d.includes('s')) { b.h = Math.max(MIN, sy.v - s0.y); hy = sy.hit; }
    }
    XS.box = b; markSnap(i, [hx], [hy]); drawXSel();
  };
  const stop = dragAssist(() => ptr, upd, {zoom:true, boxPx:() => XS && {w:XS.box.w * S.scale, h:XS.box.h * S.scale}});
  const move = ev => { ptr = {x:ev.clientX, y:ev.clientY}; upd(); };
  const up = () => { stop(); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); clearSnapMarks(); };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
}
function confirmXSel(){
  if (!XS) return;
  const {i, box, meta} = XS, b = {...box};
  if (meta.ppt) { b.nw = Math.round(meta.ppt * b.w); b.nh = Math.round(meta.ppt * b.h); }   // keep the image's native resolution
  cancelXSel(true);
  openCrop(i, b, meta.k ?? -1);
}
function startExtractDraw(i, e){
  const view0 = XS ? XS.meta.view0 : saveViewState();
  const hitImg = e.target.closest && e.target.closest('.imgbox');
  cancelXSel(false);
  const pg = S.pages[i];
  let ptr = {x:e.clientX, y:e.clientY};
  const p0 = snapPoint(i, pagePointXY(i, ptr.x, ptr.y), {images:true});
  const d = document.createElement('div'); d.className = 'draft'; S.els[i].querySelector('.ovl').appendChild(d);
  let box = {x:p0.x, y:p0.y, w:0, h:0};
  const upd = () => {
    const ex = imageEdges(i), q = pagePointXY(i, ptr.x, ptr.y);
    const sx = snapAxis(i, 'x', q.x, ex.x), sy = snapAxis(i, 'y', q.y, ex.y);
    box = {x:Math.min(p0.x, sx.v), y:Math.min(p0.y, sy.v), w:Math.abs(sx.v - p0.x), h:Math.abs(sy.v - p0.y)};
    markSnap(i, [sx.hit], [sy.hit]);
    Object.assign(d.style, {left:box.x / pg.w * 100 + '%', top:box.y / pg.h * 100 + '%', width:box.w / pg.w * 100 + '%', height:box.h / pg.h * 100 + '%'});
  };
  const stop = dragAssist(() => ptr, upd, {zoom:true, boxPx:() => ({w:box.w * S.scale, h:box.h * S.scale})});
  const move = ev => { ptr = {x:ev.clientX, y:ev.clientY}; upd(); };
  const up = () => {
    stop(); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
    d.remove(); clearSnapMarks();
    if (box.w < 5 || box.h < 5) {
      if (hitImg) {   // a click on a detected image: select it, keeping its native resolution
        const k = +hitImg.dataset.k, b = (imgResolved.get(S.version + ':' + i) || [])[k];
        if (b) { showXSel(i, {x:b.x, y:b.y, w:b.w, h:b.h}, {view0, ppt:nativeScale(b), k}); return; }
      }
      restoreViewState(view0); return;
    }
    showXSel(i, box, {view0, ppt:null, k:-1});
  };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
}

pagesEl.addEventListener('contextmenu', e => {

  e.preventDefault(); const i = +pel.dataset.i;

});
pagesEl.addEventListener('pointermove', e => textboxHover(e));
pagesEl.addEventListener('pointerleave', () => { if (S.tool === 'textbox') clearTextMarks(); });

  if (NP) await closeNote(true);
  if (S.signed && !(await confirmDlg('此文件已數位簽署', '繼續修改會使現有的數位簽章失效。確定要繼續？', '繼續修改'))) return false;

    const res = await fn(doc);
    if (res === false) return false;
    const out = await doc.save();

    if (label) toast(label);

  } catch (e) { console.error(e); toast('操作失敗：' + (e.message || e), 'err'); return false; }
  finally { busy(false); }
}

  function composeTpl(){

  const ctx = (i, k) => ({page:i + 1, seq:st.seqStart + k - 1, total:n, pad:padLen(), seqPad:seqPadLen(), dateFmt:st.dateFmt});

  $b('#exNames').addEventListener('focusout', () => setTimeout(() => refresh(), 0));

    } else $b('#exPx').textContent = '';
    if (DESK) {

    policy:st.policy, useSub:st.useSub, subTpl:st.subTpl, lastDir:st.dir, keepDir:!!st.dirPicked || !!pr.keepDir});
  await runImageExport({...st, sub:DESK && st.useSub ? subName() : ''}, res.ps, res.names);

async function runImageExport(st, ps, names){
  const f = IMG_FORMATS[st.fmt], alpha = f.alpha && st.transparent;
  let plan = null;
  if (DESK) {
    try { plan = await DESK.exportImages.plan(st.dir, st.sub, names, st.policy); }
    catch (e) { toast('無法寫入輸出資料夾：' + (e.message || e), 'err'); return; }
  }
  let cancel = false, done = 0, skipped = 0, failed = 0;
  const zip = [], written = [];
  S.exporting = true;
  openModal({title:'轉存圖片中', width:440,
    body:`<div id="xpTxt">準備中…</div><div class="updbar show" style="background:transparent;padding:10px 0 0"><span class="bar" style="background:#e6e2d9;width:100%;height:8px"><i id="xpBar" style="background:var(--seal)"></i></span></div>`,
    buttons:[{label:'取消', handler:() => { cancel = true; $('#xpTxt').textContent = '正在取消…'; }}]});
  const t0 = performance.now();
  for (let k = 0; k < ps.length && !cancel; k++) {
    const i = ps[k], target = plan ? plan.files[k] : {name:names[k]};
    $('#xpTxt').innerHTML = `正在轉存第 <b>${i + 1}</b> 頁（${k + 1} / ${ps.length}）<br><span style="color:var(--ink3);font-size:12px">${esc(target.name)}</span>`;
    $('#xpBar').style.width = (k / ps.length * 100) + '%';
    if (target.skip) { skipped++; continue; }
    let c = null;
    try {
      c = await renderForExport(i, st.dpi, {transparent:alpha, annots:st.annots});
      const bytes = await encodePage(c, st.fmt, {dpi:st.dpi, quality:st.quality, alpha});
      if (DESK) written.push(await DESK.exportImages.write(st.dir, st.sub, target.name, bytes));
      else zip.push({name:target.name, data:bytes});
      done++;
    } catch (e) { console.error(e); failed++; toast(`第 ${i + 1} 頁轉存失敗：${e.message || e}`, 'err'); }
    finally { if (c) { c.width = c.height = 0; } }
    await new Promise(r => setTimeout(r, 0));
  }
  $('#xpBar').style.width = '100%';
  S.exporting = false;
  closeModal(undefined);
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  if (!DESK) {
    if (zip.length === 1) await saveFile(zip[0].name, new Blob([zip[0].data]));
    else if (zip.length) await saveFile(S.name.replace(/\.pdf$/i, '') + '_圖片.zip', new Blob([makeZip(zip)], {type:'application/zip'}));
    return;
  }
  const parts = [`已轉存 <b>${done}</b> 張 ${f.label}`];
  if (skipped) parts.push(`略過 ${skipped} 張（同名檔案已存在）`);
  if (failed) parts.push(`<span style="color:var(--seal)">${failed} 張失敗</span>`);
  if (cancel) parts.push('（已取消）');
  const r = await openModal({title:cancel ? '轉存已取消' : '轉存完成', width:480,
    body:`<div>${parts.join('，')}，耗時 ${secs} 秒。</div><div class="note" style="margin-top:10px;word-break:break-all">輸出位置：${esc(plan.dir)}</div>`,
    buttons:[{label:'完成', value:false}, {label:'開啟資料夾', primary:true, value:true}]});
  if (r) DESK.exportImages.openFolder(plan.dir);
}

const PAPER = {a4:[595.28, 841.89], a3:[841.89, 1190.55], a5:[419.53, 595.28], letter:[612, 792], legal:[612, 1008]};

async function openAddPage(presetAt){

          <option value="start">文件最前面</option>

        </select></div>
      <div class="field" id="apAtF" style="display:none"><label>在第幾頁之後（0 = 最前面）</label><input type="number" id="apAt" min="0" max="${n}" style="width:90px"></div>
    </div>
    <div class="flab" style="margin-bottom:6px">🖱 用滑鼠<b>拖曳紅色虛線的「新頁」</b>到想放的位置，或<b>點一下某一頁</b>插在它後面</div>
    <div class="ap-strip" id="apStrip"><div class="ap-mark" id="apMark"></div></div>
    <div class="ap-sum" id="apSum"></div>`;
  const $b = q => body.querySelector(q);
  const strip = $b('#apStrip'), mark = $b('#apMark'), H = 120;
  const newSize = () => {
    if (st.size === 'same') return {w:cp.w, h:cp.h};
    let [w, h] = PAPER[st.size]; if (st.ori === 'l') [w, h] = [h, w]; return {w, h};
  };
  // existing pages: built once, thumbnails load lazily
  const cards = S.pages.map((pg, i) => {
    const d = document.createElement('div'); d.className = 'ap-pg'; d.dataset.i = i;

  });
  const obs = new IntersectionObserver(ents => ents.forEach(en => {
    if (!en.isIntersecting) return; obs.unobserve(en.target);
    pageThumb(+en.target.dataset.i, H).then(u => { if (u) { const im = new Image(); im.src = u; en.target.querySelector('.b').appendChild(im); } });
  }), {root:strip, rootMargin:'0px 400px'});

// 排列頁面: all pages in a grid; drag them into a new order, then apply it in one step (undo puts it back)
async function openArrange(){
  if (!S.pdf || S.pages.length < 2) return;

  }), {root:grid, rootMargin:'300px 0px'});

  const update = () => {

      const c = cards[i]; grid.appendChild(c);

    const r = before ? next : rectAt(gap - 1), x = before ? r.left - 7 : r.right + 7;

  });
  grid.addEventListener('pointermove', e => {
    if (!drag) return;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.on) {
      if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 5) return;
      drag.on = true; drag.card.classList.add('dragging');
      const b = drag.card.querySelector('.b'); drag.ghost = b.cloneNode(true); drag.ghost.className = 'ar-ghost';
      drag.ghost.style.width = b.style.width; drag.ghost.style.height = b.style.height; document.body.appendChild(drag.ghost);
      const tick = () => {   // scroll near the top and bottom edges
        if (!drag) return;
        const r = grid.getBoundingClientRect();
        if (drag.y < r.top + 50) grid.scrollTop -= 14; else if (drag.y > r.bottom - 50) grid.scrollTop += 14;
        drag.at = gapAt(drag.x, drag.y); showMark(drag.at);
        drag.raf = requestAnimationFrame(tick);
      };
      drag.raf = requestAnimationFrame(tick);
    }
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
    drag.at = gapAt(e.clientX, e.clientY); showMark(drag.at);
  });
  const endDrag = () => {
    if (!drag) return;
    const d = drag; drag = null;
    cancelAnimationFrame(d.raf); d.ghost && d.ghost.remove(); d.card.classList.remove('dragging'); mark.style.display = 'none';
    if (!d.on || !d.at) return;

    {label:'取消', value:null},
    {label:'套用新順序', primary:true, id:'arOk', handler:() => [...ord]}],
    onOpen:(mb, mf) => { okBtn = mf.querySelector('#arOk'); update(); }});

    const pages = doc.getPages();

    res.forEach(i => doc.addPage(pages[i]));

  }, {scrollToCurrent:true});
}

function visToPdf(i, b){
  const pg = S.pages[i], vp = pg.vp1;
  const pts = [[b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.h], [b.x + b.w, b.y + b.h]].map(p => vp.convertToPdfPoint(p[0], p[1]));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  return {rect:[Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)], origin:pts[2], rot:pg.rot};
}

/* ---------------- writing back to the opened file ----------------
   When the browser supports the File System Access API, a PDF opened through the
   picker (or dragged in) keeps a handle, and every edit is written straight back
   into that same file. Otherwise saving downloads a file with the original name. */
const canPick = () => !!DESK || typeof window.showOpenFilePicker === 'function';
function desktopHandle(p, name){
  return {kind:'file', name, path:p,
    queryPermission: async () => 'granted', requestPermission: async () => 'granted',
    getFile: async () => { const r = await DESK.readFile(p); return new File([r.data], r.name, {type:'application/pdf'}); },
    createWritable: async () => { const parts = []; return {
      write: async b => { parts.push(b); },
      close: async () => { await DESK.writeFile(p, new Uint8Array(await new Blob(parts).arrayBuffer())); },
    }; },
  };
}
async function openPath(p){
  try {
    const r = await DESK.readFile(p);
    await openFile(new File([r.data], r.name, {type:'application/pdf'}), desktopHandle(p, r.name));
  } catch (e) { toast('無法開啟檔案：' + (e.message || e), 'err'); }
}
let permAsk = null;
function primeWrite(){
  // must run synchronously inside the click so the permission prompt is allowed
  if (!S.handle || !S.autoWrite || !S.handle.requestPermission) return null;
  permAsk = S.handle.queryPermission({mode:'readwrite'})
    .then(st => st === 'granted' ? st : S.handle.requestPermission({mode:'readwrite'}))
    .catch(() => 'denied');
  return permAsk;
}
async function writeBack(bytes, {quiet = false} = {}){
  if (!S.handle) return false;
  const h = S.handle, doc = activeDoc();
  const run = async () => {
    let st = permAsk ? await permAsk : await h.queryPermission({mode:'readwrite'}).catch(() => 'denied');
    permAsk = null;
    if (st !== 'granted') st = await h.requestPermission({mode:'readwrite'}).catch(() => 'denied');
    if (st !== 'granted') throw new Error('沒有寫入原檔的權限');
    const w = await h.createWritable();
    await w.write(new Blob([bytes], {type:'application/pdf'}));
    await w.close();
  };
  // serialize writes so a fast series of edits never interleaves
  const prev = S.writing || Promise.resolve();
  const job = prev.catch(() => {}).then(run);
  S.writing = job;
  try {
    await job;
    if (doc === activeDoc()) { if (S.bytes === bytes) S.dirty = false; }
    else if (doc && doc.bytes === bytes) doc.dirty = false;
    updateUI();
    if (!quiet) toast('已存回原檔 ' + S.name);
    return true;
  } catch (e) {
    console.error(e);
    toast('無法寫回原檔：' + (e.message || e) + '，可按「儲存」另存', 'err');
    return false;
  }
}

/* ---------------- page picker (shared by 減頁 and 插入PDF) ---------------- */
function parseRange(txt, n){
  const out = new Set();
  for (const part of String(txt).replace(/[，、；;\s]+/g, ',').split(',')) {
    if (!part) continue;
    const m = /^(\d*)\s*[-~－–]\s*(\d*)$/.exec(part);
    if (m) {
      const a = m[1] ? +m[1] : 1, b = m[2] ? +m[2] : n;
      for (let k = Math.min(a, b); k <= Math.max(a, b); k++) if (k >= 1 && k <= n) out.add(k - 1);
    } else if (/^\d+$/.test(part)) { const k = +part; if (k >= 1 && k <= n) out.add(k - 1); }
    else return null;
  }
  return out;
}
function rangeText(sel){
  const a = [...sel].sort((x, y) => x - y), out = [];
  for (let k = 0; k < a.length; k++) {
    let j = k; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++;
    out.push(j > k ? `${a[k] + 1}-${a[j] + 1}` : `${a[k] + 1}`); k = j;
  }
  return out.join(', ');
}

async function insertFromPdf(file){
  if (!S.pdf) return;
  busy(true, '讀取 PDF…');
  let bytes, src, sizes = [];
  try {
    bytes = new Uint8Array(await file.arrayBuffer());
    src = await pdfjsLib.getDocument({...PDF_OPTS, data:bytes.slice()}).promise;
    for (let i = 1; i <= Math.min(src.numPages, 400); i++) { const pg = await src.getPage(i), v = pg.getViewport({scale:1}); sizes.push({w:v.width, h:v.height}); }
  } catch (e) {
    busy(false);

  }
  busy(false);
  const n = src.numPages, cur = S.current + 1, tot = S.pages.length;

    <select data-x="pos">

    <span id="atWrap" style="display:none">第 <input type="text" data-x="at" value="${cur}" style="width:56px;font:inherit;border:1px solid var(--line2);border-radius:7px;padding:5px 8px;text-align:center"> 頁之後（0 = 最前面）</span>
    <span class="flab" style="margin-left:auto">來源：${esc(file.name)} · 共 ${n} 頁</span>`;
  const picker = pagePicker({
    title:'從其他 PDF 插入頁面', mode:'insert', count:n, initial:[...Array(n).keys()],
    getPage:i => src.getPage(i + 1), sizes,
    okLabel:k => k ? `插入 ${k} 頁` : '插入',
    note:'勾選要匯入的頁面（預設全選，可按住 Shift 連續選取），並選擇要插入的位置。',
    validate:sel => sel.length ? '' : '請至少勾選一頁', footer,
  });

  }, 0);

  await mutate(`已從「${file.name}」插入 ${res.sel.length} 頁`, async doc => {
    const srcDoc = await PDFDocument.load(bytes, {ignoreEncryption:true, updateMetadata:false});
    const copied = await doc.copyPages(srcDoc, res.sel);

function wrapText(ctx, text, maxW){
  const lines = [];
  text.split('\n').forEach(par => {
    const toks = par.match(/[A-Za-z0-9_\-.,:;'"!?()@#%&*+=/\\]+|\s+|./gu) || [''];
    let line = '';
    for (const t of toks) {
      const test = line + t;
      if (ctx.measureText(test).width <= maxW || !line) {
        if (ctx.measureText(test).width > maxW && !line) {
          // a single long token: hard-break it
          let part = '';
          for (const ch of t) { if (ctx.measureText(part + ch).width > maxW && part) { lines.push(part); part = ch; } else part += ch; }
          line = part;
        } else line = test;
      } else { lines.push(line.replace(/\s+$/, '')); line = t.trimStart(); }
    }
    lines.push(line);
  });
  return lines;
}

/* ====================================================================
   System fonts (字型清單): every font family installed on this computer (queryLocalFonts), with the name a
   Taiwanese user knows it by (read from the font file: 微軟正黑體, not Microsoft JhengHei) and whether it is a
   Chinese font. Reading a font file can take a while (Chinese fonts are 10–30 MB), so it happens in the
   background, one file at a time, and the result is cached in localStorage.
   ==================================================================== */
const FONTCAT = {ok:null, fams:[], busy:false, subs:new Set()};
const FONTCAT_KEY = 'pdfeditor.fontcat.v1';
const FONT_LANGS = ['zh-TW', 'zh-HK', 'zh-MO', 'zh', 'zh-SG', 'en'];
let fontListing = null, fontAnalysing = Promise.resolve(), fontNotify = 0;
const fontCache = () => { try { return JSON.parse(localStorage.getItem(FONTCAT_KEY)) || {}; } catch (_) { return {}; } };
function fontChanged(){
  if (fontNotify) return;
  fontNotify = requestAnimationFrame(() => { fontNotify = 0; FONTCAT.subs.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); });
}
// the family name in the preferred language: typographic family (name ID 16) first, then the family (name ID 1)
function fontFileName(font, fallback){
  const rec = font.name && font.name.records || {};
  for (const ids of [rec.preferredFamily, rec.fontFamily]) {
    if (!ids) continue;
    for (const l of FONT_LANGS) if (ids[l] && String(ids[l]).trim()) return String(ids[l]).trim();
  }
  return fallback;
}
async function analyseFont(fam, face){
  try {
    const bytes = new Uint8Array(await (await face.blob()).arrayBuffer());
    const font = fontkit.create(bytes, fam.ps || undefined);
    if (!font || !font.name) throw new Error('not a single font');
    return {name:fontFileName(font, fam.family), cjk:[...'中文字體'].every(ch => font.hasGlyphForCodePoint(ch.codePointAt(0)))};
  } catch (_) { return {name:fam.family, cjk:false}; }
}
// list the fonts (resolves as soon as the list is known; the files are read afterwards)
function loadFontCatalog(){
  if (fontListing) return fontListing;
  fontListing = (async () => {
    let faces = [];
    try {
      if (typeof window.queryLocalFonts !== 'function') throw new Error('no queryLocalFonts');
      faces = await window.queryLocalFonts();
    } catch (e) { FONTCAT.ok = false; FONTCAT.fams = []; fontChanged(); return; }
    const byFam = new Map();
    for (const f of faces) {
      if (!f.family) continue;
      const cur = byFam.get(f.family), regular = /^(regular|normal|book|roman)$/i.test(f.style || '');
      if (!cur || (regular && !cur.regular)) byFam.set(f.family, {face:f, regular});
    }
    const cache = fontCache(), todo = [];
    FONTCAT.fams = [...byFam.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([family, {face}]) => {
      const fam = {family, ps:face.postscriptName || '', name:family, cjk:null}, c = cache[family + '|' + fam.ps];
      if (c) { fam.name = c.name || family; fam.cjk = !!c.cjk; } else todo.push([fam, face]);
      return fam;
    });
    FONTCAT.ok = true; fontChanged();
    if (todo.length) {
      FONTCAT.busy = true;
      fontAnalysing = (async () => {
        for (const [fam, face] of todo) {
          Object.assign(fam, await analyseFont(fam, face));
          const c = fontCache(); c[fam.family + '|' + fam.ps] = {name:fam.name, cjk:fam.cjk};
          try { localStorage.setItem(FONTCAT_KEY, JSON.stringify(c)); } catch (_) {}
          fontChanged();
        }
        FONTCAT.busy = false; fontChanged();
      })();
    }
  })();
  return fontListing;
}
const fontAnalysisDone = () => (fontListing || Promise.resolve()).then(() => fontAnalysing);
const fontLabel = family => { const f = family && FONTCAT.fams.find(x => x.family === family); return f ? f.name : family || ''; };
const fontInstalled = family => !!family && FONTCAT.fams.some(x => x.family === family);

   ==================================================================== */
const TB_DEF = {size:14, color:'#1f2328', bg:'', bold:false, italic:false, underline:false, boxBg:'', border:false, font:''};
// text boxes use the bundled Noto Sans TC (思源黑體) unless a run names another font (run.font: a system font family)
const TB_FONT = '"PDFE Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';

const fontStack = f => f ? cssFamily(f) + ',' + TB_FONT : TB_FONT;
// the first family of a CSS font-family list ("PDFE Sans", i.e. the default, gives '')
function firstFamily(list){
  const s = String(list || '').trim(); let out = '';
  if (s[0] === '"' || s[0] === "'") { for (let k = 1; k < s.length; k++) { const c = s[k]; if (c === '\\') { out += s[++k] || ''; continue; } if (c === s[0]) break; out += c; } }
  else out = s.split(',')[0].trim().replace(/\s+/g, ' ');
  return out === 'PDFE Sans' ? '' : out;
}

const saveTB = () => { try { localStorage.setItem('pdfeditor.textbox.v1', JSON.stringify(TB_STYLE)); } catch (_) {} };

function placeTBE(){

  TBE.el.style.transform = `scale(${S.scale})${TBE.rot ? ` rotate(${TBE.rot}deg)` : ''}${TBE.vert ? ' translateX(-100%)' : ''}`;
  TBE.el.style.maxWidth = TBE.rot || TBE.vert ? 'none' : Math.max(60, pg.w - TBE.x - 4) + 'px';

let PENDING_IMG = null;   // {png|jpg bytes, kind, w, h, name, url}
async function loadImageFile(file){
  const url = URL.createObjectURL(file);
  const img = new Image(); img.src = url;
  try { await img.decode(); } catch (_) { URL.revokeObjectURL(url); throw new Error('無法讀取這張圖片'); }
  let w = img.naturalWidth || 300, h = img.naturalHeight || 200;
  const isJpg = /jpe?g$/i.test(file.type) || /\.jpe?g$/i.test(file.name);
  let bytes, kind;
  if (isJpg && Math.max(w, h) <= 6000) { bytes = new Uint8Array(await file.arrayBuffer()); kind = 'jpg'; }   // keep the original JPEG data
  else {
    const k = Math.min(1, 4000 / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    bytes = new Uint8Array(await (await blobOf(c, 'image/png')).arrayBuffer()); kind = 'png';
  }
  return {bytes, kind, w, h, name:file.name, url};
}
async function chooseImage(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml,.png,.jpg,.jpeg,.webp,.gif,.bmp,.svg';

    const f = inp.files[0]; if (!f) return;
    try { PENDING_IMG = await loadImageFile(f); setTool('image'); toast('在頁面上點一下放置圖片，或拖曳決定大小'); }
    catch (e) { toast(e.message || '無法讀取圖片', 'err'); }
  };
  inp.click();
}
function defaultImgSize(pg, img){
  let w = img.w * .75, h = img.h * .75;   // 96 dpi pixels → points

  '#1c64d9', '#74c0fc', '#7048e8', '#ae3ec9', '#d6336c', '#fcc2d7', '#fff3bf', '#d3f9d8', '#d0ebff', '#862e9c', '#c92a2a', '#5c940d'];
let CPK = null;   // open picker: {opts, h, s, v}
const WHEEL = 168;
function openColorPicker(opts){
  const m = $('#cpMenu');
  const start = normHex(opts.value) || '#e03131';
  CPK = {opts, ...hex2hsv(start), start};
  const chip = (c, cls = '') => `<button class="cp-sw${cls}${normHex(opts.value) === c ? ' on' : ''}" data-v="${c}" style="background:${c}" title="${c}"></button>`;
  m.innerHTML = `<div class="cp-head"><b>${esc(opts.title || '選擇顏色')}</b>${opts.none ? `<button class="cp-nonebtn" data-v="" title="不使用顏色">∅ 無</button>` : ''}</div>
    <div class="cp-grid">${CP_BASE.map(c => chip(c)).join('')}</div>
    <div class="cp-wheelrow"><div class="cp-wheelbox"><canvas class="cp-wheel"></canvas><i class="cp-mark"></i></div>
      <div class="cp-side"><div class="cp-prev" title="上：原本的顏色／下：新的顏色"><i class="old" style="background:${start}"></i><i class="new"></i></div>
        <input class="cp-hex" maxlength="7" spellcheck="false" title="輸入色碼，例如 #1c64d9">
        <span class="cp-rgb"></span>
        <button class="cp-eye" title="滴管：點畫面上任何地方吸取顏色">${icon('dropper')}滴管</button></div></div>
    <label class="cp-vrow" title="亮度"><span>亮度</span><input type="range" class="cp-val" min="0" max="100"></label>
    <div class="cp-sec"><span>★ 我的最愛</span><button class="cp-addfav" title="把目前的顏色加入我的最愛">＋ 加入目前顏色</button></div>
    <div class="cp-grid cp-fav"></div>
    <div class="cp-sec"><span>常用顏色</span><button class="cp-clrfreq" title="清除常用顏色紀錄">清除</button></div>
    <div class="cp-grid cp-freq"></div>
    <div class="cp-foot"><button data-cpx="cancel">取消</button><button class="pri" data-cpx="ok">套用</button></div>`;
  const wc = m.querySelector('.cp-wheel'), dpr = window.devicePixelRatio || 1;
  wc.width = wc.height = Math.round(WHEEL * dpr);
  const lists = () => {
    m.querySelector('.cp-fav').innerHTML = CPS.fav.length ? CPS.fav.map(c => chip(c, ' fav')).join('') : '<span class="cp-empty">按「＋ 加入目前顏色」收藏喜歡的顏色（右鍵可移除）</span>';
    const fr = frequentColors();
    m.querySelector('.cp-freq').innerHTML = fr.length ? fr.map(c => chip(c)).join('') : '<span class="cp-empty">使用過的顏色會自動出現在這裡</span>';
  };
  lists(); paintWheel(); syncPicker();
  // position next to the anchor, kept inside the window
  m.style.display = 'block';
  const r = opts.at || (opts.anchor ? opts.anchor.getBoundingClientRect() : {left:innerWidth / 2 - 130, bottom:120, top:120});
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + 'px';
  let top = (r.bottom ?? r.top) + 4;
  if (top + m.offsetHeight > innerHeight - 8) top = Math.max(8, (r.top ?? top) - m.offsetHeight - 4);
  m.style.top = Math.max(8, Math.min(top, innerHeight - m.offsetHeight - 8)) + 'px';
  // keep the focus (and any text selection) where it was while clicking buttons and the wheel
  m.onpointerdown = e => { if (e.target.closest('button,canvas')) e.preventDefault(); };
  m.oncontextmenu = e => {
    e.preventDefault();
    const b = e.target.closest('.cp-sw.fav'); if (!b) return;
    CPS.fav = CPS.fav.filter(c => c !== b.dataset.v); saveCPS(); lists(); toast('已從我的最愛移除');
  };
  m.onclick = async e => {
    const x = e.target.closest('[data-cpx]');
    if (x) { if (x.dataset.cpx === 'ok') pickColor(hsv2hex(CPK.h, CPK.s, CPK.v)); else closeColorPicker(); return; }
    if (e.target.closest('.cp-eye')) { const o = CPK.opts; const c = await eyedropper(); if (c) { CPK = {opts:o}; pickColor(c); } else openColorPicker(o); return; }
    if (e.target.closest('.cp-addfav')) {
      const c = hsv2hex(CPK.h, CPK.s, CPK.v);
      if (!CPS.fav.includes(c)) { CPS.fav.push(c); if (CPS.fav.length > 32) CPS.fav.shift(); saveCPS(); lists(); toast('已加入我的最愛'); } else toast('這個顏色已經在我的最愛裡');
      return;
    }
    if (e.target.closest('.cp-clrfreq')) { CPS.use = {}; saveCPS(); lists(); return; }
    const b = e.target.closest('[data-v]'); if (b) pickColor(b.dataset.v);
  };
  m.ondblclick = null;
  const hex = m.querySelector('.cp-hex');
  hex.oninput = () => { const c = normHex(hex.value); if (c) { Object.assign(CPK, hex2hsv(c)); paintWheel(); syncPicker(true); } };
  hex.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter' || e.key === 'Escape') e.preventDefault(); if (e.key === 'Enter') { const c = normHex(hex.value); if (c) pickColor(c); } if (e.key === 'Escape') closeColorPicker(); };
  m.querySelector('.cp-val').oninput = e => { CPK.v = +e.target.value / 100; paintWheel(); syncPicker(); };
  const fromWheel = ev => {
    const b = wc.getBoundingClientRect(), R = b.width / 2, dx = ev.clientX - b.left - R, dy = ev.clientY - b.top - R;
    CPK.h = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360; CPK.s = Math.min(1, Math.hypot(dx, dy) / R);
    if (CPK.v < .05) CPK.v = 1;   // picking a hue on a black wheel would show nothing
    syncPicker();
  };
  wc.onpointerdown = ev => { ev.preventDefault(); wc.setPointerCapture(ev.pointerId); fromWheel(ev); wc.onpointermove = fromWheel; };
  wc.onpointerup = () => { wc.onpointermove = null; paintWheel(); };
  wc.ondblclick = () => pickColor(hsv2hex(CPK.h, CPK.s, CPK.v));
}
function paintWheel(){
  const wc = $('#cpMenu .cp-wheel'); if (!wc || !CPK) return;
  const n = wc.width, g = wc.getContext('2d'), img = g.createImageData(n, n), R = n / 2, d = img.data;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const dx = x - R + .5, dy = y - R + .5, r = Math.hypot(dx, dy), o = (y * n + x) * 4;
    if (r > R) continue;
    const [cr, cg, cb] = hsv2rgb((Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360, Math.min(1, r / R), CPK.v);
    d[o] = cr; d[o + 1] = cg; d[o + 2] = cb; d[o + 3] = r > R - 1 ? Math.round((R - r) * 255) : 255;
  }
  g.putImageData(img, 0, 0);
}
function syncPicker(fromHex){
  const m = $('#cpMenu'); if (!CPK || !m.querySelector('.cp-wheel')) return;
  const c = hsv2hex(CPK.h, CPK.s, CPK.v), [r, g, b] = hsv2rgb(CPK.h, CPK.s, CPK.v);
  const mk = m.querySelector('.cp-mark'), a = CPK.h * Math.PI / 180, R = WHEEL / 2;
  mk.style.left = R + Math.cos(a) * CPK.s * R + 'px'; mk.style.top = R + Math.sin(a) * CPK.s * R + 'px'; mk.style.background = c;
  m.querySelector('.cp-prev .new').style.background = c;
  if (!fromHex) m.querySelector('.cp-hex').value = c;
  m.querySelector('.cp-rgb').textContent = `R ${r}　G ${g}　B ${b}`;
  const val = m.querySelector('.cp-val'); val.value = Math.round(CPK.v * 100);
  val.style.background = `linear-gradient(90deg,#000,${hsv2hex(CPK.h, CPK.s, 1)})`;
}
function closeColorPicker(){ const m = $('#cpMenu'); m.style.display = 'none'; m.innerHTML = ''; CPK = null; }
function pickColor(c){
  const o = CPK && CPK.opts; closeColorPicker();
  if (!o) return;
  if (c) { c = normHex(c) || c; noteColorUse(c); }
  o.onPick(c || '');
}

/* ---------------- 滴管：freeze the window, pick any pixel ---------------- */
let EYEDROP = false;
async function eyedropper(){
  if (EYEDROP) return null;
  EYEDROP = true;
  try {
    $('#cpMenu').style.display = 'none';
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    let url = null;
    try { url = DESK && DESK.capture ? await DESK.capture() : null; } catch (_) {}
    if (!url) {
      if (window.EyeDropper) { try { return normHex((await new window.EyeDropper().open()).sRGBHex); } catch (_) { return null; } }
      toast('這個環境無法使用滴管', 'err'); return null;
    }
    const img = new Image(); img.src = url; await img.decode();
    const src = document.createElement('canvas'); src.width = img.naturalWidth; src.height = img.naturalHeight;
    const sg = src.getContext('2d', {willReadFrequently:true}); sg.drawImage(img, 0, 0);
    const kx = src.width / innerWidth, ky = src.height / innerHeight;
    return await new Promise(res => {
      const ov = document.createElement('div'); ov.id = 'eyedrop';
      ov.style.backgroundImage = `url(${url})`;
      ov.innerHTML = `<canvas class="ed-loupe" width="154" height="154"></canvas><div class="ed-lab"><i></i><span></span></div><div class="ed-tip">點一下吸取顏色・Esc 或右鍵取消</div>`;
      document.body.appendChild(ov);
      const lp = ov.querySelector('.ed-loupe'), lg = lp.getContext('2d'), lab = ov.querySelector('.ed-lab');
      lg.imageSmoothingEnabled = false;
      const at = e => { const x = clamp(Math.floor(e.clientX * kx), 0, src.width - 1), y = clamp(Math.floor(e.clientY * ky), 0, src.height - 1);
        const d = sg.getImageData(x, y, 1, 1).data; return {x, y, c:'#' + [d[0], d[1], d[2]].map(v => pad2(v.toString(16))).join('')}; };
      const move = e => {
        const p = at(e), N = 11, cell = lp.width / N;
        lg.fillStyle = '#fff'; lg.fillRect(0, 0, lp.width, lp.height);
        lg.drawImage(src, p.x - 5, p.y - 5, N, N, 0, 0, lp.width, lp.height);
        lg.strokeStyle = 'rgba(0,0,0,.12)'; lg.lineWidth = 1;
        for (let k = 1; k < N; k++) { lg.beginPath(); lg.moveTo(k * cell, 0); lg.lineTo(k * cell, lp.height); lg.moveTo(0, k * cell); lg.lineTo(lp.width, k * cell); lg.stroke(); }
        lg.strokeStyle = '#000'; lg.lineWidth = 2; lg.strokeRect(5 * cell, 5 * cell, cell, cell); lg.strokeStyle = '#fff'; lg.lineWidth = 1; lg.strokeRect(5 * cell - 2, 5 * cell - 2, cell + 4, cell + 4);
        const lx = e.clientX + 22 + 154 > innerWidth ? e.clientX - 22 - 154 : e.clientX + 22, ly = e.clientY + 22 + 190 > innerHeight ? e.clientY - 22 - 190 : e.clientY + 22;
        lp.style.left = lx + 'px'; lp.style.top = ly + 'px'; lab.style.left = lx + 'px'; lab.style.top = ly + 160 + 'px';
        lab.querySelector('i').style.background = p.c; lab.querySelector('span').textContent = p.c.toUpperCase();
      };
      const done = c => { ov.remove(); window.removeEventListener('keydown', key, true); res(c); };
      const key = e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(null); } };
      ov.addEventListener('pointermove', move);
      ov.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); done(e.button === 0 ? at(e).c : null); });
      ov.addEventListener('contextmenu', e => e.preventDefault());
      window.addEventListener('keydown', key, true);
    });
  } finally { EYEDROP = false; }
}
// a colour button usable inside dialogs: <button class="cpick" data-color="#hex">
function bindColorButton(btn, get, set, {none = false, title} = {}){
  const paint = () => { const v = get(); btn.style.setProperty('--c', v || 'transparent'); btn.classList.toggle('none', !v); };
  btn.addEventListener('click', e => { e.preventDefault(); openColorPicker({anchor:btn, value:get(), none, title, onPick:c => { set(c); paint(); }}); });
  paint();
}

/* ====================================================================
   填色 (fill): click a region to flood-fill it, or drag a rectangle / lasso
   ==================================================================== */
const fillCanvasCache = new Map();
function fillSource(i){
  const pg = S.pages[i], key = S.version + ':' + i;
  if (!fillCanvasCache.has(key)) {
    fillCanvasCache.clear();
    fillCanvasCache.set(key, (async () => {
      let k = 3; if (pg.w * pg.h * k * k > 12e6) k = Math.sqrt(12e6 / (pg.w * pg.h));
      const vp = pg.page.getViewport({scale:k});
      const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      const g = c.getContext('2d', {willReadFrequently:true}); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      await pg.page.render({canvasContext:g, viewport:vp, annotationMode:pdfjsLib.AnnotationMode.ENABLE}).promise;
      return {c, k:c.width / pg.w, data:g.getImageData(0, 0, c.width, c.height).data};
    })());
  }
  return fillCanvasCache.get(key);
}
function floodMask(src, sx, sy, tol){
  const {c, data} = src, W = c.width, H = c.height, mask = new Uint8Array(W * H);
  const o0 = (sy * W + sx) * 4, r0 = data[o0], g0 = data[o0 + 1], b0 = data[o0 + 2];
  const same = p => { const o = p * 4; return Math.abs(data[o] - r0) <= tol && Math.abs(data[o + 1] - g0) <= tol && Math.abs(data[o + 2] - b0) <= tol; };
  const stack = [sx, sy]; let minX = sx, maxX = sx, minY = sy, maxY = sy, count = 0;
  while (stack.length) {
    const y = stack.pop(), x0 = stack.pop();
    let x = x0; const row = y * W;
    if (mask[row + x] || !same(row + x)) continue;
    while (x > 0 && !mask[row + x - 1] && same(row + x - 1)) x--;
    let upOpen = false, dnOpen = false;
    for (; x < W && !mask[row + x] && same(row + x); x++) {
      mask[row + x] = 1; count++;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (y > 0) { const up = !mask[row - W + x] && same(row - W + x); if (up && !upOpen) stack.push(x, y - 1); upOpen = up; }
      if (y < H - 1) { const dn = !mask[row + W + x] && same(row + W + x); if (dn && !dnOpen) stack.push(x, y + 1); dnOpen = dn; }
    }
  }
  return {mask, W, H, minX, maxX, minY, maxY, count};
}
const FILL_MARK = '填色區塊';
async function fillAt(i, p){
  const st = STYLES.fill, color = st.color || '#ffd43b';
  const anns = await getAnns(i);
  const inside = a => p.x >= a.x && p.x <= a.x + a.w && p.y >= a.y && p.y <= a.y + a.h;
  // clicking inside one of the shapes changes its fill colour
  const shape = anns.filter(a => ['Square', 'Circle', 'Polygon'].includes(a.subtype) && inside(a)).sort((a, b) => a.w * a.h - b.w * b.h)[0];
  if (shape) return recolorShape(i, shape, color);
  const old = anns.filter(a => a.subtype === 'Stamp' && a.contents === FILL_MARK && inside(a)).sort((a, b) => a.w * a.h - b.w * b.h)[0];
  busy(true, '正在偵測區塊…');
  let src, fm;
  try {
    src = await fillSource(i);
    const sx = clamp(Math.floor(p.x * src.k), 0, src.c.width - 1), sy = clamp(Math.floor(p.y * src.k), 0, src.c.height - 1);
    fm = floodMask(src, sx, sy, +st.tol || 32);
  } finally { busy(false); }
  if (fm.count < 4) { toast('這裡沒有可以填色的區塊', 'err'); return; }
  if (fm.count > src.c.width * src.c.height * .9 && !(await confirmDlg('整頁填色', '偵測到的區塊幾乎是整頁，確定要整頁填色嗎？', '整頁填色'))) return;
  const w = fm.maxX - fm.minX + 1, h = fm.maxY - fm.minY + 1;
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const og = out.getContext('2d'), od = og.createImageData(w, h), n = parseInt(color.slice(1), 16), A = Math.round(255 * (st.opacity ?? 1));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!fm.mask[(y + fm.minY) * fm.W + x + fm.minX]) continue;
    const o = (y * w + x) * 4; od.data[o] = n >> 16 & 255; od.data[o + 1] = n >> 8 & 255; od.data[o + 2] = n & 255; od.data[o + 3] = A;
  }
  og.putImageData(od, 0, 0);
  const png = new Uint8Array(await (await blobOf(out, 'image/png')).arrayBuffer());
  const b = {x:fm.minX / src.k, y:fm.minY / src.k, w:w / src.k, h:h / src.k};
  await mutate('已填色', async doc => {
    if (old) { const ref = findAnnotRef(doc, i, old.id); if (ref) removeAnnotRefs(doc, i, ref); }
    const g = visToPdf(i, b), ap = await imageAP(doc, png, b.w, b.h, g.rot);
    addAnnot(doc, i, {Type:'Annot', Subtype:'Stamp', Name:'Fill', Rect:g.rect, Contents:PDFHexString.fromText(FILL_MARK), C:hexColor(color),
      T:PDFHexString.fromText(AUTHOR), M:nowStr(), CreationDate:nowStr(), Subj:PDFHexString.fromText('填色'), F:4, PDFE:true, AP:{N:ap}});
  });
}
async function recolorShape(i, a, color){
  await mutate('已變更填色', doc => {
    const ref = findAnnotRef(doc, i, a.id); if (!ref) return false;
    const ctx = doc.context, dict = ctx.lookup(ref, PDFDict), N = k => PDFName.of(k), sub = String(dict.get(N('Subtype'))).slice(1);
    dict.set(N('IC'), ctx.obj(hexColor(color))); dict.set(N('M'), nowStr());
    if (!dict.get(N('PDFE'))) { dict.delete(N('AP')); return; }   // other apps' shapes: let the viewer redraw from /IC
    const st = readAnnStyle(dict), turned = ROT_BOX.has(sub) && boxTurn(dict);
    const box = turned ? vRect(i, turned.baseRect) : {x:a.x, y:a.y, w:a.w, h:a.h};   // a turned shape is redrawn upright, then turned again
    const geom = sub === 'Polygon' ? geomPoly(flatPts(i, numArr(dict.lookup(N('Vertices'), PDFArray))), st, true) : shapeGeom(dict, st, box);
    const g = visToPdf(i, geom.b), ap = formAP(doc, geom.ops, geom.b.w, geom.b.h, S.pages[i].rot, gsRes(st));
    if (turned) { setTurn(doc, dict, ap, g.rect, turned.deg); return; }
    dict.set(N('Rect'), ctx.obj(g.rect));
    dict.set(N('AP'), ctx.obj({N:ap}));
  });
}
function fillStyle(){ const st = STYLES.fill; return {color:st.color, fill:st.color, width:.5, opacity:st.opacity ?? 1, dash:false}; }
async function createFillRect(i, r){
  const st = fillStyle(), geom = geomBox(r, st, 'rect');
  await addGeomAnnot(i, '填色', geom, baseDict('Square', '填色', st, {BS:bsDict(st), IC:hexColor(st.fill)}), gsRes(st));
}
async function createFillPoly(i, pts){
  const st = fillStyle(), slim = pts.filter((p, k) => !k || Math.hypot(p.x - pts[k - 1].x, p.y - pts[k - 1].y) > 1.2);
  if (slim.length < 3) return;
  const geom = geomPoly(slim, st, true);
  await addGeomAnnot(i, '填色', geom, baseDict('Polygon', '填色', st, {Vertices:toPdfPts(i, slim), BS:bsDict(st), IC:hexColor(st.fill)}), gsRes(st));
}
/* 節點 mode: click out the vertices of any shape; nodes stay draggable until the shape is finished */
let FPOLY = null;   // {i, pts, g, hover}
function drawFillPoly(){
  if (!FPOLY) return;
  const {pts, g, hover} = FPOLY, st = STYLES.fill, col = st.color || '#ffd43b', u = 1 / S.scale;
  const all = hover && !FPOLY.drag ? [...pts, hover] : pts;
  const closing = hover && pts.length >= 3 && Math.hypot(hover.x - pts[0].x, hover.y - pts[0].y) * S.scale < 9;
  g.innerHTML = (all.length >= 3 ? `<polygon points="${ptsAttr(all)}" fill="${col}" fill-opacity="${(st.opacity ?? 1) * .75}" stroke="none"/>` : '') +
    `<polyline points="${ptsAttr(all)}" fill="none" stroke="#1c64d9" stroke-width="${1.2 * u}" stroke-dasharray="${4 * u} ${3 * u}"/>` +
    pts.map((p, k) => `<circle cx="${p.x}" cy="${p.y}" r="${(k === 0 && closing ? 6 : 4) * u}" fill="${k === 0 ? (closing ? '#ffd43b' : '#fff') : '#fff'}" stroke="#1c64d9" stroke-width="${1.5 * u}"/>`).join('');
}
function cancelFillPoly(){ if (FPOLY) { FPOLY.g.remove(); FPOLY = null; } }
function finishFillPoly(){
  if (!FPOLY) return;
  const {i, pts} = FPOLY; cancelFillPoly();
  if (pts.length >= 3) createFillPoly(i, pts); else toast('至少需要 3 個節點才能填色', 'err');
}
function fillNodeDown(i, e){
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();   // so Enter / Backspace reach the node editor
  if (FPOLY && FPOLY.i !== i) cancelFillPoly();
  const p = snapPoint(i, pagePoint(i, e));
  if (!FPOLY) { const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); svgLayer(i).appendChild(g); FPOLY = {i, pts:[], g, hover:null}; }
  const pts = FPOLY.pts, near = k => Math.hypot(pts[k].x - p.x, pts[k].y - p.y) * S.scale < 8;
  if (pts.length >= 3 && near(0)) { finishFillPoly(); return true; }
  const hit = pts.findIndex((q, k) => near(k));
  if (hit >= 0) {   // drag an existing node; a click without moving on the last node finishes
    let moved = false; FPOLY.drag = true;

function gsRes(st){ return (st.opacity ?? 1) < 1 ? {ExtGState:{GS0:{Type:'ExtGState', CA:st.opacity, ca:st.opacity}}} : null; }
function strokePrefix(st){

function bboxOf(pts, pad){

const loc = (b, p) => [(p.x - b.x).toFixed(2), (b.y + b.h - p.y).toFixed(2)];
const toPdfPts = (i, pts) => pts.flatMap(p => S.pages[i].vp1.convertToPdfPoint(p.x, p.y));

    `${P(cx - rx, cy - ry * k)} ${P(cx - rx * k, cy - ry)} ${P(cx, cy - ry)} c ${P(cx + rx * k, cy - ry)} ${P(cx + rx, cy - ry * k)} ${P(cx + rx, cy)} c h `;

function trimCanvas(c){
  const ctx = c.getContext('2d'), d = ctx.getImageData(0, 0, c.width, c.height).data;

}

      tr.innerHTML = `<td class="act">${a.label}</td>` + Array.from({length:MAX_BINDS}, (_, k) => {
        const b = (work[a.id] || [])[k];
        return `<td><div class="kcell${b ? '' : ' empty'}" data-a="${a.id}" data-k="${k}" tabindex="0"><span>${b ? esc(bindLabel(b)) : '未設定'}</span>${b ? '<button class="kx" title="清除">×</button>' : ''}</div></td>`;
      }).join('');
      tb.appendChild(tr);
    });
  };
  const stopCapture = () => {
    capture = null;
    window.removeEventListener('keydown', onKey, true); window.removeEventListener('mousedown', onMouse, true);
    window.removeEventListener('contextmenu', onCtx, true);
    body.querySelectorAll('.kcell.rec').forEach(c => c.classList.remove('rec'));
  };
  let target = null;
  const assign = b => {
    const {a, k} = target; stopCapture();
    if (isReserved(b)) { msg.textContent = `「${bindLabel(b)}」是程式內建的快捷鍵，請換一個。`; draw(); return; }
    // a binding belongs to one action only: take it away from wherever it was
    let moved = '';
    BIND_ACTIONS.forEach(x => { const list = work[x.id] || []; const i = list.findIndex(y => sameBind(y, b)); if (i >= 0 && !(x.id === a && i === k)) { list.splice(i, 1); if (x.id !== a) moved = x.label; } });
    const list = work[a] = (work[a] || []);
    if (k < list.length) list[k] = b; else list.push(b);
    work[a] = list.slice(0, MAX_BINDS); save();
    msg.textContent = moved ? `「${bindLabel(b)}」原本設定給「${moved}」，已改為「${BIND_ACTIONS.find(x => x.id === a).label}」。` : '已儲存';
    draw();
  };
  const onKey = e => {
    e.preventDefault(); e.stopPropagation();
    if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;   // wait for the real key
    if (e.key === 'Escape' && !e.ctrlKey && !e.shiftKey && !e.altKey) { stopCapture(); msg.textContent = ''; draw(); return; }
    if (e.key === 'Backspace' && !e.ctrlKey && !e.shiftKey && !e.altKey) { const {a, k} = target; stopCapture(); (work[a] || []).splice(k, 1); save(); msg.textContent = '已儲存'; draw(); return; }
    assign(keyFromEvent(e));
  };
  const onMouse = e => {
    if (e.button === 0) {   // left click: cancel unless it is on the cell being recorded
      if (!e.target.closest('.kcell.rec')) { stopCapture(); draw(); }
      return;
    }
    e.preventDefault(); e.stopPropagation();
    if (e.button === 2) { msg.textContent = '滑鼠右鍵用於選單，無法設定。'; return; }
    assign(MB(e.button));
  };
  const onCtx = e => { e.preventDefault(); e.stopPropagation(); };
  body.addEventListener('click', e => {
    if (e.target.closest('[data-kb="reset"]')) { stopCapture(); Object.keys(work).forEach(k => delete work[k]); Object.assign(work, structuredClone(DEFAULT_BINDS)); save(); msg.textContent = '已恢復預設'; draw(); return; }
    const x = e.target.closest('.kx');
    const c = e.target.closest('.kcell'); if (!c) return;
    const a = c.dataset.a, k = +c.dataset.k;
    if (x) { (work[a] || []).splice(k, 1); save(); msg.textContent = '已儲存'; stopCapture(); draw(); return; }
    stopCapture(); draw();
    const cell = tb.querySelector(`.kcell[data-a="${a}"][data-k="${Math.min(k, (work[a] || []).length)}"]`);
    target = {a, k:Math.min(k, (work[a] || []).length)};
    cell.classList.add('rec'); cell.querySelector('span').textContent = '請按下按鍵或滑鼠按鍵…'; msg.textContent = 'Esc 取消、Backspace 清除這一格';
    capture = assign;
    window.addEventListener('keydown', onKey, true); window.addEventListener('mousedown', onMouse, true);
    window.addEventListener('contextmenu', onCtx, true);
  });
  draw();
  return {body, stop:stopCapture};
}

/* ====================================================================
   設定: 外觀 (window theme, page colour), 工具列, 按鍵, 軟體更新 in one window
   ==================================================================== */
const RIBBON_KEY = 'pdfeditor.ribbon.v1', RELEASES_URL = 'https://forgejo.taiyopen.com/tsukiinuhibi/PDFEditor/releases';
let RIBBON = (() => { try { return JSON.parse(localStorage.getItem(RIBBON_KEY)) || {}; } catch (_) { return {}; } })();
function applyRibbon(){ $('#ribbon').classList.toggle('icons-only', !!RIBBON.iconsOnly); }
let SET = null;   // the open settings window
async function openSettings(tab = 'look'){
  if (SET) { SET.show(tab); return; }
  const tabs = [['look', '外觀'], ['bar', '工具列'], ['keys', '按鍵'], ...(DESK ? [['update', '軟體更新']] : [])];
  const body = document.createElement('div'); body.className = 'set';
  body.innerHTML = `<div class="set-tabs">${tabs.map(([k, n]) => `<button data-st="${k}">${n}</button>`).join('')}</div><div class="set-pane"></div>`;
  const pane = body.querySelector('.set-pane');
  let keys = null;
  const opt = (type, name, value, on, label, extra = '') => `<label class="set-opt"><input type="${type}" name="${name}" value="${value}"${on ? ' checked' : ''}>${label}${extra}</label>`;
  const panes = {
    look:() => `<div class="set-h">視窗顯示</div>
      ${[['system', 'themeAuto'], ['dark', 'moon'], ['light', 'sun']].map(([k, ic]) => opt('radio', 'th', k, THEME === k, `${icon(ic)}${THEME_NAMES[k]}`, k === 'system' ? `<small>目前：${darkMQ.matches ? '暗色' : '亮色'}</small>` : '')).join('')}
      <div class="set-h">頁面色彩 <small>只影響畫面顯示，不會改變檔案</small></div>
      ${Object.entries(PAGE_NAMES).map(([k, n]) => opt('radio', 'pc', k, PAGECOLOR === k, `<span class="pcs pcs-${k}"></span>${n}`)).join('')}`,
    bar:() => `<div class="set-h">工具列</div>
      ${opt('checkbox', 'iconsOnly', '1', !!RIBBON.iconsOnly, '只顯示圖示，不顯示文字', '<small>滑鼠移到按鈕上會顯示名稱</small>')}
      <div class="note" style="margin-top:12px">「加頁」「旋轉」「簽署」按鈕的 ▾ 會列出同一類的其他功能，按鈕上會留著你最近用的那一個。工具列放不下時，把滑鼠移到工具列上滾動滾輪即可左右捲動。</div>`,
    update:() => {
      const st = UPD.state.state, ready = st === 'ready', working = st === 'checking' || st === 'downloading';
      return `<div class="set-h">軟體更新</div>
        <div style="margin-bottom:8px;color:var(--ink2)">目前版本：v${esc(UPD.info ? UPD.info.version : '')}</div>
        <div id="updMsg">${updateMessage() || '程式開啟後和每 4 小時會自動檢查一次新版本，有新版會在背景下載好再通知你。'}</div>
        <div class="set-btns"><button class="btn" data-u2="check"${working || ready ? ' disabled' : ''}>立即檢查</button>${ready ? '<button class="btn pri" data-u2="install">立即重新啟動並更新</button>' : ''}<span class="sp"></span><button class="btn" data-u2="page">版本記錄</button></div>`;
    },
  };
  const show = k => {
    if (!tabs.some(t => t[0] === k)) k = 'look';
    if (keys) { keys.stop(); keys = null; }
    SET.tab = k; UPD.modalOpen = k === 'update';
    body.querySelectorAll('[data-st]').forEach(b => b.classList.toggle('on', b.dataset.st === k));
    if (k === 'keys') { keys = keyEditor(); pane.innerHTML = ''; pane.appendChild(keys.body); }
    else pane.innerHTML = panes[k]();
  };
  SET = {tab, show, paintUpdate:() => { if (SET && SET.tab === 'update') pane.innerHTML = panes.update(); }};
  body.addEventListener('click', e => {
    const t = e.target.closest('[data-st]'); if (t) { show(t.dataset.st); return; }
    const u = e.target.closest('[data-u2]'); if (!u || u.disabled) return;
    if (u.dataset.u2 === 'check') { UPD.state = {state:'checking'}; renderUpdate(); DESK.update.check().then(st => { if (st) { UPD.state = st; renderUpdate(); } }); }
    if (u.dataset.u2 === 'install') { closeModal(true); installUpdate(); }
    if (u.dataset.u2 === 'page') DESK.openExternal(RELEASES_URL);
  });
  body.addEventListener('change', e => {
    const el = e.target;
    if (el.name === 'th') { setTheme(el.value); toast('顯示模式：' + THEME_NAMES[el.value]); }
    if (el.name === 'pc') { setPageColor(el.value); toast('頁面色彩：' + PAGE_NAMES[el.value]); }
    if (el.name === 'iconsOnly') { RIBBON.iconsOnly = el.checked; try { localStorage.setItem(RIBBON_KEY, JSON.stringify(RIBBON)); } catch (_) {} applyRibbon(); }
  });
  await openModal({title:'設定', body, width:620, buttons:[{spacer:true}, {label:'關閉', value:true, primary:true}], onOpen:() => show(tab)});
  if (keys) keys.stop();
  SET = null; UPD.modalOpen = false;
}
// the toolbars scroll sideways with the mouse wheel when they do not fit
function wheelSideways(e){
  const r = e.currentTarget; if (r.scrollWidth <= r.clientWidth + 1 || e.ctrlKey) return;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; if (!d) return;
  e.preventDefault(); r.scrollLeft += d * (e.deltaMode === 1 ? 32 : 1);
}
$('#ribbon').addEventListener('wheel', wheelSideways, {passive:false});
$('#viewbar').addEventListener('wheel', wheelSideways, {passive:false});
// a narrow view bar drops its words step by step: the labels, then the zoom buttons', the view modes', the last two;
// last of all it closes up the gaps
const VB_STEPS = ['c1', 'c2', 'c3', 'c4', 'c5'];
function fitViewbar(){
  const v = $('#viewbar'); v.classList.remove(...VB_STEPS);
  for (const c of VB_STEPS) { if (v.scrollWidth <= v.clientWidth + 1) break; v.classList.add(c); }
}
new ResizeObserver(() => fitViewbar()).observe($('#viewbar'));
document.fonts.ready.then(fitViewbar);

/* ====================================================================
   Desktop: open-with, updates
   ==================================================================== */
const UPD = {state:{state:'idle'}, info:null, modalOpen:false, dismissed:null};
function renderUpdate(){
  const s = UPD.state, bar = $('#updBar'), dot = $('#updDot'), sb = $('#bSettings');
  dot.classList.toggle('on', s.state === 'ready');
  sb.title = s.state === 'ready' ? `設定：新版本 v${s.version} 已下載好，打開「軟體更新」即可更新` : s.state === 'downloading' ? `設定：正在下載新版本 ${s.percent || 0}%` : '設定：顯示模式、工具列、按鍵、軟體更新';
  if (s.state === 'ready' && UPD.dismissed !== s.version) {
    bar.innerHTML = `<span>新版本 <b>v${esc(s.version)}</b> 已下載完成，重新啟動即可完成更新。</span><span class="sp"></span>
      ${s.notes ? '<button data-u="notes">查看更新內容</button>' : ''}<button data-u="later">稍後</button><button class="go" data-u="install">立即重新啟動並更新</button>`;
    bar.classList.add('show');
  } else if (s.state === 'downloading') {
    bar.innerHTML = `<span>正在下載新版本 <b>v${esc(s.version || '')}</b>…</span><span class="bar"><i style="width:${s.percent || 0}%"></i></span><span>${s.percent || 0}%</span><span class="sp"></span>`;
    bar.classList.add('show');
  } else bar.classList.remove('show');
  if (SET) SET.paintUpdate();
}
function updateMessage(){
  const s = UPD.state, v = UPD.info ? UPD.info.version : '';
  switch (s.state) {
    case 'checking': return '<span class="spin" style="display:inline-block;vertical-align:-3px;margin-right:8px"></span>正在檢查新版本…';
    case 'latest': return `目前已是最新版本 <b>v${esc(v)}</b>。`;
    case 'available': return `發現新版本 <b>v${esc(s.version)}</b>，正在背景下載…`;
    case 'downloading': return `正在下載新版本 <b>v${esc(s.version || '')}</b>… ${s.percent || 0}%<div class="updbar show" style="background:transparent;padding:8px 0 0"><span class="bar" style="background:#e6e2d9;width:100%"><i style="width:${s.percent || 0}%;background:#2f9e62"></i></span></div>`;
    case 'ready': return `新版本 <b>v${esc(s.version)}</b> 已下載完成。${s.notes ? `<div class="note" style="margin-top:10px;white-space:pre-wrap;max-height:220px;overflow:auto">${esc(s.notes)}</div>` : ''}`;
    case 'error': return `檢查更新時發生問題：${esc(s.message || '')}<div class="note" style="margin-top:10px">請確認網路連線後再試一次，也可以按「版本記錄」手動下載最新安裝檔。</div>`;
    case 'dev': return '目前是開發模式，不會自動更新。';
    case 'unsupported': return '這個安裝方式不支援自動更新，請按「版本記錄」下載最新安裝檔。';
    default: return '';
  }
}
async function installUpdate(){
  if (anyDirty() && !(await confirmDlg('安裝更新', '文件有尚未儲存的修改，重新啟動後這些修改會遺失。要繼續更新嗎？（建議先按「另存新檔」）', '仍要更新'))) return;
  S.dirty = false; docs.forEach(d => d.dirty = false);
  toast('正在重新啟動並安裝更新…');
  await DESK.update.install();
}
actions.checkUpdate = async () => {
  if (!DESK) return;
  if (!['ready', 'downloading', 'checking'].includes(UPD.state.state)) { UPD.state = {state:'checking'}; renderUpdate(); DESK.update.check().then(st => { if (st) { UPD.state = st; renderUpdate(); } }); }
  openSettings('update');
};
$('#updBar').addEventListener('click', e => {
  const u = e.target.dataset.u; if (!u) return;
  if (u === 'install') installUpdate();
  if (u === 'later') { UPD.dismissed = UPD.state.version; renderUpdate(); }
  if (u === 'notes') openSettings('update');
});
if (DESK) {
  $('#grpApp').style.display = '';
  DESK.info().then(info => { UPD.info = info; if (info.user) AUTHOR = info.user; $('#stVer').textContent = 'v' + info.version; $('#stVer').title = '檢查更新'; });
  $('#stVer').addEventListener('click', () => actions.checkUpdate());
  DESK.update.on(st => {
    const prev = UPD.state.state; UPD.state = st; renderUpdate();
    if (st.state === 'ready' && prev !== 'ready') toast(`新版本 v${st.version} 已下載完成`);
  });
  DESK.update.state().then(st => { if (st) { UPD.state = st; renderUpdate(); } });
  DESK.onOpenPath(p => openPath(p));
  DESK.ready().then(async list => { for (const p of (list || [])) await openPath(p); });
}
/* ---------------- 顯示模式: follow the OS / dark / light ---------------- */
const THEME_KEY = 'pdfeditor.theme';
let THEME = (() => { try { return localStorage.getItem(THEME_KEY) || 'system'; } catch (_) { return 'system'; } })();
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const THEME_NAMES = {system:'跟隨作業系統', dark:'暗色模式', light:'亮色模式'};
const PAGE_KEY = 'pdfeditor.pagecolor';
let PAGECOLOR = (() => { try { return localStorage.getItem(PAGE_KEY) || 'original'; } catch (_) { return 'original'; } })();
const PAGE_NAMES = {original:'原色', auto:'自動（暗色模式時使用夜間色彩）', night:'夜間（反轉顏色）', sepia:'護眼（米黃）'};
function setPageColor(v){ PAGECOLOR = v; try { localStorage.setItem(PAGE_KEY, v); } catch (_) {} applyTheme(); }
function applyTheme(){
  const dark = THEME === 'dark' || (THEME === 'system' && darkMQ.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.dataset.page = PAGECOLOR === 'auto' ? (dark ? 'night' : 'original') : PAGECOLOR;
  if (typeof drawRulers === 'function') drawRulers();
}
darkMQ.addEventListener('change', applyTheme);
function setTheme(t){
  THEME = t; try { localStorage.setItem(THEME_KEY, t); } catch (_) {}
  if (DESK && DESK.setTheme) DESK.setTheme(t).then(applyTheme); else applyTheme();
}
if (DESK && DESK.setTheme) DESK.setTheme(THEME).then(applyTheme); else applyTheme();
paintSplitButtons(); paintActionButtons(); applyRibbon();
window.__pdfapp = {S, setTool, renderForExport, renderRegion, setTheme, setPageColor, actions, scrollToPage, makeSample, pageChars:i => pageChars(i), getAnns, TBE:() => TBE && {i:TBE.i, html:TBE.el.innerHTML}, sel:() => AS && {id:AS.a.id, sub:AS.a.subtype, box:AS.box, rot:AS.rot || 0}, annRot, recolorShape, pdfeBlocks, applyTextFormat, textItems:i => pageTextItems(i), readRegion, ocrText:() => OCR.panel && OCR.panel.querySelector('.ocr-tx').value, ocrBox:() => OCR.box, tidyOcr, denoiseCanvas,
  fontCat:() => ({ok:FONTCAT.ok, fams:FONTCAT.fams.map(f => ({...f}))}), fontLoad:loadFontCatalog, tbStyle:() => currentTBStyle(),
  tbRT:async i => { const doc = await PDFDocument.load(S.bytes, {ignoreEncryption:true, updateMetadata:false}), out = [];
    for (const a of (await getAnns(i)).filter(a => a.subtype === 'FreeText')) { const ref = findAnnotRef(doc, i, a.id), d = ref && doc.context.lookup(ref, PDFDict), v = d && d.lookupMaybe(PDFName.of('PDFE_RT'), PDFHexString, PDFString); if (v) out.push({id:a.id, rt:JSON.parse(v.decodeText())}); }
    return out; },
  fontReady:() => loadFontCatalog().then(fontAnalysisDone)};
</script>
