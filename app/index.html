<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>PDF 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2328; --ink2:#57606a; --ink3:#8c959f;
  --paper:#fbfaf7; --line:#e3e0d8; --line2:#d4d0c6;
  --desk:#cfcbc2; --desk2:#c6c2b8;
  --seal:#c8371d; --seal-soft:#fbe9e4; --seal-ink:#9d2a14;
  --ok:#1f7a4d;
  --radius:7px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--desk);font-size:13px;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- ribbon ---------- */
.ribbon{background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:stretch;gap:0;padding:4px 8px;overflow-x:auto;overflow-y:hidden;flex:none;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:9px;padding:0 14px 0 4px;margin-right:4px;border-right:1px solid var(--line);white-space:nowrap}
.seal{width:30px;height:30px;border-radius:6px;background:var(--seal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;letter-spacing:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.brand b{font-size:15px;letter-spacing:.04em}
.grp{display:flex;flex-direction:column;padding:0 6px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.grp .btns{display:flex;gap:2px;flex:1}
.grp .cap{font-size:10.5px;color:var(--ink3);text-align:center;letter-spacing:.12em;padding-top:1px}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;padding:5px 6px 4px;border:0;background:transparent;border-radius:var(--radius);cursor:pointer;white-space:nowrap;font-size:12px;color:var(--ink)}
.rb:hover{background:#efece5}
.rb:active{background:#e6e2d9}
.rb.on{background:var(--seal-soft);color:var(--seal-ink)}
.rb.on svg{stroke:var(--seal)}
.rb:disabled{opacity:.35;cursor:default;background:transparent}
.rb.primary svg{stroke:var(--seal)}
@media (max-width:1600px){ .brand b{display:none} .brand{padding-right:8px} .rb{min-width:40px;padding:5px 2px 4px;font-size:11.5px} .grp{padding:0 3px} .rs{padding:0 5px 0 3px} }
@media (max-width:1340px){ .rb{min-width:36px;font-size:11px;letter-spacing:-.02em} .rb svg.i{width:18px;height:18px} .grp .cap{font-size:10px;letter-spacing:.04em} .brand{display:none} }

/* ---------- view bar ---------- */
.tabbar{display:flex;align-items:flex-end;gap:2px;background:#e4e0d8;border-bottom:1px solid var(--line2);padding:5px 8px 0;overflow-x:auto;overflow-y:hidden;flex:none;scrollbar-width:thin}
.tabbar.hide{display:none}
.dtab{display:flex;align-items:center;gap:7px;max-width:230px;min-width:120px;padding:6px 6px 7px 12px;border-radius:8px 8px 0 0;background:#d9d5cc;cursor:pointer;font-size:12.5px;color:var(--ink2);border:1px solid transparent;border-bottom:0;position:relative;top:1px;user-select:none}
.dtab:hover{background:#d2cdc3}
.dtab.on{background:#f3f1ec;color:var(--ink);border-color:var(--line2);font-weight:500}
.dtab .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtab .dd{width:7px;height:7px;border-radius:50%;background:#e08a00;flex:none}
.dtab .x{width:20px;height:20px;border:0;border-radius:5px;background:transparent;cursor:pointer;color:var(--ink3);font-size:15px;line-height:1;flex:none;display:grid;place-items:center}
.dtab .x:hover{background:rgba(0,0,0,.08);color:var(--seal-ink)}
.dtab-add{border:0;background:transparent;font-size:18px;color:var(--ink2);cursor:pointer;width:30px;height:28px;border-radius:6px;margin-bottom:2px;flex:none}
.dtab-add:hover{background:rgba(0,0,0,.07)}
.rstack{display:flex;flex-direction:column;justify-content:center;gap:1px;padding-left:2px}
.rs{display:flex;align-items:center;gap:5px;border:0;background:transparent;border-radius:5px;padding:0 8px 0 5px;height:16px;font-size:11.5px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.rs svg.i{width:14px;height:14px}
.rs:hover{background:#efece5}
.rs:disabled{opacity:.35;cursor:default;background:transparent}
.ctx{position:fixed;z-index:70;min-width:220px;background:#fff;border-radius:9px;box-shadow:0 10px 34px rgba(0,0,0,.22);padding:5px;display:none;font-size:13px}
.ctx button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:6px 10px;border-radius:6px;cursor:pointer;text-align:left}
.ctx button:hover:not(:disabled){background:var(--seal-soft);color:var(--seal-ink)}
.ctx button:disabled{color:var(--ink3);cursor:default}
.ctx button kbd{margin-left:auto}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.ctx .hd{font-size:11px;color:var(--ink3);padding:4px 10px 2px}
.viewbar{background:#f3f1ec;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:6px;padding:5px 10px;flex:none;overflow-x:auto;white-space:nowrap}
.vb{height:28px;min-width:28px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid transparent;background:transparent;border-radius:6px;cursor:pointer;font-size:12.5px}
.vb svg.i{width:17px;height:17px}
.vb:hover{background:#e7e4dc}
.vb.on{background:#fff;border-color:var(--line2);color:var(--seal-ink);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.vb.on svg{stroke:var(--seal)}
.vb:disabled{opacity:.35;cursor:default;background:transparent}
.sep{width:1px;height:20px;background:var(--line2);margin:0 4px;flex:none}
.pager{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pager input{width:52px;height:28px;border:1px solid var(--line2);border-radius:6px;text-align:center;font:inherit;font-size:13px;background:#fff}
.pager .tot{color:var(--ink2);min-width:46px}
.zoomsel{position:relative}
.zoomsel input{width:66px;height:28px;border:1px solid var(--line2);border-radius:6px;text-align:center;font:inherit;background:#fff;font-variant-numeric:tabular-nums}
.chk{display:inline-flex;align-items:center;gap:5px;color:var(--ink2);font-size:12px;cursor:pointer;padding:0 4px}
.lbl{color:var(--ink3);font-size:11.5px;letter-spacing:.1em;margin-right:2px}

/* ---------- hint bar ---------- */
.updbar{flex:none;display:none;align-items:center;gap:10px;padding:7px 14px;background:#1f3b2d;color:#fff;font-size:12.5px}
.updbar.show{display:flex}
.updbar .sp{flex:1}
.updbar .bar{width:160px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.updbar .bar i{display:block;height:100%;background:#7ee2a8;width:0}
.updbar button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:5px;padding:3px 10px;cursor:pointer;font-size:12px}
.updbar button.go{background:#2f9e62;border-color:#2f9e62}
.updwrap{position:relative;display:inline-flex}
.upddot{position:absolute;top:-2px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--seal);border:2px solid var(--paper);display:none}
.upddot.on{display:block}
#stVer{cursor:pointer;color:var(--ink3)}
#stVer:hover{color:var(--seal-ink)}
.hint{flex:none;display:none;align-items:center;gap:10px;padding:6px 14px;background:var(--seal);color:#fff;font-size:12.5px}
.hint.show{display:flex}
.hint .sp{flex:1}
.hint button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:5px;padding:3px 10px;cursor:pointer;font-size:12px}
.hint button:hover{background:rgba(255,255,255,.28)}
.swatch{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.6);cursor:pointer;padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.25)}

/* ---------- main ---------- */
.main{flex:1;display:flex;min-height:0}
.side{width:212px;flex:none;background:#ebe8e1;border-right:1px solid var(--line2);display:flex;flex-direction:column;min-height:0}
.side.hide{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line2);flex:none}
.tab{flex:1;border:0;background:transparent;padding:8px 0 7px;cursor:pointer;font-size:12.5px;color:var(--ink2);border-bottom:2px solid transparent}
.tab.on{color:var(--seal-ink);border-bottom-color:var(--seal);font-weight:500}
.panel{flex:1;overflow:auto;padding:10px;display:none}
.panel.on{display:block}
.thumb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:7px;cursor:pointer;margin-bottom:2px}
.thumb:hover{background:#e0dcd3}
.thumb.on .tn{text-decoration:underline;text-underline-offset:3px}
.thumb.sel{background:#fff;box-shadow:0 0 0 2px var(--seal) inset}
.thumb .tc{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);display:block}
.thumb .tn{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.thumb.sel .tn{color:var(--seal-ink);font-weight:500}
.empty-note{color:var(--ink3);font-size:12px;line-height:1.7;padding:8px 2px}
.sbtn{width:100%;border:1px dashed var(--ink3);background:transparent;border-radius:7px;padding:8px;cursor:pointer;color:var(--ink2);margin-bottom:10px}
.sbtn:hover{border-color:var(--seal);color:var(--seal-ink);background:#fff}
/* page picker */
.pp-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pp-bar input[type=text]{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:5px 9px;width:180px}
.pp-bar .cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2)}
.pp-bar .cnt b{color:var(--seal-ink)}
.pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tw,130px),1fr));gap:12px;padding:12px;background:#ebe8e1;border-radius:9px;max-height:min(58vh,620px);overflow:auto;user-select:none}
.pp-card{position:relative;background:transparent;border-radius:8px;padding:8px 6px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid transparent}
.pp-card:hover{background:#e0dcd3}
.pp-card .th{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);display:grid;place-items:center;color:#c9c5bc;font-size:12px;width:100%}
.pp-card canvas{display:block;width:100%;height:100%}
.pp-card .num{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pp-card .ck{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:6px;background:#fff;border:1.5px solid var(--ink3);display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;z-index:2}
.pp-card.on{border-color:var(--seal);background:#fff}
.pp-card.on .ck{background:var(--seal);border-color:var(--seal)}
.pp-card.on .num{color:var(--seal-ink);font-weight:500}
.pp-del .pp-card.on .th::after{content:"";position:absolute;inset:0;background:rgba(200,55,29,.28);background-image:linear-gradient(45deg,transparent 48.5%,rgba(200,55,29,.75) 48.5% 51.5%,transparent 51.5%),linear-gradient(-45deg,transparent 48.5%,rgba(200,55,29,.75) 48.5% 51.5%,transparent 51.5%)}
.pp-card.cur .num::after{content:" · 目前頁";color:var(--ink3);font-weight:400}
.pp-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.pp-foot select{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;background:#fff}
.att{background:#fff;border-radius:7px;padding:8px 9px;margin-bottom:7px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.att .nm{font-weight:500;word-break:break-all;font-size:12.5px}
.att .meta{color:var(--ink3);font-size:11px;margin:2px 0 6px}
.att .row{display:flex;gap:6px}
.mini{border:1px solid var(--line2);background:#faf9f6;border-radius:5px;padding:2px 8px;font-size:11.5px;cursor:pointer}
.mini:hover{border-color:var(--seal);color:var(--seal-ink)}
.mini.danger:hover{background:#fde8e4}
.imgitem{background:#fff;border-radius:7px;padding:6px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid transparent}
.imgitem:hover{border-color:var(--seal)}
.imgitem canvas{width:100%;display:block;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/12px 12px}
.imgitem .meta{font-size:11px;color:var(--ink2);margin-top:5px;display:flex;justify-content:space-between}
.annitem{background:#fff;border-radius:7px;padding:7px 9px;margin-bottom:7px;cursor:pointer;border-left:3px solid #f2b705;font-size:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.annitem:hover{background:#fffaf0}
.annitem .k{color:var(--ink3);font-size:11px;margin-bottom:2px}

.vwrap{flex:1;position:relative;min-width:0}
.viewer{position:absolute;inset:0;overflow:auto;background:var(--desk);outline:none;scrollbar-gutter:stable}
.ruler,.rcorner{position:absolute;display:none;z-index:6}
.vwrap.rulers .ruler,.vwrap.rulers .rcorner{display:block}
.vwrap.rulers .viewer{top:20px;left:20px}
.ruler.h{top:0;left:20px;right:0;height:20px;cursor:s-resize}
.ruler.v{left:0;top:20px;bottom:0;width:20px;cursor:e-resize}
.rcorner{top:0;left:0;width:20px;height:20px;background:#e9e6df;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.page .grd{position:absolute;inset:0;pointer-events:none;display:none;
  background-image:linear-gradient(to right,rgba(0,120,200,.14) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,120,200,.14) 1px,transparent 1px),
    linear-gradient(to right,rgba(0,120,200,.32) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,120,200,.32) 1px,transparent 1px)}
.show-grid .page .grd{display:block}
.page .gdl{position:absolute;inset:0;pointer-events:none;z-index:2}
.guide{position:absolute;pointer-events:auto;z-index:3}
.guide.h{left:-14px;right:-14px;height:0;border-top:1px solid #00a3ff;cursor:row-resize}
.guide.v{top:-14px;bottom:-14px;width:0;border-left:1px solid #00a3ff;cursor:col-resize}
.guide.h::before{content:"";position:absolute;left:0;right:0;top:-5px;height:9px}
.guide.v::before{content:"";position:absolute;top:0;bottom:0;left:-5px;width:9px}
.guide:hover{border-color:#c8371d}
.guide-ghost{position:fixed;z-index:96;pointer-events:none}
.guide-ghost.h{height:0;border-top:1px dashed #00a3ff}
.guide-ghost.v{width:0;border-left:1px dashed #00a3ff}
.guide-ghost.del{border-color:#c8371d}
.guide-lab{position:fixed;z-index:97;pointer-events:none;background:#22262b;color:#fff;font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap}
.snapline{position:absolute;pointer-events:none}
.snapline.h{left:0;right:0;border-top:1px solid #e0279b}
.snapline.v{top:0;bottom:0;border-left:1px solid #e0279b}
.xsel{position:absolute;outline:2px solid var(--seal);background:rgba(200,55,29,.07);cursor:move;z-index:4;box-shadow:0 0 0 1px rgba(255,255,255,.8) inset}
.xsel .h{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--seal);border-radius:3px;margin:-6px 0 0 -6px}
.xsel .h[data-d=n],.xsel .h[data-d=s]{cursor:ns-resize}
.xsel .h[data-d=e],.xsel .h[data-d=w]{cursor:ew-resize}
.xsel .h[data-d=nw],.xsel .h[data-d=se]{cursor:nwse-resize}
.xsel .h[data-d=ne],.xsel .h[data-d=sw]{cursor:nesw-resize}
.xbar{position:absolute;z-index:5;display:flex;gap:6px;align-items:center;background:#22262b;color:#fff;padding:5px 6px 5px 10px;border-radius:8px;font-size:12px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.xbar .dim{color:#cfd3d8;margin-right:4px;font-variant-numeric:tabular-nums}
.xbar button{border:0;border-radius:5px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px;background:rgba(255,255,255,.14);color:#fff}
.xbar button[data-x=ok]{background:var(--seal)}
.aidmenu{min-width:250px}
.aidmenu button .ck{width:14px;color:var(--seal);font-weight:700;display:inline-block}
.aidmenu .aid-row{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;font-size:12.5px}
.aidmenu .aid-row select{font:inherit;font-size:12px;border:1px solid var(--line2);border-radius:5px;padding:2px 5px}
.aidmenu .aid-tip{font-size:11px;color:var(--ink3);padding:6px 10px 4px;line-height:1.55;max-width:260px}
.viewer.pan-ready,.viewer.pan-ready *{cursor:grab!important}
.viewer.panning,.viewer.panning *{cursor:grabbing!important;user-select:none}
.pages{position:relative;margin:0}
.page{position:absolute;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.12)}
.page.newpage{outline:3px solid var(--seal);outline-offset:4px;animation:np 2.6s ease-out forwards}
.page.newpage::after{content:attr(data-badge);position:absolute;left:10px;top:10px;background:var(--seal);color:#fff;font-size:12px;padding:4px 11px;border-radius:5px;white-space:nowrap;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.2);animation:npb 2.6s ease-out forwards}
@keyframes npb{0%,75%{opacity:1}100%{opacity:0}}
@keyframes np{0%,70%{outline-color:var(--seal)}100%{outline-color:transparent}}
.thumb.newpage .tc{outline:3px solid var(--seal);outline-offset:2px}
.ex-grid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(380px,1.15fr);gap:20px}
.ex-h{font-weight:700;font-size:13px;margin-bottom:8px;color:var(--ink)}
.ex-pages{max-height:min(62vh,640px);--tw:104px}
.ex-fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ex-fmt{border:1.5px solid var(--line2);background:#fff;border-radius:8px;padding:7px 9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ex-fmt b{font-size:13px}
.ex-fmt small{font-size:11px;color:var(--ink3);line-height:1.35}
.ex-fmt:hover{border-color:var(--ink3)}
.ex-fmt.on{border-color:var(--seal);background:#fffaf8}
.ex-fmt.on b{color:var(--seal-ink)}
.ex-dir{display:flex;gap:8px;align-items:center;background:#f6f4ef;border-radius:7px;padding:7px 9px}
.ex-dir span{flex:1;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.ex-in{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;font-size:13px;background:#fff;width:100%}
.ex-in:disabled{background:#f3f1ec;color:var(--ink3)}
.ex-tokens{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:6px}
.ex-tokens select{font:inherit;border:1px solid var(--line2);border-radius:6px;padding:2px 6px;font-size:12px}
.ex-names{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;padding:4px}
.ex-row{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:5px}
.ex-row .pg{font-size:12px;color:var(--ink3);width:56px;flex:none;font-variant-numeric:tabular-nums}
.ex-row input{flex:1;font:inherit;font-size:12.5px;border:1px solid transparent;border-radius:5px;padding:3px 6px;background:transparent;min-width:0}
.ex-row input:hover{border-color:var(--line2)}
.ex-row input:focus{border-color:var(--seal);background:#fff;outline:none}
.ex-row.custom input{background:#fffaf0}
.ex-row .ext{font-size:12px;color:var(--ink3)}
.ex-mode{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.mac-list{display:flex;gap:6px;flex-wrap:wrap}
.mac{display:flex;align-items:center;gap:4px;border:1.5px solid var(--line2);border-radius:8px;padding:5px 6px 5px 9px;background:#fff;font-size:13px}
.mac.on{border-color:var(--seal);background:#fffaf8;color:var(--seal-ink)}
.mac label{display:flex;align-items:center;gap:5px;cursor:pointer}
.mac .mv{display:flex;gap:1px}
.mac .mv button{border:0;background:#f1eee8;border-radius:4px;width:20px;height:20px;cursor:pointer;font-size:14px;line-height:1;color:var(--ink2)}
.mac .mv button:hover:not(:disabled){background:var(--seal-soft);color:var(--seal-ink)}
.mac .mv button:disabled{opacity:.3;cursor:default}
.ex-opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ex-opt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.ex-opt select,.ex-opt input{font:inherit;border:1px solid var(--line2);border-radius:6px;padding:3px 6px;font-size:12.5px;background:#fff}
.kb{width:100%;border-collapse:separate;border-spacing:0 6px}
.kb th{font-size:11.5px;color:var(--ink3);font-weight:500;text-align:left;padding:0 6px}
.kb td{padding:0 4px}
.kb td.act{font-weight:500;white-space:nowrap;padding-right:12px}
.kcell{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1.5px solid var(--line2);border-radius:7px;padding:6px 6px 6px 10px;min-height:34px;cursor:pointer;background:#fff;font-size:12.5px}
.kcell:hover{border-color:var(--ink3)}
.kcell.empty span{color:var(--ink3)}
.kcell.rec{border-color:var(--seal);background:#fffaf8;color:var(--seal-ink);animation:krec 1s ease-in-out infinite}
@keyframes krec{50%{box-shadow:0 0 0 3px rgba(200,55,29,.18)}}
.kx{border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:15px;line-height:1;border-radius:4px;width:20px;height:20px}
.kx:hover{background:var(--seal-soft);color:var(--seal-ink)}
.tool-note .annhit.txt{display:block}
.annhit.txt{cursor:pointer}
.annhit.noap{background:none!important;border:0!important;width:20px!important;height:20px!important}
.npend{position:absolute;pointer-events:none;z-index:5}
.npop{position:absolute;z-index:7;background:#ffef3a;border:1px solid #8a7f00;border-radius:3px;box-shadow:2px 3px 10px rgba(0,0,0,.28);display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:200px;min-height:110px;font-size:13px}
.nhd{display:flex;align-items:center;gap:7px;padding:4px 5px 4px 6px;cursor:move;user-select:none;color:#2b2a00}
.nhd .nic{width:20px;height:20px;flex:none}
.nhd .nau{font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nhd .ndt{flex:1;text-align:right;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nhd button{border:0;background:transparent;cursor:pointer;width:22px;height:22px;border-radius:50%;flex:none;font-size:13px;line-height:1;color:#4a4500}
.nhd .nx{background:#fff7a8;border:1px solid #8a7f00;font-size:15px;font-weight:700}
.nhd button:hover{background:#fff;color:#c8371d}
.nbd{flex:1;margin:0 5px 5px;background:#fff;border:1px dashed #8a7f00;display:flex}
.nbd textarea{flex:1;border:0;resize:none;outline:none;padding:6px 8px;font:inherit;font-size:13.5px;line-height:1.55;background:transparent;color:#1f2328}
.ncall{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:6}
.ncall polygon{fill:#ffef3a;stroke:#8a7f00;stroke-width:1;opacity:.92}
svg.dsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
.tool-pen .page,.tool-arrow .page,.tool-line .page,.tool-rect .page,.tool-ellipse .page,.tool-polyline .page,.tool-polygon .page,.tool-cloud .page,.tool-stamp .page{cursor:crosshair}
.tool-hlText .page,.tool-strike .page,.tool-underline .page{cursor:text}
.tool-eraser .page{cursor:cell}
.hint.styl{background:#fff8f5;color:var(--ink);border-bottom:1px solid #f1d5cc;flex-wrap:nowrap;overflow-x:auto;padding:5px 12px;white-space:nowrap;scrollbar-width:thin}
.hint.styl button{color:var(--ink);border-color:var(--line2);background:#fff}
.hint.styl button:hover{background:#fff;border-color:var(--seal)}
.hint.styl [data-h=done]{position:sticky;right:-12px;box-shadow:-10px 0 10px #fff8f5;flex:none}
.sb-t{display:inline-flex;align-items:center;gap:5px;color:var(--seal-ink)}
.sb-t svg.i{width:17px;height:17px;stroke:var(--seal)}
.sb-tip{color:var(--ink2);font-size:12px}
.sb-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.sb-q{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#f1d5cc;color:var(--seal-ink);font-size:10px;margin-left:3px;cursor:help}
.sb-g{display:flex;gap:4px;flex-wrap:nowrap}
.sb-h{font-size:11.5px;color:var(--ink3)}
.pchip{display:inline-flex;align-items:center;gap:5px;font-size:12px!important;padding:3px 8px!important;border-radius:6px!important}
.pchip i{display:inline-block;width:16px;height:12px;border-radius:2px;box-sizing:border-box}
.pchip.on{border-color:var(--seal)!important;color:var(--seal-ink)!important}
.sb-sw{display:inline-flex;gap:3px;align-items:center}
.sb-sw .sw,.sb-sw .swn{width:18px!important;height:18px!important;padding:0!important;border-radius:50%!important;border:1.5px solid rgba(0,0,0,.18)!important}
.sb-sw .swn{font-size:11px;line-height:1;color:var(--ink3)!important}
.sb-sw .on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--seal)}
.sb-sw input[type=color]{width:22px;height:20px;border:0;padding:0;background:none;cursor:pointer}
.sb-l{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2)}
.sb-l select{font:inherit;font-size:12px;border:1px solid var(--line2);border-radius:5px;padding:2px 4px;background:#fff}
.cpick{display:inline-flex!important;align-items:center;gap:3px;padding:2px 5px!important;border-radius:6px!important;font-size:10px!important;color:var(--ink3)!important}
.cpick i{width:18px;height:14px;border-radius:3px;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.2) inset}
.cpick.none i{background:linear-gradient(135deg,#fff 45%,#e03131 45% 55%,#fff 55%)}
.cpmenu{min-width:0;padding:8px}
.cp-grid{display:grid;grid-template-columns:repeat(8,22px);gap:5px}
.cp-sw{width:22px!important;height:22px;padding:0!important;border-radius:50%!important;border:1.5px solid rgba(0,0,0,.18)!important;cursor:pointer}
.cp-sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--seal)}
.cp-sw.none{background:#fff;color:var(--ink3);font-size:12px}
.cp-custom{display:flex!important;align-items:center;gap:6px;font-size:12px;color:var(--ink2);margin-top:8px}
.cp-custom input{width:40px;height:22px;border:0;padding:0;background:none}
.stamp-cur{display:inline-flex;align-items:center;min-height:26px}
.toolmenu button svg.i{width:17px;height:17px}
.toolmenu button.on{background:var(--seal-soft);color:var(--seal-ink)}
.toolmenu small{margin-left:auto;color:var(--ink3);font-size:10.5px;padding-left:10px}
.st-tabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.st-tabs button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent}
.st-tabs button.on{color:var(--seal-ink);border-bottom-color:var(--seal);font-weight:600}
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:56vh;overflow:auto;padding:2px}
.st-item{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;display:grid;place-items:center;min-height:74px}
.st-item canvas{max-width:100%;max-height:96px}
.st-item:hover{border-color:var(--ink3)}
.st-item.on{border-color:var(--seal);background:#fff7e0;box-shadow:0 0 0 2px #ffe08a inset}
.st-prev{background:#f6f4ef;border-radius:8px;padding:18px;display:grid;place-items:center;min-height:120px}

.asel{position:absolute;z-index:4;outline:1.5px dashed #1c64d9;outline-offset:2px;cursor:move;box-shadow:0 0 0 4px rgba(28,100,217,.10)}
.asel.fixed{cursor:default}
.asel.noteMove{outline-color:#8a7f00}
.asel .h{position:absolute;width:11px;height:11px;background:#fff;border:2px solid #1c64d9;border-radius:2px;margin:-5.5px 0 0 -5.5px;z-index:2}
.asel .h[data-d=n],.asel .h[data-d=s]{cursor:ns-resize}
.asel .h[data-d=e],.asel .h[data-d=w]{cursor:ew-resize}
.asel .h[data-d=nw],.asel .h[data-d=se]{cursor:nwse-resize}
.asel .h[data-d=ne],.asel .h[data-d=sw]{cursor:nesw-resize}
.aghost{position:absolute;inset:0;width:100%;height:100%;opacity:.9;pointer-events:none}
.aveil{position:absolute;background:rgba(255,255,255,.72);pointer-events:none;z-index:3;outline:1px dashed #adb5bd}
.abar .hintk{color:#9aa2ab;font-size:11px}
.abar button[data-x=del]{background:var(--seal)}
.rb.split{flex-direction:row;align-items:stretch;padding:0;gap:0}
.rb.split .sp-main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 2px 4px 6px;min-width:38px;border-radius:7px 0 0 7px}
.rb.split .sp-arr{display:flex;align-items:center;padding:0 5px;font-size:10px;color:var(--ink3);border-left:1px solid transparent;border-radius:0 7px 7px 0}
.rb.split:hover .sp-arr{border-left-color:var(--line2)}
.rb.split .sp-arr:hover{background:#e6e2d9;color:var(--ink)}
.rb.split .sp-main:hover{background:#e6e2d9}
.rb.split.on .sp-main svg{stroke:var(--seal)}
.tsw{display:inline-flex;gap:2px;background:#fff;border:1px solid #f1d5cc;border-radius:8px;padding:2px;flex:none}
.tsb{display:inline-flex!important;align-items:center;gap:4px;border:0!important;background:transparent!important;border-radius:6px!important;padding:3px 8px!important;font-size:12px!important;color:var(--ink2)!important;cursor:pointer}
.tsb svg.i{width:16px;height:16px}
.tsb:hover{background:#f6f1ea!important;color:var(--ink)!important}
.tsb.on{background:var(--seal)!important;color:#fff!important}
.tsb.on svg.i{stroke:#fff}
@media (max-width:1500px){ .tsw .tsb span{display:none} .tsw .tsb.on span{display:inline} }
.ex-warn{font-size:12px;color:#a15c00;min-height:18px;margin-top:6px}
.ap-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.ap-row .field{margin:0}
.ap-row select,.ap-row input{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;background:#fff;font-size:13px}
.ap-strip{display:flex;gap:12px;align-items:flex-end;overflow-x:auto;padding:16px 14px 12px;background:#ebe8e1;border-radius:9px;min-height:190px}
.ap-pg{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ap-pg .b{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);display:grid;place-items:center;overflow:hidden;color:#c9c5bc}
.ap-pg .b canvas,.ap-pg .b img{display:block;width:100%;height:100%}
.ap-pg.new .b{background:#fff;box-shadow:none;outline:2px dashed var(--seal);outline-offset:-2px;color:var(--seal);font-weight:700;font-size:13px}
.ap-pg.new{color:var(--seal-ink);font-weight:500}
.ap-pg.more{align-self:center;color:var(--ink3);font-size:18px;padding:0 4px}
.ap-sum{margin-top:10px;font-size:13px}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:#fff}
.stepper button{border:0;background:#f3f1ec;width:30px;font-size:16px;cursor:pointer}
.stepper button:hover{background:var(--seal-soft);color:var(--seal-ink)}
.ap-row .stepper input{border:0;border-radius:0;width:56px;text-align:center;padding:6px 2px}
.chips{display:flex;gap:4px}
.chips button{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12.5px}
.chips button.on{border-color:var(--seal);color:var(--seal-ink);background:#fffaf8}
.ap-strip{position:relative}
.ap-strip .ap-pg{cursor:pointer;position:relative}
.ap-strip .ap-pg:not(.new):hover .b{outline:2px solid var(--ink3);outline-offset:2px}
.ap-strip .ap-pg:not(.new):hover::after{content:"點選：插在此頁後";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--ink2);white-space:nowrap}
.ap-new{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:grab;touch-action:none;user-select:none}
.ap-new.dragging{opacity:.3}
.ap-new .stack{position:relative}
.ap-ghost i,.ap-new .stack i{position:absolute;inset:0;background:#fff;border:2px dashed var(--seal);border-radius:2px}
.ap-ghost b,.ap-new .stack b{position:absolute;inset:0;display:grid;place-items:center;color:var(--seal);font-size:13px;text-align:center;line-height:1.35;background:#fff;border:2px dashed var(--seal);border-radius:2px}
.ap-new .lb{font-size:11.5px;color:var(--seal-ink);font-weight:500;white-space:nowrap}
.ap-new .grip{font-size:10.5px;color:var(--ink3)}
.ap-ghost{position:fixed !important;z-index:95;pointer-events:none;opacity:.9;transform:translate(18px,-55%) rotate(-3deg);filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.ap-mark{position:absolute;top:8px;bottom:30px;width:4px;margin-left:-2px;background:var(--seal);border-radius:2px;display:none;pointer-events:none}
.ap-mark::before{content:"放在這裡";position:absolute;top:-2px;left:8px;background:var(--seal);color:#fff;font-size:11px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.ap-sum b{color:var(--seal-ink)}
.page canvas.pc{position:absolute;inset:0;width:100%;height:100%;display:block}
.page .ovl{position:absolute;inset:0}
.page .ld{position:absolute;inset:0;display:grid;place-items:center;color:#c9c5bc;font-size:12px}
.tool-note .page,.tool-textbox .page,.tool-signature .page{cursor:crosshair}
.tool-highlight .page,.tool-digisign .page,.tool-extract .page{cursor:crosshair}
.tool-hand .page{cursor:grab}

.imgbox{position:absolute;display:none;border:2px solid var(--seal);background:rgba(200,55,29,.10);cursor:pointer;border-radius:2px}
.imgbox span{position:absolute;left:-2px;top:-20px;background:var(--seal);color:#fff;font-size:11px;padding:1px 6px;border-radius:3px 3px 0 0;white-space:nowrap}
.imgbox:hover{background:rgba(200,55,29,.22)}
.tool-extract .imgbox{display:block}
.annhit{position:absolute;display:none;cursor:pointer;border-radius:2px}
.tool-select .annhit{display:block}
.annhit:hover{outline:2px solid rgba(200,55,29,.55);outline-offset:1px}
.annhit.noap{background:#ffd43b;border:1px solid #b38600;width:18px!important;height:18px!important;border-radius:3px}
.annhit.sig{outline:1.5px dashed var(--ok)}
.draft{position:absolute;border:1.5px dashed var(--seal);background:rgba(200,55,29,.08);pointer-events:none}
.draft.hl{border:0;background:rgba(255,212,59,.45);mix-blend-mode:multiply}

.tip{position:fixed;z-index:60;max-width:280px;background:#22262b;color:#fff;padding:7px 10px;border-radius:7px;font-size:12px;line-height:1.55;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:pre-wrap;display:none}
.pop{position:fixed;z-index:61;width:260px;background:#fff;border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,.25);padding:12px;font-size:12.5px;display:none}
.pop .k{color:var(--ink3);font-size:11px;margin-bottom:4px}
.pop .c{white-space:pre-wrap;line-height:1.6;max-height:180px;overflow:auto;margin-bottom:10px}
.pop .row{display:flex;justify-content:flex-end;gap:6px}

/* ---------- empty state ---------- */
.welcome{position:absolute;inset:0;display:grid;place-items:center;padding:20px}
.wcard{background:var(--paper);border-radius:14px;padding:34px 38px;max-width:520px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.12);text-align:center;border:2px dashed transparent;transition:border-color .15s}
.drop .wcard{border-color:var(--seal)}
.wcard .seal{width:56px;height:56px;font-size:28px;margin:0 auto 16px;border-radius:12px}
.wcard h1{font-size:21px;margin:0 0 8px;letter-spacing:.03em}
.wcard p{color:var(--ink2);margin:0 0 22px;line-height:1.7}
.wcard .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:9px 18px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.pri:hover{background:var(--seal-ink)}
.btn.pri svg{stroke:#fff}
.btn:disabled{opacity:.5;cursor:default}
.keys{margin-top:24px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:12px;color:var(--ink2);max-width:330px;margin-left:auto;margin-right:auto}
kbd{font-family:inherit;background:#fff;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;color:var(--ink)}

/* ---------- status ---------- */
.status{flex:none;height:26px;background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 12px;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px}
.status .dot.dirty{background:#e08a00}
.status .sig{color:var(--ok);font-weight:500}
.status .sp{flex:1}
.wmode{display:inline-flex;align-items:center;gap:6px}
.wmode b{font-weight:500;color:var(--ok)}
.wmode.ro b{color:#a15c00}
.wmode label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(25,22,18,.45);display:none;place-items:center;z-index:80;padding:16px}
.mask.show{display:grid}
.modal{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:96vw;max-height:94vh;display:flex;flex-direction:column;min-width:320px}
.modal .mh{padding:14px 18px 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal .mh::before{content:"";width:4px;height:16px;background:var(--seal);border-radius:2px}
.modal .mb{padding:4px 18px 14px;overflow:auto;line-height:1.6}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.modal .mf .sp{flex:1}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.field label,.flab{font-size:12px;color:var(--ink2)}
.field input[type=text],.field input[type=password],.field input[type=number],.field textarea,.field select{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:7px 9px;font-size:13.5px;background:#fff}
.field textarea{resize:vertical;min-height:90px}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid rgba(200,55,29,.25);border-color:var(--seal)}
.frow{display:flex;gap:10px}
.frow>.field{flex:1}
.radio{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line2);border-radius:8px;margin-bottom:8px;cursor:pointer}
.radio:has(input:checked){border-color:var(--seal);background:#fffaf8}
.radio small{display:block;color:var(--ink3);font-size:11.5px}
.note{background:#f6f4ef;border-radius:8px;padding:9px 11px;font-size:12px;color:var(--ink2);line-height:1.65}
.note.warn{background:#fff4e0;color:#7a4b00}

.padwrap{border:1px solid var(--line2);border-radius:8px;background:#fff;position:relative;touch-action:none}
.padwrap::after{content:"";position:absolute;left:24px;right:24px;bottom:46px;border-bottom:1px dashed #cfcac0;pointer-events:none}
.padwrap canvas{display:block;width:100%;height:220px;cursor:crosshair}
.pens{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pen{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2);cursor:pointer;padding:0}
.pen.on{box-shadow:0 0 0 2px var(--seal)}

/* crop */
.cropstage{background:#2b2a28;border-radius:9px;padding:18px;overflow:hidden;display:grid;place-items:center;min-height:240px;user-select:none}
.cropwrap{position:relative;line-height:0;background:repeating-conic-gradient(#555 0 25%,#666 0 50%) 0 0/16px 16px}
.cropwrap canvas{display:block}
.cropbox{position:absolute;outline:1.5px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.58);cursor:move}
.cropclip{position:absolute;inset:0}
.cropbox .h{position:absolute;width:14px;height:14px;background:#fff;border:2px solid var(--seal);border-radius:3px;margin:-7px 0 0 -7px}
.cropbox .h[data-d=n],.cropbox .h[data-d=s]{cursor:ns-resize}
.cropbox .h[data-d=e],.cropbox .h[data-d=w]{cursor:ew-resize}
.cropbox .h[data-d=nw],.cropbox .h[data-d=se]{cursor:nwse-resize}
.cropbox .h[data-d=ne],.cropbox .h[data-d=sw]{cursor:nesw-resize}
.cropbox .g{position:absolute;border:0 solid rgba(255,255,255,.35);pointer-events:none}
.cropctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.cropctl .field{margin:0}
.cropctl input{width:100%}
.cropinfo{font-size:12px;color:var(--ink2);margin-top:8px;font-variant-numeric:tabular-nums}

/* toast & busy */
.toasts{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#22262b;color:#fff;padding:8px 16px;border-radius:20px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:tin .2s ease-out}
.toast.err{background:var(--seal-ink)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.busy{position:fixed;inset:0;z-index:85;display:none;place-items:center;background:rgba(255,255,255,.25);cursor:progress}
.busy.show{display:grid}
.busy div{background:#fff;padding:12px 20px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border:2px solid #eee;border-top-color:var(--seal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
input[type=file]{display:none}
</style>
</head>

function fmtSize(n){ return n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : (n/1048576).toFixed(2) + ' MB'; }
const isTyping = e => { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); };

let modalResolve = null;
function openModal({title, body, buttons, width, onOpen}){
  const m = $('#modal'); m.style.width = width ? width + 'px' : '';
  m.innerHTML = `<div class="mh">${esc(title)}</div><div class="mb"></div><div class="mf"></div>`;
  const mb = m.querySelector('.mb');
  if (typeof body === 'string') mb.innerHTML = body; else if (body) mb.appendChild(body);
  const mf = m.querySelector('.mf');
  return new Promise(res => {
    modalResolve = res;
    (buttons || [{label:'確定', value:true, primary:true}]).forEach(b => {
      if (b.spacer) { const s = document.createElement('span'); s.className = 'sp'; mf.appendChild(s); return; }
      const el = document.createElement('button'); el.className = 'btn' + (b.primary ? ' pri' : ''); el.textContent = b.label;
      if (b.id) el.id = b.id;
      el.onclick = async () => {
        if (b.handler) { const r = await b.handler(el); if (r === undefined) return; closeModal(r); }
        else closeModal(b.value);
      };
      mf.appendChild(el);
    });
    $('#mask').classList.add('show');
    onOpen && onOpen(mb, mf);
  });
}
function closeModal(v){ $('#mask').classList.remove('show'); const r = modalResolve; modalResolve = null; r && r(v); }
$('#mask').addEventListener('pointerdown', e => { if (e.target.id === 'mask' && !S.exporting) closeModal(undefined); });
function confirmDlg(title, msg, okLabel = '確定'){ return openModal({title, body:`<div style="max-width:380px">${esc(msg)}</div>`, buttons:[{label:'取消', value:false},{label:okLabel, value:true, primary:true}]}).then(v => !!v); }

/* ---------------- downloads ---------------- */
let dlPromise = null;
function getDownloads(){
  if (!dlPromise && DESK) dlPromise = Promise.resolve({save: async ({filename, data}) => {
    const u8 = new Uint8Array(await (data instanceof Blob ? data : new Blob([data])).arrayBuffer());
    const where = await DESK.saveAs(filename, u8);
    if (!where) throw {code:'declined'};
    return {status:'saved', path:where};
  }});
  if (!dlPromise) dlPromise = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  return dlPromise;
}
setTimeout(getDownloads, 0);
async function saveFile(filename, data){
  const blob = data instanceof Blob ? data : new Blob([data]);
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({filename, data:blob}); toast((DESK ? '已儲存 ' : '已下載 ') + filename); return true; }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') toast('已取消下載');
      else if (c === 'rejected_extension' || c === 'extension_not_enabled') toast('這種檔案類型無法在預覽環境中下載', 'err');
      else if (c === 'rate_limited') toast('已有下載確認視窗開啟中，請稍候', 'err');
      else toast('下載失敗：' + (e && (e.message || c) || e), 'err');
      return false;
    }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000); return true;
}

/* ====================================================================
   Loading
   ==================================================================== */
/* ---------------- documents & tabs ----------------
   Each open PDF is a document with its own pages, view, undo history and file handle.
   The active document's fields live on S; switching tabs stashes them and restores another set. */
const DOC_KEYS = ['bytes', 'name', 'pdf', 'pages', 'scale', 'zoomMode', 'view', 'cover', 'current', 'undo', 'redo',
  'dirty', 'signed', 'version', 'imgCache', 'annCache', 'handle', 'thumbSel', 'guides'];
const docs = [];
let active = -1, docSeq = 0, VSEQ = 0;
S.thumbSel = new Set();
const activeDoc = () => docs[active] || null;
function blankDoc(){
  return {id:++docSeq, bytes:null, name:'', pdf:null, pages:[], scale:PX, zoomMode:'fit-width', view:S.view || 'continuous',
    cover:S.cover, current:0, undo:[], redo:[], dirty:false, signed:false, version:0, imgCache:new Map(), annCache:new Map(),
    handle:null, thumbSel:new Set(), guides:{h:[], v:[]}, scrollTop:0, scrollLeft:0};
}
function stashActive(){
  const d = activeDoc(); if (!d) return;
  DOC_KEYS.forEach(k => d[k] = S[k]);
  d.scrollTop = viewer.scrollTop; d.scrollLeft = viewer.scrollLeft;
  S.st.forEach(st => st && st.task && st.task.cancel());
}
const applyDoc = d => DOC_KEYS.forEach(k => S[k] = d[k]);
const anyDirty = () => S.dirty || docs.some((d, i) => i !== active && d.dirty);
function docField(d, k){ return d === activeDoc() ? S[k] : d[k]; }

function switchTab(i){
  if (i === active || !docs[i]) return;
  if (PEN.strokes.length || PEN.busy || NP) { (async () => { await closeNote(true); await flushPen(); switchTab(i); })(); return; }
  stashActive(); hideCtx(); hideTip(); pop.style.display = 'none';
  active = i; applyDoc(docs[i]);
  mountDoc({scroll:'restore', scrollTop:docs[i].scrollTop, scrollLeft:docs[i].scrollLeft});
}
async function openInNewTab(bytes, name, handle){
  const prev = active;
  stashActive();
  const d = blankDoc(); d.name = name; d.handle = handle;
  docs.push(d); active = docs.length - 1; applyDoc(d);
  try { await loadDoc(bytes, {name}); }
  catch (e) {
    docs.splice(active, 1);
    if (docs.length) { active = clamp(prev, 0, docs.length - 1); applyDoc(docs[active]); mountDoc({scroll:'restore', scrollTop:docs[active].scrollTop, scrollLeft:docs[active].scrollLeft}); }
    else { active = -1; showWelcome(); }
    throw e;
  }
}
async function closeTab(i){
  const d = docs[i]; if (!d) return;
  if (docField(d, 'dirty') && !(await confirmDlg('關閉分頁', `「${docField(d, 'name')}」有尚未儲存的修改，關閉後這些修改會遺失。`, '不儲存並關閉'))) return;
  const pdf = docField(d, 'pdf');
  if (i === active) {
    S.st.forEach(st => st && st.task && st.task.cancel());
    docs.splice(i, 1);
    if (docs.length) { active = Math.min(i, docs.length - 1); applyDoc(docs[active]); mountDoc({scroll:'restore', scrollTop:docs[active].scrollTop, scrollLeft:docs[active].scrollLeft}); }
    else { active = -1; showWelcome(); }
  } else {
    docs.splice(i, 1); if (i < active) active--;
    renderTabs();
  }
  if (pdf) setTimeout(() => pdf.destroy(), 300);
}
function showWelcome(){
  applyDoc(blankDoc());
  pagesEl.innerHTML = ''; S.els = []; S.st = []; S.pos = []; S.rows = [];
  $('#welcome').style.display = '';
  $$('[data-need]').forEach(b => b.disabled = true);
  $('#p-thumbs').innerHTML = ''; ['images', 'anns', 'atts'].forEach(t => { const pn = $('#p-' + t); pn.innerHTML = ''; delete pn.dataset.ver; });
  setTool('select'); $('#hint').classList.remove('show');
  updateUI();
}
function renderTabs(){
  const bar = $('#tabbar');
  bar.classList.toggle('hide', !docs.length);
  bar.innerHTML = '';
  docs.forEach((d, i) => {
    const t = document.createElement('div'); t.className = 'dtab' + (i === active ? ' on' : '');
    const nm = docField(d, 'name'), dirty = docField(d, 'dirty'), h = docField(d, 'handle');
    t.title = (h && h.path) || nm;
    t.innerHTML = `<span class="nm">${esc(nm)}</span>${dirty ? '<span class="dd" title="有未儲存的修改"></span>' : ''}<button class="x" title="關閉 (Ctrl+W)">×</button>`;
    t.addEventListener('pointerdown', e => { if (e.button === 1) e.preventDefault(); });
    t.addEventListener('auxclick', e => { if (e.button === 1) closeTab(i); });
    t.addEventListener('click', e => { if (e.target.closest('.x')) closeTab(i); else switchTab(i); });
    bar.appendChild(t);
  });
  const add = document.createElement('button'); add.className = 'dtab-add'; add.textContent = '+'; add.title = '開啟其他 PDF (Ctrl+O)';
  add.onclick = () => actions.open(); bar.appendChild(add);
  const on = bar.querySelector('.dtab.on'); if (on) on.scrollIntoView({block:'nearest', inline:'nearest'});
}

async function loadDoc(bytes, {name, keepView = false, scrollToCurrent = false} = {}){
  let anchorOffset = 0;
  if (keepView && S.pos[S.current]) anchorOffset = viewer.scrollTop - S.pos[S.current].y;
  S.st.forEach(st => st && st.task && st.task.cancel());
  const old = S.pdf;
  const pdf = await pdfjsLib.getDocument({...PDF_OPTS, data:bytes.slice()}).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const p = await pdf.getPage(i); const vp = p.getViewport({scale:1});
    pages.push({page:p, vp1:vp, w:vp.width, h:vp.height, rot:((p.rotate % 360) + 360) % 360});
  }
  S.pdf = pdf; S.pages = pages; S.bytes = bytes; S.version = ++VSEQ;
  if (name) S.name = name;
  S.imgCache.clear(); S.annCache.clear();
  if (!keepView) { S.current = 0; S.zoomMode = 'fit-width'; }
  S.current = clamp(S.current, 0, pages.length - 1);
  const keepSel = keepView ? [...(S.thumbSel || [])].filter(i => i < pages.length) : [];
  S.thumbSel = new Set(keepSel.length ? keepSel : [S.current]);
  mountDoc(keepView && !scrollToCurrent ? {scroll:'anchor', anchorOffset} : {scroll:'current'});
  if (old && old !== pdf) setTimeout(() => old.destroy(), 500);
}
function mountDoc({scroll = 'current', anchorOffset = 0, scrollTop = 0, scrollLeft = 0} = {}){
  pagesEl.innerHTML = '';
  S.els = S.pages.map((p, i) => {
    const d = document.createElement('div'); d.className = 'page'; d.dataset.i = i;
    d.innerHTML = `<div class="ld">${i + 1}</div><div class="grd"></div><div class="ovl"></div><div class="gdl"></div>`;
    return d;
  });
  S.st = S.pages.map(() => ({rendered:0, ver:-1, task:null, ovlVer:-1}));
  XS = null; AS = null; clearSnapMarks(); if (NP) closeNoteDom(); POLY = null;
  $('#welcome').style.display = 'none';
  $$('[data-need]').forEach(b => b.disabled = false);
  if (S.zoomMode !== 'custom') S.scale = fitScale(S.zoomMode);
  layout();
  if (scroll === 'anchor') viewer.scrollTop = S.pos[S.current] ? S.pos[S.current].y + anchorOffset : 0;
  else if (scroll === 'restore') { viewer.scrollTop = scrollTop; viewer.scrollLeft = scrollLeft; updateCurrentFromScroll(); }
  else scrollToPage(S.current);
  updateUI(); scheduleRender(0);
  buildThumbs(); refreshPanels(); applyViewAids();
}

async function openFile(file, handle = null){
  if (!file) return;
  // the same file is already open: just switch to its tab
  const same = handle && handle.path && docs.findIndex(d => { const h = docField(d, 'handle'); return h && h.path === handle.path; });
  if (same >= 0) { switchTab(same); toast('「' + file.name + '」已經開啟'); return; }
  busy(true, '開啟中…');
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    await openInNewTab(bytes, file.name, handle);
    toast('已開啟 ' + file.name + (handle ? '（修改會直接存回原檔）' : ''));
  } catch (e) {
    console.error(e);
    toast(e && e.name === 'PasswordException' ? '此 PDF 受密碼保護，目前版本尚不支援' : '無法開啟此檔案：' + (e.message || e), 'err');
  } finally { busy(false); }
}

/* ====================================================================
   Layout
   ==================================================================== */
const isCont = () => S.view === 'continuous' || S.view === 'two-continuous';
const isTwo = () => S.view === 'two' || S.view === 'two-continuous';
function rowsFor(){
  const n = S.pages.length, rows = [];
  if (!isTwo()) { for (let i = 0; i < n; i++) rows.push([i]); return rows; }
  let i = 0;
  if (S.cover && n) { rows.push([0]); i = 1; }
  for (; i < n; i += 2) rows.push(i + 1 < n ? [i, i + 1] : [i]);
  return rows;
}
const rowOf = p => S.rows.findIndex(r => r.includes(p));

function layout(){
  S.rows = rowsFor();
  const sc = S.scale, n = S.pages.length;
  const shown = isCont() ? S.rows.map((_, i) => i) : [Math.max(0, rowOf(S.current))];
  let maxW = 0;
  shown.forEach(ri => S.rows[ri].forEach(p => maxW = Math.max(maxW, S.pages[p].w * sc)));
  const contentW = (isTwo() ? 2 * maxW + GAP : maxW) + 2 * MARGIN;
  const W = Math.max(contentW, viewer.clientWidth), cx = W / 2;
  const pos = new Array(n).fill(null);
  let y = MARGIN;
  for (const ri of shown) {
    const row = S.rows[ri];
    const rh = Math.max(...row.map(p => S.pages[p].h * sc));
    if (isTwo()) {
      if (row.length === 2) {
        const [L, R] = row;
        pos[L] = {x: cx - GAP / 2 - S.pages[L].w * sc, y: y + (rh - S.pages[L].h * sc) / 2};
        pos[R] = {x: cx + GAP / 2, y: y + (rh - S.pages[R].h * sc) / 2};
      } else {
        const p = row[0], w = S.pages[p].w * sc;
        pos[p] = {x: (S.cover && p === 0) ? cx + GAP / 2 : cx - GAP / 2 - w, y};
      }
    } else {
      const p = row[0]; pos[p] = {x: cx - S.pages[p].w * sc / 2, y};
    }
    y += rh + GAP;
  }
  const H = y - GAP + MARGIN;
  pagesEl.style.width = W + 'px'; pagesEl.style.height = H + 'px';
  S.pos = pos;
  S.els.forEach((el, i) => {
    const p = pos[i];
    if (!p) { if (el.parentNode) el.remove(); return; }
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    el.style.width = S.pages[i].w * sc + 'px'; el.style.height = S.pages[i].h * sc + 'px';
    if (!el.parentNode) pagesEl.appendChild(el);
  });
  if (typeof NP !== 'undefined' && NP) positionNote();
}

function fitScale(mode){
  if (mode === 'actual') return PX;
  if (!S.pages.length) return S.scale;
  const rows = rowsFor(); const row = rows[Math.max(0, rows.findIndex(r => r.includes(S.current)))] || [0];
  // fit-width fits the widest page that is laid out (all pages in continuous views), so mixed
  // portrait/landscape documents never need a horizontal scrollbar; fit-page also fits the current spread's height
  const shownPages = isCont() ? S.pages.map((_, i) => i) : row;
  const pw = (isTwo() ? 2 : 1) * Math.max(...shownPages.map(p => S.pages[p].w));
  const ph = Math.max(...row.map(p => S.pages[p].h));
  const aw = viewer.clientWidth - 2 * MARGIN - (isTwo() ? GAP : 0) - (mode === 'fit-width' ? 2 : 0);
  const ah = viewer.clientHeight - 2 * MARGIN;
  const sw = aw / pw;
  return clamp(mode === 'fit-width' ? sw : Math.min(sw, ah / ph), MIN_Z * PX, MAX_Z * PX);
}

/* zoom keeping the point under the cursor fixed */
function zoomTo(newScale, clientX, clientY, mode = 'custom'){
  if (!S.pdf) return;
  newScale = clamp(newScale, MIN_Z * PX, MAX_Z * PX);
  const r = viewer.getBoundingClientRect();
  const ax = (clientX ?? r.left + viewer.clientWidth / 2) - r.left;
  const ay = (clientY ?? r.top + viewer.clientHeight / 2) - r.top;
  const X = viewer.scrollLeft + ax, Y = viewer.scrollTop + ay;
  const old = S.scale;
  let best = -1, bd = Infinity;
  S.pos.forEach((p, i) => {
    if (!p) return;
    const w = S.pages[i].w * old, h = S.pages[i].h * old;
    const dx = Math.max(p.x - X, 0, X - (p.x + w)), dy = Math.max(p.y - Y, 0, Y - (p.y + h));
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  });
  let px = 0, py = 0;
  if (best >= 0) { px = (X - S.pos[best].x) / old; py = (Y - S.pos[best].y) / old; }
  S.scale = newScale; S.zoomMode = mode;
  layout();
  if (best >= 0) {
    viewer.scrollLeft = S.pos[best].x + px * newScale - ax;
    viewer.scrollTop = S.pos[best].y + py * newScale - ay;
  }
  updateZoomUI(); scheduleRender(140); drawRulers();
}
function setZoomMode(mode){
  if (!S.pdf) return;
  const cur = S.current, off = S.pos[cur] ? (viewer.scrollTop - S.pos[cur].y) / S.scale : 0;
  S.zoomMode = mode; S.scale = fitScale(mode); layout();
  if (mode === 'fit-page') scrollToPage(cur);
  else if (S.pos[cur]) viewer.scrollTop = S.pos[cur].y + Math.max(0, off) * S.scale;
  updateZoomUI(); scheduleRender(0);
}
function setView(v){
  if (!S.pdf) return;
  const cur = S.current;
  S.view = v; if (S.zoomMode !== 'custom') S.scale = fitScale(S.zoomMode);
  layout(); scrollToPage(cur); updateUI(); scheduleRender(0);
}

function scrollToPage(i){
  if (!S.pdf) return;
  i = clamp(i, 0, S.pages.length - 1);
  if (!isCont()) { S.current = i; layout(); viewer.scrollTop = 0; }
  else {
    S.current = i;
    const p = S.pos[i], row = S.rows[rowOf(i)] || [i];
    const top = Math.min(...row.map(k => S.pos[k] ? S.pos[k].y : Infinity));
    if (p) viewer.scrollTop = Math.max(0, top - MARGIN / 2);
    const w = S.pages[i].w * S.scale;
    if (p && pagesEl.offsetWidth > viewer.clientWidth) viewer.scrollLeft = Math.max(0, p.x + w / 2 - viewer.clientWidth / 2);
  }
  updatePager(); scheduleRender(0);
}
function goPage(delta){
  if (!S.pdf) return;
  if (isTwo()) {
    const ri = clamp(rowOf(S.current) + delta, 0, S.rows.length - 1);
    scrollToPage(S.rows[ri][0]);
  } else scrollToPage(S.current + delta);
}

function updateCurrentFromScroll(){
  if (!S.pdf || !isCont()) return;
  const mid = viewer.scrollTop + viewer.clientHeight * 0.35;
  let cur = S.current;
  for (let i = 0; i < S.pages.length; i++) {
    const p = S.pos[i]; if (!p) continue;
    if (p.y + S.pages[i].h * S.scale + GAP / 2 >= mid) { cur = i; break; }
  }
  if (viewer.scrollTop + viewer.clientHeight >= viewer.scrollHeight - 2) {
    // at the very bottom, make the last row current
    const last = S.rows[S.rows.length - 1]; if (last && S.pos[last[0]] && S.pos[last[0]].y < viewer.scrollTop + viewer.clientHeight) cur = Math.max(cur, last[0]);
  }
  if (cur !== S.current) { S.current = cur; updatePager(); }
}

/* ====================================================================
   Rendering
   ==================================================================== */
let renderTimer = 0;
function scheduleRender(delay){ clearTimeout(renderTimer); renderTimer = setTimeout(renderVisible, delay); }
function pagesInView(buffer){
  const top = viewer.scrollTop - buffer, bot = viewer.scrollTop + viewer.clientHeight + buffer, out = [];
  S.pos.forEach((p, i) => { if (p && p.y < bot && p.y + S.pages[i].h * S.scale > top) out.push(i); });
  return out;
}
function renderVisible(){
  if (!S.pdf) return;
  const near = pagesInView(viewer.clientHeight * 0.6);
  near.sort((a, b) => Math.abs(a - S.current) - Math.abs(b - S.current)).forEach(renderPage);
  const keep = new Set(pagesInView(viewer.clientHeight * 3));
  S.els.forEach((el, i) => {
    if (keep.has(i)) return;
    const c = el.querySelector('canvas.pc');
    if (c) { c.width = c.height = 0; c.remove(); S.st[i].rendered = 0; }
    if (S.st[i].task) { S.st[i].task.cancel(); S.st[i].task = null; }
  });
}
async function renderPage(i){
  const st = S.st[i], want = S.scale, ver = S.version;
  if (st.rendered === want && st.ver === ver) { ensureOverlay(i); return; }
  if (st.task && st.taskScale === want) return;
  if (st.task) st.task.cancel();
  const pg = S.pages[i];
  const dpr = window.devicePixelRatio || 1;
  let rs = want * dpr;
  const maxPx = 16e6;
  if (pg.w * pg.h * rs * rs > maxPx) rs = Math.sqrt(maxPx / (pg.w * pg.h));
  const vp = pg.page.getViewport({scale:rs});
  const c = document.createElement('canvas'); c.className = 'pc';
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  const task = pg.page.render({canvasContext:c.getContext('2d'), viewport:vp, annotationMode:pdfjsLib.AnnotationMode.ENABLE});
  st.task = task; st.taskScale = want;
  try { await task.promise; }
  catch (e) { if (!e || e.name !== 'RenderingCancelledException') console.error(e); return; }
  finally { if (st.task === task) st.task = null; }
  if (ver !== S.version) return;
  const el = S.els[i], oldC = el.querySelector('canvas.pc');
  if (oldC) { oldC.replaceWith(c); oldC.width = oldC.height = 0; } else el.insertBefore(c, el.firstChild);
  const ld = el.querySelector('.ld'); if (ld) ld.remove();
  st.rendered = want; st.ver = ver;
  ensureOverlay(i);
}

/* overlays: annotation hit-areas + detected image boxes (positioned in %) */
async function ensureOverlay(i){
  const st = S.st[i]; if (st.ovlVer === S.version) return; st.ovlVer = S.version;
  const ver = S.version, el = S.els[i], ovl = el.querySelector('.ovl'), pg = S.pages[i];
  const [anns, imgs] = await Promise.all([getAnns(i), detectImages(i)]);
  if (ver !== S.version) return;
  ovl.querySelectorAll('.annhit,.imgbox').forEach(n => n.remove());
  const pct = (v, t) => (v / t * 100) + '%';
  anns.forEach(a => {
    const d = document.createElement('div'); d.className = 'annhit' + (a.noap ? ' noap' : '') + (a.sig ? ' sig' : '') + (a.subtype === 'Text' ? ' txt' : '');
    d.style.left = pct(a.x, pg.w); d.style.top = pct(a.y, pg.h); d.style.width = pct(a.w, pg.w); d.style.height = pct(a.h, pg.h);
    if (a.subtype === 'Text') {
      if (a.noap) d.innerHTML = NOTE_SVG;
      d.title = (a.author ? a.author + '：' : '') + (a.contents || '').slice(0, 80);
      d.addEventListener('pointerdown', ev => { if ((S.tool === 'select' || S.tool === 'note') && !S.spaceDown && ev.button === 0) { ev.stopPropagation(); if (S.tool === 'select') noteIconDown(ev, i, a); } });
      d.addEventListener('click', ev => { if (S.tool === 'note' && !S.spaceDown) { ev.stopPropagation(); if (NP && NP.note.id === a.id) return; closeNote(true); openNoteById(i, a.id); } });
      ovl.appendChild(d); return;
    }

async function getAnns(i){
  const key = S.version + ':' + i; if (S.annCache.has(key)) return S.annCache.get(key);
  const pg = S.pages[i];
  const p = pg.page.getAnnotations().then(list => {
   const popups = {}; list.forEach(a => { if (a.subtype === 'Popup' && a.rect) popups[a.id] = a.rect; });
   const vbox = r => { const v = pg.vp1.convertToViewportRectangle(r); return {x:Math.min(v[0], v[2]), y:Math.min(v[1], v[3]), w:Math.abs(v[2] - v[0]), h:Math.abs(v[3] - v[1])}; };

   return list.map(a => {
    const isSig = a.subtype === 'Widget' && a.fieldType === 'Sig';

    const r = pg.vp1.convertToViewportRectangle(a.rect);

    const contents = (a.contentsObj && a.contentsObj.str) || a.contents || '';
    const author = (a.titleObj && a.titleObj.str) || a.title || '';
    const o = {id:a.id, subtype:a.subtype, x, y, w:Math.abs(r[2] - r[0]), h:Math.abs(r[3] - r[1]),
      contents, author, sig:isSig, noap:a.subtype === 'Text' && !a.hasAppearance, mdate:a.modificationDate || a.creationDate || null,
      popupBox:a.popupRef && popups[a.popupRef] ? vbox(popups[a.popupRef]) : null,
      label: isSig ? '數位簽章欄位' : (ANN_LABEL[a.subtype] + (author ? ' · ' + author : ''))};

}

/* ---------------- image detection ---------------- */
const imgResolved = new Map();
async function detectImages(i){
  const key = S.version + ':' + i; if (S.imgCache.has(key)) return S.imgCache.get(key);
  const p = (async () => {
    const pg = S.pages[i];
    const ops = await pg.page.getOperatorList({annotationMode:pdfjsLib.AnnotationMode.DISABLE});
    const O = pdfjsLib.OPS, U = pdfjsLib.Util, vt = pg.vp1.transform;
    let ctm = [1, 0, 0, 1, 0, 0]; const stack = [], out = [];
    const add = (nw, nh) => {
      const pts = [[0, 0], [1, 0], [0, 1], [1, 1]].map(q => U.applyTransform(U.applyTransform(q, ctm), vt));
      const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
      let x0 = Math.max(0, Math.min(...xs)), y0 = Math.max(0, Math.min(...ys));
      let x1 = Math.min(pg.w, Math.max(...xs)), y1 = Math.min(pg.h, Math.max(...ys));
      if (x1 - x0 < 4 || y1 - y0 < 4) return;
      const b = {x:x0, y:y0, w:x1 - x0, h:y1 - y0, nw:nw | 0, nh:nh | 0};
      if (!out.some(o => Math.abs(o.x - b.x) < 1 && Math.abs(o.y - b.y) < 1 && Math.abs(o.w - b.w) < 1 && Math.abs(o.h - b.h) < 1)) out.push(b);
    };
    for (let k = 0; k < ops.fnArray.length; k++) {
      const fn = ops.fnArray[k], a = ops.argsArray[k];
      switch (fn) {
        case O.save: stack.push(ctm.slice()); break;
        case O.restore: if (stack.length) ctm = stack.pop(); break;
        case O.transform: ctm = U.transform(ctm, a); break;
        case O.paintFormXObjectBegin: stack.push(ctm.slice()); if (a && Array.isArray(a[0]) && a[0].length === 6) ctm = U.transform(ctm, a[0]); break;
        case O.paintFormXObjectEnd: if (stack.length) ctm = stack.pop(); break;
        case O.paintImageXObject: add(a[1], a[2]); break;
        case O.paintInlineImageXObject: add(a[0] && a[0].width, a[0] && a[0].height); break;
        case O.paintImageMaskXObject: add(a[0] && a[0].width, a[0] && a[0].height); break;
      }
    }
    return out;
  })().then(out => { imgResolved.set(key, out); return out; }).catch(e => { console.warn(e); return []; });
  S.imgCache.set(key, p); return p;
}

/* render a region (visual pt coords) of a page to a canvas */
async function renderRegion(i, box, pxPerPt){
  const pg = S.pages[i];
  const s = pxPerPt;
  const vp = pg.page.getViewport({scale:s});
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(box.w * s)); c.height = Math.max(1, Math.round(box.h * s));
  await pg.page.render({canvasContext:c.getContext('2d'), viewport:vp, transform:[1, 0, 0, 1, -box.x * s, -box.y * s], annotationMode:pdfjsLib.AnnotationMode.DISABLE}).promise;
  return c;
}
function nativeScale(box){
  let s = box.nw ? Math.max(box.nw / box.w, box.nh / box.h) : 3;
  s = clamp(s, 2, 8);
  return Math.min(s, 5000 / Math.max(box.w, box.h));
}

/* ====================================================================

   ==================================================================== */
let flipLock = 0, flipAcc = 0;
viewer.addEventListener('wheel', e => {
  if (!S.pdf) return;
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    let d = e.deltaY; if (e.deltaMode === 1) d *= 33; else if (e.deltaMode === 2) d *= 400;
    d = clamp(d, -160, 160);
    zoomTo(S.scale * Math.exp(-d * 0.0022), e.clientX, e.clientY);
    return;
  }
  if (!isCont()) {
    // single / two-page: wheel past the edge flips to the next spread
    const atBottom = viewer.scrollTop + viewer.clientHeight >= viewer.scrollHeight - 1;
    const atTop = viewer.scrollTop <= 0;
    const now = performance.now();
    if ((e.deltaY > 0 && atBottom) || (e.deltaY < 0 && atTop)) {
      e.preventDefault();
      if (now < flipLock) return;
      flipAcc += e.deltaY;
      if (Math.abs(flipAcc) >= 60) {
        const dir = flipAcc > 0 ? 1 : -1; flipAcc = 0;
        const ri = rowOf(S.current) + dir;
        if (ri >= 0 && ri < S.rows.length) {
          S.current = S.rows[ri][0]; layout();
          viewer.scrollTop = dir > 0 ? 0 : viewer.scrollHeight;
          updatePager(); scheduleRender(0);
          flipLock = now + 350;
        }
      }
    } else flipAcc = 0;
  }
}, {passive:false});

viewer.addEventListener('scroll', () => { updateCurrentFromScroll(); scheduleRender(60); hideTip(); });

  if (!S.pdf) return;

  else layout();
  scheduleRender(80);
}).observe(viewer);

  const ghost = document.createElement('div'); ghost.className = 'guide-ghost ' + dir; document.body.appendChild(ghost);
  const lab = document.createElement('div'); lab.className = 'guide-lab'; document.body.appendChild(lab);
  let val = null, page = -1;
  const move = ev => {
    page = pageAt(ev.clientX, ev.clientY);
    const vr = viewer.getBoundingClientRect();
    if (dir === 'h') { ghost.style.top = ev.clientY + 'px'; ghost.style.left = vr.left + 'px'; ghost.style.width = vr.width + 'px'; }
    else { ghost.style.left = ev.clientX + 'px'; ghost.style.top = vr.top + 'px'; ghost.style.height = vr.height + 'px'; }

function paintRulers(){
  if (!VIEW.rulers) return;
  const H = $('#rulerH'), V = $('#rulerV'), dpr = window.devicePixelRatio || 1, T = 20;
  const vr = viewer.getBoundingClientRect();
  const w = vr.width, h = vr.height;
  [[H, w, T], [V, T, h]].forEach(([c, cw, ch]) => { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); c.style.width = cw + 'px'; c.style.height = ch + 'px'; });
  const i = rulerPage >= 0 && S.pos[rulerPage] ? rulerPage : S.current;
  const p = S.pos[i];
  const draw = (c, horiz) => {
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const len = horiz ? w : h;
    g.fillStyle = '#f3f1ec'; g.fillRect(0, 0, horiz ? w : T, horiz ? T : h);
    g.strokeStyle = '#d4d0c6'; g.beginPath();
    if (horiz) { g.moveTo(0, T - .5); g.lineTo(w, T - .5); } else { g.moveTo(T - .5, 0); g.lineTo(T - .5, h); } g.stroke();
    if (!p) return;
    const pg = S.pages[i];
    const origin = horiz ? p.x - viewer.scrollLeft : p.y - viewer.scrollTop;   // px in ruler space
    const extent = (horiz ? pg.w : pg.h) * S.scale;
    // page extent band
    g.fillStyle = '#fff'; if (horiz) g.fillRect(origin, 0, extent, T - 1); else g.fillRect(0, origin, T - 1, extent);

      const tl = isMajor ? 9 : 4;

  const gdl = el.querySelector('.gdl');
  xs.filter(v => v != null).forEach(x => { const d = document.createElement('div'); d.className = 'snapline v'; d.style.left = x / pg.w * 100 + '%'; gdl.appendChild(d); snapMarks.push(d); });
  ys.filter(v => v != null).forEach(y => { const d = document.createElement('div'); d.className = 'snapline h'; d.style.top = y / pg.h * 100 + '%'; gdl.appendChild(d); snapMarks.push(d); });

/* auto-scroll near the viewer edges and, after a short hold, a slow zoom-in around the pointer */
function dragAssist(getPtr, onFrame, {zoom = false, boxPx = null} = {}){

  const tick = () => {
    if (!alive) return;
    const p = getPtr();
    if (p) {
      const r = viewer.getBoundingClientRect(), edge = 40;
      let dx = 0, dy = 0;
      if (p.x < r.left + edge) dx = p.x - (r.left + edge); else if (p.x > r.left + viewer.clientWidth - edge) dx = p.x - (r.left + viewer.clientWidth - edge);
      if (p.y < r.top + edge) dy = p.y - (r.top + edge); else if (p.y > r.top + viewer.clientHeight - edge) dy = p.y - (r.top + viewer.clientHeight - edge);

/* ---------------- image extraction: draw → adjust with handles → confirm ---------------- */
let XS = null;   // {i, box, meta:{view0, ppt, k}, el, bar}

  if (NP) await closeNote(true);
  if (S.signed && !(await confirmDlg('此文件已數位簽署', '繼續修改會使現有的數位簽章失效。確定要繼續？', '繼續修改'))) return false;
  busy(true, '處理中…');

    const res = await fn(doc);
    if (res === false) return false;
    const out = await doc.save();

    S.redo = []; S.signed = false; S.dirty = true;

    else if (label) toast(label);

}

  const drawMacros = () => {

  body.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {

  const padLen = () => st.pad === 'auto' ? String(n).length : +st.pad;
  const seqPadLen = () => st.pad === 'auto' ? String(st.seqStart + Math.max(1, st.sel.size) - 1).length : +st.pad;
  function composeTpl(){
    const parts = st.macOrder.filter(m => st.macOn[m]).map(m => m === 'page' ? PAGE_STYLES[st.pageStyle][0] : MACROS[m].tok);
    return parts.join(SEPS[st.sep]);
  }
  const activeTpl = () => st.nameMode === 'macro' ? composeTpl() : st.tpl;
  const ctx = (i, k) => ({page:i + 1, seq:st.seqStart + k - 1, total:n, pad:padLen(), seqPad:seqPadLen(), dateFmt:st.dateFmt});
  const nameFor = (i, k) => st.custom.has(i) ? st.custom.get(i) : cleanFileName(fillTemplate(activeTpl(), ctx(i, k)));
  const subName = () => cleanFileName(fillTemplate(st.subTpl || '', {page:1, seq:1, total:n, pad:0, dateFmt:st.dateFmt}));
  let okBtn = null;
  const renderNames = () => {
    const list = $b('#exNames'), ext = IMG_FORMATS[st.fmt].ext, ps = pages();
    const focused = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.pi;

    list.innerHTML = '';
    const shown = ps.slice(0, 300);

      const r = document.createElement('div'); r.className = 'ex-row' + (st.custom.has(i) ? ' custom' : '');
      r.innerHTML = `<span class="pg">第 ${i + 1} 頁</span><input type="text" data-pi="${i}" value="${esc(nameFor(i, k + 1))}"><span class="ext">.${ext}</span>`;

    });

  };
  $b('#exNames').addEventListener('input', e => {

  });
  $b('#exNames').addEventListener('focusout', () => setTimeout(() => refresh(), 0));
  function refresh(keepNames){
    cards.forEach((c, i) => c.classList.toggle('on', st.sel.has(i)));
    const ps = pages();
    $b('#exCnt').innerHTML = `已選 <b>${ps.length}</b> / ${n} 頁`;

    $b('#exTrF').style.opacity = f.alpha ? 1 : .4; $b('#exTr').disabled = !f.alpha;
    $b('#exDpiCF').style.display = dpiSel.value === 'custom' ? '' : 'none';
    if (ps.length) {
      const z = exportSize(ps[0], st.dpi);
      $b('#exPx').innerHTML = `輸出尺寸：第 ${ps[0] + 1} 頁 → <b>${z.w} × ${z.h}</b> px${z.capped ? '　<span style="color:var(--seal)">（超過上限，已自動縮小）</span>' : ''}`;
    } else $b('#exPx').textContent = '';
    if (DESK) {
      const sub = st.useSub ? subName() : '';
      $b('#exSubT').disabled = !st.useSub;

      $b('#exDir').textContent = '\u200E' + shown + '\u200E'; $b('#exDir').title = shown;   // LRM keeps the path's own direction inside the rtl-truncated box

    $b('#exWarn').textContent = warn;

  await runImageExport({...st, sub:DESK && st.useSub ? subName() : ''}, res.ps, res.names);
}

async function runImageExport(st, ps, names){
  const f = IMG_FORMATS[st.fmt], alpha = f.alpha && st.transparent;
  let plan = null;
  if (DESK) {
    try { plan = await DESK.exportImages.plan(st.dir, st.sub, names, st.policy); }
    catch (e) { toast('無法寫入輸出資料夾：' + (e.message || e), 'err'); return; }
  }
  let cancel = false, done = 0, skipped = 0, failed = 0;
  const zip = [], written = [];
  S.exporting = true;
  openModal({title:'轉存圖片中', width:440,
    body:`<div id="xpTxt">準備中…</div><div class="updbar show" style="background:transparent;padding:10px 0 0"><span class="bar" style="background:#e6e2d9;width:100%;height:8px"><i id="xpBar" style="background:var(--seal)"></i></span></div>`,
    buttons:[{label:'取消', handler:() => { cancel = true; $('#xpTxt').textContent = '正在取消…'; }}]});
  const t0 = performance.now();
  for (let k = 0; k < ps.length && !cancel; k++) {
    const i = ps[k], target = plan ? plan.files[k] : {name:names[k]};
    $('#xpTxt').innerHTML = `正在轉存第 <b>${i + 1}</b> 頁（${k + 1} / ${ps.length}）<br><span style="color:var(--ink3);font-size:12px">${esc(target.name)}</span>`;
    $('#xpBar').style.width = (k / ps.length * 100) + '%';
    if (target.skip) { skipped++; continue; }
    let c = null;
    try {
      c = await renderForExport(i, st.dpi, {transparent:alpha, annots:st.annots});
      const bytes = await encodePage(c, st.fmt, {dpi:st.dpi, quality:st.quality, alpha});
      if (DESK) written.push(await DESK.exportImages.write(st.dir, st.sub, target.name, bytes));
      else zip.push({name:target.name, data:bytes});
      done++;
    } catch (e) { console.error(e); failed++; toast(`第 ${i + 1} 頁轉存失敗：${e.message || e}`, 'err'); }
    finally { if (c) { c.width = c.height = 0; } }
    await new Promise(r => setTimeout(r, 0));
  }
  $('#xpBar').style.width = '100%';
  S.exporting = false;
  closeModal(undefined);
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  if (!DESK) {
    if (zip.length === 1) await saveFile(zip[0].name, new Blob([zip[0].data]));
    else if (zip.length) await saveFile(S.name.replace(/\.pdf$/i, '') + '_圖片.zip', new Blob([makeZip(zip)], {type:'application/zip'}));
    return;
  }
  const parts = [`已轉存 <b>${done}</b> 張 ${f.label}`];
  if (skipped) parts.push(`略過 ${skipped} 張（同名檔案已存在）`);
  if (failed) parts.push(`<span style="color:var(--seal)">${failed} 張失敗</span>`);
  if (cancel) parts.push('（已取消）');
  const r = await openModal({title:cancel ? '轉存已取消' : '轉存完成', width:480,
    body:`<div>${parts.join('，')}，耗時 ${secs} 秒。</div><div class="note" style="margin-top:10px;word-break:break-all">輸出位置：${esc(plan.dir)}</div>`,
    buttons:[{label:'完成', value:false}, {label:'開啟資料夾', primary:true, value:true}]});
  if (r) DESK.exportImages.openFolder(plan.dir);
}

}

function visToPdf(i, b){
  const pg = S.pages[i], vp = pg.vp1;

  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
