<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>PDF 工作台</title>
<script>try{var t=localStorage.getItem('pdfeditor.theme')||'system',d=(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)),pc=localStorage.getItem('pdfeditor.pagecolor')||'original';document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.dataset.page=pc==='auto'?(d?'night':'original'):pc;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2328; --ink2:#57606a; --ink3:#8c959f;
  --paper:#fbfaf7; --line:#e3e0d8; --line2:#d4d0c6;
  --desk:#cfcbc2; --desk2:#c6c2b8;
  --seal:#c8371d; --seal-soft:#fbe9e4; --seal-ink:#9d2a14;
  --ok:#1f7a4d;
  --radius:7px;
  --surface:#fff; --surface2:#f6f4ef; --bar:#f3f1ec; --bar2:#e9e6df; --panel:#ebe8e1; --hover:#efece5; --hover2:#e6e2d9;
  --tabbar:#e4e0d8; --tab:#d9d5cc; --tab-h:#d2cdc3; --tint:#fffaf8; --tint-line:#f1d5cc; --danger-soft:#fde8e4;
  --shadow:rgba(0,0,0,.12); --ruler-bg:#f3f1ec; --ruler-band:#fff; --ruler-ink:#57606a; --ruler-tick:#8c959f;
  color-scheme:light;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--desk);font-size:13px;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- ribbon ---------- */
.ribbon{background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:stretch;gap:0;padding:4px 8px;overflow-x:auto;overflow-y:hidden;flex:none;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:9px;padding:0 14px 0 4px;margin-right:4px;border-right:1px solid var(--line);white-space:nowrap}
.logo{width:32px;height:32px;display:block;flex:none;-webkit-user-drag:none;user-select:none}
.brand b{font-size:15px;letter-spacing:.04em}
.grp{display:flex;flex-direction:column;padding:0 6px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.grp .btns{display:flex;gap:2px;flex:1}
.grp .cap{font-size:10.5px;color:var(--ink3);text-align:center;letter-spacing:.12em;padding-top:1px}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;padding:5px 6px 4px;border:0;background:transparent;border-radius:var(--radius);cursor:pointer;white-space:nowrap;font-size:12px;color:var(--ink)}
.rb:hover{background:var(--hover)}
.rb:active{background:var(--hover2)}
.rb.on{background:var(--seal-soft);color:var(--seal-ink)}
.rb.on svg{stroke:var(--seal)}
.rb:disabled{opacity:.35;cursor:default;background:transparent}
.rb.primary svg{stroke:var(--seal)}
@media (max-width:1600px){ .brand b{display:none} .brand{padding-right:8px} .rb{min-width:40px;padding:5px 2px 4px;font-size:11.5px} .grp{padding:0 3px} .rs{padding:0 5px 0 3px} }
@media (max-width:1340px){ .rb{min-width:36px;font-size:11px;letter-spacing:-.02em} .rb svg.i{width:18px;height:18px} .grp .cap{font-size:10px;letter-spacing:.04em} .brand{display:none} }

/* ---------- view bar ---------- */
.tabbar{display:flex;align-items:flex-end;gap:2px;background:var(--tabbar);border-bottom:1px solid var(--line2);padding:5px 8px 0;overflow-x:auto;overflow-y:hidden;flex:none;scrollbar-width:thin}
.tabbar.hide{display:none}
.dtab{display:flex;align-items:center;gap:7px;max-width:230px;min-width:120px;padding:6px 6px 7px 12px;border-radius:8px 8px 0 0;background:var(--tab);cursor:pointer;font-size:12.5px;color:var(--ink2);border:1px solid transparent;border-bottom:0;position:relative;top:1px;user-select:none}
.dtab:hover{background:var(--tab-h)}
.dtab.on{background:var(--bar);color:var(--ink);border-color:var(--line2);font-weight:500}
.dtab .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtab .dd{width:7px;height:7px;border-radius:50%;background:#e08a00;flex:none}
.dtab .x{width:20px;height:20px;border:0;border-radius:5px;background:transparent;cursor:pointer;color:var(--ink3);font-size:15px;line-height:1;flex:none;display:grid;place-items:center}
.dtab .x:hover{background:rgba(0,0,0,.08);color:var(--seal-ink)}
.dtab-add{border:0;background:transparent;font-size:18px;color:var(--ink2);cursor:pointer;width:30px;height:28px;border-radius:6px;margin-bottom:2px;flex:none}
.dtab-add:hover{background:rgba(0,0,0,.07)}
.rstack{display:flex;flex-direction:column;justify-content:center;gap:1px;padding-left:2px}
/* 只顯示圖示: labels hidden (the buttons' titles still name them) */
.ribbon.icons-only .rb{font-size:0;gap:0;min-width:34px;padding:6px 5px}
.ribbon.icons-only .rb svg.i{width:21px;height:21px}
.ribbon.icons-only .rb .sp-lab{display:none}
.ribbon.icons-only .rb.split{padding:0;min-width:0}
.ribbon.icons-only .rb.split .sp-main{min-width:30px;padding:6px 3px 6px 6px}
.ribbon.icons-only .rb.split .sp-arr{font-size:10px}
.ribbon.icons-only .rs{font-size:0;gap:0;padding:0 5px;height:19px}
.ribbon.icons-only .rs svg.i{width:16px;height:16px}
.ribbon.icons-only .brand b{display:none}
/* 設定 */
.set-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 14px}
.set-tabs button{border:0;background:none;padding:8px 14px;font-size:13.5px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.set-tabs button:hover{color:var(--ink);background:#fff3bf;border-radius:6px 6px 0 0}
.set-tabs button.on{color:var(--seal-ink);border-bottom-color:var(--seal);font-weight:600}
.set-pane{min-height:250px}
.set-h{font-weight:600;font-size:13px;margin:4px 0 8px}
.set-h small{font-weight:400;color:var(--ink3);margin-left:6px}
.set-h:not(:first-child){margin-top:16px}
.set-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.set-opt:hover{background:var(--hover)}
.set-opt small{color:var(--ink3);margin-left:4px}
.set-opt svg.i{width:17px;height:17px}
.set-btns{display:flex;align-items:center;gap:8px;margin-top:14px}
.set-btns .sp{flex:1}
.rs{display:flex;align-items:center;gap:5px;border:0;background:transparent;border-radius:5px;padding:0 8px 0 5px;height:16px;font-size:11.5px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.rs svg.i{width:14px;height:14px}
.rs:hover{background:var(--hover)}
.rs:disabled{opacity:.35;cursor:default;background:transparent}
.ctx{position:fixed;z-index:70;min-width:220px;background:var(--surface);border-radius:9px;box-shadow:0 10px 34px rgba(0,0,0,.22);padding:5px;display:none;font-size:13px}
.ctx button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:6px 10px;border-radius:6px;cursor:pointer;text-align:left}
.ctx button:hover:not(:disabled){background:var(--seal-soft);color:var(--seal-ink)}
.ctx button:disabled{color:var(--ink3);cursor:default}
.ctx button kbd{margin-left:auto}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.ctx .hd{font-size:11px;color:var(--ink3);padding:4px 10px 2px}
.viewbar{background:var(--bar);border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:6px;padding:5px 10px;flex:none;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin}
/* the bar never squashes its items; when narrow it sheds words step by step (fitViewbar), then scrolls sideways */
.viewbar>*{flex-shrink:0}
.viewbar .vt2{display:none}
.viewbar.c1 .lbl{display:none}
.viewbar.c2 [data-zoom] .vt{display:none}
.viewbar.c3 [data-view] .vt,.viewbar.c3 .chk .vt{display:none}
.viewbar.c3 .chk .vt2{display:inline}
.viewbar.c4 #bAids .vt,.viewbar.c4 [data-act="layers"] .vt{display:none}
.viewbar.c5{gap:3px;padding:5px 6px}
.viewbar.c5 .sep{margin:0 2px}
.vb{height:28px;min-width:28px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid transparent;background:transparent;border-radius:6px;cursor:pointer;font-size:12.5px}
.vb svg.i{width:17px;height:17px}
.vb:hover{background:var(--hover)}
.vb.on{background:var(--surface);border-color:var(--line2);color:var(--seal-ink);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.vb.on svg{stroke:var(--seal)}
.vb:disabled{opacity:.35;cursor:default;background:transparent}
.sep{width:1px;height:20px;background:var(--line2);margin:0 4px;flex:none}
.pager{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pager input{width:52px;height:28px;border:1px solid var(--line2);border-radius:6px;text-align:center;font:inherit;font-size:13px;background:var(--surface)}
.pager .tot{color:var(--ink2);min-width:46px}
.zoomsel{position:relative}
.zoomsel input{width:66px;height:28px;border:1px solid var(--line2);border-radius:6px;text-align:center;font:inherit;background:var(--surface);font-variant-numeric:tabular-nums}
.chk{display:inline-flex;align-items:center;gap:5px;color:var(--ink2);font-size:12px;cursor:pointer;padding:0 4px}
.lbl{color:var(--ink3);font-size:11.5px;letter-spacing:.1em;margin-right:2px}

/* ---------- hint bar ---------- */
.updbar{flex:none;display:none;align-items:center;gap:10px;padding:7px 14px;background:#1f3b2d;color:#fff;font-size:12.5px}
.updbar.show{display:flex}
.updbar .sp{flex:1}
.updbar .bar{width:160px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.updbar .bar i{display:block;height:100%;background:#7ee2a8;width:0}
.updbar button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:5px;padding:3px 10px;cursor:pointer;font-size:12px}
.updbar button.go{background:#2f9e62;border-color:#2f9e62}
.updwrap{position:relative;display:inline-flex}
.upddot{position:absolute;top:-2px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--seal);border:2px solid var(--paper);display:none}
.upddot.on{display:block}
#stVer{cursor:pointer;color:var(--ink3)}
#stVer:hover{color:var(--seal-ink)}
.hint{flex:none;display:none;align-items:center;gap:10px;padding:6px 14px;background:var(--seal);color:#fff;font-size:12.5px}
.hint.show{display:flex}
.hint .sp{flex:1}
.hint button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:5px;padding:3px 10px;cursor:pointer;font-size:12px}
.hint button:hover{background:rgba(255,255,255,.28)}
.swatch{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.6);cursor:pointer;padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.25)}

/* ---------- main ---------- */
.main{flex:1;display:flex;min-height:0}
.side{width:212px;flex:none;background:var(--panel);border-right:1px solid var(--line2);display:flex;flex-direction:column;min-height:0}
.side.hide{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line2);flex:none}
.tab{flex:1;border:0;background:transparent;padding:8px 0 7px;cursor:pointer;font-size:12.5px;color:var(--ink2);border-bottom:2px solid transparent}
.tab.on{color:var(--seal-ink);border-bottom-color:var(--seal);font-weight:500}
.panel{flex:1;overflow:auto;padding:10px;display:none}
.panel.on{display:block}
.thumb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:7px;cursor:pointer;margin-bottom:2px}
.thumb:hover{background:var(--hover2)}
.thumb.on .tn{text-decoration:underline;text-underline-offset:3px}
.thumb.sel{background:var(--surface);box-shadow:0 0 0 2px var(--seal) inset}
.thumb .tc{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);display:block}
.thumb .tn{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.thumb.sel .tn{color:var(--seal-ink);font-weight:500}
.empty-note{color:var(--ink3);font-size:12px;line-height:1.7;padding:8px 2px}
.sbtn{width:100%;border:1px dashed var(--ink3);background:transparent;border-radius:7px;padding:8px;cursor:pointer;color:var(--ink2);margin-bottom:10px}
.sbtn:hover{border-color:var(--seal);color:var(--seal-ink);background:var(--surface)}
/* page picker */
.pp-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pp-bar input[type=text]{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:5px 9px;width:180px}
.pp-bar .cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2)}
.pp-bar .cnt b{color:var(--seal-ink)}
.pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tw,130px),1fr));gap:12px;padding:12px;background:var(--panel);border-radius:9px;max-height:min(58vh,620px);overflow:auto;user-select:none}
.pp-card{position:relative;background:transparent;border-radius:8px;padding:8px 6px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid transparent}
.pp-card:hover{background:var(--hover2)}
.pp-card .th{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);display:grid;place-items:center;color:#c9c5bc;font-size:12px;width:100%}
.pp-card canvas{display:block;width:100%;height:100%}
.pp-card .num{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pp-card .ck{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1.5px solid var(--ink3);display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;z-index:2}
.pp-card.on{border-color:var(--seal);background:var(--surface)}
.pp-card:not(.on) .ck{color:transparent}
.pp-card.on .ck{background:var(--seal);border-color:var(--seal)}
.pp-card.on .num{color:var(--seal-ink);font-weight:500}
.pp-del .pp-card.on .th::after{content:"";position:absolute;inset:0;background:rgba(200,55,29,.28);background-image:linear-gradient(45deg,transparent 48.5%,rgba(200,55,29,.75) 48.5% 51.5%,transparent 51.5%),linear-gradient(-45deg,transparent 48.5%,rgba(200,55,29,.75) 48.5% 51.5%,transparent 51.5%)}
.pp-card.cur .num::after{content:" · 目前頁";color:var(--ink3);font-weight:400}
.pp-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.pp-foot select{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;background:var(--surface)}
.att{background:var(--surface);border-radius:7px;padding:8px 9px;margin-bottom:7px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.att .nm{font-weight:500;word-break:break-all;font-size:12.5px}
.att .meta{color:var(--ink3);font-size:11px;margin:2px 0 6px}
.att .row{display:flex;gap:6px}
.mini{border:1px solid var(--line2);background:var(--surface2);border-radius:5px;padding:2px 8px;font-size:11.5px;cursor:pointer}
.mini:hover{border-color:var(--seal);color:var(--seal-ink)}
.mini.danger:hover{background:var(--danger-soft)}
.imgitem{background:var(--surface);border-radius:7px;padding:6px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid transparent}
.imgitem:hover{border-color:var(--seal)}
.imgitem canvas{width:100%;display:block;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/12px 12px}
.imgitem .meta{font-size:11px;color:var(--ink2);margin-top:5px;display:flex;justify-content:space-between}
.annitem{background:var(--surface);border-radius:7px;padding:7px 9px;margin-bottom:7px;cursor:pointer;border-left:3px solid #f2b705;font-size:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.annitem:hover{background:var(--tint)}
.annitem .k{color:var(--ink3);font-size:11px;margin-bottom:2px}

.vwrap{flex:1;position:relative;min-width:0}
.viewer{position:absolute;inset:0;overflow:auto;background:var(--desk);outline:none;scrollbar-gutter:stable}
.ruler,.rcorner{position:absolute;display:none;z-index:6}
.vwrap.rulers .ruler,.vwrap.rulers .rcorner{display:block}
.vwrap.rulers .viewer{top:20px;left:20px}
.ruler.h{top:0;left:20px;right:0;height:20px;cursor:s-resize}
.ruler.v{left:0;top:20px;bottom:0;width:20px;cursor:e-resize}
.rcorner{top:0;left:0;width:20px;height:20px;background:var(--bar2);border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.page .grd{position:absolute;inset:0;pointer-events:none;display:none;
  background-image:linear-gradient(to right,rgba(0,120,200,.14) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,120,200,.14) 1px,transparent 1px),
    linear-gradient(to right,rgba(0,120,200,.32) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,120,200,.32) 1px,transparent 1px)}
.show-grid .page .grd{display:block}
.page .gdl{position:absolute;inset:0;pointer-events:none;z-index:2}
.guide{position:absolute;pointer-events:auto;z-index:3}
.guide.h{left:-14px;right:-14px;height:0;border-top:1px solid #00a3ff;cursor:row-resize}
.guide.v{top:-14px;bottom:-14px;width:0;border-left:1px solid #00a3ff;cursor:col-resize}
.guide.h::before{content:"";position:absolute;left:0;right:0;top:-5px;height:9px}
.guide.v::before{content:"";position:absolute;top:0;bottom:0;left:-5px;width:9px}
.guide:hover{border-color:#c8371d}
.guide-ghost{position:fixed;z-index:96;pointer-events:none}
.guide-ghost.h{height:0;border-top:1px dashed #00a3ff}
.guide-ghost.v{width:0;border-left:1px dashed #00a3ff}
.guide-ghost.del{border-color:#c8371d}
.guide-lab{position:fixed;z-index:97;pointer-events:none;background:#22262b;color:#fff;font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap}
.snapline{position:absolute;pointer-events:none}
.snapline.h{left:0;right:0;border-top:1px solid #e0279b}
.snapline.v{top:0;bottom:0;border-left:1px solid #e0279b}
.xsel{position:absolute;outline:2px solid var(--seal);background:rgba(200,55,29,.07);cursor:move;z-index:4;box-shadow:0 0 0 1px rgba(255,255,255,.8) inset}
.xsel .h{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--seal);border-radius:3px;margin:-6px 0 0 -6px}
.xsel .h[data-d=n],.xsel .h[data-d=s]{cursor:ns-resize}
.xsel .h[data-d=e],.xsel .h[data-d=w]{cursor:ew-resize}
.xsel .h[data-d=nw],.xsel .h[data-d=se]{cursor:nwse-resize}
.xsel .h[data-d=ne],.xsel .h[data-d=sw]{cursor:nesw-resize}
.xbar{position:absolute;z-index:5;display:flex;gap:6px;align-items:center;background:#22262b;color:#fff;padding:5px 6px 5px 10px;border-radius:8px;font-size:12px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.xbar .dim{color:#cfd3d8;margin-right:4px;font-variant-numeric:tabular-nums}
.xbar button{border:0;border-radius:5px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px;background:rgba(255,255,255,.14);color:#fff}
.xbar button[data-x=ok]{background:var(--seal)}
.aidmenu{min-width:250px}
.aidmenu button .ck{width:14px;color:var(--seal);font-weight:700;display:inline-block}
.aidmenu .aid-row{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;font-size:12.5px}
.aidmenu .aid-row select{font:inherit;font-size:12px;border:1px solid var(--line2);border-radius:5px;padding:2px 5px}
.aidmenu .aid-tip{font-size:11px;color:var(--ink3);padding:6px 10px 4px;line-height:1.55;max-width:260px}
.viewer.pan-ready,.viewer.pan-ready *{cursor:grab!important}
.viewer.panning,.viewer.panning *{cursor:grabbing!important;user-select:none}
.pages{position:relative;margin:0}
.page{position:absolute;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.12)}
.page.newpage{outline:3px solid var(--seal);outline-offset:4px;animation:np 2.6s ease-out forwards}
.page.newpage::after{content:attr(data-badge);position:absolute;left:10px;top:10px;background:var(--seal);color:#fff;font-size:12px;padding:4px 11px;border-radius:5px;white-space:nowrap;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.2);animation:npb 2.6s ease-out forwards}
@keyframes npb{0%,75%{opacity:1}100%{opacity:0}}
@keyframes np{0%,70%{outline-color:var(--seal)}100%{outline-color:transparent}}
.thumb.newpage .tc{outline:3px solid var(--seal);outline-offset:2px}
.ex-grid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(380px,1.15fr);gap:20px}
.ex-h{font-weight:700;font-size:13px;margin-bottom:8px;color:var(--ink)}
.ex-pages{max-height:min(62vh,640px);--tw:104px}
.ex-fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ex-fmt{border:1.5px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ex-fmt b{font-size:13px}
.ex-fmt small{font-size:11px;color:var(--ink3);line-height:1.35}
.ex-fmt:hover{border-color:var(--ink3)}
.ex-fmt.on{border-color:var(--seal);background:var(--tint)}
.ex-fmt.on b{color:var(--seal-ink)}
.ex-dir{display:flex;gap:8px;align-items:center;background:var(--surface2);border-radius:7px;padding:7px 9px}
.ex-dir span{flex:1;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.ex-in{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;font-size:13px;background:var(--surface);width:100%}
.ex-in:disabled{background:var(--bar);color:var(--ink3)}
.ex-tokens{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:6px}
.ex-tokens select{font:inherit;border:1px solid var(--line2);border-radius:6px;padding:2px 6px;font-size:12px}
.ex-names{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;padding:4px}
.ex-row{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:5px}
.ex-row .pg{font-size:12px;color:var(--ink3);width:56px;flex:none;font-variant-numeric:tabular-nums}
.ex-row input{flex:1;font:inherit;font-size:12.5px;border:1px solid transparent;border-radius:5px;padding:3px 6px;background:transparent;min-width:0}
.ex-row input:hover{border-color:var(--line2)}
.ex-row input:focus{border-color:var(--seal);background:var(--surface);outline:none}
.ex-row.custom input{background:var(--tint)}
.ex-row .ext{font-size:12px;color:var(--ink3)}
.ex-mode{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.mac-list{display:flex;gap:6px;flex-wrap:wrap}
.mac{display:flex;align-items:center;gap:4px;border:1.5px solid var(--line2);border-radius:8px;padding:5px 6px 5px 9px;background:var(--surface);font-size:13px}
.mac.on{border-color:var(--seal);background:var(--tint);color:var(--seal-ink)}
.mac label{display:flex;align-items:center;gap:5px;cursor:pointer}
.mac .mv{display:flex;gap:1px}
.mac .mv button{border:0;background:var(--hover);border-radius:4px;width:20px;height:20px;cursor:pointer;font-size:14px;line-height:1;color:var(--ink2)}
.mac .mv button:hover:not(:disabled){background:var(--seal-soft);color:var(--seal-ink)}
.mac .mv button:disabled{opacity:.3;cursor:default}
.ex-opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ex-opt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.ex-opt select,.ex-opt input{font:inherit;border:1px solid var(--line2);border-radius:6px;padding:3px 6px;font-size:12.5px;background:var(--surface)}
.kb{width:100%;border-collapse:separate;border-spacing:0 6px}
.kb th{font-size:11.5px;color:var(--ink3);font-weight:500;text-align:left;padding:0 6px}
.kb td{padding:0 4px}
.kb td.act{font-weight:500;white-space:nowrap;padding-right:12px}
.kcell{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1.5px solid var(--line2);border-radius:7px;padding:6px 6px 6px 10px;min-height:34px;cursor:pointer;background:var(--surface);font-size:12.5px}
.kcell:hover{border-color:var(--ink3)}
.kcell.empty span{color:var(--ink3)}
.kcell.rec{border-color:var(--seal);background:var(--tint);color:var(--seal-ink);animation:krec 1s ease-in-out infinite}
@keyframes krec{50%{box-shadow:0 0 0 3px rgba(200,55,29,.18)}}
.kx{border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:15px;line-height:1;border-radius:4px;width:20px;height:20px}
.kx:hover{background:var(--seal-soft);color:var(--seal-ink)}
.tool-note .annhit.txt{display:block}
.annhit.txt{cursor:pointer}
.annhit.noap{background:none!important;border:0!important;width:20px!important;height:20px!important}
.npend{position:absolute;pointer-events:none;z-index:5}
.npop{position:absolute;z-index:7;background:#ffef3a;border:1px solid #8a7f00;border-radius:3px;box-shadow:2px 3px 10px rgba(0,0,0,.28);display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:200px;min-height:110px;font-size:13px}
.nhd{display:flex;align-items:center;gap:7px;padding:4px 5px 4px 6px;cursor:move;user-select:none;color:#2b2a00}
.nhd .nic{width:20px;height:20px;flex:none}
.nhd .nau{font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nhd .ndt{flex:1;text-align:right;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nhd button{border:0;background:transparent;cursor:pointer;width:22px;height:22px;border-radius:50%;flex:none;font-size:13px;line-height:1;color:#4a4500}
.nhd .nx{background:#fff7a8;border:1px solid #8a7f00;font-size:15px;font-weight:700}
.nhd button:hover{background:#fff;color:#c8371d}
.nbd{flex:1;margin:0 5px 5px;background:#fff;border:1px dashed #8a7f00;display:flex}
.nbd textarea{flex:1;border:0;resize:none;outline:none;padding:6px 8px;font:inherit;font-size:13.5px;line-height:1.55;background:transparent;color:#1f2328}
.ncall{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:6}
.ncall polygon{fill:#ffef3a;stroke:#8a7f00;stroke-width:1;opacity:.92}
svg.dsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
.tool-pen .page,.tool-arrow .page,.tool-line .page,.tool-rect .page,.tool-ellipse .page,.tool-polyline .page,.tool-polygon .page,.tool-cloud .page,.tool-stamp .page{cursor:crosshair}
.tool-hlText .page,.tool-strike .page,.tool-underline .page{cursor:text}
.tool-eraser .page{cursor:cell}
.hint.styl{background:var(--tint);color:var(--ink);border-bottom:1px solid var(--tint-line);flex-wrap:nowrap;overflow-x:auto;padding:5px 12px;white-space:nowrap;scrollbar-width:thin}
.hint.styl button{color:var(--ink);border-color:var(--line2);background:var(--surface)}
.hint.styl button:hover{background:var(--surface);border-color:var(--seal)}
.hint.styl [data-h=done]{position:sticky;right:-12px;box-shadow:-10px 0 10px var(--tint);flex:none}
.sb-t{display:inline-flex;align-items:center;gap:5px;color:var(--seal-ink)}
.sb-t svg.i{width:17px;height:17px;stroke:var(--seal)}
.sb-tip{color:var(--ink2);font-size:12px}
.sb-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.sb-q{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--tint-line);color:var(--seal-ink);font-size:10px;margin-left:3px;cursor:help}
.sb-g{display:flex;gap:4px;flex-wrap:nowrap}
.sb-h{font-size:11.5px;color:var(--ink3)}
.pchip{display:inline-flex;align-items:center;gap:5px;font-size:12px!important;padding:3px 8px!important;border-radius:6px!important}
.pchip i{display:inline-block;width:16px;height:12px;border-radius:2px;box-sizing:border-box}
.pchip.on{border-color:var(--seal)!important;color:var(--seal-ink)!important}
.sb-sw{display:inline-flex;gap:3px;align-items:center}
.sb-sw .sw,.sb-sw .swn{width:18px!important;height:18px!important;padding:0!important;border-radius:50%!important;border:1.5px solid rgba(0,0,0,.18)!important}
.sb-sw .swn{font-size:11px;line-height:1;color:var(--ink3)!important}
.sb-sw .on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--seal)}
.sb-sw input[type=color]{width:22px;height:20px;border:0;padding:0;background:none;cursor:pointer}
.sb-l{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2)}
.sb-l select{font:inherit;font-size:12px;border:1px solid var(--line2);border-radius:5px;padding:2px 4px;background:var(--surface)}
.cpick{display:inline-flex!important;align-items:center;gap:3px;padding:2px 5px!important;border-radius:6px!important;font-size:10px!important;color:var(--ink3)!important}
.cpick i{width:18px;height:14px;border-radius:3px;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.2) inset}
.cpick.none i{background:linear-gradient(135deg,#fff 45%,#e03131 45% 55%,#fff 55%)}
.cpmenu{min-width:0;padding:8px}
.cp-grid{display:grid;grid-template-columns:repeat(8,22px);gap:5px}
.cp-sw{width:22px!important;height:22px;padding:0!important;border-radius:50%!important;border:1.5px solid rgba(0,0,0,.18)!important;cursor:pointer}
.cp-sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--seal)}
.cp-sw.none{background:var(--surface);color:var(--ink3);font-size:12px}
.cp-custom{display:flex!important;align-items:center;gap:6px;font-size:12px;color:var(--ink2);margin-top:8px}
.cp-custom input{width:40px;height:22px;border:0;padding:0;background:none}
.stamp-cur{display:inline-flex;align-items:center;min-height:26px}
.toolmenu button svg.i{width:17px;height:17px}
.toolmenu button.on{background:var(--seal-soft);color:var(--seal-ink)}
.toolmenu small{margin-left:auto;color:var(--ink3);font-size:10.5px;padding-left:10px}
.st-tabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.st-tabs button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent}
.st-tabs button.on{color:var(--seal-ink);border-bottom-color:var(--seal);font-weight:600}
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:56vh;overflow:auto;padding:2px}
.st-item{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;display:grid;place-items:center;min-height:74px}
.st-item canvas{max-width:100%;max-height:96px}
.st-item:hover{border-color:var(--ink3)}
.st-item.on{border-color:var(--seal);background:#fff7e0;box-shadow:0 0 0 2px #ffe08a inset}
.st-prev{background:var(--surface2);border-radius:8px;padding:18px;display:grid;place-items:center;min-height:120px}

.asel{position:absolute;z-index:4;outline:1.5px dashed #1c64d9;outline-offset:2px;cursor:move;box-shadow:0 0 0 4px rgba(28,100,217,.10)}
.asel.fixed{cursor:default}
.asel.noteMove{outline-color:#8a7f00}
.asel .h{position:absolute;width:11px;height:11px;background:#fff;border:2px solid #1c64d9;border-radius:2px;margin:-5.5px 0 0 -5.5px;z-index:2}
.asel .h[data-d=n],.asel .h[data-d=s]{cursor:ns-resize}
.asel .h[data-d=e],.asel .h[data-d=w]{cursor:ew-resize}
.asel .h[data-d=nw],.asel .h[data-d=se]{cursor:nwse-resize}
.asel .h[data-d=ne],.asel .h[data-d=sw]{cursor:nesw-resize}
.aghost{position:absolute;inset:0;width:100%;height:100%;opacity:.9;pointer-events:none}
.asel.geo-wait .h{visibility:hidden}
.aturn{position:absolute;pointer-events:none;z-index:4}
.aturn canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.aveil{position:absolute;background:rgba(255,255,255,.72);pointer-events:none;z-index:3;outline:1px dashed #adb5bd}
.abar .hintk{color:#9aa2ab;font-size:11px}
.abar button[data-x=del]{background:var(--seal)}
.rb.split{flex-direction:row;align-items:stretch;padding:0;gap:0}
.rb.split .sp-main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 2px 4px 6px;min-width:38px;border-radius:7px 0 0 7px}
.rb.split .sp-arr{display:flex;align-items:center;padding:0 5px;font-size:10px;color:var(--ink3);border-left:1px solid transparent;border-radius:0 7px 7px 0}
.rb.split:hover .sp-arr{border-left-color:var(--line2)}
.rb.split .sp-arr:hover{background:var(--hover2);color:var(--ink)}
.rb.split .sp-main:hover{background:var(--hover2)}
.rb.split.on .sp-main svg{stroke:var(--seal)}
.tsw{display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--tint-line);border-radius:8px;padding:2px;flex:none}
.tsb{display:inline-flex!important;align-items:center;gap:4px;border:0!important;background:transparent!important;border-radius:6px!important;padding:3px 8px!important;font-size:12px!important;color:var(--ink2)!important;cursor:pointer}
.tsb svg.i{width:16px;height:16px}
.tsb:hover{background:#f6f1ea!important;color:var(--ink)!important}
.tsb.on{background:var(--seal)!important;color:#fff!important}
.tsb.on svg.i{stroke:#fff}
@media (max-width:1500px){ .tsw .tsb span{display:none} .tsw .tsb.on span{display:inline} }
.ex-warn{font-size:12px;color:#a15c00;min-height:18px;margin-top:6px}
.ap-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.ap-row .field{margin:0}
.ap-row select,.ap-row input{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;background:var(--surface);font-size:13px}
.ap-strip{display:flex;gap:12px;align-items:flex-end;overflow-x:auto;padding:16px 14px 12px;background:var(--panel);border-radius:9px;min-height:190px}
.ap-pg{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ap-pg .b{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);display:grid;place-items:center;overflow:hidden;color:#c9c5bc}
.ap-pg .b canvas,.ap-pg .b img{display:block;width:100%;height:100%}
.ap-pg.new .b{background:#fff;box-shadow:none;outline:2px dashed var(--seal);outline-offset:-2px;color:var(--seal);font-weight:700;font-size:13px}
.ap-pg.new{color:var(--seal-ink);font-weight:500}
.ap-pg.more{align-self:center;color:var(--ink3);font-size:18px;padding:0 4px}
.ap-sum{margin-top:10px;font-size:13px}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--bar);width:30px;font-size:16px;cursor:pointer}
.stepper button:hover{background:var(--seal-soft);color:var(--seal-ink)}
.ap-row .stepper input{border:0;border-radius:0;width:56px;text-align:center;padding:6px 2px}
.chips{display:flex;gap:4px}
.chips button{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12.5px}
.chips button.on{border-color:var(--seal);color:var(--seal-ink);background:var(--tint)}
.ap-strip{position:relative}
.ap-strip .ap-pg{cursor:pointer;position:relative}
.ap-strip .ap-pg:not(.new):hover .b{outline:2px solid var(--ink3);outline-offset:2px}
.ap-strip .ap-pg:not(.new):hover::after{content:"點選：插在此頁後";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--ink2);white-space:nowrap}
.ap-new{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:grab;touch-action:none;user-select:none}
.ap-new.dragging{opacity:.3}
.ap-new .stack{position:relative}
.ap-ghost i,.ap-new .stack i{position:absolute;inset:0;background:#fff;border:2px dashed var(--seal);border-radius:2px}
.ap-ghost b,.ap-new .stack b{position:absolute;inset:0;display:grid;place-items:center;color:var(--seal);font-size:13px;text-align:center;line-height:1.35;background:#fff;border:2px dashed var(--seal);border-radius:2px}
.ap-new .lb{font-size:11.5px;color:var(--seal-ink);font-weight:500;white-space:nowrap}
.ap-new .grip{font-size:10.5px;color:var(--ink3)}
.ap-ghost{position:fixed !important;z-index:95;pointer-events:none;opacity:.9;transform:translate(18px,-55%) rotate(-3deg);filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.ap-mark{position:absolute;top:8px;bottom:30px;width:4px;margin-left:-2px;background:var(--seal);border-radius:2px;display:none;pointer-events:none}
.ap-mark::before{content:"放在這裡";position:absolute;top:-2px;left:8px;background:var(--seal);color:#fff;font-size:11px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.ap-sum b{color:var(--seal-ink)}
/* 排列頁面: every page in a grid, dragged into a new order */
.ar-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ar-top .flab{flex:1;margin:0}
.ar-grid{position:relative;display:flex;flex-wrap:wrap;gap:18px 14px;align-items:flex-end;align-content:flex-start;padding:18px 14px 14px;background:var(--panel);border-radius:9px;min-height:200px;max-height:calc(100vh - 270px);overflow-y:auto}
.ar-pg{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;cursor:grab;touch-action:none;user-select:none;white-space:nowrap}
.ar-pg .b{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);overflow:hidden}
.ar-pg .b img{display:block;width:100%;height:100%}
.ar-pg:hover .b{outline:2px solid var(--ink3);outline-offset:2px}
.ar-pg.moved{color:var(--seal-ink);font-weight:500}
.ar-pg.moved .b{outline:2px solid var(--seal);outline-offset:2px}
.ar-pg.dragging{opacity:.3}
.ar-ghost{position:fixed;z-index:95;pointer-events:none;opacity:.9;transform:translate(18px,-55%) rotate(-3deg);filter:drop-shadow(0 8px 16px rgba(0,0,0,.25));background:#fff}
.ar-ghost img{display:block;width:100%;height:100%}
.ar-mark{position:absolute;width:4px;margin-left:-2px;background:var(--seal);border-radius:2px;display:none;pointer-events:none}
.ar-sum{margin-top:10px;font-size:13px}
.ar-sum b{color:var(--seal-ink)}
.page canvas.pc{position:absolute;inset:0;width:100%;height:100%;display:block}
.page .ovl{position:absolute;inset:0}
.page .ld{position:absolute;inset:0;display:grid;place-items:center;color:#c9c5bc;font-size:12px}
.tool-note .page,.tool-textbox .page,.tool-signature .page{cursor:crosshair}
.tool-highlight .page,.tool-digisign .page,.tool-extract .page,.tool-ocr .page{cursor:crosshair}
/* 文字辨識: the box stays marked while its result is shown */
.ocrmark{position:absolute;border:2px dashed #1c64d9;background:rgba(28,100,217,.08);pointer-events:none;z-index:5;border-radius:2px}
.ocrp{position:fixed;z-index:60;width:380px;max-width:calc(100vw - 24px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.22);display:flex;flex-direction:column;font-size:13px}
.ocr-hd{display:flex;align-items:center;gap:8px;padding:9px 10px 6px 12px;cursor:move;user-select:none}
.ocr-hd b{font-size:13.5px}
.ocr-src{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocr-hd .sp,.ocr-ft .sp{flex:1}
.ocr-x{width:26px;height:26px;border:0;border-radius:6px;background:none;color:var(--ink2);cursor:pointer;font-size:14px}
.ocr-x:hover{background:#fff3bf;color:#1f2328}
.ocr-st{display:flex;align-items:center;gap:8px;padding:0 12px 6px;font-size:12px;color:var(--ink2);min-height:18px}
.ocr-bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.ocr-bar i{display:block;height:100%;width:0;background:#1c64d9;transition:width .2s}
.ocr-tx{margin:0 12px;min-height:110px;max-height:46vh;height:150px;resize:vertical;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--ink);font:14px/1.6 "Noto Sans TC","Microsoft JhengHei",sans-serif;white-space:pre-wrap}
.ocr-tx:focus{outline:2px solid rgba(28,100,217,.35);border-color:#1c64d9}
.ocr-ft{display:flex;align-items:center;gap:6px;padding:9px 12px 11px}
.ocr-ft button{height:28px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);cursor:pointer;font-size:12.5px;white-space:nowrap}
.ocr-ft button:hover{background:#fff3bf;color:#1f2328}
.ocr-ft button.pri{background:var(--seal);border-color:var(--seal);color:#fff;font-weight:600}
.ocr-ft button.pri:hover{filter:brightness(1.08);color:#fff;background:var(--seal)}
.ocr-ft button:disabled{opacity:.45;cursor:default}
.ocr-ft .tsw button{height:24px;border:0;padding:0 9px}
.ocr-ft .tsw button.on{background:var(--seal);color:#fff}
.tool-hand .page{cursor:grab}

.imgbox{position:absolute;display:none;border:2px solid var(--seal);background:rgba(200,55,29,.10);cursor:pointer;border-radius:2px}
.imgbox span{position:absolute;left:-2px;top:-20px;background:var(--seal);color:#fff;font-size:11px;padding:1px 6px;border-radius:3px 3px 0 0;white-space:nowrap}
.imgbox:hover{background:rgba(200,55,29,.22)}
.tool-extract .imgbox{display:block}
.annhit{position:absolute;display:none;cursor:pointer;border-radius:2px}
.tool-select .annhit{display:block}
.annhit:hover{outline:2px solid rgba(200,55,29,.55);outline-offset:1px}
.annhit.noap{background:#ffd43b;border:1px solid #b38600;width:18px!important;height:18px!important;border-radius:3px}
.annhit.sig{outline:1.5px dashed var(--ok)}
.draft{position:absolute;border:1.5px dashed var(--seal);background:rgba(200,55,29,.08);pointer-events:none}
.draft.hl{border:0;background:rgba(255,212,59,.45);mix-blend-mode:multiply}

.tip{position:fixed;z-index:60;max-width:280px;background:#22262b;color:#fff;padding:7px 10px;border-radius:7px;font-size:12px;line-height:1.55;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:pre-wrap;display:none}
.pop{position:fixed;z-index:61;width:260px;background:var(--surface);border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,.25);padding:12px;font-size:12.5px;display:none}
.pop .k{color:var(--ink3);font-size:11px;margin-bottom:4px}
.pop .c{white-space:pre-wrap;line-height:1.6;max-height:180px;overflow:auto;margin-bottom:10px}
.pop .row{display:flex;justify-content:flex-end;gap:6px}

/* ---------- empty state ---------- */
.welcome{position:absolute;inset:0;display:grid;place-items:center;padding:20px}
.wcard{background:var(--paper);border-radius:14px;padding:34px 38px;max-width:520px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.12);text-align:center;border:2px dashed transparent;transition:border-color .15s}
.drop .wcard{border-color:var(--seal)}
.wcard .logo{width:76px;height:76px;margin:0 auto 14px}
.wcard h1{font-size:21px;margin:0 0 8px;letter-spacing:.03em}
.wcard p{color:var(--ink2);margin:0 0 22px;line-height:1.7}
.wcard .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:9px 18px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.pri:hover{background:var(--seal-ink)}
.btn.pri svg{stroke:#fff}
.btn:disabled{opacity:.5;cursor:default}
.keys{margin-top:24px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:12px;color:var(--ink2);max-width:330px;margin-left:auto;margin-right:auto}
kbd{font-family:inherit;background:var(--surface);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;color:var(--ink)}

/* ---------- status ---------- */
.status{flex:none;height:26px;background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 12px;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px}
.status .dot.dirty{background:#e08a00}
.status .sig{color:var(--ok);font-weight:500}
.status .sp{flex:1}
.wmode{display:inline-flex;align-items:center;gap:6px}
.wmode b{font-weight:500;color:var(--ok)}
.wmode.ro b{color:#a15c00}
.wmode label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(25,22,18,.45);display:none;place-items:center;z-index:80;padding:16px}
.mask.show{display:grid}
.modal{background:var(--surface);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:96vw;max-height:94vh;display:flex;flex-direction:column;min-width:320px}
.modal .mh{padding:14px 18px 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal .mh::before{content:"";width:4px;height:16px;background:var(--seal);border-radius:2px}
.modal .mb{padding:4px 18px 14px;overflow:auto;line-height:1.6}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.modal .mf .sp{flex:1}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.field label,.flab{font-size:12px;color:var(--ink2)}
.field input[type=text],.field input[type=password],.field input[type=number],.field textarea,.field select{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:7px 9px;font-size:13.5px;background:var(--surface)}
.field textarea{resize:vertical;min-height:90px}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid rgba(200,55,29,.25);border-color:var(--seal)}
.frow{display:flex;gap:10px}
.frow>.field{flex:1}
.radio{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line2);border-radius:8px;margin-bottom:8px;cursor:pointer}
.radio:has(input:checked){border-color:var(--seal);background:var(--tint)}
.radio small{display:block;color:var(--ink3);font-size:11.5px}
.note{background:var(--surface2);border-radius:8px;padding:9px 11px;font-size:12px;color:var(--ink2);line-height:1.65}
.note.warn{background:#fff4e0;color:#7a4b00}

.padwrap{border:1px solid var(--line2);border-radius:8px;background:#fff;position:relative;touch-action:none}
.padwrap::after{content:"";position:absolute;left:24px;right:24px;bottom:46px;border-bottom:1px dashed #cfcac0;pointer-events:none}
.padwrap canvas{display:block;width:100%;height:220px;cursor:crosshair}
.pens{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pen{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2);cursor:pointer;padding:0}
.pen.on{box-shadow:0 0 0 2px var(--seal)}

/* crop */
.cropstage{background:#2b2a28;border-radius:9px;padding:18px;overflow:hidden;display:grid;place-items:center;min-height:240px;user-select:none}
.cropwrap{position:relative;line-height:0;background:repeating-conic-gradient(#555 0 25%,#666 0 50%) 0 0/16px 16px}
.cropwrap canvas{display:block}
.cropbox{position:absolute;outline:1.5px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.58);cursor:move}
.cropclip{position:absolute;inset:0}
.cropbox .h{position:absolute;width:14px;height:14px;background:#fff;border:2px solid var(--seal);border-radius:3px;margin:-7px 0 0 -7px}
.cropbox .h[data-d=n],.cropbox .h[data-d=s]{cursor:ns-resize}
.cropbox .h[data-d=e],.cropbox .h[data-d=w]{cursor:ew-resize}
.cropbox .h[data-d=nw],.cropbox .h[data-d=se]{cursor:nwse-resize}
.cropbox .h[data-d=ne],.cropbox .h[data-d=sw]{cursor:nesw-resize}
.cropbox .g{position:absolute;border:0 solid rgba(255,255,255,.35);pointer-events:none}
.cropctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.cropctl .field{margin:0}
.cropctl input{width:100%}
.cropinfo{font-size:12px;color:var(--ink2);margin-top:8px;font-variant-numeric:tabular-nums}

/* toast & busy */
.toasts{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#22262b;color:#fff;padding:8px 16px;border-radius:20px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:tin .2s ease-out}
.toast.err{background:var(--seal-ink)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.busy{position:fixed;inset:0;z-index:85;display:none;place-items:center;background:rgba(255,255,255,.25);cursor:progress}
.busy.show{display:grid}
.busy.quiet{background:transparent}
.busy.quiet>div{visibility:hidden}
.busy div{background:var(--surface);padding:12px 20px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border:2px solid #eee;border-top-color:var(--seal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
input[type=file]{display:none}

html[data-theme="dark"]{
  --ink:#e8e6e3; --ink2:#b4b1ab; --ink3:#87847e;
  --paper:#232427; --line:#36373b; --line2:#47484d; --desk:#141416; --desk2:#101012;
  --seal:#e8573c; --seal-soft:#3b2521; --seal-ink:#ff8f78; --ok:#4cc38a;
  --surface:#2e2f33; --surface2:#27282b; --bar:#2a2b2e; --bar2:#26272a; --panel:#1e1f22; --hover:#36373b; --hover2:#404146;
  --tabbar:#19191b; --tab:#252629; --tab-h:#2d2e31; --tint:#2c2422; --tint-line:#5b342c; --danger-soft:#4a241d;
  --shadow:rgba(0,0,0,.5); --ruler-bg:#26272a; --ruler-band:#33343a; --ruler-ink:#b4b1ab; --ruler-tick:#6d6a65;
  color-scheme:dark;
}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{color:var(--ink)}
html[data-theme="dark"] .nbd textarea{color:#1f2328}
html[data-theme="dark"] .page{box-shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.55)}
html[data-theme="dark"] .thumb .tc{box-shadow:0 1px 3px rgba(0,0,0,.6)}
html[data-theme="dark"] .modal{box-shadow:0 20px 60px rgba(0,0,0,.6);border:1px solid var(--line)}
html[data-theme="dark"] .ctx,html[data-theme="dark"] .pop{background:var(--surface);border:1px solid var(--line2);box-shadow:0 12px 34px rgba(0,0,0,.55)}
html[data-theme="dark"] .mask{background:rgba(0,0,0,.6)}
html[data-theme="dark"] .welcome .wcard{background:var(--paper);box-shadow:0 10px 40px rgba(0,0,0,.5)}
html[data-theme="dark"] kbd{background:var(--surface);border-color:var(--line2);color:var(--ink)}
html[data-theme="dark"] .ld{color:#9b978f}
html[data-theme="dark"] .st-item{background:#f5f3ef;border-color:#55565b}
html[data-theme="dark"] .st-item.on{background:#fff4d6}
html[data-theme="dark"] .st-prev{background:#f5f3ef}
html[data-theme="dark"] .cropstage{background:#0d0d0e}
html[data-theme="dark"] .ap-strip,html[data-theme="dark"] .pp-grid{background:#18191b}
html[data-theme="dark"] .pp-card.on{background:var(--surface)}
html[data-theme="dark"] .note.warn{background:#3a2e15;color:#f0c674}
html[data-theme="dark"] .hint.styl [data-h=done]{box-shadow:-10px 0 10px var(--tint)}
html[data-theme="dark"] .tsw{background:var(--surface);border-color:var(--tint-line)}
html[data-theme="dark"] .tsb:hover{background:var(--hover)!important}
html[data-theme="dark"] .ex-row.custom input{background:#33301f}
html[data-theme="dark"] .rcorner{border-color:var(--line2)}
html[data-theme="dark"] .rs:hover,html[data-theme="dark"] .rb:hover{background:var(--hover)}
html[data-theme="dark"] ::-webkit-scrollbar{width:11px;height:11px}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#4a4b50;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
html[data-theme="dark"] ::-webkit-scrollbar-track{background:transparent}
html[data-page="night"] .page canvas.pc,html[data-page="night"] .thumb .tc{filter:invert(.9) hue-rotate(180deg)}
html[data-page="night"] .page{background:#1a1a1a}
html[data-page="night"] .page .ld{color:#555}
html[data-page="sepia"] .page canvas.pc,html[data-page="sepia"] .thumb .tc{filter:sepia(.55) saturate(1.2) brightness(.95) contrast(.97)}
html[data-page="sepia"] .page{background:#efe1c0}
.thememenu .hd{font-size:11px;color:var(--ink3);padding:6px 10px 2px}
.thememenu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
/* toolbar options: always full colour (same as 開啟); turn yellow under the mouse so they are easy to find */
.rb:disabled,.rs:disabled,.vb:disabled{opacity:1;cursor:default}
html[data-theme="dark"] .rb,html[data-theme="dark"] .rs,html[data-theme="dark"] .vb{color:#f4f2ee}
html[data-theme="dark"] .rb:hover,html[data-theme="dark"] .rs:hover,html[data-theme="dark"] .vb:hover,
html[data-theme="dark"] .rb.split .sp-main:hover,html[data-theme="dark"] .rb.split .sp-arr:hover{color:#ffd43b;background:rgba(255,212,59,.13)}
html[data-theme="dark"] .rb:hover svg,html[data-theme="dark"] .rs:hover svg,html[data-theme="dark"] .vb:hover svg,html[data-theme="dark"] .rb.split .sp-main:hover svg{stroke:#ffd43b}
html[data-theme="light"] .rb:hover,html[data-theme="light"] .rs:hover,html[data-theme="light"] .vb:hover,
html[data-theme="light"] .rb.split .sp-main:hover,html[data-theme="light"] .rb.split .sp-arr:hover{background:#ffe066;color:#3d2a00}
html[data-theme="light"] .rb:hover svg,html[data-theme="light"] .rs:hover svg,html[data-theme="light"] .vb:hover svg,html[data-theme="light"] .rb.split .sp-main:hover svg{stroke:#3d2a00}
.rb.split:hover{background:transparent!important}
.automark{position:fixed;z-index:98;width:32px;height:32px;margin:-16px 0 0 -16px;pointer-events:none;display:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.automark svg{width:100%;height:100%}
.automark circle{fill:rgba(255,255,255,.92);stroke:#57606a;stroke-width:1.2}
.automark path{fill:#3d4248}
.automark circle.dot{fill:#3d4248;stroke:none}
html[data-theme="dark"] .automark circle{fill:rgba(40,41,44,.92);stroke:#b4b1ab}
html[data-theme="dark"] .automark path,html[data-theme="dark"] .automark circle.dot{fill:#f4f2ee}
body.autoscrolling,body.autoscrolling *{cursor:all-scroll!important;user-select:none}
body.autoscrolling[data-autodir=n],body.autoscrolling[data-autodir=n] *{cursor:n-resize!important}
body.autoscrolling[data-autodir=s],body.autoscrolling[data-autodir=s] *{cursor:s-resize!important}
body.autoscrolling[data-autodir=w],body.autoscrolling[data-autodir=w] *{cursor:w-resize!important}
body.autoscrolling[data-autodir=e],body.autoscrolling[data-autodir=e] *{cursor:e-resize!important}
.thememenu button .ck{width:14px;color:var(--seal);font-weight:700;display:inline-block}
.pcs{width:16px;height:16px;border-radius:4px;border:1px solid var(--line2);display:inline-block;flex:none}
.pcs-original{background:#fff}
.pcs-auto{background:linear-gradient(135deg,#fff 50%,#1a1a1a 50%)}
.pcs-night{background:#1a1a1a}
.pcs-sepia{background:#efe1c0}
.thememenu small{margin-left:auto;color:var(--ink3);font-size:11px;padding-left:12px}

/* inline text box editor */
.tbed{position:absolute;z-index:30;transform-origin:0 0;min-width:24px;padding:4px;outline:1.2px dashed #1c64d9;outline-offset:0;white-space:pre;line-height:1.3;
  font-family:"PDFE Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;cursor:text;user-select:text;-webkit-user-select:text;color:#1f2328}
.tbed div{min-height:1em}
/* editing the PDF's own text: the editor uses the font the text is written with, so what you see is what is saved */
@font-face{font-family:"PDFE Sans";src:url(fonts/NotoSansTC-Regular.ttf) format("truetype");font-weight:100 600;font-display:block}
@font-face{font-family:"PDFE Sans";src:url(fonts/NotoSansTC-Bold.ttf) format("truetype");font-weight:601 900;font-display:block}
.tbed.real{font-family:"PDFE Sans";font-kerning:none;font-synthesis:style}
.tbed.vert{writing-mode:vertical-rl;text-orientation:upright}
.tbed.vert div{min-height:0;min-width:1em}
.tbed:focus{outline-color:#1c64d9}
html[data-page="night"] .tbveil,html[data-page="night"] .tbed{filter:invert(.9) hue-rotate(180deg)}
html[data-page="sepia"] .tbveil{filter:sepia(.55) saturate(1.2) brightness(.95)}
.tbveil{position:absolute;z-index:29;background:#fff;pointer-events:none}
.tfmt{min-width:26px;height:26px;padding:0 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);font-size:13px;cursor:pointer}
.tfmt:hover{background:#fff3bf;color:#1f2328}
.tfmt.on{background:#d0ebff;border-color:#1c64d9;color:#1c64d9}
.tm-sizes,.tm-cols{display:flex;gap:4px;padding:4px 10px;flex-wrap:wrap;max-width:290px}
.tm-sizes button{width:auto;min-width:28px;padding:3px 6px;border:1px solid var(--line);border-radius:4px;justify-content:center}
.tm-cols button{width:22px;height:22px;padding:0;border-radius:50%;border:1px solid rgba(0,0,0,.2);justify-content:center;font-size:11px}
.tb-thumb{display:inline-flex;height:26px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.tb-thumb img{height:100%;width:auto;max-width:60px;object-fit:contain}

/* colour picker */
#cpMenu{z-index:10050;width:268px;padding:10px 10px 8px}
.cp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:12px;color:var(--ink2)}
.cp-head b{font-weight:600;color:var(--ink)}
.cp-nonebtn{width:auto!important;padding:2px 8px!important;font-size:12px;border:1px solid var(--line)!important;border-radius:5px}
.cpmenu .cp-grid{grid-template-columns:repeat(8,24px);gap:7px 6px;min-height:24px}
.cpmenu .cp-sw{width:24px!important;height:24px}
.cp-sw:hover{transform:scale(1.12);box-shadow:0 0 0 2px #ffd43b}
.cp-wheelrow{display:flex;gap:10px;margin:10px 0 6px;align-items:flex-start}
.cp-wheelbox{position:relative;width:168px;height:168px;flex:none}
.cp-wheel{width:168px;height:168px;border-radius:50%;cursor:crosshair;display:block;touch-action:none}
.cp-mark{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);pointer-events:none}
.cp-side{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.cp-prev{display:flex;flex-direction:column;height:46px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.cp-prev i{flex:1}
.cp-hex{width:100%;box-sizing:border-box;font:12px ui-monospace,Consolas,monospace;padding:4px 5px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}
.cp-rgb{font-size:10.5px;color:var(--ink3);white-space:nowrap}
.cp-eye{display:flex!important;align-items:center;justify-content:center;gap:4px;width:100%!important;padding:5px 4px!important;border:1px solid var(--line)!important;border-radius:6px;font-size:12px}
.cp-eye:hover,.cp-addfav:hover,.cp-clrfreq:hover,.cp-foot button:hover,.cp-nonebtn:hover{background:#fff3bf!important;color:#1f2328!important}
.cp-eye svg{width:15px;height:15px}
.cp-vrow{display:flex!important;align-items:center;gap:8px;font-size:12px;color:var(--ink2);padding:0!important;margin-bottom:4px}
.cp-val{flex:1;-webkit-appearance:none;appearance:none;height:10px;border-radius:5px;border:1px solid var(--line)}
.cp-val::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:1.5px solid #555;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.cp-sec{display:flex;align-items:center;justify-content:space-between;margin:8px 0 5px;font-size:12px;color:var(--ink2);font-weight:600}
.cp-sec button{width:auto!important;padding:1px 7px!important;font-size:11.5px;font-weight:400;border:1px solid var(--line)!important;border-radius:5px}
.cp-empty{grid-column:1/-1;font-size:11.5px;color:var(--ink3);line-height:1.4}
.cp-foot{display:flex;justify-content:flex-end;gap:6px;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.cp-foot button{width:auto!important;padding:4px 14px!important;border:1px solid var(--line)!important;border-radius:6px;justify-content:center}
.cp-foot .pri{background:var(--seal)!important;color:#fff!important;border-color:var(--seal)!important}
.cp-foot .pri:hover{filter:brightness(1.08);background:var(--seal)!important;color:#fff!important}
#eyedrop{position:fixed;inset:0;z-index:10100;background-size:100% 100%;cursor:crosshair}
#eyedrop .ed-loupe{position:fixed;width:154px;height:154px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);pointer-events:none;left:-999px}
#eyedrop .ed-lab{position:fixed;left:-999px;display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;background:rgba(20,22,26,.88);color:#fff;font:12px ui-monospace,Consolas,monospace;pointer-events:none}
#eyedrop .ed-lab i{width:14px;height:14px;border-radius:3px;border:1px solid #fff}
#eyedrop .ed-tip{position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:8px;background:rgba(20,22,26,.85);color:#fff;font-size:13px;pointer-events:none}
.sc-cols{display:flex;align-items:center;gap:5px;height:30px}
.sc-cols .swatch{width:20px;height:20px}
.pens .cpick{margin-left:4px}

/* layers panel */
#p-layers{padding:8px 6px}
.ly-tools{display:flex;align-items:center;gap:3px;margin-bottom:8px}
.ly-tools .sp{flex:1}
.ly-tools button{height:26px;padding:0 7px;white-space:nowrap;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:12px;cursor:pointer}
.ly-tools button:hover,.ly-adopt:hover{background:#fff3bf;color:#1f2328}
.ly-list{display:flex;flex-direction:column;gap:2px}
.ly-row{display:flex;align-items:center;gap:2px;height:30px;padding:0 4px 0 0;border-radius:6px;border:1px solid transparent;cursor:pointer;user-select:none;font-size:12.5px;color:var(--ink)}
.ly-row:hover{background:var(--hover)}
.ly-row.act{background:rgba(28,100,217,.12);border-color:rgba(28,100,217,.45)}
.ly-row.act .ly-name{font-weight:600}
.ly-row.off .ly-name,.ly-row.off .ly-n{opacity:.45}
.ly-row button{display:flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;border:0;background:none;color:var(--ink2);border-radius:4px;cursor:pointer;flex:none}
.ly-row button:hover{background:#fff3bf;color:#1f2328}
.ly-row svg,.ly-obj svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ly-car{font-size:10px;width:14px!important;transition:transform .12s}
.ly-car.open{transform:rotate(90deg)}
.ly-row.off .ly-eye{color:var(--ink3)}
.ly-lock{color:var(--ink3)!important;opacity:.55}
.ly-lock.on{color:#c92a2a!important;opacity:1}
.ly-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:3px}
.ly-tag{font-size:10px;padding:0 4px;border-radius:3px;background:var(--hover);color:var(--ink3);margin-right:3px}
.ly-n{font-size:11px;color:var(--ink3);min-width:16px;text-align:right}
.ly-row.base{cursor:default;color:var(--ink3);border-top:1px dashed var(--line);border-radius:0;margin-top:4px}
.ly-row.base:hover{background:none}
.ly-pg{width:44px;text-align:center}
.ly-row.loose .ly-name{color:var(--ink3);font-style:italic}
.ly-row.drop-a{box-shadow:inset 0 2px 0 #1c64d9}
.ly-row.drop-b{box-shadow:inset 0 -2px 0 #1c64d9}
.ly-row.drop-in{background:rgba(28,100,217,.18);border-color:#1c64d9}
.ly-objs{margin:0 0 4px calc(16px + var(--d,0) * 14px);border-left:1px solid var(--line);padding-left:4px}
.ly-row{padding-left:calc(var(--d,0) * 14px)}
.ly-row.ly-grp .ly-name{font-weight:600}
.ly-gi{display:flex;align-items:center;color:#e8a317;margin-left:2px}
.ly-gi svg{width:15px;height:15px;fill:rgba(232,163,23,.18);stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.ly-obj{display:flex;align-items:center;gap:4px;height:24px;font-size:11.5px;color:var(--ink2);border-radius:4px;cursor:pointer;padding-right:4px}
.ly-obj:hover{background:var(--hover)}
.ly-obj.hid .ly-on{opacity:.45;text-decoration:line-through}
.ly-oeye{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border:0;background:none;color:var(--ink3);cursor:pointer;border-radius:4px;padding:0}
.ly-oeye:hover{background:#fff3bf;color:#1f2328}
.ly-on{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ly-op{font-size:10.5px;color:var(--ink3)}
.ly-ren{flex:1;min-width:0;height:22px;font-size:12.5px;padding:0 4px;border:1px solid #1c64d9;border-radius:4px;background:var(--surface);color:var(--ink)}
.ly-adopt{margin:4px 0 2px 18px;padding:4px 8px;font-size:11.5px;border:1px dashed var(--line);border-radius:6px;background:var(--surface);color:var(--ink2);cursor:pointer}
.ly-note{margin-top:10px;font-size:11.5px;line-height:1.6;color:var(--ink3)}
.ly-pick{height:24px;font-size:12px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);max-width:150px}
.tabs .tab{padding-left:6px;padding-right:6px}

/* editing the PDF's own text */
.txhov{position:absolute;outline:1.5px solid rgba(28,100,217,.55);background:rgba(28,100,217,.06);pointer-events:none;border-radius:2px;z-index:3}
.txsel{position:absolute;background:rgba(28,100,217,.22);pointer-events:none;z-index:3}
.txband{position:absolute;border:1px dashed #1c64d9;background:rgba(28,100,217,.05);pointer-events:none;z-index:3}
.tool-textbox .page.over-text{cursor:text}

/* rotation & end-point handles */
.asel .rh{position:absolute;left:50%;top:-30px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;border:2px solid #1c64d9;cursor:grab;display:flex;align-items:center;justify-content:center;z-index:3}
.asel .rh::after{content:"";position:absolute;left:50%;top:18px;width:0;height:11px;border-left:1.5px dashed #1c64d9}
.asel .rh svg{width:13px;height:13px;fill:none;stroke:#1c64d9;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.asel .rh:hover{background:#fff3bf}
.asel .eh{position:absolute;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;border:2px solid #1c64d9;cursor:crosshair;z-index:3}
.asel .eh:hover{background:#fff3bf}
.geoprev{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}
.rlabel{position:absolute;transform:translate(-50%,calc(-100% - 10px));padding:2px 7px;border-radius:5px;background:rgba(20,22,26,.85);color:#fff;font-size:11.5px;white-space:nowrap;pointer-events:none;z-index:6}

/* stand-ins kept on screen until the edited page is redrawn */
.hold{pointer-events:none!important}
.asel.hold{outline:none;box-shadow:none;cursor:default}
.tbed.hold{outline:none!important;caret-color:transparent}
</style>
</head>

<!-- ribbon -->

  <div class="grp"><div class="btns"><div class="rstack">

  <div class="grp"><div class="btns">

    <div class="rstack">
      <button class="rs" data-act="copyPages" data-need title="複製選取的頁面 (Ctrl+C)，可在任何分頁貼上"><i data-i="copy"></i>複製頁</button>
      <button class="rs" data-act="cutPages" data-need title="剪下選取的頁面 (Ctrl+X)"><i data-i="cut"></i>剪下頁</button>
      <button class="rs" data-act="pastePages" data-need id="bPaste" title="貼上頁面到目前頁之後 (Ctrl+V)"><i data-i="paste"></i>貼上頁</button>
    </div>
  </div><div class="cap">頁面</div></div>
  <div class="grp"><div class="btns">
    <button class="rb" data-tool="select" data-need title="選取 / 查看註解"><i data-i="select"></i>選取</button>
    <button class="rb" data-tool="hand" data-need title="手形工具（或按住空白鍵）"><i data-i="hand"></i>手形</button>
    <button class="rb" data-tool="extract" data-need title="自動標示頁面中的圖片，點選即可擷取與裁切"><i data-i="image"></i>擷取圖片</button>
    <button class="rb" data-tool="ocr" data-need title="框選頁面上的區塊，辨識出文字後可以複製（掃描檔、圖片也可以）"><i data-i="ocr"></i>文字辨識</button>
  </div><div class="cap">工具</div></div>
  <div class="grp"><div class="btns">
    <button class="rb" data-tool="note" data-need title="便利貼註解"><i data-i="note"></i>便利貼</button>
    <button class="rb" data-tool="textbox" data-need title="文字方塊：點一下（左鍵或右鍵）直接在十字處輸入；反白文字即可修改字級、顏色與底色"><i data-i="text"></i>文字方塊</button>
    <button class="rb" data-act="insertImage" data-need title="插入圖片：選擇圖片後點一下放置或拖曳決定大小；也可以直接把圖片檔拖到頁面上"><i data-i="insImg"></i>插入圖片</button>
    <button class="rb split" data-menu="markText" data-need title="文字標記：點按使用目前工具，點 ▾ 選擇其他（高亮、刪除線、底線、區域螢光筆）"><span class="sp-main"><i data-i="hlText"></i><span class="sp-lab">高亮</span></span><span class="sp-arr" title="選擇其他文字標記工具">▾</span></button>
    <button class="rb split" data-menu="drawMenu" data-need title="繪圖：點按使用目前工具，點 ▾ 選擇其他（箭頭、線條、矩形、橢圓形、多邊形、雲狀）"><span class="sp-main"><i data-i="arrow"></i><span class="sp-lab">箭頭</span></span><span class="sp-arr" title="選擇其他繪圖工具">▾</span></button>
    <button class="rb" data-tool="pen" data-need title="畫筆：自由手繪"><i data-i="pen2"></i>畫筆</button>
    <button class="rb" data-tool="eraser" data-need title="橡皮擦：擦除畫筆筆跡"><i data-i="eraser"></i>橡皮擦</button>
    <button class="rb" data-tool="fill" data-need title="填色：點一下區塊自動填滿顏色，或拖曳矩形／套索範圍"><i data-i="bucket"></i>填色</button>
    <button class="rb" data-tool="stamp" data-need title="戳記：核准、草稿、機密、日期章…"><i data-i="stamp"></i>戳記</button>
  </div><div class="cap">註解</div></div>
  <div class="grp"><div class="btns">
    <button class="rb split" data-amenu="sign" data-need title="簽署與附件：點按使用，點 ▾ 選擇（手寫簽名、數位簽章、附加檔案）"><span class="sp-main"></span><span class="sp-arr">▾</span></button>
  </div><div class="cap">簽署</div></div>
  <div class="grp" id="grpApp"><div class="btns">
    <button class="rb" data-act="settings" id="bSettings" title="設定：顯示模式、工具列、按鍵、軟體更新"><span class="updwrap"><i data-i="gear"></i><span class="upddot" id="updDot"></span></span>設定</button>

</div>

/* ---------------- downloads ---------------- */
let dlPromise = null;
function getDownloads(){
  if (!dlPromise && DESK) dlPromise = Promise.resolve({save: async ({filename, data}) => {
    const u8 = new Uint8Array(await (data instanceof Blob ? data : new Blob([data])).arrayBuffer());
    const where = await DESK.saveAs(filename, u8);
    if (!where) throw {code:'declined'};
    return {status:'saved', path:where};
  }});
  if (!dlPromise) dlPromise = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  return dlPromise;
}
setTimeout(getDownloads, 0);
// every save goes to a new file; the file that was opened is never overwritten
async function saveAsNew(bytes, suffix){
  const base = S.name.replace(/\.pdf$/i, '').replace(/_已編輯(\(\d+\))?$/, '');
  const fn = base + suffix + '.pdf';
  const orig = S.handle && (S.handle.orig || S.handle.path);
  if (DESK) {
    const dir = S.handle && S.handle.path ? S.handle.path.replace(/[\\/][^\\/]*$/, '') : '';
    const where = await DESK.saveAs(dir ? dir + (S.handle.path.includes('\\') ? '\\' : '/') + fn : fn, bytes, {avoid:orig ? [orig] : []});
    if (!where) { toast('已取消儲存'); return false; }
    if (where.error) { toast(where.error, 'err'); return false; }
    const name = where.split(/[\\/]/).pop();
    S.dirty = false; S.name = name; S.handle = {...desktopHandle(where, name), orig};
    updateUI(); toast('已另存新檔：' + name);
    return true;
  }
  if (await saveFile(fn, new Blob([bytes], {type:'application/pdf'}))) { S.dirty = false; updateUI(); return true; }
  return false;
}
async function saveFile(filename, data){
  const blob = data instanceof Blob ? data : new Blob([data]);
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({filename, data:blob}); toast((DESK ? '已儲存 ' : '已下載 ') + filename); return true; }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') toast('已取消下載');
      else if (c === 'rejected_extension' || c === 'extension_not_enabled') toast('這種檔案類型無法在預覽環境中下載', 'err');
      else if (c === 'rate_limited') toast('已有下載確認視窗開啟中，請稍候', 'err');
      else toast('下載失敗：' + (e && (e.message || c) || e), 'err');
      return false;
    }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000); return true;
}

/* ---------------- documents & tabs ----------------
   Each open PDF is a document with its own pages, view, undo history and file handle.
   The active document's fields live on S; switching tabs stashes them and restores another set. */
const DOC_KEYS = ['bytes', 'name', 'pdf', 'pages', 'scale', 'zoomMode', 'view', 'cover', 'current', 'undo', 'redo',
  'dirty', 'signed', 'version', 'imgCache', 'annCache', 'handle', 'thumbSel', 'guides', 'activeLayer'];
const docs = [];
let active = -1, docSeq = 0, VSEQ = 0;
S.thumbSel = new Set();
const activeDoc = () => docs[active] || null;
function blankDoc(){
  return {id:++docSeq, bytes:null, name:'', pdf:null, pages:[], scale:PX, zoomMode:'fit-width', view:S.view || 'continuous',
    cover:S.cover, current:0, undo:[], redo:[], dirty:false, signed:false, version:0, imgCache:new Map(), annCache:new Map(),
    handle:null, thumbSel:new Set(), guides:{h:[], v:[]}, scrollTop:0, scrollLeft:0, activeLayer:null};
}
function stashActive(){
  const d = activeDoc(); if (!d) return;
  DOC_KEYS.forEach(k => d[k] = S[k]);
  d.scrollTop = viewer.scrollTop; d.scrollLeft = viewer.scrollLeft;
  S.st.forEach(st => st && st.task && st.task.cancel());
}
const applyDoc = d => DOC_KEYS.forEach(k => S[k] = d[k]);
const anyDirty = () => S.dirty || docs.some((d, i) => i !== active && d.dirty);
function docField(d, k){ return d === activeDoc() ? S[k] : d[k]; }

function switchTab(i){
  if (i === active || !docs[i]) return;
  if (PEN.strokes.length || PEN.busy || NP || TBE) { (async () => { await closeNote(true); await flushPen(); await commitTextEditor(); switchTab(i); })(); return; }
  stashActive(); hideCtx(); hideTip(); pop.style.display = 'none';
  active = i; applyDoc(docs[i]);
  mountDoc({scroll:'restore', scrollTop:docs[i].scrollTop, scrollLeft:docs[i].scrollLeft});
}
async function openInNewTab(bytes, name, handle){
  const prev = active;
  stashActive();
  const d = blankDoc(); d.name = name; d.handle = handle;
  docs.push(d); active = docs.length - 1; applyDoc(d);
  try { await loadDoc(bytes, {name}); }
  catch (e) {
    docs.splice(active, 1);
    if (docs.length) { active = clamp(prev, 0, docs.length - 1); applyDoc(docs[active]); mountDoc({scroll:'restore', scrollTop:docs[active].scrollTop, scrollLeft:docs[active].scrollLeft}); }
    else { active = -1; showWelcome(); }
    throw e;
  }
}
async function closeTab(i){
  const d = docs[i]; if (!d) return;
  if (docField(d, 'dirty')) {
    const v = await openModal({title:'關閉分頁', body:`<div style="max-width:400px">「${esc(docField(d, 'name'))}」有尚未儲存的修改。原檔不會被修改，要先另存新檔嗎？</div>`,
      buttons:[{label:'取消', value:null}, {label:'不儲存並關閉', value:'drop'}, {label:'另存新檔', value:'save', primary:true}]});
    if (!v) return;
    if (v === 'save') { if (i !== active) switchTab(i); await new Promise(r => setTimeout(r, 50)); if (!(await saveAsNew(S.bytes, '_已編輯'))) return; i = active; }
  }
  const pdf = docField(d, 'pdf');
  if (i === active) {
    S.st.forEach(st => st && st.task && st.task.cancel());
    docs.splice(i, 1);
    if (docs.length) { active = Math.min(i, docs.length - 1); applyDoc(docs[active]); mountDoc({scroll:'restore', scrollTop:docs[active].scrollTop, scrollLeft:docs[active].scrollLeft}); }
    else { active = -1; showWelcome(); }
  } else {

}
function showWelcome(){

  $('#welcome').style.display = '';

function renderTabs(){
  const bar = $('#tabbar');

  bar.innerHTML = '';
  docs.forEach((d, i) => {
    const t = document.createElement('div'); t.className = 'dtab' + (i === active ? ' on' : '');
    const nm = docField(d, 'name'), dirty = docField(d, 'dirty'), h = docField(d, 'handle');
    t.title = (h && h.path) || nm;
    t.innerHTML = `<span class="nm">${esc(nm)}</span>${dirty ? '<span class="dd" title="有未儲存的修改"></span>' : ''}<button class="x" title="關閉 (Ctrl+W)">×</button>`;
    t.addEventListener('pointerdown', e => { if (e.button === 1) e.preventDefault(); });

  add.onclick = () => actions.open(); bar.appendChild(add);

async function loadDoc(bytes, {name, keepView = false, scrollToCurrent = false} = {}){
  let anchorOffset = 0;
  if (keepView && S.pos[S.current]) anchorOffset = viewer.scrollTop - S.pos[S.current].y;
  S.st.forEach(st => st && st.task && st.task.cancel());
  const old = S.pdf, prev = keepView ? {els:S.els, pages:S.pages} : null;
  const pdf = await pdfjsLib.getDocument({...PDF_OPTS, data:bytes.slice()}).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const p = await pdf.getPage(i); const vp = p.getViewport({scale:1});
    pages.push({page:p, vp1:vp, w:vp.width, h:vp.height, rot:((p.rotate % 360) + 360) % 360});
  }
  if (prev) { prev.map = matchPages(prev.pages, pages); prev.pre = await prerenderNew(pages, prev); }
  S.pdf = pdf; S.pages = pages; S.bytes = bytes; S.version = ++VSEQ;
  if (name) S.name = name;
  S.imgCache.clear(); S.annCache.clear();
  if (!keepView) { S.current = 0; S.zoomMode = 'fit-width'; }
  S.current = clamp(S.current, 0, pages.length - 1);
  const keepSel = keepView ? [...(S.thumbSel || [])].filter(i => i < pages.length) : [];
  S.thumbSel = new Set(keepSel.length ? keepSel : [S.current]);

// which old page each new page is: pdf-lib keeps a page's object number through an edit, so pages that
// were only moved by adding or deleting others are recognised; new pages get -1
function matchPages(olds, pages){
  const key = p => p.page.ref ? p.page.ref.num + ':' + p.page.ref.gen : null, at = new Map();
  olds.forEach((p, j) => { const k = key(p); if (k && !at.has(k)) at.set(k, j); });
  const map = pages.map(p => { const k = key(p); if (!k || !at.has(k)) return -1; const j = at.get(k); at.delete(k); return j; });   // each old picture is used once
  if (olds.length === pages.length) {   // same number of pages: an unmatched page stands where it stood before
    const used = new Set(map);
    map.forEach((j, i) => { if (j < 0 && !used.has(i)) map[i] = i; });
  }

const samePic = (a, b) => !!a && !!b && Math.abs(a.w - b.w) < .01 && Math.abs(a.h - b.h) < .01;

/* ====================================================================
   Layout
   ==================================================================== */
const isCont = () => S.view === 'continuous' || S.view === 'two-continuous';
const isTwo = () => S.view === 'two' || S.view === 'two-continuous';
function rowsFor(){
  const n = S.pages.length, rows = [];
  if (!isTwo()) { for (let i = 0; i < n; i++) rows.push([i]); return rows; }
  let i = 0;
  if (S.cover && n) { rows.push([0]); i = 1; }
  for (; i < n; i += 2) rows.push(i + 1 < n ? [i, i + 1] : [i]);

  const shown = isCont() ? S.rows.map((_, i) => i) : [Math.max(0, rowOf(S.current))];
  let maxW = 0;
  shown.forEach(ri => S.rows[ri].forEach(p => maxW = Math.max(maxW, S.pages[p].w * sc)));
  const contentW = (isTwo() ? 2 * maxW + GAP : maxW) + 2 * MARGIN;
  const W = Math.max(contentW, viewer.clientWidth), cx = W / 2;
  const pos = new Array(n).fill(null);
  let y = MARGIN;
  for (const ri of shown) {
    const row = S.rows[ri];
    const rh = Math.max(...row.map(p => S.pages[p].h * sc));
    if (isTwo()) {
      if (row.length === 2) {
        const [L, R] = row;
        pos[L] = {x: cx - GAP / 2 - S.pages[L].w * sc, y: y + (rh - S.pages[L].h * sc) / 2};
        pos[R] = {x: cx + GAP / 2, y: y + (rh - S.pages[R].h * sc) / 2};
      } else {
        const p = row[0], w = S.pages[p].w * sc;
        pos[p] = {x: (S.cover && p === 0) ? cx + GAP / 2 : cx - GAP / 2 - w, y};
      }
    } else {
      const p = row[0]; pos[p] = {x: cx - S.pages[p].w * sc / 2, y};
    }
    y += rh + GAP;
  }
  const H = y - GAP + MARGIN;
  pagesEl.style.width = W + 'px'; pagesEl.style.height = H + 'px';
  S.pos = pos;
  S.els.forEach((el, i) => {
    const p = pos[i];

    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    el.style.width = S.pages[i].w * sc + 'px'; el.style.height = S.pages[i].h * sc + 'px';
    if (!el.parentNode) pagesEl.appendChild(el);

function fitScale(mode){

  const ph = Math.max(...row.map(p => S.pages[p].h));
  const aw = viewer.clientWidth - 2 * MARGIN - (isTwo() ? GAP : 0) - (mode === 'fit-width' ? 2 : 0);

const imgResolved = new Map();
async function detectImages(i){
  const key = S.version + ':' + i; if (S.imgCache.has(key)) return S.imgCache.get(key);

      const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
      let x0 = Math.max(0, Math.min(...xs)), y0 = Math.max(0, Math.min(...ys));
      let x1 = Math.min(pg.w, Math.max(...xs)), y1 = Math.min(pg.h, Math.max(...ys));
      if (x1 - x0 < 4 || y1 - y0 < 4) return;
      const b = {x:x0, y:y0, w:x1 - x0, h:y1 - y0, nw:nw | 0, nh:nh | 0};
      if (!out.some(o => Math.abs(o.x - b.x) < 1 && Math.abs(o.y - b.y) < 1 && Math.abs(o.w - b.w) < 1 && Math.abs(o.h - b.h) < 1)) out.push(b);
    };

        case O.restore: if (stack.length) ctm = stack.pop(); break;

        case O.paintFormXObjectBegin: stack.push(ctm.slice()); if (a && Array.isArray(a[0]) && a[0].length === 6) ctm = U.transform(ctm, a[0]); break;
