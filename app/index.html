<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob: data: https://fonts.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>PDF 工作台</title>
<script>try{var t=localStorage.getItem('pdfeditor.theme')||'system',d=(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)),pc=localStorage.getItem('pdfeditor.pagecolor')||'original';document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.dataset.page=pc==='auto'?(d?'night':'original'):pc;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2328; --ink2:#57606a; --ink3:#8c959f;
  --paper:#fbfaf7; --line:#e3e0d8; --line2:#d4d0c6;
  --desk:#cfcbc2; --desk2:#c6c2b8;
  --seal:#c8371d; --seal-soft:#fbe9e4; --seal-ink:#9d2a14;
  --ok:#1f7a4d;
  --radius:7px;
  --surface:#fff; --surface2:#f6f4ef; --bar:#f3f1ec; --bar2:#e9e6df; --panel:#ebe8e1; --hover:#efece5; --hover2:#e6e2d9;
  --tabbar:#e4e0d8; --tab:#d9d5cc; --tab-h:#d2cdc3; --tint:#fffaf8; --tint-line:#f1d5cc; --danger-soft:#fde8e4;
  --shadow:rgba(0,0,0,.12); --ruler-bg:#f3f1ec; --ruler-band:#fff; --ruler-ink:#57606a; --ruler-tick:#8c959f;
  color-scheme:light;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--desk);font-size:13px;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- ribbon ---------- */
.ribbon{background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:stretch;gap:0;padding:4px 8px;overflow-x:auto;overflow-y:hidden;flex:none;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:9px;padding:0 14px 0 4px;margin-right:4px;border-right:1px solid var(--line);white-space:nowrap}
.logo{width:32px;height:32px;display:block;flex:none;-webkit-user-drag:none;user-select:none}
.brand b{font-size:15px;letter-spacing:.04em}
.grp{display:flex;flex-direction:column;padding:0 6px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.grp .btns{display:flex;gap:2px;flex:1}
.grp .cap{font-size:10.5px;color:var(--ink3);text-align:center;letter-spacing:.12em;padding-top:1px}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;padding:5px 6px 4px;border:0;background:transparent;border-radius:var(--radius);cursor:pointer;white-space:nowrap;font-size:12px;color:var(--ink)}
.rb:hover{background:var(--hover)}
.rb:active{background:var(--hover2)}
.rb.on{background:var(--seal-soft);color:var(--seal-ink)}
.rb.on svg{stroke:var(--seal)}
.rb:disabled{opacity:.35;cursor:default;background:transparent}
.rb.primary svg{stroke:var(--seal)}
@media (max-width:1600px){ .brand b{display:none} .brand{padding-right:8px} .rb{min-width:40px;padding:5px 2px 4px;font-size:11.5px} .grp{padding:0 3px} .rs{padding:0 5px 0 3px} }
@media (max-width:1340px){ .rb{min-width:36px;font-size:11px;letter-spacing:-.02em} .rb svg.i{width:18px;height:18px} .grp .cap{font-size:10px;letter-spacing:.04em} .brand{display:none} }

/* ---------- view bar ---------- */
.tabbar{display:flex;align-items:flex-end;gap:2px;background:var(--tabbar);border-bottom:1px solid var(--line2);padding:5px 8px 0;overflow-x:auto;overflow-y:hidden;flex:none;scrollbar-width:thin}
.tabbar.hide{display:none}
.dtab{display:flex;align-items:center;gap:7px;max-width:230px;min-width:120px;padding:6px 6px 7px 12px;border-radius:8px 8px 0 0;background:var(--tab);cursor:pointer;font-size:12.5px;color:var(--ink2);border:1px solid transparent;border-bottom:0;position:relative;top:1px;user-select:none}
.dtab:hover{background:var(--tab-h)}
.dtab.on{background:var(--bar);color:var(--ink);border-color:var(--line2);font-weight:500}
.dtab .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtab .dd{width:7px;height:7px;border-radius:50%;background:#e08a00;flex:none}
.dtab .x{width:20px;height:20px;border:0;border-radius:5px;background:transparent;cursor:pointer;color:var(--ink3);font-size:15px;line-height:1;flex:none;display:grid;place-items:center}
.dtab .x:hover{background:rgba(0,0,0,.08);color:var(--seal-ink)}
.dtab-add{border:0;background:transparent;font-size:18px;color:var(--ink2);cursor:pointer;width:30px;height:28px;border-radius:6px;margin-bottom:2px;flex:none}
.dtab-add:hover{background:rgba(0,0,0,.07)}
.rstack{display:flex;flex-direction:column;justify-content:center;gap:1px;padding-left:2px}
/* 只顯示圖示: labels hidden (the buttons' titles still name them) */
.ribbon.icons-only .rb{font-size:0;gap:0;min-width:34px;padding:6px 5px}
.ribbon.icons-only .rb svg.i{width:21px;height:21px}
.ribbon.icons-only .rb .sp-lab{display:none}
.ribbon.icons-only .rb.split{padding:0;min-width:0}
.ribbon.icons-only .rb.split .sp-main{min-width:30px;padding:6px 3px 6px 6px}
.ribbon.icons-only .rb.split .sp-arr{font-size:10px}
.ribbon.icons-only .rs{font-size:0;gap:0;padding:0 5px;height:19px}
.ribbon.icons-only .rs svg.i{width:16px;height:16px}
.ribbon.icons-only .brand b{display:none}
/* 設定 */
.set-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 14px}
.set-tabs button{border:0;background:none;padding:8px 14px;font-size:13.5px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.set-tabs button:hover{color:var(--ink);background:#fff3bf;border-radius:6px 6px 0 0}
.set-tabs button.on{color:var(--seal-ink);border-bottom-color:var(--seal);font-weight:600}
.set-pane{min-height:250px}
.set-h{font-weight:600;font-size:13px;margin:4px 0 8px}
.set-h small{font-weight:400;color:var(--ink3);margin-left:6px}
.set-h:not(:first-child){margin-top:16px}
.set-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.set-opt:hover{background:var(--hover)}
.ppl-row{display:flex;align-items:center;gap:6px}
.ppl-row .set-opt{flex:1;min-width:0;overflow-wrap:anywhere}
.ppl-def{font-size:11.5px;color:var(--seal-ink);background:var(--seal-soft);border-radius:9px;padding:1px 8px;flex:none}
.ppl-del{border:0;background:none;width:30px;height:30px;border-radius:7px;cursor:pointer;color:var(--ink2);display:grid;place-items:center;flex:none}
.ppl-del:hover:not(:disabled){background:#ffe3e3;color:#c92a2a}
.ppl-del:disabled{opacity:.35;cursor:default}
.ppl-del svg.i{width:18px;height:18px}
.ppl-add{display:flex;gap:8px;margin-top:10px}
.ppl-add .ex-in{flex:1}
.set-opt small{color:var(--ink3);margin-left:4px}
.set-opt svg.i{width:17px;height:17px}
.set-btns{display:flex;align-items:center;gap:8px;margin-top:14px}
.set-btns .sp{flex:1}
.rs{display:flex;align-items:center;gap:5px;border:0;background:transparent;border-radius:5px;padding:0 8px 0 5px;height:16px;font-size:11.5px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.rs svg.i{width:14px;height:14px}
.rs:hover{background:var(--hover)}
.rs:disabled{opacity:.35;cursor:default;background:transparent}
.ctx{position:fixed;z-index:70;min-width:220px;background:var(--surface);border-radius:9px;box-shadow:0 10px 34px rgba(0,0,0,.22);padding:5px;display:none;font-size:13px}
.ctx button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:6px 10px;border-radius:6px;cursor:pointer;text-align:left}
.ctx button:hover:not(:disabled){background:var(--seal-soft);color:var(--seal-ink)}
.ctx button:disabled{color:var(--ink3);cursor:default}
.ctx button kbd{margin-left:auto}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.ctx .hd{font-size:11px;color:var(--ink3);padding:4px 10px 2px}
.viewbar{background:var(--bar);border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:6px;padding:5px 10px;flex:none;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin}
/* the bar never squashes its items; when narrow it sheds words step by step (fitViewbar), then scrolls sideways */
.viewbar>*{flex-shrink:0}
.viewbar .vt2{display:none}
.viewbar.c1 .lbl{display:none}
.viewbar.c2 [data-zoom] .vt{display:none}
.viewbar.c3 [data-view] .vt,.viewbar.c3 .chk .vt{display:none}
.viewbar.c3 .chk .vt2{display:inline}
.viewbar.c4 #bAids .vt,.viewbar.c4 [data-act="layers"] .vt{display:none}
.viewbar.c5{gap:3px;padding:5px 6px}
.viewbar.c5 .sep{margin:0 2px}
.vb{height:28px;min-width:28px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid transparent;background:transparent;border-radius:6px;cursor:pointer;font-size:12.5px}
.vb svg.i{width:17px;height:17px}
.vb:hover{background:var(--hover)}
.vb.on{background:var(--surface);border-color:var(--line2);color:var(--seal-ink);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.vb.on svg{stroke:var(--seal)}
.vb:disabled{opacity:.35;cursor:default;background:transparent}
.sep{width:1px;height:20px;background:var(--line2);margin:0 4px;flex:none}
.pager{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pager input{width:52px;height:28px;border:1px solid var(--line2);border-radius:6px;text-align:center;font:inherit;font-size:13px;background:var(--surface)}
.pager .tot{color:var(--ink2);min-width:46px}
.zoomsel{position:relative}
.zoomsel input{width:66px;height:28px;border:1px solid var(--line2);border-radius:6px;text-align:center;font:inherit;background:var(--surface);font-variant-numeric:tabular-nums}
.chk{display:inline-flex;align-items:center;gap:5px;color:var(--ink2);font-size:12px;cursor:pointer;padding:0 4px}
.lbl{color:var(--ink3);font-size:11.5px;letter-spacing:.1em;margin-right:2px}

/* ---------- hint bar ---------- */
.updbar{flex:none;display:none;align-items:center;gap:10px;padding:7px 14px;background:#1f3b2d;color:#fff;font-size:12.5px}
.updbar.show{display:flex}
.updbar .sp{flex:1}
.updbar .bar{width:160px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.updbar .bar i{display:block;height:100%;background:#7ee2a8;width:0}
.updbar button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:5px;padding:3px 10px;cursor:pointer;font-size:12px}
.updbar button.go{background:#2f9e62;border-color:#2f9e62}
.updwrap{position:relative;display:inline-flex}
.upddot{position:absolute;top:-2px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--seal);border:2px solid var(--paper);display:none}
.upddot.on{display:block}
#stVer{cursor:pointer;color:var(--ink3)}
#stVer:hover{color:var(--seal-ink)}
.hint{flex:none;display:none;align-items:center;gap:10px;padding:6px 14px;background:var(--seal);color:#fff;font-size:12.5px}
.hint.show{display:flex}
.hint .sp{flex:1}
.hint button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:5px;padding:3px 10px;cursor:pointer;font-size:12px}
.hint button:hover{background:rgba(255,255,255,.28)}
.swatch{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.6);cursor:pointer;padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.25)}

/* ---------- main ---------- */
.main{flex:1;display:flex;min-height:0}
.side{width:212px;flex:none;background:var(--panel);border-right:1px solid var(--line2);display:flex;flex-direction:column;min-height:0}
.side.hide{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line2);flex:none}
.tab{flex:1;border:0;background:transparent;padding:8px 0 7px;cursor:pointer;font-size:12.5px;color:var(--ink2);border-bottom:2px solid transparent}
.tab.on{color:var(--seal-ink);border-bottom-color:var(--seal);font-weight:500}
.panel{flex:1;overflow:auto;padding:10px;display:none}
.panel.on{display:block}
.thumb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:7px;cursor:pointer;margin-bottom:2px}
.thumb:hover{background:var(--hover2)}
.thumb.on .tn{text-decoration:underline;text-underline-offset:3px}
.thumb.sel{background:var(--surface);box-shadow:0 0 0 2px var(--seal) inset}
.thumb .tc{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);display:block}
.thumb .tn{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.thumb.sel .tn{color:var(--seal-ink);font-weight:500}
.empty-note{color:var(--ink3);font-size:12px;line-height:1.7;padding:8px 2px}
.sbtn{width:100%;border:1px dashed var(--ink3);background:transparent;border-radius:7px;padding:8px;cursor:pointer;color:var(--ink2);margin-bottom:10px}
.sbtn:hover{border-color:var(--seal);color:var(--seal-ink);background:var(--surface)}
/* page picker */
.pp-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pp-bar input[type=text]{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:5px 9px;width:180px}
.pp-bar .cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2)}
.pp-bar .cnt b{color:var(--seal-ink)}
.pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tw,130px),1fr));gap:12px;padding:12px;background:var(--panel);border-radius:9px;max-height:min(58vh,620px);overflow:auto;user-select:none}
.pp-card{position:relative;background:transparent;border-radius:8px;padding:8px 6px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid transparent}
.pp-card:hover{background:var(--hover2)}
.pp-card .th{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);display:grid;place-items:center;color:#c9c5bc;font-size:12px;width:100%}
.pp-card canvas{display:block;width:100%;height:100%}
.pp-card .num{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pp-card .ck{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1.5px solid var(--ink3);display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;z-index:2}
.pp-card.on{border-color:var(--seal);background:var(--surface)}
.pp-card:not(.on) .ck{color:transparent}
.pp-card.on .ck{background:var(--seal);border-color:var(--seal)}
.pp-card.on .num{color:var(--seal-ink);font-weight:500}
.pp-del .pp-card.on .th::after{content:"";position:absolute;inset:0;background:rgba(200,55,29,.28);background-image:linear-gradient(45deg,transparent 48.5%,rgba(200,55,29,.75) 48.5% 51.5%,transparent 51.5%),linear-gradient(-45deg,transparent 48.5%,rgba(200,55,29,.75) 48.5% 51.5%,transparent 51.5%)}
.pp-card.cur .num::after{content:" · 目前頁";color:var(--ink3);font-weight:400}
.pp-group{grid-column:1/-1;font-size:12.5px;font-weight:600;color:var(--ink2);padding:4px 2px 5px;border-bottom:1px solid var(--line2);overflow-wrap:anywhere}
.pp-group:not(:first-child){margin-top:6px}
.pp-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.pp-foot select{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;background:var(--surface)}
.att{background:var(--surface);border-radius:7px;padding:8px 9px;margin-bottom:7px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.att .nm{font-weight:500;word-break:break-all;font-size:12.5px}
.att .meta{color:var(--ink3);font-size:11px;margin:2px 0 6px}
.att .row{display:flex;gap:6px}
.mini{border:1px solid var(--line2);background:var(--surface2);border-radius:5px;padding:2px 8px;font-size:11.5px;cursor:pointer}
.mini:hover{border-color:var(--seal);color:var(--seal-ink)}
.mini.danger:hover{background:var(--danger-soft)}
.imgitem{background:var(--surface);border-radius:7px;padding:6px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid transparent}
.imgitem:hover{border-color:var(--seal)}
.imgitem canvas{width:100%;display:block;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/12px 12px}
.imgitem .meta{font-size:11px;color:var(--ink2);margin-top:5px;display:flex;justify-content:space-between}
.annitem{background:var(--surface);border-radius:7px;padding:7px 9px;margin-bottom:7px;cursor:pointer;border-left:3px solid #f2b705;font-size:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.annitem:hover{background:var(--tint)}
.annitem .k{color:var(--ink3);font-size:11px;margin-bottom:2px}

.vwrap{flex:1;position:relative;min-width:0}
.viewer{position:absolute;inset:0;overflow:auto;background:var(--desk);outline:none;scrollbar-gutter:stable}
.ruler,.rcorner{position:absolute;display:none;z-index:6}
.vwrap.rulers .ruler,.vwrap.rulers .rcorner{display:block}
.vwrap.rulers .viewer{top:20px;left:20px}
.ruler.h{top:0;left:20px;right:0;height:20px;cursor:s-resize}
.ruler.v{left:0;top:20px;bottom:0;width:20px;cursor:e-resize}
.rcorner{top:0;left:0;width:20px;height:20px;background:var(--bar2);border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.page .grd{position:absolute;inset:0;pointer-events:none;display:none;
  background-image:linear-gradient(to right,rgba(0,120,200,.14) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,120,200,.14) 1px,transparent 1px),
    linear-gradient(to right,rgba(0,120,200,.32) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,120,200,.32) 1px,transparent 1px)}
.show-grid .page .grd{display:block}
.page .gdl{position:absolute;inset:0;pointer-events:none;z-index:2}
.guide{position:absolute;pointer-events:auto;z-index:3}
.guide.h{left:-14px;right:-14px;height:0;border-top:1px solid #00a3ff;cursor:row-resize}
.guide.v{top:-14px;bottom:-14px;width:0;border-left:1px solid #00a3ff;cursor:col-resize}
.guide.h::before{content:"";position:absolute;left:0;right:0;top:-5px;height:9px}
.guide.v::before{content:"";position:absolute;top:0;bottom:0;left:-5px;width:9px}
.guide:hover{border-color:#c8371d}
.guide-ghost{position:fixed;z-index:96;pointer-events:none}
.guide-ghost.h{height:0;border-top:1px dashed #00a3ff}
.guide-ghost.v{width:0;border-left:1px dashed #00a3ff}
.guide-ghost.del{border-color:#c8371d}
.guide-lab{position:fixed;z-index:97;pointer-events:none;background:#22262b;color:#fff;font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap}
.snapline{position:absolute;pointer-events:none}
.snapline.h{left:0;right:0;border-top:1px solid #e0279b}
.snapline.v{top:0;bottom:0;border-left:1px solid #e0279b}
.xsel{position:absolute;outline:2px solid var(--seal);background:rgba(200,55,29,.07);cursor:move;z-index:4;box-shadow:0 0 0 1px rgba(255,255,255,.8) inset}
.xsel .h{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--seal);border-radius:3px;margin:-6px 0 0 -6px}
.xsel .h[data-d=n],.xsel .h[data-d=s]{cursor:ns-resize}
.xsel .h[data-d=e],.xsel .h[data-d=w]{cursor:ew-resize}
.xsel .h[data-d=nw],.xsel .h[data-d=se]{cursor:nwse-resize}
.xsel .h[data-d=ne],.xsel .h[data-d=sw]{cursor:nesw-resize}
.xbar{position:absolute;z-index:5;display:flex;gap:6px;align-items:center;background:#22262b;color:#fff;padding:5px 6px 5px 10px;border-radius:8px;font-size:12px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.xbar .dim{color:#cfd3d8;margin-right:4px;font-variant-numeric:tabular-nums}

.ap-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.ap-row .field{margin:0}
.ap-row select,.ap-row input{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;background:var(--surface);font-size:13px}
.ap-strip{display:flex;gap:12px;align-items:flex-end;overflow-x:auto;padding:16px 14px 12px;background:var(--panel);border-radius:9px;min-height:190px}
.ap-pg{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ap-pg .b{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);display:grid;place-items:center;overflow:hidden;color:#c9c5bc}
.ap-pg .b canvas,.ap-pg .b img{display:block;width:100%;height:100%}
.ap-pg.new .b{background:#fff;box-shadow:none;outline:2px dashed var(--seal);outline-offset:-2px;color:var(--seal);font-weight:700;font-size:13px}
.ap-pg.new{color:var(--seal-ink);font-weight:500}
.ap-pg.more{align-self:center;color:var(--ink3);font-size:18px;padding:0 4px}
.ap-sum{margin-top:10px;font-size:13px}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--bar);width:30px;font-size:16px;cursor:pointer}
.stepper button:hover{background:var(--seal-soft);color:var(--seal-ink)}
.ap-row .stepper input{border:0;border-radius:0;width:56px;text-align:center;padding:6px 2px}
.chips{display:flex;gap:4px}
.chips button{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12.5px}
.chips button.on{border-color:var(--seal);color:var(--seal-ink);background:var(--tint)}
.ap-strip{position:relative}
.ap-strip .ap-pg{cursor:pointer;position:relative}
.ap-strip .ap-pg:not(.new):hover .b{outline:2px solid var(--ink3);outline-offset:2px}
.ap-strip .ap-pg:not(.new):hover::after{content:"點選：插在此頁後";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--ink2);white-space:nowrap}
.ap-new{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:grab;touch-action:none;user-select:none}
.ap-new.dragging{opacity:.3}
.ap-new .stack{position:relative}
.ap-ghost i,.ap-new .stack i{position:absolute;inset:0;background:#fff;border:2px dashed var(--seal);border-radius:2px}
.ap-ghost b,.ap-new .stack b{position:absolute;inset:0;display:grid;place-items:center;color:var(--seal);font-size:13px;text-align:center;line-height:1.35;background:#fff;border:2px dashed var(--seal);border-radius:2px}
.ap-new .lb{font-size:11.5px;color:var(--seal-ink);font-weight:500;white-space:nowrap}
.ap-new .grip{font-size:10.5px;color:var(--ink3)}
.ap-ghost{position:fixed !important;z-index:95;pointer-events:none;opacity:.9;transform:translate(18px,-55%) rotate(-3deg);filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.ap-mark{position:absolute;top:8px;bottom:30px;width:4px;margin-left:-2px;background:var(--seal);border-radius:2px;display:none;pointer-events:none}
.ap-mark::before{content:"放在這裡";position:absolute;top:-2px;left:8px;background:var(--seal);color:#fff;font-size:11px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.ap-sum b{color:var(--seal-ink)}
/* 排列頁面: every page in a grid, dragged into a new order */
.ar-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ar-top .flab{flex:1;margin:0}
.ar-grid{position:relative;display:flex;flex-wrap:wrap;gap:18px 14px;align-items:flex-end;align-content:flex-start;padding:18px 14px 14px;background:var(--panel);border-radius:9px;min-height:200px;max-height:calc(100vh - 270px);overflow-y:auto}
.ar-pg{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;cursor:grab;touch-action:none;user-select:none;white-space:nowrap}
.ar-pg .b{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);overflow:hidden}
.ar-pg .b img{display:block;width:100%;height:100%}
.ar-pg:hover .b{outline:2px solid var(--ink3);outline-offset:2px}
.ar-pg.moved{color:var(--seal-ink);font-weight:500}
.ar-pg.moved .b{outline:2px solid var(--seal);outline-offset:2px}
.ar-pg.dragging{opacity:.3}
.ar-ghost{position:fixed;z-index:95;pointer-events:none;opacity:.9;transform:translate(18px,-55%) rotate(-3deg);filter:drop-shadow(0 8px 16px rgba(0,0,0,.25));background:#fff}
.ar-ghost img{display:block;width:100%;height:100%}
.ar-mark{position:absolute;width:4px;margin-left:-2px;background:var(--seal);border-radius:2px;display:none;pointer-events:none}
.ar-sum{margin-top:10px;font-size:13px}
.ar-sum b{color:var(--seal-ink)}
.page canvas.pc{position:absolute;inset:0;width:100%;height:100%;display:block}
.page .ovl{position:absolute;inset:0}
.page .ld{position:absolute;inset:0;display:grid;place-items:center;color:#c9c5bc;font-size:12px}
.tool-note .page,.tool-textbox .page,.tool-signature .page{cursor:crosshair}
.tool-highlight .page,.tool-digisign .page,.tool-extract .page,.tool-ocr .page,.tool-link .page{cursor:crosshair}
.lnk{position:absolute;display:none;outline:1.5px solid rgba(28,100,217,.75);background:rgba(28,100,217,.08);border-radius:2px;cursor:pointer;z-index:3}
.tool-link .lnk{display:block}
.lnk:hover{background:rgba(28,100,217,.18)}
/* 文字辨識: the box stays marked while its result is shown */
.ocrmark{position:absolute;border:2px dashed #1c64d9;background:rgba(28,100,217,.08);pointer-events:none;z-index:5;border-radius:2px}
.ocrp{position:fixed;z-index:60;width:380px;max-width:calc(100vw - 24px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.22);display:flex;flex-direction:column;font-size:13px}
.ocr-hd{display:flex;align-items:center;gap:8px;padding:9px 10px 6px 12px;cursor:move;user-select:none}
.ocr-hd b{font-size:13.5px}
.ocr-src{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocr-hd .sp,.ocr-ft .sp{flex:1}
.ocr-x{width:26px;height:26px;border:0;border-radius:6px;background:none;color:var(--ink2);cursor:pointer;font-size:14px}
.ocr-x:hover{background:#fff3bf;color:#1f2328}
.ocr-st{display:flex;align-items:center;gap:8px;padding:0 12px 6px;font-size:12px;color:var(--ink2);min-height:18px}
.ocr-bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.ocr-bar i{display:block;height:100%;width:0;background:#1c64d9;transition:width .2s}
.ocr-tx{margin:0 12px;min-height:110px;max-height:46vh;height:150px;resize:vertical;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--ink);font:14px/1.6 "Noto Sans TC","Microsoft JhengHei",sans-serif;white-space:pre-wrap}
.ocr-tx:focus{outline:2px solid rgba(28,100,217,.35);border-color:#1c64d9}
.ocr-ft{display:flex;align-items:center;gap:6px;padding:9px 12px 11px}
.ocr-ft button{height:28px;padding:0 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);cursor:pointer;font-size:12.5px;white-space:nowrap}
.ocr-ft button:hover{background:#fff3bf;color:#1f2328}
.ocr-ft button.pri{background:var(--seal);border-color:var(--seal);color:#fff;font-weight:600}
.ocr-ft button.pri:hover{filter:brightness(1.08);color:#fff;background:var(--seal)}
.ocr-ft button:disabled{opacity:.45;cursor:default}
.ocr-ft .tsw button{height:24px;border:0;padding:0 9px}
.ocr-ft .tsw button.on{background:var(--seal);color:#fff}
/* 字型辨識: the 字型 tab of the 文字辨識 window */
.ocr-tabs{display:inline-flex;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:2px;flex:none}
.ocr-tabs button{height:22px;padding:0 10px;border:0;border-radius:5px;background:none;color:var(--ink2);cursor:pointer;font-size:12px}
.ocr-tabs button:hover{background:#fff3bf;color:#1f2328}
.ocr-tabs button.on,.ocr-tabs button.on:hover{background:var(--seal);color:#fff}
.ocrp.fonts .ocr-st,.ocrp.fonts .ocr-tx,.ocrp.fonts .ocr-ft:not(.ocr-ft2),.ocrp.fonts .ocr-src,.ocrp:not(.fonts) .ocr-fonts,.ocrp:not(.fonts) .ocr-ft2{display:none!important}
.ocr-fonts{margin:0 12px;min-height:110px;max-height:52vh;overflow:auto;padding:4px 9px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface2)}
.fi-st{display:flex;align-items:center;gap:8px;min-height:20px;padding:2px 0;font-size:12px;color:var(--ink2)}
.fi-st:empty,.fi-st.idle{display:none}
.fi-bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.fi-bar i{display:block;height:100%;width:0;background:#1c64d9;transition:width .2s}
.fi-h{margin:8px 0 0;font-size:11.5px;font-weight:600;color:var(--ink3)}
.fi-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:8px;row-gap:1px;align-items:center;padding:6px 1px;border-bottom:1px solid var(--line)}
.fi-row:last-child{border-bottom:0}
.fi-sample{grid-column:1/-1;font-size:20px;line-height:1.35;color:var(--ink);white-space:nowrap;overflow:hidden}
.fi-name{display:flex;align-items:baseline;min-width:0;font-size:12.5px}
.fi-label{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-src{flex:none;margin-left:6px;font-size:11px;color:var(--ink3);white-space:nowrap}
.fi-pct{font-size:13px;font-weight:700;color:#1c64d9;font-variant-numeric:tabular-nums}
.fi-row button,.fi-more{height:24px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;font-size:12px;white-space:nowrap}
.fi-row button:hover,.fi-more:hover{background:#fff3bf;color:#1f2328}
.fi-none{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.fi-hint{grid-column:1/-1;font-size:11.5px;color:#a85400}
.fi-note{margin:6px 0 0;font-size:11px;color:var(--ink3)}
.fi-by{margin:8px 0 2px}
/* 版本記錄 (what's new) */
.wn{max-height:min(60vh,520px);overflow:auto;padding:0 2px;line-height:1.6}
.wn .wn-v{margin:14px 0 4px;font-size:15px;color:var(--seal)}
.wn .wn-v:first-child{margin-top:0}
.wn h4{margin:8px 0 2px;font-size:13.5px}
.wn ul{margin:2px 0 6px;padding-left:20px}
.wn li{margin:2px 0}
.wn p{margin:4px 0}
.wn code{font-size:12px;padding:0 3px;border-radius:3px;background:var(--surface2)}
.ocr-gf{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);cursor:pointer;user-select:none}
html[data-theme="dark"] .fi-pct{color:#7fb3ff}
html[data-theme="dark"] .fi-hint{color:#f2a65a}
.tool-hand .page{cursor:grab}

.imgbox{position:absolute;display:none;border:2px solid var(--seal);background:rgba(200,55,29,.10);cursor:pointer;border-radius:2px}
.imgbox span{position:absolute;left:-2px;top:-20px;background:var(--seal);color:#fff;font-size:11px;padding:1px 6px;border-radius:3px 3px 0 0;white-space:nowrap}
.imgbox:hover{background:rgba(200,55,29,.22)}
.tool-extract .imgbox{display:block}
.annhit{position:absolute;display:none;cursor:pointer;border-radius:2px}
.tool-select .annhit{display:block}
.annhit:hover{outline:2px solid rgba(200,55,29,.55);outline-offset:1px}
.annhit.noap{background:#ffd43b;border:1px solid #b38600;width:18px!important;height:18px!important;border-radius:3px}
.annhit.sig{outline:1.5px dashed var(--ok)}
.draft{position:absolute;border:1.5px dashed var(--seal);background:rgba(200,55,29,.08);pointer-events:none}
.draft.hl{border:0;background:rgba(255,212,59,.45);mix-blend-mode:multiply}

.tip{position:fixed;z-index:60;max-width:280px;background:#22262b;color:#fff;padding:7px 10px;border-radius:7px;font-size:12px;line-height:1.55;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:pre-wrap;display:none}
.pop{position:fixed;z-index:61;width:260px;background:var(--surface);border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,.25);padding:12px;font-size:12.5px;display:none}
.pop .k{color:var(--ink3);font-size:11px;margin-bottom:4px}
.pop .c{white-space:pre-wrap;line-height:1.6;max-height:180px;overflow:auto;margin-bottom:10px}
.pop .row{display:flex;justify-content:flex-end;gap:6px}

/* ---------- empty state ---------- */
.welcome{position:absolute;inset:0;display:grid;place-items:center;padding:20px}
.wcard{background:var(--paper);border-radius:14px;padding:34px 38px;max-width:520px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.12);text-align:center;border:2px dashed transparent;transition:border-color .15s}
.drop .wcard{border-color:var(--seal)}
.wcard .logo{width:76px;height:76px;margin:0 auto 14px}
.wcard h1{font-size:21px;margin:0 0 8px;letter-spacing:.03em}
.wcard p{color:var(--ink2);margin:0 0 22px;line-height:1.7}
.wcard .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:9px 18px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.pri:hover{background:var(--seal-ink)}
.btn.pri svg{stroke:#fff}
.btn:disabled{opacity:.5;cursor:default}
.keys{margin-top:24px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:12px;color:var(--ink2);max-width:330px;margin-left:auto;margin-right:auto}
kbd{font-family:inherit;background:var(--surface);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;color:var(--ink)}

/* ---------- status ---------- */
.status{flex:none;height:26px;background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 12px;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px}
.status .dot.dirty{background:#e08a00}
.status .sig{color:var(--ok);font-weight:500}
.status .sp{flex:1}
.wmode{display:inline-flex;align-items:center;gap:6px}
.wmode b{font-weight:500;color:var(--ok)}
.wmode.ro b{color:#a15c00}
.wmode label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(25,22,18,.45);display:none;place-items:center;z-index:80;padding:16px}
.mask.show{display:grid}
.modal{background:var(--surface);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:96vw;max-height:94vh;display:flex;flex-direction:column;min-width:320px}
.modal .mh{padding:14px 18px 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal .mh::before{content:"";width:4px;height:16px;background:var(--seal);border-radius:2px}
.modal .mb{padding:4px 18px 14px;overflow:auto;line-height:1.6}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.modal .mf .sp{flex:1}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.field label,.flab{font-size:12px;color:var(--ink2)}
.field input[type=text],.field input[type=password],.field input[type=number],.field textarea,.field select{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:7px 9px;font-size:13.5px;background:var(--surface)}
.field textarea{resize:vertical;min-height:90px}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid rgba(200,55,29,.25);border-color:var(--seal)}
.frow{display:flex;gap:10px}
.frow>.field{flex:1}
.radio{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line2);border-radius:8px;margin-bottom:8px;cursor:pointer}
.radio:has(input:checked){border-color:var(--seal);background:var(--tint)}
.radio small{display:block;color:var(--ink3);font-size:11.5px}
.note{background:var(--surface2);border-radius:8px;padding:9px 11px;font-size:12px;color:var(--ink2);line-height:1.65}
.note.warn{background:#fff4e0;color:#7a4b00}

.padwrap{border:1px solid var(--line2);border-radius:8px;background:#fff;position:relative;touch-action:none}
.padwrap::after{content:"";position:absolute;left:24px;right:24px;bottom:46px;border-bottom:1px dashed #cfcac0;pointer-events:none}
.padwrap canvas{display:block;width:100%;height:220px;cursor:crosshair}
.pens{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pen{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2);cursor:pointer;padding:0}
.pen.on{box-shadow:0 0 0 2px var(--seal)}

/* crop */
.cropstage{background:#2b2a28;border-radius:9px;padding:18px;overflow:hidden;display:grid;place-items:center;min-height:240px;user-select:none}
.cropwrap{position:relative;line-height:0;background:repeating-conic-gradient(#555 0 25%,#666 0 50%) 0 0/16px 16px}
.cropwrap canvas{display:block}
.cropbox{position:absolute;outline:1.5px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.58);cursor:move}
.cropclip{position:absolute;inset:0}
.cropbox .h{position:absolute;width:14px;height:14px;background:#fff;border:2px solid var(--seal);border-radius:3px;margin:-7px 0 0 -7px}
.cropbox .h[data-d=n],.cropbox .h[data-d=s]{cursor:ns-resize}
.cropbox .h[data-d=e],.cropbox .h[data-d=w]{cursor:ew-resize}
.cropbox .h[data-d=nw],.cropbox .h[data-d=se]{cursor:nwse-resize}
.cropbox .h[data-d=ne],.cropbox .h[data-d=sw]{cursor:nesw-resize}
.cropbox .g{position:absolute;border:0 solid rgba(255,255,255,.35);pointer-events:none}
.cropctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.cropctl .field{margin:0}
.cropctl input{width:100%}
.cropinfo{font-size:12px;color:var(--ink2);margin-top:8px;font-variant-numeric:tabular-nums}

/* toast & busy */
.toasts{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#22262b;color:#fff;padding:8px 16px;border-radius:20px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:tin .2s ease-out}
.toast.err{background:var(--seal-ink)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.busy{position:fixed;inset:0;z-index:85;display:none;place-items:center;background:rgba(255,255,255,.25);cursor:progress}
.busy.show{display:grid}
.busy.quiet{background:transparent}
.busy.quiet>div{visibility:hidden}
.busy div{background:var(--surface);padding:12px 20px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border:2px solid #eee;border-top-color:var(--seal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
input[type=file]{display:none}

html[data-theme="dark"]{
  --ink:#e8e6e3; --ink2:#b4b1ab; --ink3:#87847e;
  --paper:#232427; --line:#36373b; --line2:#47484d; --desk:#141416; --desk2:#101012;
  --seal:#e8573c; --seal-soft:#3b2521; --seal-ink:#ff8f78; --ok:#4cc38a;
  --surface:#2e2f33; --surface2:#27282b; --bar:#2a2b2e; --bar2:#26272a; --panel:#1e1f22; --hover:#36373b; --hover2:#404146;
  --tabbar:#19191b; --tab:#252629; --tab-h:#2d2e31; --tint:#2c2422; --tint-line:#5b342c; --danger-soft:#4a241d;
  --shadow:rgba(0,0,0,.5); --ruler-bg:#26272a; --ruler-band:#33343a; --ruler-ink:#b4b1ab; --ruler-tick:#6d6a65;
  color-scheme:dark;
}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{color:var(--ink)}
html[data-theme="dark"] .nbd textarea{color:#1f2328}
html[data-theme="dark"] .page{box-shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.55)}
html[data-theme="dark"] .thumb .tc{box-shadow:0 1px 3px rgba(0,0,0,.6)}
html[data-theme="dark"] .modal{box-shadow:0 20px 60px rgba(0,0,0,.6);border:1px solid var(--line)}

<!-- ribbon -->
<div class="ribbon" id="ribbon">

  <div class="grp"><div class="btns">
    <button class="rb split" data-amenu="openm" title="開啟：點按開啟檔案，點 ▾ 選擇（開啟檔案、從網址開啟）"><span class="sp-main"></span><span class="sp-arr">▾</span></button>
    <button class="rb primary" data-act="save" data-need title="另存新檔 (Ctrl+S)：修改後的內容一律存成新檔案，不會覆蓋原檔"><i data-i="save"></i>另存新檔</button>
    <button class="rb split" data-amenu="output" data-need title="輸出：點按執行，點 ▾ 選擇（列印、轉存圖片）"><span class="sp-main"></span><span class="sp-arr">▾</span></button>
  </div><div class="cap">檔案</div></div>
  <div class="grp"><div class="btns"><div class="rstack">
    <button class="rs" data-act="undo" id="bUndo" title="復原 (Ctrl+Z)"><i data-i="undo"></i>復原</button>
    <button class="rs" data-act="redo" id="bRedo" title="重做 (Ctrl+Y)"><i data-i="redo"></i>重做</button>
  </div></div><div class="cap">編輯</div></div>
  <div class="grp"><div class="btns">

let dlPromise = null;
function getDownloads(){
  if (!dlPromise && DESK) dlPromise = Promise.resolve({save: async ({filename, data}) => {
    const u8 = new Uint8Array(await (data instanceof Blob ? data : new Blob([data])).arrayBuffer());
    const where = await DESK.saveAs(filename, u8);

  }});

  return dlPromise;
}
setTimeout(getDownloads, 0);

// clean: drop what the document no longer uses first (deleted notes, replaced pictures, leftovers in the original file);

async function saveAsNew(bytes, suffix, {clean = true} = {}){
  if (clean && !S.signed) { busy(true, '正在整理檔案…'); try { bytes = await pruneUnused(bytes); } finally { busy(false); } }
  const base = S.name.replace(/\.pdf$/i, '').replace(/_已編輯(\(\d+\))?$/, '');
  const fn = base + suffix + '.pdf';
  const orig = S.handle && (S.handle.orig || S.handle.path);
  if (DESK) {
    const dir = S.handle && S.handle.path ? S.handle.path.replace(/[\\/][^\\/]*$/, '') : '';
    const where = await DESK.saveAs(dir ? dir + (S.handle.path.includes('\\') ? '\\' : '/') + fn : fn, bytes, {avoid:orig ? [orig] : []});
    if (!where) { toast('已取消儲存'); return false; }
    if (where.error) { toast(where.error, 'err'); return false; }
    const name = where.split(/[\\/]/).pop();
    S.dirty = false; S.name = name; S.handle = {...desktopHandle(where, name), orig};
    updateUI(); toast('已另存新檔：' + name);
    return true;
  }
  if (await saveFile(fn, new Blob([bytes], {type:'application/pdf'}))) { S.dirty = false; updateUI(); return true; }

async function saveFile(filename, data){
  const blob = data instanceof Blob ? data : new Blob([data]);
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({filename, data:blob}); toast((DESK ? '已儲存 ' : '已下載 ') + filename); return true; }
    catch (e) {
      const c = e && e.code;

      else if (c === 'rate_limited') toast('已有下載確認視窗開啟中，請稍候', 'err');
      else toast('下載失敗：' + (e && (e.message || c) || e), 'err');

    }

function mountDoc({scroll = 'current', anchorOffset = 0, scrollTop = 0, scrollLeft = 0, prev = null} = {}){

  // pages are matched by identity, so after adding or deleting pages every picture still sits on its own page
  const reuse = prev && prev.els && prev.pages && prev.map ? prev : null;
  S.els = S.pages.map((p, i) => {
    const d = document.createElement('div'); d.className = 'page'; d.dataset.i = i;
    d.innerHTML = `<div class="ld">${i + 1}</div><div class="grd"></div><div class="ovl"></div><div class="gdl"></div>`;
    const j = reuse ? reuse.map[i] : -1, o = j >= 0 && reuse.els[j], op = j >= 0 && reuse.pages[j];
    if (o && samePic(op, p)) {
      const c = o.querySelector('canvas.pc');
      if (c) { d.querySelector('.ld').remove(); d.insertBefore(c, d.firstChild); }
      o.querySelectorAll('.hold, svg.dsvg').forEach(h => { h.classList.add('hold'); d.appendChild(h); });
    } else if (reuse && reuse.pre && reuse.pre.has(i)) { d.querySelector('.ld').remove(); d.insertBefore(reuse.pre.get(i).c, d.firstChild); }
    return d;
  });
  pagesEl.innerHTML = '';
  S.st = S.pages.map(() => ({rendered:0, ver:-1, task:null, ovlVer:-1}));
  XS = null; AS = null; MS = null; rulerPage = -1; clearSnapMarks(); if (NP) closeNoteDom(); POLY = null; paintObjBar();
  $('#welcome').style.display = 'none';
  $$('[data-need]').forEach(b => b.disabled = false);
  if (S.zoomMode !== 'custom') S.scale = fitScale(S.zoomMode);
  if (reuse && reuse.pre) reuse.pre.forEach((v, i) => { if (v.scale === S.scale) { S.st[i].rendered = v.scale; S.st[i].ver = S.version; } });   // already drawn at this size
  layout();
  if (scroll === 'anchor') viewer.scrollTop = S.pos[S.current] ? S.pos[S.current].y + anchorOffset : 0;
  else if (scroll === 'restore') { viewer.scrollTop = scrollTop; viewer.scrollLeft = scrollLeft; updateCurrentFromScroll(); }
  else scrollToPage(S.current);
  updateUI(); scheduleRender(0);
  buildThumbs(reuse ? reuse.map : null, reuse && reuse.pre); refreshPanels(); applyViewAids();
  if (FIND.open) {   // the matches were for the document as it was: gone at once (the current one remembered), found again
    const h = FIND.hits[FIND.cur]; if (h) FIND.keep = {i:h.i, li:h.li, s:h.s};
    FIND.hits = []; FIND.cur = -1; FIND.done = ''; paintFind(); buildFindPanel(); if (FIND.q) setFindLabel('搜尋中…');
    scheduleFind();
  }
}

// the same file: Windows paths ignore case and the slash's direction
const samePath = (a, b) => !!a && !!b && (a === b || (/^[A-Za-z]:[\\/]/.test(a) && a.replace(/\//g, '\\').toLowerCase() === String(b).replace(/\//g, '\\').toLowerCase()));
async function openFile(file, handle = null, {rethrow = false} = {}){
  if (!file) return;
  await whenIdle();   // (a file sent while a change is being made opens after it)
  // the same file is already open: just switch to its tab
  const same = handle && handle.path && docs.findIndex(d => { const h = docField(d, 'handle'); return h && samePath(h.path, handle.path); });
  if (same >= 0) { switchTab(same); toast('「' + file.name + '」已經開啟'); return; }
  busy(true, '開啟中…');
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    await openInNewTab(bytes, file.name, handle);
    toast('已開啟 ' + file.name + '（修改不會動到原檔，完成後請另存新檔）');
  } catch (e) {
    console.error(e);
    toast(e && e.name === 'PasswordException' ? '此 PDF 受密碼保護，目前版本尚不支援' : '無法開啟此檔案：' + (e.message || e), 'err');
    if (rethrow) throw e;
  } finally { busy(false); }
}

/* ====================================================================
   Layout
   ==================================================================== */
const isCont = () => S.view === 'continuous' || S.view === 'two-continuous';
const isTwo = () => S.view === 'two' || S.view === 'two-continuous';
function rowsFor(){
  const n = S.pages.length, rows = [];
  if (!isTwo()) { for (let i = 0; i < n; i++) rows.push([i]); return rows; }
  let i = 0;
  if (S.cover && n) { rows.push([0]); i = 1; }
  for (; i < n; i += 2) rows.push(i + 1 < n ? [i, i + 1] : [i]);
  return rows;
}
const rowOf = p => S.rows.findIndex(r => r.includes(p));

function layout(){
  S.rows = rowsFor();
  const sc = S.scale, n = S.pages.length;
  const shown = isCont() ? S.rows.map((_, i) => i) : [Math.max(0, rowOf(S.current))];
  if (MS && !shown.some(ri => (S.rows[ri] || []).includes(MS.i))) clearMulti();   // its page is no longer on screen
  let maxW = 0;
  shown.forEach(ri => S.rows[ri].forEach(p => maxW = Math.max(maxW, S.pages[p].w * sc)));
  const contentW = (isTwo() ? 2 * maxW + GAP : maxW) + 2 * MARGIN;
  const W = Math.max(contentW, viewer.clientWidth), cx = W / 2;
  const pos = new Array(n).fill(null);
  let y = MARGIN;
  for (const ri of shown) {
    const row = S.rows[ri];
    const rh = Math.max(...row.map(p => S.pages[p].h * sc));
    if (isTwo()) {
      if (row.length === 2) {
        const [L, R] = row;
        pos[L] = {x: cx - GAP / 2 - S.pages[L].w * sc, y: y + (rh - S.pages[L].h * sc) / 2};
        pos[R] = {x: cx + GAP / 2, y: y + (rh - S.pages[R].h * sc) / 2};
      } else {
        const p = row[0], w = S.pages[p].w * sc;
        pos[p] = {x: (S.cover && p === 0) ? cx + GAP / 2 : cx - GAP / 2 - w, y};
      }
    } else {
      const p = row[0]; pos[p] = {x: cx - S.pages[p].w * sc / 2, y};
    }
    y += rh + GAP;
  }
  const H = y - GAP + MARGIN;
  pagesEl.style.width = W + 'px'; pagesEl.style.height = H + 'px';
  S.pos = pos;
  S.els.forEach((el, i) => {
    const p = pos[i];
    if (!p) { if (el.parentNode) el.remove(); return; }
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    el.style.width = S.pages[i].w * sc + 'px'; el.style.height = S.pages[i].h * sc + 'px';
    if (!el.parentNode) pagesEl.appendChild(el);
  });
  if (typeof NP !== 'undefined' && NP) positionNote();
}

function fitScale(mode){
  if (mode === 'actual') return PX;
  if (!S.pages.length) return S.scale;
  const rows = rowsFor(); const row = rows[Math.max(0, rows.findIndex(r => r.includes(S.current)))] || [0];
  // fit-width fits the widest page that is laid out (all pages in continuous views), so mixed
  // portrait/landscape documents never need a horizontal scrollbar; fit-page also fits the current spread's height
  const shownPages = isCont() ? S.pages.map((_, i) => i) : row;
  const pw = (isTwo() ? 2 : 1) * Math.max(...shownPages.map(p => S.pages[p].w));
  const ph = Math.max(...row.map(p => S.pages[p].h));
  const aw = viewer.clientWidth - 2 * MARGIN - (isTwo() ? GAP : 0) - (mode === 'fit-width' ? 2 : 0);
  const ah = viewer.clientHeight - 2 * MARGIN;
  const sw = aw / pw;
  return clamp(mode === 'fit-width' ? sw : Math.min(sw, ah / ph), MIN_Z * PX, MAX_Z * PX);
}

/* zoom keeping the point under the cursor fixed */
function zoomTo(newScale, clientX, clientY, mode = 'custom'){
  if (!S.pdf) return;
  newScale = clamp(newScale, MIN_Z * PX, MAX_Z * PX);
  const r = viewer.getBoundingClientRect();
  const ax = (clientX ?? r.left + viewer.clientWidth / 2) - r.left;
  const ay = (clientY ?? r.top + viewer.clientHeight / 2) - r.top;
  const X = viewer.scrollLeft + ax, Y = viewer.scrollTop + ay;
  const old = S.scale;
  let best = -1, bd = Infinity;
  S.pos.forEach((p, i) => {
    if (!p) return;
    const w = S.pages[i].w * old, h = S.pages[i].h * old;
    const dx = Math.max(p.x - X, 0, X - (p.x + w)), dy = Math.max(p.y - Y, 0, Y - (p.y + h));
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  });
  let px = 0, py = 0;
  if (best >= 0) { px = (X - S.pos[best].x) / old; py = (Y - S.pos[best].y) / old; }
  S.scale = newScale; S.zoomMode = mode;
  layout();
  if (best >= 0) {
    viewer.scrollLeft = S.pos[best].x + px * newScale - ax;
    viewer.scrollTop = S.pos[best].y + py * newScale - ay;
  }
  updateZoomUI(); scheduleRender(140); drawRulers();
}
function setZoomMode(mode){
  if (!S.pdf) return;
  const cur = S.current, off = S.pos[cur] ? (viewer.scrollTop - S.pos[cur].y) / S.scale : 0;
  S.zoomMode = mode; S.scale = fitScale(mode); layout();
  if (mode === 'fit-page') scrollToPage(cur);
  else if (S.pos[cur]) viewer.scrollTop = S.pos[cur].y + Math.max(0, off) * S.scale;
  updateZoomUI(); scheduleRender(0);
}
function setView(v){
  if (!S.pdf) return;
  const cur = S.current;
  S.view = v; if (S.zoomMode !== 'custom') S.scale = fitScale(S.zoomMode);
  layout(); scrollToPage(cur); updateUI(); scheduleRender(0);
}

function scrollToPage(i){
  if (!S.pdf) return;
  i = clamp(i, 0, S.pages.length - 1);
  if (!isCont()) { S.current = i; layout(); viewer.scrollTop = 0; }
  else {
    S.current = i;
    const p = S.pos[i], row = S.rows[rowOf(i)] || [i];
    const top = Math.min(...row.map(k => S.pos[k] ? S.pos[k].y : Infinity));
    if (p) viewer.scrollTop = Math.max(0, top - MARGIN / 2);
    const w = S.pages[i].w * S.scale;
    if (p && pagesEl.offsetWidth > viewer.clientWidth) viewer.scrollLeft = Math.max(0, p.x + w / 2 - viewer.clientWidth / 2);
  }
  updatePager(); scheduleRender(0);
}
function goPage(delta){
  if (!S.pdf) return;
  if (isTwo()) {
    const ri = clamp(rowOf(S.current) + delta, 0, S.rows.length - 1);
    scrollToPage(S.rows[ri][0]);
  } else scrollToPage(S.current + delta);
}

function updateCurrentFromScroll(){
  if (!S.pdf || !isCont()) return;
  const mid = viewer.scrollTop + viewer.clientHeight * 0.35;
  let cur = S.current;
  for (let i = 0; i < S.pages.length; i++) {
    const p = S.pos[i]; if (!p) continue;
    if (p.y + S.pages[i].h * S.scale + GAP / 2 >= mid) { cur = i; break; }
  }
  if (viewer.scrollTop + viewer.clientHeight >= viewer.scrollHeight - 2) {
    // at the very bottom, make the last row current
    const last = S.rows[S.rows.length - 1]; if (last && S.pos[last[0]] && S.pos[last[0]].y < viewer.scrollTop + viewer.clientHeight) cur = Math.max(cur, last[0]);
  }
  if (cur !== S.current) { S.current = cur; updatePager(); }
}

/* ====================================================================
   Rendering
   ==================================================================== */
let renderTimer = 0;
function scheduleRender(delay){ clearTimeout(renderTimer); renderTimer = setTimeout(renderVisible, delay); }
function pagesInView(buffer){
  const top = viewer.scrollTop - buffer, bot = viewer.scrollTop + viewer.clientHeight + buffer, out = [];
  S.pos.forEach((p, i) => { if (p && p.y < bot && p.y + S.pages[i].h * S.scale > top) out.push(i); });
  return out;
}
function renderVisible(){
  if (!S.pdf) return;
  const near = pagesInView(viewer.clientHeight * 0.6);
  near.sort((a, b) => Math.abs(a - S.current) - Math.abs(b - S.current)).forEach(renderPage);
  const keep = new Set(pagesInView(viewer.clientHeight * 3));
  S.els.forEach((el, i) => {
    if (keep.has(i)) return;
    const c = el.querySelector('canvas.pc');
    if (c) { c.width = c.height = 0; c.remove(); S.st[i].rendered = 0; }
    if (S.st[i].task) { S.st[i].task.cancel(); S.st[i].task = null; }
  });
}
async function renderPage(i){
  const st = S.st[i], want = S.scale, ver = S.version;
  if (st.rendered === want && st.ver === ver) { ensureOverlay(i); return; }
  if (st.task && st.taskScale === want) return;
  if (st.task) st.task.cancel();
  const pg = S.pages[i];
  const dpr = window.devicePixelRatio || 1;
  let rs = want * dpr;
  const maxPx = 16e6;
  if (pg.w * pg.h * rs * rs > maxPx) rs = Math.sqrt(maxPx / (pg.w * pg.h));
  const vp = pg.page.getViewport({scale:rs});
  const c = document.createElement('canvas'); c.className = 'pc';
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  const task = pg.page.render({canvasContext:c.getContext('2d'), viewport:vp, annotationMode:pdfjsLib.AnnotationMode.ENABLE});
  st.task = task; st.taskScale = want;
  try { await task.promise; }
  catch (e) { if (!e || e.name !== 'RenderingCancelledException') console.error(e); return; }
  finally { if (st.task === task) st.task = null; }
  if (ver !== S.version) return;
  const el = S.els[i], oldC = el.querySelector('canvas.pc');
  if (oldC) { oldC.replaceWith(c); oldC.width = oldC.height = 0; } else el.insertBefore(c, el.firstChild);
  const ld = el.querySelector('.ld'); if (ld) ld.remove();
  el.querySelectorAll('.hold').forEach(n => n.remove());   // what stood in for the edit until now
  st.rendered = want; st.ver = ver;
  ensureOverlay(i);
}

/* overlays: annotation hit-areas + detected image boxes (positioned in %) */
async function ensureOverlay(i){
  const st = S.st[i]; if (st.ovlVer === S.version) return; st.ovlVer = S.version;
  const ver = S.version, el = S.els[i], ovl = el.querySelector('.ovl'), pg = S.pages[i];
  const [anns, imgs, lnks] = await Promise.all([getAnns(i), detectImages(i), pageLinks(i)]);
  if (ver !== S.version) return;
  ovl.querySelectorAll('.annhit,.imgbox,.lnk').forEach(n => n.remove());
  const pct = (v, t) => (v / t * 100) + '%';
  anns.forEach(a => {
    const d = document.createElement('div'); d.className = 'annhit' + (a.noap ? ' noap' : '') + (a.sig ? ' sig' : '') + (a.subtype === 'Text' ? ' txt' : '');
    d.style.left = pct(a.x, pg.w); d.style.top = pct(a.y, pg.h); d.style.width = pct(a.w, pg.w); d.style.height = pct(a.h, pg.h);
    if (a.subtype === 'Text') {
      if (a.noap) d.innerHTML = NOTE_SVG;
      d.title = (a.author ? a.author + '：' : '') + (a.contents || '').slice(0, 80);
      d.addEventListener('pointerdown', ev => { if ((S.tool === 'select' || S.tool === 'note') && !S.spaceDown && ev.button === 0) { ev.stopPropagation(); if (S.tool === 'select') { if (ev.shiftKey) toggleMulti(i, a); else noteIconDown(ev, i, a); } } });
      d.addEventListener('click', ev => { if (S.tool === 'note' && !S.spaceDown) { ev.stopPropagation(); if (NP && NP.note.id === a.id) return; closeNote(true); openNoteById(i, a.id); } });
      ovl.appendChild(d); return;
    }
    d.addEventListener('pointerenter', ev => showTip(ev, a.label + (a.contents ? '\n' + a.contents : '')));
    d.addEventListener('pointermove', moveTip);
    d.addEventListener('pointerleave', hideTip);
    d.addEventListener('pointerdown', ev => {
      if (S.tool !== 'select' || S.spaceDown || ev.button !== 0) return;
      ev.stopPropagation(); hideTip();
      if (a.sig) return;
      if (ev.shiftKey && movableAnn(a)) { toggleMulti(i, a); return; }
      selectAnnot(i, a);
      if (AS && AS.movable) dragAnnot(ev, 'move');
    });
    d.addEventListener('click', ev => { if (S.tool === 'select' && !S.spaceDown && a.sig) { ev.stopPropagation(); hideTip(); showAnnPop(ev, i, a); } });
    ovl.appendChild(d);
  });
  imgs.forEach((b, k) => {
    const d = document.createElement('div'); d.className = 'imgbox';
    d.style.left = pct(b.x, pg.w); d.style.top = pct(b.y, pg.h); d.style.width = pct(b.w, pg.w); d.style.height = pct(b.h, pg.h);
    d.innerHTML = `<span>圖片 ${k + 1}${b.nw ? ' · ' + b.nw + '×' + b.nh : ''}</span>`;
    d.dataset.k = k;   // click selects the image; dragging from it starts a new selection (handled in startExtractDraw)
    ovl.appendChild(d);
  });
  lnks.forEach(l => {   // (shown only with the link tool) a click changes or deletes the link; Ctrl+click is left to followLinkAt
    const d = document.createElement('div'); d.className = 'lnk'; d.title = linkText(l);
    d.style.left = pct(l.box.x, pg.w); d.style.top = pct(l.box.y, pg.h); d.style.width = pct(l.box.w, pg.w); d.style.height = pct(l.box.h, pg.h);
    const mine = ev => S.tool === 'link' && !S.spaceDown && ev.button === 0 && !ev.ctrlKey && !ev.metaKey;
    d.addEventListener('pointerdown', ev => { if (mine(ev)) { ev.stopPropagation(); ev.preventDefault(); } });
    d.addEventListener('click', ev => { if (mine(ev)) { ev.stopPropagation(); openLinkDialog(i, {link:l}); } });
    ovl.appendChild(d);
  });
  if (FIND.open) paintFindPage(i);
}

const tip = $('#tip');
function showTip(e, txt){ tip.textContent = txt; tip.style.display = 'block'; moveTip(e); }
function moveTip(e){ tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + 'px'; tip.style.top = (e.clientY + 16) + 'px'; }
function hideTip(){ tip.style.display = 'none'; }

/* ---------------- annotations (read) ---------------- */
const ANN_LABEL = {Text:'便利貼', FreeText:'文字方塊', Highlight:'高亮', Underline:'底線', StrikeOut:'刪除線', Square:'矩形', Circle:'橢圓形', Ink:'畫筆', Stamp:'戳記', FileAttachment:'附件註解', Line:'線條', Polygon:'多邊形', PolyLine:'折線', Squiggly:'波浪線', Caret:'插入符號'};
// annotations that can be worked with: not hidden, not on a hidden or locked layer
async function getAnns(i){
  const all = await getAllAnns(i);
  if (!all.length) return all;
  const blocked = await blockedAnnots();
  return all.filter(a => !a.flagHidden && !(blocked && blocked.has(a.id)));
}
async function getAllAnns(i){
  const key = S.version + ':' + i; if (S.annCache.has(key)) return S.annCache.get(key);
  const pg = S.pages[i];
  const p = pg.page.getAnnotations().then(list => {
   const popups = {}; list.forEach(a => { if (a.subtype === 'Popup' && a.rect) popups[a.id] = a.rect; });
   const vbox = r => { const v = pg.vp1.convertToViewportRectangle(r); return {x:Math.min(v[0], v[2]), y:Math.min(v[1], v[3]), w:Math.abs(v[2] - v[0]), h:Math.abs(v[3] - v[1])}; };
   const hex = c => c && c.length >= 3 ? '#' + [...c].slice(0, 3).map(v => pad2(Math.round(v).toString(16))).join('') : null;
   return list.map(a => {
    const isSig = a.subtype === 'Widget' && a.fieldType === 'Sig';
    if (!ANN_LABEL[a.subtype] && !isSig) return null;
    const r = pg.vp1.convertToViewportRectangle(a.rect);
    const x = Math.min(r[0], r[2]), y = Math.min(r[1], r[3]);
    const contents = (a.contentsObj && a.contentsObj.str) || a.contents || '';
    const author = (a.titleObj && a.titleObj.str) || a.title || '';
    const o = {id:a.id, subtype:a.subtype, x, y, w:Math.abs(r[2] - r[0]), h:Math.abs(r[3] - r[1]),
      contents, author, sig:isSig, noap:a.subtype === 'Text' && !a.hasAppearance, flagHidden:!!(a.annotationFlags & 2), mdate:a.modificationDate || a.creationDate || null,
      popupBox:a.popupRef && popups[a.popupRef] ? vbox(popups[a.popupRef]) : null,
      label: isSig ? '數位簽章欄位' : (ANN_LABEL[a.subtype] + (author ? ' · ' + author : ''))};
    if (a.subtype === 'Ink' && a.inkLists) {
      o.ink = a.inkLists.map(fl => { const pts = []; for (let k = 0; k + 1 < fl.length; k += 2) { const v = pg.vp1.convertToViewportPoint(fl[k], fl[k + 1]); pts.push({x:v[0], y:v[1]}); } return pts; });
      o.inkColor = hex(a.color) || '#000000'; o.inkWidth = (a.borderStyle && a.borderStyle.width) || 1; o.inkOpacity = a.opacity ?? 1;
    }
    return o;
  }).filter(Boolean); }).catch(() => []);
  S.annCache.set(key, p); return p;
}
const pop = $('#pop');
function showAnnPop(e, i, a){
  pop.innerHTML = `<div class="k">${esc(a.label)} · 第 ${i + 1} 頁</div><div class="c">${a.contents ? esc(a.contents) : '<span style="color:#8c959f">（沒有文字內容）</span>'}</div>
    <div class="row">${a.sig ? '' : '<button class="mini danger" data-x="del">刪除註解</button>'}<button class="mini" data-x="close">關閉</button></div>`;
  pop.style.display = 'block';
  pop.style.left = Math.min(e.clientX, innerWidth - 280) + 'px'; pop.style.top = Math.min(e.clientY + 10, innerHeight - pop.offsetHeight - 10) + 'px';
  pop.onclick = async ev => {
    const x = ev.target.dataset.x; if (!x) return;
    pop.style.display = 'none';
    if (x === 'del') await deleteAnnot(i, a.id);
  };
}
document.addEventListener('pointerdown', e => { if (!pop.contains(e.target)) pop.style.display = 'none'; }, true);

/* ---------------- image detection ---------------- */
const imgResolved = new Map();
// [x0, y0, x1, y1] boxes: where two meet (null: one is missing → the other; no overlap → null); two {x, y, w, h} alike
const boxMeet = (a, b) => { if (!a) return b; if (!b) return a; const r = [Math.max(a[0], b[0]), Math.max(a[1], b[1]), Math.min(a[2], b[2]), Math.min(a[3], b[3])]; return r[0] <= r[2] && r[1] <= r[3] ? r : null; };
const sameBox = (p, q, d = 1.5) => !!p && !!q && ['x', 'y', 'w', 'h'].every(k => Math.abs(p[k] - q[k]) <= d);
async function detectImages(i){
  const key = S.version + ':' + i; if (S.imgCache.has(key)) return S.imgCache.get(key);
  const p = (async () => {
    const pg = S.pages[i];
    return imageBoxesOf(await pg.page.getOperatorList({annotationMode:pdfjsLib.AnnotationMode.DISABLE}), pg.vp1.transform, pg.w, pg.h);
  })().then(out => { imgResolved.set(key, out); return out; }).catch(e => { console.warn(e); return []; });
  S.imgCache.set(key, p); return p;
}
// the pictures an operator list paints, as boxes in the page view (vt: the page's view transform at scale 1; W × H its size):
// {x, y, w, h: the part that shows (clipped), nw × nh: its pixels, full: the whole picture}
function imageBoxesOf(ops, vt, W, H){

    const pathBox = (fns, args) => {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, j = 0;
      const pt = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };

        if (f === O.rectangle) { pt(args[j], args[j + 1]); pt(args[j] + args[j + 2], args[j + 1] + args[j + 3]); }

        j += n;
      }
      return x0 <= x1 && y0 <= y1 ? [x0, y0, x1, y1] : null;
    };

      const f = view([0, 0, 1, 1], ctm), v = boxMeet(boxMeet(f, clip), [0, 0, W, H]);
      if (!v || v[2] - v[0] < 4 || v[3] - v[1] < 4) return;
      const full = {x:f[0], y:f[1], w:f[2] - f[0], h:f[3] - f[1]};
      if (!out.some(o => sameBox(o.full, full, 1))) out.push({x:v[0], y:v[1], w:v[2] - v[0], h:v[3] - v[1], nw:nw | 0, nh:nh | 0, full});
    };

        case O.transform: ctm = U.transform(ctm, a); break;
        case O.constructPath: { const b = a && pathBox(a[0], a[1]); if (b) { const v = view(b, ctm); path = path ? [Math.min(path[0], v[0]), Math.min(path[1], v[1]), Math.max(path[2], v[2]), Math.max(path[3], v[3])] : v; } break; }
        case O.clip: case O.eoClip: pending = true; break;
        case O.endPath: case O.fill: case O.eoFill: case O.stroke: case O.closeStroke: case O.fillStroke: case O.eoFillStroke: case O.closeFillStroke: case O.closeEOFillStroke:

        case O.paintFormXObjectBegin:

          break;
        case O.paintFormXObjectEnd: if (stack.length) ({ctm, clip} = stack.pop()); break;
        case O.paintImageXObject: add(a[1], a[2]); break;

    }
    return out;
  }
}

/* render a region (visual pt coords) of a page to a canvas */
async function renderRegion(i, box, pxPerPt){
  const pg = S.pages[i];
  const s = pxPerPt;
  const vp = pg.page.getViewport({scale:s});
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(box.w * s)); c.height = Math.max(1, Math.round(box.h * s));
  // what is on the page, including everything added to it (shapes, text boxes, stamps, pictures…)
  await pg.page.render({canvasContext:c.getContext('2d'), viewport:vp, transform:[1, 0, 0, 1, -box.x * s, -box.y * s], annotationMode:pdfjsLib.AnnotationMode.ENABLE}).promise;
  return c;
}
function nativeScale(box){
  const f = box.full || box;   // a cropped picture: its pixels span the whole picture, not the part that shows
  let s = box.nw ? Math.max(box.nw / f.w, box.nh / f.h) : 3;
  s = clamp(s, 2, 8);
  return Math.min(s, 5000 / Math.max(box.w, box.h));
}

let flipLock = 0, flipAcc = 0;
viewer.addEventListener('wheel', e => {
  if (!S.pdf) return;
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    let d = e.deltaY; if (e.deltaMode === 1) d *= 33; else if (e.deltaMode === 2) d *= 400;
    d = clamp(d, -160, 160);

    return;
  }
  if (!isCont()) {
    // single / two-page: wheel past the edge flips to the next spread
    const atBottom = viewer.scrollTop + viewer.clientHeight >= viewer.scrollHeight - 1;
    const atTop = viewer.scrollTop <= 0;
    const now = performance.now();
    if ((e.deltaY > 0 && atBottom) || (e.deltaY < 0 && atTop)) {
      e.preventDefault();
      if (now < flipLock) return;
      flipAcc += e.deltaY;
      if (Math.abs(flipAcc) >= 60) {
        const dir = flipAcc > 0 ? 1 : -1; flipAcc = 0;
        const ri = rowOf(S.current) + dir;
        if (ri >= 0 && ri < S.rows.length) {
          S.current = S.rows[ri][0]; layout();
          viewer.scrollTop = dir > 0 ? 0 : viewer.scrollHeight;
          updatePager(); scheduleRender(0);
          flipLock = now + 350;
        }
      }
    } else flipAcc = 0;
  }
}, {passive:false});

/* ====================================================================
   Editing (pdf-lib)
   ==================================================================== */
async function mutate(label, fn, opts = {}){
  if (!S.pdf) return false;
  primeWrite();
  if (!opts.fromPen && (PEN.strokes.length || PEN.busy)) await flushPen();
  if (NP) await closeNote(true);
  if (S.signed && !(await confirmDlg('此文件已數位簽署', '繼續修改會使現有的數位簽章失效。確定要繼續？', '繼續修改'))) return false;
  busy(true, '處理中…');
  const cur0 = S.current, pdf0 = S.pdf;
  try {
    const doc = await PDFDocument.load(S.bytes, {ignoreEncryption:true, updateMetadata:false});
    // still encrypted (a signed 「限制編輯」 file, or one that could not be decrypted): pdf-lib cannot change it. (A quick
    // check only: pdf-lib misses the encryption of linearized files with xref streams; the catch below asks pdf.js.)
    if (doc.isEncrypted) { const e = new Error('encrypted'); e.name = 'StillEncrypted'; throw e; }
    // signed elsewhere (a signature made here asks above, through S.signed): the first change in the tab says that it
    // breaks the signature (the original file is not touched, and 復原 brings it back); a tab is looked at until then
    const sigNote = !S.signed && !S.sigChecked && signedDoc(doc);
    const res = await fn(doc);
    if (res === false) return false;
    const out = await doc.save();
    const was = {redo:S.redo, signed:S.signed, dirty:S.dirty};
    S.undo.push({bytes:S.bytes, signed:S.signed, cur:S.current, label, by:opts.by === 'claude' ? 'claude' : ''});   // (Claude's own changes say so)
    S.redo = []; S.signed = false; S.dirty = true;
    try { await loadDoc(out, {keepView:true, scrollToCurrent:!!opts.scrollToCurrent}); }
    catch (e) {   // the result cannot be shown: the document stays as it was, with no undo step and not marked changed
      S.undo.pop(); S.redo = was.redo; S.signed = was.signed; S.dirty = was.dirty; S.current = cur0; updateUI();
      scheduleRender(0);   // (loadDoc stopped the pages being drawn; draw them again)
      throw e;
    }
    if (S.undo.length > 30) S.undo.shift();
    S.sigChecked = true;
    if (opts.highlight) highlightPages(opts.highlight.from, opts.highlight.count, opts.highlight.label);
    if (label) toast(label);
    if (sigNote) toast('這份文件有數位簽章，修改後簽章會失效。原檔不會被修改；按「復原」可以回到簽署時的內容。', 'long');
    return true;
  } catch (e) {
    console.error(e);
    // still encrypted (a signed 「限制編輯」 file, or one that could not be decrypted): pdf-lib cannot change it. Whether it
    // is, pdf.js knows (EncryptFilterName); the bytes "/Encrypt" may be anywhere in a plain file
    const locked = e && (e.name === 'PasswordException' || e.name === 'StillEncrypted') || await Promise.race([
      Promise.resolve().then(() => pdf0.getMetadata()).then(m => !!(m && m.info && m.info.EncryptFilterName), () => false),
      new Promise(res => setTimeout(() => res(false), 2000))]);   // (the document the change was made on, even if its tab was closed)
    if (locked) toast('這份 PDF 有加密保護，PDF 工作台無法修改它', 'err');
    else toast('操作失敗：' + (e.message || e), 'err');
    S.current = cur0;
    return false;
  }
  finally { busy(false); }
}

      const shown = (st.dir || '（未選擇）') + (sub ? (st.dir && st.dir.includes('\\') ? '\\' : '/') + sub : '');
      $b('#exDir').textContent = '\u200E' + shown + '\u200E'; $b('#exDir').title = shown;   // LRM keeps the path's own direction inside the rtl-truncated box
    }
    $b('#exMacBox').style.display = st.nameMode === 'macro' ? '' : 'none';
    $b('#exTplBox').style.display = st.nameMode === 'tpl' ? '' : 'none';
    body.querySelectorAll('.ex-opt[data-for]').forEach(o => o.style.display = st.nameMode === 'macro' && st.macOn[o.dataset.for] ? '' : 'none');
    $b('#exEg').textContent = ps.length ? (cleanFileName(fillTemplate(activeTpl(), ctx(ps[0], 1))) || '（空白）') + '.' + f.ext : '';
    if (!keepNames) renderNames();
    // duplicates / empty names
    const ext = f.ext, seen = new Map(); let dup = 0, empty = 0;
    ps.forEach((i, k) => { const nm = cleanFileName(nameFor(i, k + 1)); if (!nm) empty++; const key = (nm + '.' + ext).toLowerCase(); seen.set(key, (seen.get(key) || 0) + 1); });
    seen.forEach(v => { if (v > 1) dup += v; });
    let warn = '', block = !ps.length || empty > 0 || (DESK && !st.dir);
    if (empty) warn = st.nameMode === 'macro' && !st.macOrder.some(m => st.macOn[m]) ? '請至少勾選一個要保留的項目，或改用自訂範本。' : '有頁面的檔名是空的。';
    else if (dup) { if (!DESK || st.policy === 'rename') warn = `有 ${dup} 個檔名重複，將自動加上編號。`; else { warn = `有 ${dup} 個檔名重複，請修改檔名或改用「自動加上編號」。`; block = true; } }
    $b('#exWarn').textContent = warn;
    if (okBtn) { okBtn.disabled = block; okBtn.textContent = ps.length ? `轉存 ${ps.length} 張 ${f.label}` : '轉存'; }
  }
  const res = await openModal({title:'將頁面轉存成圖片', body, width:Math.min(1120, innerWidth - 40), buttons:[
    {label:'取消', value:null},
    {label:'轉存', primary:true, id:'exOk', handler:() => {
      const ps = pages(); if (!ps.length) return;
      return {ps, names:ps.map((i, k) => cleanFileName(nameFor(i, k + 1)) + '.' + IMG_FORMATS[st.fmt].ext)};
    }}],
    onOpen:(mb, mf) => { okBtn = mf.querySelector('#exOk'); refresh(); setTimeout(() => cards[S.current] && cards[S.current].scrollIntoView({block:'center'}), 30); }});
  obs.disconnect();
  if (!res) return;
  saveExpPrefs({fmt:st.fmt, dpi:st.dpi, quality:st.quality, transparent:st.transparent, annots:st.annots, tpl:st.tpl, pad:st.pad,
    nameMode:st.nameMode, macOrder:st.macOrder, macOn:st.macOn, pageStyle:st.pageStyle, dateFmt:st.dateFmt, sep:st.sep, seqStart:st.seqStart,
    policy:st.policy, useSub:st.useSub, subTpl:st.subTpl, lastDir:st.dir, keepDir:!!st.dirPicked || !!pr.keepDir});
  await runImageExport({...st, sub:DESK && st.useSub ? subName() : ''}, res.ps, res.names);
}

async function runImageExport(st, ps, names){
  const f = IMG_FORMATS[st.fmt], alpha = f.alpha && st.transparent;
  let plan = null;
  if (DESK) {
    try { plan = await DESK.exportImages.plan(st.dir, st.sub, names, st.policy); }
    catch (e) { toast('無法寫入輸出資料夾：' + (e.message || e), 'err'); return; }
  }
  let cancel = false, done = 0, skipped = 0, failed = 0;
  const zip = [], written = [];
  S.exporting = true;
  openModal({title:'轉存圖片中', width:440,
    body:`<div id="xpTxt">準備中…</div><div class="updbar show" style="background:transparent;padding:10px 0 0"><span class="bar" style="background:#e6e2d9;width:100%;height:8px"><i id="xpBar" style="background:var(--seal)"></i></span></div>`,
    buttons:[{label:'取消', handler:() => { cancel = true; $('#xpTxt').textContent = '正在取消…'; }}]});
  const t0 = performance.now();
  for (let k = 0; k < ps.length && !cancel; k++) {
    const i = ps[k], target = plan ? plan.files[k] : {name:names[k]};
    $('#xpTxt').innerHTML = `正在轉存第 <b>${i + 1}</b> 頁（${k + 1} / ${ps.length}）<br><span style="color:var(--ink3);font-size:12px">${esc(target.name)}</span>`;
    $('#xpBar').style.width = (k / ps.length * 100) + '%';
    if (target.skip) { skipped++; continue; }
    let c = null;
    try {
      c = await renderForExport(i, st.dpi, {transparent:alpha, annots:st.annots});
      const bytes = await encodePage(c, st.fmt, {dpi:st.dpi, quality:st.quality, alpha});
      if (DESK) written.push(await DESK.exportImages.write(st.dir, st.sub, target.name, bytes));
      else zip.push({name:target.name, data:bytes});
      done++;
    } catch (e) { console.error(e); failed++; toast(`第 ${i + 1} 頁轉存失敗：${e.message || e}`, 'err'); }
    finally { if (c) { c.width = c.height = 0; } }
    await new Promise(r => setTimeout(r, 0));
  }
  $('#xpBar').style.width = '100%';
  S.exporting = false;
  closeModal(undefined);
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  if (!DESK) {
    if (zip.length === 1) await saveFile(zip[0].name, new Blob([zip[0].data]));
    else if (zip.length) await saveFile(S.name.replace(/\.pdf$/i, '') + '_圖片.zip', new Blob([makeZip(zip)], {type:'application/zip'}));
    return;
  }
  const parts = [`已轉存 <b>${done}</b> 張 ${f.label}`];
  if (skipped) parts.push(`略過 ${skipped} 張（同名檔案已存在）`);
  if (failed) parts.push(`<span style="color:var(--seal)">${failed} 張失敗</span>`);
  if (cancel) parts.push('（已取消）');
  const r = await openModal({title:cancel ? '轉存已取消' : '轉存完成', width:480,
    body:`<div>${parts.join('，')}，耗時 ${secs} 秒。</div><div class="note" style="margin-top:10px;word-break:break-all">輸出位置：${esc(plan.dir)}</div>`,
    buttons:[{label:'完成', value:false}, {label:'開啟資料夾', primary:true, value:true}]});
  if (r) DESK.exportImages.openFolder(plan.dir);
}

const PAPER = {a4:[595.28, 841.89], a3:[841.89, 1190.55], a5:[419.53, 595.28], letter:[612, 792], legal:[612, 1008]};

async function openAddPage(presetAt){
  const n = S.pages.length, cur = S.current, cp = S.pages[cur];
  const mm = v => Math.round(v / 72 * 25.4);

    </div>
    <div class="ap-row">
      <div class="field"><label>插入位置</label>
        <select id="apPos">
          <option value="after">目前頁（第 ${cur + 1} 頁）之後</option>
          <option value="before">目前頁（第 ${cur + 1} 頁）之前</option>
          <option value="start">文件最前面</option>
          <option value="end">文件最後面（第 ${n} 頁之後）</option>

      <div class="field" id="apAtF" style="display:none"><label>在第幾頁之後（0 = 最前面）</label><input type="number" id="apAt" min="0" max="${n}" style="width:90px"></div>
    </div>
    <div class="flab" style="margin-bottom:6px">🖱 用滑鼠<b>拖曳紅色虛線的「新頁」</b>到想放的位置，或<b>點一下某一頁</b>插在它後面</div>
    <div class="ap-strip" id="apStrip"><div class="ap-mark" id="apMark"></div></div>
    <div class="ap-sum" id="apSum"></div>`;
  const $b = q => body.querySelector(q);
  const strip = $b('#apStrip'), mark = $b('#apMark'), H = 120;
  const newSize = () => {
    if (st.size === 'same') return {w:cp.w, h:cp.h};

  };
  // existing pages: built once, thumbnails load lazily
  const cards = S.pages.map((pg, i) => {

  });
  const obs = new IntersectionObserver(ents => ents.forEach(en => {
    if (!en.isIntersecting) return; obs.unobserve(en.target);

  }), {root:strip, rootMargin:'0px 400px'});
  cards.forEach(c => obs.observe(c));
  // the draggable block of new pages
  const grp = document.createElement('div'); grp.className = 'ap-new'; grp.title = '拖曳到想插入的位置';
  const drawGroup = () => {

      <span class="lb">第 ${st.at + 1}${st.count > 1 ? '–' + (st.at + st.count) : ''} 頁（新）</span><span class="grip">⠿ 拖曳移動</span>`;
  };
  const place = () => { strip.insertBefore(grp, cards[st.at] || null); };
  const labels = () => cards.forEach((c, i) => {
    const num = i < st.at ? i + 1 : i + 1 + st.count;
    c.querySelector('span').textContent = `第 ${num} 頁${num !== i + 1 ? `（原 ${i + 1}）` : ''}`;
  });
  const syncPos = () => {
    const sel = $b('#apPos');
    const v = st.at === cur + 1 ? 'after' : st.at === cur ? 'before' : st.at === 0 ? 'start' : st.at === n ? 'end' : 'at';
    if (sel.value !== 'at' || v !== 'at') sel.value = v;
    $b('#apAtF').style.display = sel.value === 'at' ? '' : 'none';
    if (document.activeElement !== $b('#apAt')) $b('#apAt').value = st.at;
  };
  let okBtn = null;
  const update = ({scroll = true} = {}) => {
    $b('#apOriF').style.display = st.size === 'same' ? 'none' : '';
    $b('#apChips').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.k === st.count));
    if (document.activeElement !== $b('#apCount')) $b('#apCount').value = st.count;
