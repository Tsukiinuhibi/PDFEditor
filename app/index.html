  list.forEach(a => {
    const d = document.createElement('div'); d.className = 'att';
    d.innerHTML = `<div class="nm">${esc(a.filename)}</div><div class="meta">${fmtSize(a.content ? a.content.length : 0)}${a.description && a.description !== a.filename ? ' · ' + esc(a.description) : ''}</div>
      <div class="row"><button class="mini" data-x="dl">下載</button><button class="mini danger" data-x="rm">移除</button></div>`;
    d.querySelector('[data-x=dl]').onclick = () => saveFile(a.filename, new Blob([a.content]));
    d.querySelector('[data-x=rm]').onclick = async () => { if (await confirmDlg('移除附件', `確定要從 PDF 中移除「${a.filename}」？`, '移除')) removeAttachment(a.filename); };
    panel.appendChild(d);
  });
}

/* ====================================================================
   Sample document
   ==================================================================== */
async function makeSample(){
  busy(true, '產生範例中…');
  try {
    const doc = await PDFDocument.create();
    const font = await doc.embedFont(StandardFonts.Helvetica), bold = await doc.embedFont(StandardFonts.HelveticaBold);
    const mk = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return new Promise(r => c.toBlob(b => b.arrayBuffer().then(a => r(new Uint8Array(a))), 'image/png')); };
    const scene = await mk(1200, 700, (x, w, h) => {
      const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#f7b267'); g.addColorStop(.55, '#f4845f'); g.addColorStop(1, '#7b2d26'); x.fillStyle = g; x.fillRect(0, 0, w, h);
      x.fillStyle = '#fff3d6'; x.beginPath(); x.arc(w * .68, h * .42, 70, 0, 7); x.fill();
      x.fillStyle = '#5b2333'; x.beginPath(); x.moveTo(0, h); x.lineTo(0, h * .62); x.lineTo(w * .25, h * .4); x.lineTo(w * .45, h * .65); x.lineTo(w * .7, h * .45); x.lineTo(w, h * .7); x.lineTo(w, h); x.fill();
      x.fillStyle = '#2d1b2e'; x.beginPath(); x.moveTo(0, h); x.lineTo(0, h * .8); x.lineTo(w * .35, h * .68); x.lineTo(w * .6, h * .85); x.lineTo(w, h * .75); x.lineTo(w, h); x.fill();
    });
    const chart = await mk(900, 520, (x, w, h) => {
      x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.strokeStyle = '#ddd'; x.lineWidth = 2;
      for (let k = 0; k < 5; k++) { x.beginPath(); x.moveTo(70, 60 + k * 100); x.lineTo(w - 30, 60 + k * 100); x.stroke(); }
      [0.45, 0.7, 0.55, 0.9, 0.78, 0.62].forEach((v, k) => { x.fillStyle = k === 3 ? '#c8371d' : '#4a6fa5'; x.fillRect(100 + k * 130, 460 - v * 400, 80, v * 400); });
      x.fillStyle = '#333'; x.font = 'bold 30px sans-serif'; x.fillText('Quarterly Output', 70, 40);
    });
    const tile = await mk(400, 400, (x, w, h) => { for (let a = 0; a < 8; a++) for (let b = 0; b < 8; b++) { x.fillStyle = `hsl(${(a * 40 + b * 12) % 360} 60% ${45 + ((a + b) % 3) * 10}%)`; x.fillRect(a * 50, b * 50, 50, 50); } });
    const [iScene, iChart, iTile] = await Promise.all([doc.embedPng(scene), doc.embedPng(chart), doc.embedPng(tile)]);
    const lorem = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer posuere erat a ante venenatis dapibus posuere velit aliquet. Donec ullamcorper nulla non metus auctor fringilla. Cras mattis consectetur purus sit amet fermentum. Vestibulum id ligula porta felis euismod semper. Maecenas faucibus mollis interdum. Nullam quis risus eget urna mollis ornare vel eu leo.';
    const para = (page, text, x, y, w, size = 11) => {
      const words = text.split(' '); let line = '', yy = y;
      for (const wd of words) { const t = line ? line + ' ' + wd : wd; if (font.widthOfTextAtSize(t, size) > w) { page.drawText(line, {x, y:yy, size, font, color:rgb(.2, .2, .22)}); yy -= size * 1.5; line = wd; } else line = t; }
      page.drawText(line, {x, y:yy, size, font, color:rgb(.2, .2, .22)}); return yy - size * 1.5;
    };
    const A4 = [595.28, 841.89];
    let p = doc.addPage(A4);
    p.drawRectangle({x:0, y:A4[1] - 8, width:A4[0], height:8, color:rgb(.78, .22, .11)});
    p.drawText('Sample Report', {x:56, y:760, size:30, font:bold, color:rgb(.12, .13, .15)});
    p.drawText('A test document for the PDF workbench', {x:56, y:734, size:13, font, color:rgb(.45, .45, .48)});
    p.drawImage(iScene, {x:56, y:440, width:483, height:282});
    let y = para(p, lorem, 56, 410, 483); para(p, lorem, 56, y - 8, 483);
    p.drawText('1', {x:A4[0] / 2, y:30, size:10, font});
    p = doc.addPage(A4);
    p.drawText('Results', {x:56, y:770, size:22, font:bold});
    y = para(p, lorem, 56, 740, 483);
    p.drawImage(iChart, {x:56, y:y - 300, width:483, height:279});
    p.drawImage(iTile, {x:56, y:y - 520, width:180, height:180});
    para(p, lorem, 256, y - 360, 283, 10);
    p.drawText('2', {x:A4[0] / 2, y:30, size:10, font});
    p = doc.addPage([A4[1], A4[0]]);
    p.drawText('Landscape page', {x:56, y:520, size:22, font:bold});
    p.drawImage(iScene, {x:56, y:120, width:340, height:198});
    p.drawImage(iChart, {x:430, y:120, width:340, height:196});
    para(p, lorem, 56, 470, 720);
    p.drawText('3', {x:A4[1] / 2, y:30, size:10, font});
    p = doc.addPage(A4);
    p.drawText('Appendix', {x:56, y:770, size:22, font:bold});
    y = para(p, lorem, 56, 740, 483); y = para(p, lorem, 56, y - 8, 483); para(p, lorem, 56, y - 8, 483);
    p.drawText('4', {x:A4[0] / 2, y:30, size:10, font});
    await doc.attach(new TextEncoder().encode('這是附加在範例 PDF 內的說明檔。\nThis file is embedded in the sample PDF.'), '說明.txt', {mimeType:'text/plain', description:'範例附件'});
    const bytes = await doc.save();
    S.undo = []; S.redo = []; S.dirty = false; S.signed = false; S.handle = null;
    await loadDoc(bytes, {name:'範例文件.pdf'});
    toast('已載入範例文件');
  } catch (e) { console.error(e); toast('產生範例失敗：' + e.message, 'err'); }
  finally { busy(false); }
}

/* ====================================================================
   Wiring
   ==================================================================== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-tool],[data-zoom],[data-view]'); if (!b || b.disabled) return;
  if (b.dataset.act && actions[b.dataset.act]) actions[b.dataset.act]();
  else if (b.dataset.tool) setTool(b.dataset.tool);
  else if (b.dataset.zoom) setZoomMode(b.dataset.zoom);
  else if (b.dataset.view) setView(b.dataset.view);
});
$('#fOpen').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; openFile(f); });
$('#coverChk').addEventListener('change', e => { S.cover = e.target.checked; setView(S.view); });
$('#pgIn').addEventListener('keydown', e => { if (e.key === 'Enter') { const n = parseInt(e.target.value, 10); if (n >= 1) scrollToPage(n - 1); e.target.blur(); } });
$('#pgIn').addEventListener('focus', e => e.target.select());
$('#pgIn').addEventListener('blur', updatePager);
$('#zIn').addEventListener('keydown', e => { if (e.key === 'Enter') { const n = parseFloat(e.target.value); if (n > 0) zoomTo(n / 100 * PX); e.target.blur(); } });
$('#zIn').addEventListener('focus', e => e.target.select());
$('#zIn').addEventListener('blur', updateZoomUI);
['dragenter', 'dragover'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); viewer.classList.add('drop'); }));
['dragleave', 'drop'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); if (ev === 'dragleave' && e.relatedTarget) return; viewer.classList.remove('drop'); }));
window.addEventListener('drop', e => {
  const f = [...(e.dataTransfer && e.dataTransfer.files || [])];
  const idx = f.findIndex(x => /\.pdf$/i.test(x.name) || x.type === 'application/pdf');
  const pdf = f[idx];
  const item = idx >= 0 && e.dataTransfer.items ? [...e.dataTransfer.items].filter(it => it.kind === 'file')[idx] : null;
  const hp = item && item.getAsFileSystemHandle ? item.getAsFileSystemHandle().catch(() => null) : Promise.resolve(null);
  if (pdf && DESK) { const fp = DESK.pathForFile(pdf); if (fp) openPath(fp); else openFile(pdf); }
  else if (pdf) hp.then(h => openFile(pdf, h && h.kind === 'file' ? h : null)); else if (f.length && S.pdf) { const dt = new DataTransfer(); f.forEach(x => dt.items.add(x)); $('#fAttach').files = dt.files; $('#fAttach').dispatchEvent(new Event('change')); }
});
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
$$('[data-need]').forEach(b => b.disabled = true);
updateUI();

/* ====================================================================
   Desktop: open-with, updates
   ==================================================================== */
const UPD = {state:{state:'idle'}, info:null, modalOpen:false, dismissed:null};
function renderUpdate(){
  const s = UPD.state, bar = $('#updBar'), dot = $('#updDot'), txt = $('#bUpdTxt');
  dot.classList.toggle('on', s.state === 'ready');
  txt.textContent = s.state === 'ready' ? '立即更新' : s.state === 'downloading' ? `下載中 ${s.percent || 0}%` : s.state === 'checking' ? '檢查中…' : '檢查更新';
  if (s.state === 'ready' && UPD.dismissed !== s.version) {
    bar.innerHTML = `<span>新版本 <b>v${esc(s.version)}</b> 已下載完成，重新啟動即可完成更新。</span><span class="sp"></span>
      ${s.notes ? '<button data-u="notes">查看更新內容</button>' : ''}<button data-u="later">稍後</button><button class="go" data-u="install">立即重新啟動並更新</button>`;
    bar.classList.add('show');
  } else if (s.state === 'downloading') {
    bar.innerHTML = `<span>正在下載新版本 <b>v${esc(s.version || '')}</b>…</span><span class="bar"><i style="width:${s.percent || 0}%"></i></span><span>${s.percent || 0}%</span><span class="sp"></span>`;
    bar.classList.add('show');
  } else bar.classList.remove('show');
  if (UPD.modalOpen) { const m = $('#updMsg'); if (m) m.innerHTML = updateMessage(); }
}
function updateMessage(){
  const s = UPD.state, v = UPD.info ? UPD.info.version : '';
  switch (s.state) {
    case 'checking': return '<span class="spin" style="display:inline-block;vertical-align:-3px;margin-right:8px"></span>正在檢查新版本…';
    case 'latest': return `目前已是最新版本 <b>v${esc(v)}</b>。`;
    case 'available': return `發現新版本 <b>v${esc(s.version)}</b>，正在背景下載…`;
    case 'downloading': return `正在下載新版本 <b>v${esc(s.version || '')}</b>… ${s.percent || 0}%<div class="updbar show" style="background:transparent;padding:8px 0 0"><span class="bar" style="background:#e6e2d9;width:100%"><i style="width:${s.percent || 0}%;background:#2f9e62"></i></span></div>`;
    case 'ready': return `新版本 <b>v${esc(s.version)}</b> 已下載完成。${s.notes ? `<div class="note" style="margin-top:10px;white-space:pre-wrap;max-height:220px;overflow:auto">${esc(s.notes)}</div>` : ''}`;
    case 'error': return `檢查更新時發生問題：${esc(s.message || '')}<div class="note" style="margin-top:10px">請確認網路連線後再試一次。也可以到 GitHub 的版本頁面手動下載最新安裝檔。</div>`;
    case 'dev': return '目前是開發模式，不會自動更新。';
    case 'unsupported': return '這個安裝方式不支援自動更新，請到 GitHub 版本頁面下載最新安裝檔。';
    default: return '';
  }
}
async function installUpdate(){
  if (S.dirty && !(await confirmDlg('安裝更新', '文件有尚未儲存的修改，重新啟動後這些修改會遺失。要繼續更新嗎？（建議先按「儲存」）', '仍要更新'))) return;
  S.dirty = false;
  toast('正在重新啟動並安裝更新…');
  await DESK.update.install();
}
actions.checkUpdate = async () => {
  if (!DESK) return;
  if (UPD.state.state === 'ready') return showUpdateModal();
  DESK.update.check().then(st => { if (st) { UPD.state = st; renderUpdate(); } });
  if (UPD.state.state !== 'downloading') { UPD.state = {state:'checking'}; renderUpdate(); }
  showUpdateModal();
};
async function showUpdateModal(){
  UPD.modalOpen = true;
  const ready = UPD.state.state === 'ready';
  const r = await openModal({title:'軟體更新', width:460,
    body:`<div style="margin-bottom:8px;color:var(--ink2)">目前版本：v${esc(UPD.info ? UPD.info.version : '')}</div><div id="updMsg">${updateMessage()}</div>`,
    buttons:[{label:'版本記錄', value:'page'}, {spacer:true}, {label:ready ? '稍後' : '關閉', value:false}].concat(ready ? [{label:'立即重新啟動並更新', primary:true, value:'install'}] : [])});
  UPD.modalOpen = false;
  if (r === 'install') installUpdate();
  if (r === 'page') DESK.openExternal('https://github.com/Tsukiinuhibi/PDFEditor/releases');
}
$('#updBar').addEventListener('click', e => {
  const u = e.target.dataset.u; if (!u) return;
  if (u === 'install') installUpdate();
  if (u === 'later') { UPD.dismissed = UPD.state.version; renderUpdate(); }
  if (u === 'notes') showUpdateModal();
});
if (DESK) {
  $('#grpApp').style.display = '';
  DESK.info().then(info => { UPD.info = info; $('#stVer').textContent = 'v' + info.version; $('#stVer').title = '檢查更新'; });
  $('#stVer').addEventListener('click', () => actions.checkUpdate());
  DESK.update.on(st => {
    const prev = UPD.state.state; UPD.state = st; renderUpdate();
    if (st.state === 'ready' && prev !== 'ready') toast(`新版本 v${st.version} 已下載完成`);
  });
  DESK.update.state().then(st => { if (st) { UPD.state = st; renderUpdate(); } });
  DESK.onOpenPath(p => openPath(p));
  DESK.ready().then(list => { if (list && list.length) openPath(list[list.length - 1]); });
}
window.__pdfapp = {S, actions, scrollToPage, makeSample};
</script>
