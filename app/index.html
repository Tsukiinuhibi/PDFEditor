<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>PDF 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2328; --ink2:#57606a; --ink3:#8c959f;
  --paper:#fbfaf7; --line:#e3e0d8; --line2:#d4d0c6;
  --desk:#cfcbc2; --desk2:#c6c2b8;
  --seal:#c8371d; --seal-soft:#fbe9e4; --seal-ink:#9d2a14;
  --ok:#1f7a4d;
  --radius:7px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--desk);font-size:13px;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- ribbon ---------- */
.ribbon{background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:stretch;gap:0;padding:4px 8px;overflow-x:auto;flex:none;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:9px;padding:0 14px 0 4px;margin-right:4px;border-right:1px solid var(--line);white-space:nowrap}
.seal{width:30px;height:30px;border-radius:6px;background:var(--seal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;letter-spacing:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.brand b{font-size:15px;letter-spacing:.04em}
.grp{display:flex;flex-direction:column;padding:0 6px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.grp .btns{display:flex;gap:2px;flex:1}
.grp .cap{font-size:10.5px;color:var(--ink3);text-align:center;letter-spacing:.12em;padding-top:1px}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;padding:5px 6px 4px;border:0;background:transparent;border-radius:var(--radius);cursor:pointer;white-space:nowrap;font-size:12px;color:var(--ink)}
.rb:hover{background:#efece5}
.rb:active{background:#e6e2d9}
.rb.on{background:var(--seal-soft);color:var(--seal-ink)}
.rb.on svg{stroke:var(--seal)}
.rb:disabled{opacity:.35;cursor:default;background:transparent}
.rb.primary svg{stroke:var(--seal)}
@media (max-width:1420px){ .brand b{display:none} .brand{padding-right:10px} .rb{min-width:44px;padding:5px 3px 4px} .grp{padding:0 4px} }
@media (max-width:1180px){ .rb{min-width:40px;font-size:11px} }

/* ---------- view bar ---------- */
.viewbar{background:#f3f1ec;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:6px;padding:5px 10px;flex:none;overflow-x:auto;white-space:nowrap}
.vb{height:28px;min-width:28px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid transparent;background:transparent;border-radius:6px;cursor:pointer;font-size:12.5px}
.vb svg.i{width:17px;height:17px}
.vb:hover{background:#e7e4dc}
.vb.on{background:#fff;border-color:var(--line2);color:var(--seal-ink);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.vb.on svg{stroke:var(--seal)}
.vb:disabled{opacity:.35;cursor:default;background:transparent}
.sep{width:1px;height:20px;background:var(--line2);margin:0 4px;flex:none}
.pager{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.pager input{width:52px;height:28px;border:1px solid var(--line2);border-radius:6px;text-align:center;font:inherit;font-size:13px;background:#fff}
.pager .tot{color:var(--ink2);min-width:46px}
.zoomsel{position:relative}
.zoomsel input{width:66px;height:28px;border:1px solid var(--line2);border-radius:6px;text-align:center;font:inherit;background:#fff;font-variant-numeric:tabular-nums}
.chk{display:inline-flex;align-items:center;gap:5px;color:var(--ink2);font-size:12px;cursor:pointer;padding:0 4px}
.lbl{color:var(--ink3);font-size:11.5px;letter-spacing:.1em;margin-right:2px}

/* ---------- hint bar ---------- */
.updbar{flex:none;display:none;align-items:center;gap:10px;padding:7px 14px;background:#1f3b2d;color:#fff;font-size:12.5px}
.updbar.show{display:flex}
.updbar .sp{flex:1}
.updbar .bar{width:160px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.updbar .bar i{display:block;height:100%;background:#7ee2a8;width:0}
.updbar button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:5px;padding:3px 10px;cursor:pointer;font-size:12px}
.updbar button.go{background:#2f9e62;border-color:#2f9e62}
.updwrap{position:relative;display:inline-flex}
.upddot{position:absolute;top:-2px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--seal);border:2px solid var(--paper);display:none}
.upddot.on{display:block}
#stVer{cursor:pointer;color:var(--ink3)}
#stVer:hover{color:var(--seal-ink)}
.hint{flex:none;display:none;align-items:center;gap:10px;padding:6px 14px;background:var(--seal);color:#fff;font-size:12.5px}
.hint.show{display:flex}
.hint .sp{flex:1}
.hint button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:5px;padding:3px 10px;cursor:pointer;font-size:12px}
.hint button:hover{background:rgba(255,255,255,.28)}
.swatch{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.6);cursor:pointer;padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.25)}

/* ---------- main ---------- */
.main{flex:1;display:flex;min-height:0}
.side{width:212px;flex:none;background:#ebe8e1;border-right:1px solid var(--line2);display:flex;flex-direction:column;min-height:0}
.side.hide{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line2);flex:none}
.tab{flex:1;border:0;background:transparent;padding:8px 0 7px;cursor:pointer;font-size:12.5px;color:var(--ink2);border-bottom:2px solid transparent}
.tab.on{color:var(--seal-ink);border-bottom-color:var(--seal);font-weight:500}
.panel{flex:1;overflow:auto;padding:10px;display:none}
.panel.on{display:block}
.thumb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:7px;cursor:pointer;margin-bottom:2px}
.thumb:hover{background:#e0dcd3}
.thumb.on{background:#fff;box-shadow:0 0 0 2px var(--seal) inset}
.thumb .tc{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);display:block}
.thumb .tn{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.thumb.on .tn{color:var(--seal-ink);font-weight:500}
.empty-note{color:var(--ink3);font-size:12px;line-height:1.7;padding:8px 2px}
.sbtn{width:100%;border:1px dashed var(--ink3);background:transparent;border-radius:7px;padding:8px;cursor:pointer;color:var(--ink2);margin-bottom:10px}
.sbtn:hover{border-color:var(--seal);color:var(--seal-ink);background:#fff}
/* page picker */
.pp-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pp-bar input[type=text]{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:5px 9px;width:180px}
.pp-bar .cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2)}
.pp-bar .cnt b{color:var(--seal-ink)}
.pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tw,130px),1fr));gap:12px;padding:12px;background:#ebe8e1;border-radius:9px;max-height:min(58vh,620px);overflow:auto;user-select:none}
.pp-card{position:relative;background:transparent;border-radius:8px;padding:8px 6px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid transparent}
.pp-card:hover{background:#e0dcd3}
.pp-card .th{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);display:grid;place-items:center;color:#c9c5bc;font-size:12px;width:100%}
.pp-card canvas{display:block;width:100%;height:100%}
.pp-card .num{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pp-card .ck{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:6px;background:#fff;border:1.5px solid var(--ink3);display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;z-index:2}
.pp-card.on{border-color:var(--seal);background:#fff}
.pp-card.on .ck{background:var(--seal);border-color:var(--seal)}
.pp-card.on .num{color:var(--seal-ink);font-weight:500}
.pp-del .pp-card.on .th::after{content:"";position:absolute;inset:0;background:rgba(200,55,29,.28);background-image:linear-gradient(45deg,transparent 48.5%,rgba(200,55,29,.75) 48.5% 51.5%,transparent 51.5%),linear-gradient(-45deg,transparent 48.5%,rgba(200,55,29,.75) 48.5% 51.5%,transparent 51.5%)}
.pp-card.cur .num::after{content:" · 目前頁";color:var(--ink3);font-weight:400}
.pp-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.pp-foot select{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;background:#fff}
.att{background:#fff;border-radius:7px;padding:8px 9px;margin-bottom:7px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.att .nm{font-weight:500;word-break:break-all;font-size:12.5px}
.att .meta{color:var(--ink3);font-size:11px;margin:2px 0 6px}
.att .row{display:flex;gap:6px}
.mini{border:1px solid var(--line2);background:#faf9f6;border-radius:5px;padding:2px 8px;font-size:11.5px;cursor:pointer}
.mini:hover{border-color:var(--seal);color:var(--seal-ink)}
.mini.danger:hover{background:#fde8e4}
.imgitem{background:#fff;border-radius:7px;padding:6px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid transparent}
.imgitem:hover{border-color:var(--seal)}
.imgitem canvas{width:100%;display:block;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/12px 12px}
.imgitem .meta{font-size:11px;color:var(--ink2);margin-top:5px;display:flex;justify-content:space-between}
.annitem{background:#fff;border-radius:7px;padding:7px 9px;margin-bottom:7px;cursor:pointer;border-left:3px solid #f2b705;font-size:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.annitem:hover{background:#fffaf0}
.annitem .k{color:var(--ink3);font-size:11px;margin-bottom:2px}

.viewer{flex:1;overflow:auto;position:relative;background:var(--desk);outline:none}
.viewer.pan-ready,.viewer.pan-ready *{cursor:grab!important}
.viewer.panning,.viewer.panning *{cursor:grabbing!important;user-select:none}
.pages{position:relative;margin:0}
.page{position:absolute;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.12)}
.page canvas.pc{position:absolute;inset:0;width:100%;height:100%;display:block}
.page .ovl{position:absolute;inset:0}
.page .ld{position:absolute;inset:0;display:grid;place-items:center;color:#c9c5bc;font-size:12px}
.tool-note .page,.tool-textbox .page,.tool-signature .page{cursor:crosshair}
.tool-highlight .page,.tool-digisign .page,.tool-extract .page{cursor:crosshair}
.tool-hand .page{cursor:grab}

.imgbox{position:absolute;display:none;border:2px solid var(--seal);background:rgba(200,55,29,.10);cursor:pointer;border-radius:2px}
.imgbox span{position:absolute;left:-2px;top:-20px;background:var(--seal);color:#fff;font-size:11px;padding:1px 6px;border-radius:3px 3px 0 0;white-space:nowrap}
.imgbox:hover{background:rgba(200,55,29,.22)}
.tool-extract .imgbox{display:block}
.annhit{position:absolute;display:none;cursor:pointer;border-radius:2px}
.tool-select .annhit{display:block}
.annhit:hover{outline:2px solid rgba(200,55,29,.55);outline-offset:1px}
.annhit.noap{background:#ffd43b;border:1px solid #b38600;width:18px!important;height:18px!important;border-radius:3px}
.annhit.sig{outline:1.5px dashed var(--ok)}
.draft{position:absolute;border:1.5px dashed var(--seal);background:rgba(200,55,29,.08);pointer-events:none}
.draft.hl{border:0;background:rgba(255,212,59,.45);mix-blend-mode:multiply}

.tip{position:fixed;z-index:60;max-width:280px;background:#22262b;color:#fff;padding:7px 10px;border-radius:7px;font-size:12px;line-height:1.55;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:pre-wrap;display:none}
.pop{position:fixed;z-index:61;width:260px;background:#fff;border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,.25);padding:12px;font-size:12.5px;display:none}
.pop .k{color:var(--ink3);font-size:11px;margin-bottom:4px}
.pop .c{white-space:pre-wrap;line-height:1.6;max-height:180px;overflow:auto;margin-bottom:10px}
.pop .row{display:flex;justify-content:flex-end;gap:6px}

/* ---------- empty state ---------- */
.welcome{position:absolute;inset:0;display:grid;place-items:center;padding:20px}
.wcard{background:var(--paper);border-radius:14px;padding:34px 38px;max-width:520px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.12);text-align:center;border:2px dashed transparent;transition:border-color .15s}
.drop .wcard{border-color:var(--seal)}
.wcard .seal{width:56px;height:56px;font-size:28px;margin:0 auto 16px;border-radius:12px}
.wcard h1{font-size:21px;margin:0 0 8px;letter-spacing:.03em}
.wcard p{color:var(--ink2);margin:0 0 22px;line-height:1.7}
.wcard .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:9px 18px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.pri:hover{background:var(--seal-ink)}
.btn.pri svg{stroke:#fff}
.btn:disabled{opacity:.5;cursor:default}
.keys{margin-top:24px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:12px;color:var(--ink2);max-width:330px;margin-left:auto;margin-right:auto}
kbd{font-family:inherit;background:#fff;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;color:var(--ink)}

/* ---------- status ---------- */
.status{flex:none;height:26px;background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 12px;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px}
.status .dot.dirty{background:#e08a00}
.status .sig{color:var(--ok);font-weight:500}
.status .sp{flex:1}
.wmode{display:inline-flex;align-items:center;gap:6px}
.wmode b{font-weight:500;color:var(--ok)}
.wmode.ro b{color:#a15c00}
.wmode label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(25,22,18,.45);display:none;place-items:center;z-index:80;padding:16px}
.mask.show{display:grid}
.modal{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:96vw;max-height:94vh;display:flex;flex-direction:column;min-width:320px}
.modal .mh{padding:14px 18px 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.modal .mh::before{content:"";width:4px;height:16px;background:var(--seal);border-radius:2px}
.modal .mb{padding:4px 18px 14px;overflow:auto;line-height:1.6}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.modal .mf .sp{flex:1}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.field label,.flab{font-size:12px;color:var(--ink2)}
.field input[type=text],.field input[type=password],.field input[type=number],.field textarea,.field select{font:inherit;border:1px solid var(--line2);border-radius:7px;padding:7px 9px;font-size:13.5px;background:#fff}
.field textarea{resize:vertical;min-height:90px}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid rgba(200,55,29,.25);border-color:var(--seal)}
.frow{display:flex;gap:10px}
.frow>.field{flex:1}
.radio{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line2);border-radius:8px;margin-bottom:8px;cursor:pointer}
.radio:has(input:checked){border-color:var(--seal);background:#fffaf8}
.radio small{display:block;color:var(--ink3);font-size:11.5px}
.note{background:#f6f4ef;border-radius:8px;padding:9px 11px;font-size:12px;color:var(--ink2);line-height:1.65}
.note.warn{background:#fff4e0;color:#7a4b00}

.padwrap{border:1px solid var(--line2);border-radius:8px;background:#fff;position:relative;touch-action:none}
.padwrap::after{content:"";position:absolute;left:24px;right:24px;bottom:46px;border-bottom:1px dashed #cfcac0;pointer-events:none}
.padwrap canvas{display:block;width:100%;height:220px;cursor:crosshair}
.pens{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pen{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2);cursor:pointer;padding:0}
.pen.on{box-shadow:0 0 0 2px var(--seal)}

/* crop */
.cropstage{background:#2b2a28;border-radius:9px;padding:18px;overflow:hidden;display:grid;place-items:center;min-height:240px;user-select:none}
.cropwrap{position:relative;line-height:0;background:repeating-conic-gradient(#555 0 25%,#666 0 50%) 0 0/16px 16px}
.cropwrap canvas{display:block}
.cropbox{position:absolute;outline:1.5px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.58);cursor:move}
.cropclip{position:absolute;inset:0}
.cropbox .h{position:absolute;width:14px;height:14px;background:#fff;border:2px solid var(--seal);border-radius:3px;margin:-7px 0 0 -7px}
.cropbox .h[data-d=n],.cropbox .h[data-d=s]{cursor:ns-resize}
.cropbox .h[data-d=e],.cropbox .h[data-d=w]{cursor:ew-resize}
.cropbox .h[data-d=nw],.cropbox .h[data-d=se]{cursor:nwse-resize}
.cropbox .h[data-d=ne],.cropbox .h[data-d=sw]{cursor:nesw-resize}
.cropbox .g{position:absolute;border:0 solid rgba(255,255,255,.35);pointer-events:none}
.cropctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.cropctl .field{margin:0}
.cropctl input{width:100%}
.cropinfo{font-size:12px;color:var(--ink2);margin-top:8px;font-variant-numeric:tabular-nums}

/* toast & busy */
.toasts{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#22262b;color:#fff;padding:8px 16px;border-radius:20px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:tin .2s ease-out}
.toast.err{background:var(--seal-ink)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.busy{position:fixed;inset:0;z-index:85;display:none;place-items:center;background:rgba(255,255,255,.25);cursor:progress}
.busy.show{display:grid}
.busy div{background:#fff;padding:12px 20px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center}
.spin{width:16px;height:16px;border:2px solid #eee;border-top-color:var(--seal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
input[type=file]{display:none}
</style>
</head>
<body>

<!-- ribbon -->
<div class="ribbon" id="ribbon">
  <div class="brand"><div class="seal">印</div><b>PDF 工作台</b></div>
  <div class="grp"><div class="btns">
    <button class="rb" data-act="open" title="開啟 (Ctrl+O)"><i data-i="open"></i>開啟</button>
    <button class="rb primary" data-act="save" data-need title="儲存 (Ctrl+S)"><i data-i="save"></i>儲存</button>
  </div><div class="cap">檔案</div></div>
  <div class="grp"><div class="btns">
    <button class="rb" data-act="undo" id="bUndo" title="復原 (Ctrl+Z)"><i data-i="undo"></i>復原</button>
    <button class="rb" data-act="redo" id="bRedo" title="重做 (Ctrl+Y)"><i data-i="redo"></i>重做</button>

/* ---------------- state ---------------- */
const S = {
  bytes:null, name:'document.pdf', pdf:null, pages:[], els:[], st:[],

};
const viewer = $('#viewer'), pagesEl = $('#pages');

/* ---------------- small UI helpers ---------------- */
function toast(msg, kind){
  const t = document.createElement('div'); t.className = 'toast' + (kind === 'err' ? ' err' : ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), kind === 'err' ? 4200 : 2400);
}
function busy(on, txt){ $('#busy').classList.toggle('show', !!on); if (txt) $('#busyTxt').textContent = txt; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(n){ return n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : (n/1048576).toFixed(2) + ' MB'; }
const isTyping = e => { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); };

let modalResolve = null;
function openModal({title, body, buttons, width, onOpen}){
  const m = $('#modal'); m.style.width = width ? width + 'px' : '';
  m.innerHTML = `<div class="mh">${esc(title)}</div><div class="mb"></div><div class="mf"></div>`;
  const mb = m.querySelector('.mb');
  if (typeof body === 'string') mb.innerHTML = body; else if (body) mb.appendChild(body);
  const mf = m.querySelector('.mf');
  return new Promise(res => {
    modalResolve = res;
    (buttons || [{label:'確定', value:true, primary:true}]).forEach(b => {
      if (b.spacer) { const s = document.createElement('span'); s.className = 'sp'; mf.appendChild(s); return; }
      const el = document.createElement('button'); el.className = 'btn' + (b.primary ? ' pri' : ''); el.textContent = b.label;

/* ---------------- downloads ---------------- */
let dlPromise = null;
function getDownloads(){
  if (!dlPromise && DESK) dlPromise = Promise.resolve({save: async ({filename, data}) => {
    const u8 = new Uint8Array(await (data instanceof Blob ? data : new Blob([data])).arrayBuffer());
    const where = await DESK.saveAs(filename, u8);
    if (!where) throw {code:'declined'};
    return {status:'saved', path:where};
  }});
  if (!dlPromise) dlPromise = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  return dlPromise;
}
setTimeout(getDownloads, 0);

    catch (e) {
      const c = e && e.code;

    }

}

/* ====================================================================

   ==================================================================== */
async function loadDoc(bytes, {name, keepView = false, scrollToCurrent = false} = {}){
  let anchorOffset = 0;
  if (keepView && S.pos[S.current]) anchorOffset = viewer.scrollTop - S.pos[S.current].y;
  S.st.forEach(st => st && st.task && st.task.cancel());
  const old = S.pdf;
  const pdf = await pdfjsLib.getDocument({
    ...PDF_OPTS, data: bytes.slice(),
  }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const p = await pdf.getPage(i); const vp = p.getViewport({scale:1});
    pages.push({page:p, vp1:vp, w:vp.width, h:vp.height, rot:((p.rotate % 360) + 360) % 360});
  }
  S.pdf = pdf; S.pages = pages; S.bytes = bytes; S.version++;
  if (name) S.name = name;
  S.imgCache.clear(); S.annCache.clear();
  // page elements
  pagesEl.innerHTML = '';
  S.els = pages.map((p, i) => {
    const d = document.createElement('div'); d.className = 'page'; d.dataset.i = i;
    d.innerHTML = `<div class="ld">${i + 1}</div><div class="ovl"></div>`;
    return d;
  });
  S.st = pages.map(() => ({rendered:0, ver:-1, task:null, ovlVer:-1}));
  if (!keepView) { S.current = 0; S.zoomMode = 'fit-width'; }
  S.current = clamp(S.current, 0, pages.length - 1);
  $('#welcome').style.display = 'none';
  $$('[data-need]').forEach(b => b.disabled = false);
  if (S.zoomMode !== 'custom') S.scale = fitScale(S.zoomMode);
  layout();
  if (keepView && !scrollToCurrent) viewer.scrollTop = S.pos[S.current] ? S.pos[S.current].y + anchorOffset : 0;
  else scrollToPage(S.current);
  updateUI(); scheduleRender(0);
  if (old) setTimeout(() => old.destroy(), 500);
  buildThumbs(); refreshPanels();
}

async function openFile(file, handle = null){
  if (!file) return;
  if (S.dirty && !(await confirmDlg('開啟新檔案', '目前文件有尚未儲存的修改，確定要開啟其他檔案？', '開啟'))) return;
  busy(true, '開啟中…');
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    S.undo = []; S.redo = []; S.dirty = false; S.signed = false; S.handle = handle;
    await loadDoc(bytes, {name:file.name});
    toast('已開啟 ' + file.name + (handle ? '（修改會直接存回原檔）' : ''));
  } catch (e) {
    console.error(e);
    toast(e && e.name === 'PasswordException' ? '此 PDF 受密碼保護，目前版本尚不支援' : '無法開啟此檔案：' + (e.message || e), 'err');

/* ====================================================================

   ==================================================================== */
const isCont = () => S.view === 'continuous' || S.view === 'two-continuous';
const isTwo = () => S.view === 'two' || S.view === 'two-continuous';

  const n = S.pages.length, rows = [];
  if (!isTwo()) { for (let i = 0; i < n; i++) rows.push([i]); return rows; }

    const p = pos[i];
    if (!p) { if (el.parentNode) el.remove(); return; }
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    el.style.width = S.pages[i].w * sc + 'px'; el.style.height = S.pages[i].h * sc + 'px';
    if (!el.parentNode) pagesEl.appendChild(el);
  });
}

function fitScale(mode){
  if (mode === 'actual') return PX;
  if (!S.pages.length) return S.scale;
  const rows = rowsFor(); const row = rows[Math.max(0, rows.findIndex(r => r.includes(S.current)))] || [0];
  const pw = isTwo() ? (row.length === 2 ? S.pages[row[0]].w + S.pages[row[1]].w : 2 * S.pages[row[0]].w) : S.pages[row[0]].w;
  const ph = Math.max(...row.map(p => S.pages[p].h));
  const aw = viewer.clientWidth - 2 * MARGIN - (isTwo() ? GAP : 0) - (mode === 'fit-width' ? 2 : 0);
  const ah = viewer.clientHeight - 2 * MARGIN;
  const sw = aw / pw;
  return clamp(mode === 'fit-width' ? sw : Math.min(sw, ah / ph), MIN_Z * PX, MAX_Z * PX);
}

/* zoom keeping the point under the cursor fixed */
function zoomTo(newScale, clientX, clientY, mode = 'custom'){
  if (!S.pdf) return;
  newScale = clamp(newScale, MIN_Z * PX, MAX_Z * PX);
  const r = viewer.getBoundingClientRect();
  const ax = (clientX ?? r.left + viewer.clientWidth / 2) - r.left;
  const ay = (clientY ?? r.top + viewer.clientHeight / 2) - r.top;
  const X = viewer.scrollLeft + ax, Y = viewer.scrollTop + ay;
  const old = S.scale;
  let best = -1, bd = Infinity;
  S.pos.forEach((p, i) => {
    if (!p) return;
    const w = S.pages[i].w * old, h = S.pages[i].h * old;
    const dx = Math.max(p.x - X, 0, X - (p.x + w)), dy = Math.max(p.y - Y, 0, Y - (p.y + h));
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  });
  let px = 0, py = 0;
  if (best >= 0) { px = (X - S.pos[best].x) / old; py = (Y - S.pos[best].y) / old; }
  S.scale = newScale; S.zoomMode = mode;
  layout();
  if (best >= 0) {
    viewer.scrollLeft = S.pos[best].x + px * newScale - ax;
    viewer.scrollTop = S.pos[best].y + py * newScale - ay;
  }
  updateZoomUI(); scheduleRender(140);
}
function setZoomMode(mode){
  if (!S.pdf) return;
  const cur = S.current, off = S.pos[cur] ? (viewer.scrollTop - S.pos[cur].y) / S.scale : 0;
  S.zoomMode = mode; S.scale = fitScale(mode); layout();
  if (mode === 'fit-page') scrollToPage(cur);
  else if (S.pos[cur]) viewer.scrollTop = S.pos[cur].y + Math.max(0, off) * S.scale;
  updateZoomUI(); scheduleRender(0);
}
function setView(v){
  if (!S.pdf) return;
  const cur = S.current;
  S.view = v; if (S.zoomMode !== 'custom') S.scale = fitScale(S.zoomMode);
  layout(); scrollToPage(cur); updateUI(); scheduleRender(0);
}

function scrollToPage(i){
  if (!S.pdf) return;
  i = clamp(i, 0, S.pages.length - 1);
  if (!isCont()) { S.current = i; layout(); viewer.scrollTop = 0; }
  else {
    S.current = i;
    const p = S.pos[i], row = S.rows[rowOf(i)] || [i];
    const top = Math.min(...row.map(k => S.pos[k] ? S.pos[k].y : Infinity));
    if (p) viewer.scrollTop = Math.max(0, top - MARGIN / 2);
    const w = S.pages[i].w * S.scale;
    if (p && pagesEl.offsetWidth > viewer.clientWidth) viewer.scrollLeft = Math.max(0, p.x + w / 2 - viewer.clientWidth / 2);
  }
  updatePager(); scheduleRender(0);
}
function goPage(delta){
  if (!S.pdf) return;
  if (isTwo()) {
    const ri = clamp(rowOf(S.current) + delta, 0, S.rows.length - 1);
    scrollToPage(S.rows[ri][0]);
  } else scrollToPage(S.current + delta);
}

function updateCurrentFromScroll(){
  if (!S.pdf || !isCont()) return;
  const mid = viewer.scrollTop + viewer.clientHeight * 0.35;
  let cur = S.current;
  for (let i = 0; i < S.pages.length; i++) {
    const p = S.pos[i]; if (!p) continue;
    if (p.y + S.pages[i].h * S.scale + GAP / 2 >= mid) { cur = i; break; }
  }
  if (viewer.scrollTop + viewer.clientHeight >= viewer.scrollHeight - 2) {
    // at the very bottom, make the last row current
    const last = S.rows[S.rows.length - 1]; if (last && S.pos[last[0]] && S.pos[last[0]].y < viewer.scrollTop + viewer.clientHeight) cur = Math.max(cur, last[0]);
  }

}

/* ====================================================================
   Rendering
   ==================================================================== */
let renderTimer = 0;
function scheduleRender(delay){ clearTimeout(renderTimer); renderTimer = setTimeout(renderVisible, delay); }
function pagesInView(buffer){
  const top = viewer.scrollTop - buffer, bot = viewer.scrollTop + viewer.clientHeight + buffer, out = [];
  S.pos.forEach((p, i) => { if (p && p.y < bot && p.y + S.pages[i].h * S.scale > top) out.push(i); });
  return out;
}
function renderVisible(){
  if (!S.pdf) return;
  const near = pagesInView(viewer.clientHeight * 0.6);
  near.sort((a, b) => Math.abs(a - S.current) - Math.abs(b - S.current)).forEach(renderPage);
  const keep = new Set(pagesInView(viewer.clientHeight * 3));
  S.els.forEach((el, i) => {
    if (keep.has(i)) return;
    const c = el.querySelector('canvas.pc');
    if (c) { c.width = c.height = 0; c.remove(); S.st[i].rendered = 0; }
    if (S.st[i].task) { S.st[i].task.cancel(); S.st[i].task = null; }
  });
}
async function renderPage(i){
  const st = S.st[i], want = S.scale, ver = S.version;
  if (st.rendered === want && st.ver === ver) { ensureOverlay(i); return; }
  if (st.task && st.taskScale === want) return;
  if (st.task) st.task.cancel();
  const pg = S.pages[i];
  const dpr = window.devicePixelRatio || 1;
  let rs = want * dpr;
  const maxPx = 16e6;
  if (pg.w * pg.h * rs * rs > maxPx) rs = Math.sqrt(maxPx / (pg.w * pg.h));
  const vp = pg.page.getViewport({scale:rs});
  const c = document.createElement('canvas'); c.className = 'pc';
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  const task = pg.page.render({canvasContext:c.getContext('2d'), viewport:vp, annotationMode:pdfjsLib.AnnotationMode.ENABLE});
  st.task = task; st.taskScale = want;
  try { await task.promise; }
  catch (e) { if (!e || e.name !== 'RenderingCancelledException') console.error(e); return; }
  finally { if (st.task === task) st.task = null; }
  if (ver !== S.version) return;
  const el = S.els[i], oldC = el.querySelector('canvas.pc');
  if (oldC) { oldC.replaceWith(c); oldC.width = oldC.height = 0; } else el.insertBefore(c, el.firstChild);
  const ld = el.querySelector('.ld'); if (ld) ld.remove();
  st.rendered = want; st.ver = ver;
  ensureOverlay(i);
}

/* overlays: annotation hit-areas + detected image boxes (positioned in %) */
async function ensureOverlay(i){
  const st = S.st[i]; if (st.ovlVer === S.version) return; st.ovlVer = S.version;
  const ver = S.version, el = S.els[i], ovl = el.querySelector('.ovl'), pg = S.pages[i];
  const [anns, imgs] = await Promise.all([getAnns(i), detectImages(i)]);
  if (ver !== S.version) return;
  ovl.querySelectorAll('.annhit,.imgbox').forEach(n => n.remove());
  const pct = (v, t) => (v / t * 100) + '%';
  anns.forEach(a => {
    const d = document.createElement('div'); d.className = 'annhit' + (a.noap ? ' noap' : '') + (a.sig ? ' sig' : '');
    d.style.left = pct(a.x, pg.w); d.style.top = pct(a.y, pg.h); d.style.width = pct(a.w, pg.w); d.style.height = pct(a.h, pg.h);
    d.addEventListener('pointerenter', ev => showTip(ev, a.label + (a.contents ? '\n' + a.contents : '')));
    d.addEventListener('pointermove', moveTip);
    d.addEventListener('pointerleave', hideTip);
    d.addEventListener('pointerdown', ev => { if (S.tool === 'select' && !S.spaceDown) { ev.stopPropagation(); } });
    d.addEventListener('click', ev => { if (S.tool === 'select' && !S.spaceDown) { ev.stopPropagation(); hideTip(); showAnnPop(ev, i, a); } });
    ovl.appendChild(d);
  });
  imgs.forEach((b, k) => {
    const d = document.createElement('div'); d.className = 'imgbox';
    d.style.left = pct(b.x, pg.w); d.style.top = pct(b.y, pg.h); d.style.width = pct(b.w, pg.w); d.style.height = pct(b.h, pg.h);
    d.innerHTML = `<span>圖片 ${k + 1}${b.nw ? ' · ' + b.nw + '×' + b.nh : ''}</span>`;
    d.addEventListener('pointerdown', ev => { if (S.tool === 'extract' && !S.spaceDown) ev.stopPropagation(); });
    d.addEventListener('click', ev => { if (S.tool === 'extract' && !S.spaceDown) { ev.stopPropagation(); openCrop(i, b, k); } });
    ovl.appendChild(d);
  });
}

const tip = $('#tip');
function showTip(e, txt){ tip.textContent = txt; tip.style.display = 'block'; moveTip(e); }
function moveTip(e){ tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + 'px'; tip.style.top = (e.clientY + 16) + 'px'; }

/* ---------------- annotations (read) ---------------- */
const ANN_LABEL = {Text:'便利貼', FreeText:'文字方塊', Highlight:'螢光筆', Underline:'底線', StrikeOut:'刪除線', Square:'矩形', Circle:'圓形', Ink:'手繪', Stamp:'圖章', FileAttachment:'附件註解', Line:'線條', Polygon:'多邊形', PolyLine:'折線', Squiggly:'波浪線', Caret:'插入符號'};
async function getAnns(i){
  const key = S.version + ':' + i; if (S.annCache.has(key)) return S.annCache.get(key);
  const pg = S.pages[i];
  const p = pg.page.getAnnotations().then(list => list.map(a => {
    const isSig = a.subtype === 'Widget' && a.fieldType === 'Sig';
    if (!ANN_LABEL[a.subtype] && !isSig) return null;
    const r = pg.vp1.convertToViewportRectangle(a.rect);
    const x = Math.min(r[0], r[2]), y = Math.min(r[1], r[3]);
    const contents = (a.contentsObj && a.contentsObj.str) || a.contents || '';
    const author = (a.titleObj && a.titleObj.str) || a.title || '';
    return {id:a.id, subtype:a.subtype, x, y, w:Math.abs(r[2] - r[0]), h:Math.abs(r[3] - r[1]),
      contents, author, sig:isSig, noap:a.subtype === 'Text' && !a.hasAppearance,
      label: isSig ? '數位簽章欄位' : (ANN_LABEL[a.subtype] + (author ? ' · ' + author : ''))};
  }).filter(Boolean)).catch(() => []);
  S.annCache.set(key, p); return p;
}
const pop = $('#pop');
function showAnnPop(e, i, a){
  pop.innerHTML = `<div class="k">${esc(a.label)} · 第 ${i + 1} 頁</div><div class="c">${a.contents ? esc(a.contents) : '<span style="color:#8c959f">（沒有文字內容）</span>'}</div>
    <div class="row">${a.sig ? '' : '<button class="mini danger" data-x="del">刪除註解</button>'}<button class="mini" data-x="close">關閉</button></div>`;
  pop.style.display = 'block';
  pop.style.left = Math.min(e.clientX, innerWidth - 280) + 'px'; pop.style.top = Math.min(e.clientY + 10, innerHeight - pop.offsetHeight - 10) + 'px';
  pop.onclick = async ev => {
    const x = ev.target.dataset.x; if (!x) return;
    pop.style.display = 'none';
    if (x === 'del') await deleteAnnot(i, a.id);
  };
}
document.addEventListener('pointerdown', e => { if (!pop.contains(e.target)) pop.style.display = 'none'; }, true);

/* ---------------- image detection ---------------- */
async function detectImages(i){
  const key = S.version + ':' + i; if (S.imgCache.has(key)) return S.imgCache.get(key);
  const p = (async () => {
    const pg = S.pages[i];
    const ops = await pg.page.getOperatorList({annotationMode:pdfjsLib.AnnotationMode.DISABLE});
    const O = pdfjsLib.OPS, U = pdfjsLib.Util, vt = pg.vp1.transform;
    let ctm = [1, 0, 0, 1, 0, 0]; const stack = [], out = [];
    const add = (nw, nh) => {
      const pts = [[0, 0], [1, 0], [0, 1], [1, 1]].map(q => U.applyTransform(U.applyTransform(q, ctm), vt));
      const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
      let x0 = Math.max(0, Math.min(...xs)), y0 = Math.max(0, Math.min(...ys));
      let x1 = Math.min(pg.w, Math.max(...xs)), y1 = Math.min(pg.h, Math.max(...ys));
      if (x1 - x0 < 4 || y1 - y0 < 4) return;
      const b = {x:x0, y:y0, w:x1 - x0, h:y1 - y0, nw:nw | 0, nh:nh | 0};
      if (!out.some(o => Math.abs(o.x - b.x) < 1 && Math.abs(o.y - b.y) < 1 && Math.abs(o.w - b.w) < 1 && Math.abs(o.h - b.h) < 1)) out.push(b);
    };
    for (let k = 0; k < ops.fnArray.length; k++) {
      const fn = ops.fnArray[k], a = ops.argsArray[k];
      switch (fn) {
        case O.save: stack.push(ctm.slice()); break;
        case O.restore: if (stack.length) ctm = stack.pop(); break;
        case O.transform: ctm = U.transform(ctm, a); break;
        case O.paintFormXObjectBegin: stack.push(ctm.slice()); if (a && Array.isArray(a[0]) && a[0].length === 6) ctm = U.transform(ctm, a[0]); break;
        case O.paintFormXObjectEnd: if (stack.length) ctm = stack.pop(); break;
        case O.paintImageXObject: add(a[1], a[2]); break;
        case O.paintInlineImageXObject: add(a[0] && a[0].width, a[0] && a[0].height); break;
        case O.paintImageMaskXObject: add(a[0] && a[0].width, a[0] && a[0].height); break;
      }
    }
    return out;
  })().catch(e => { console.warn(e); return []; });
  S.imgCache.set(key, p); return p;
}

/* render a region (visual pt coords) of a page to a canvas */
async function renderRegion(i, box, pxPerPt){
  const pg = S.pages[i];
  const s = pxPerPt;
  const vp = pg.page.getViewport({scale:s});
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(box.w * s)); c.height = Math.max(1, Math.round(box.h * s));
  await pg.page.render({canvasContext:c.getContext('2d'), viewport:vp, transform:[1, 0, 0, 1, -box.x * s, -box.y * s], annotationMode:pdfjsLib.AnnotationMode.DISABLE}).promise;
  return c;
}
function nativeScale(box){
  let s = box.nw ? Math.max(box.nw / box.w, box.nh / box.h) : 3;
  s = clamp(s, 2, 8);
  return Math.min(s, 5000 / Math.max(box.w, box.h));
}

/* ====================================================================
   UI state
   ==================================================================== */
function updatePager(){
  const n = S.pages.length;
  if (!n) { $('#pgIn').value = '–'; $('#pgTot').textContent = '/ –'; return; }
  let label = String(S.current + 1);
  if (isTwo()) { const r = S.rows[rowOf(S.current)]; if (r && r.length === 2) label = (r[0] + 1) + '-' + (r[1] + 1); }
  if (document.activeElement !== $('#pgIn')) $('#pgIn').value = label;
  $('#pgTot').textContent = '/ ' + n;
  $$('.thumb').forEach(t => t.classList.toggle('on', +t.dataset.i === S.current));
  const th = $(`.thumb[data-i="${S.current}"]`), panel = $('#p-thumbs');
  if (th && panel.classList.contains('on')) {
    const tr = th.getBoundingClientRect(), pr = panel.getBoundingClientRect();

}

}

  $$('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
  $$('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === S.tool));
  $('#bUndo').disabled = !S.undo.length; $('#bRedo').disabled = !S.redo.length;
  $('#coverChk').checked = S.cover; $('#coverChk').disabled = !isTwo();
  $('#stFile').innerHTML = S.pdf ? `<span class="dot${S.dirty ? ' dirty' : ''}"></span>${esc(S.name)}${S.dirty ? '（已修改）' : ''}` : '尚未開啟檔案';
  $('#stSig').innerHTML = S.signed ? '<span class="sig">✓ 已數位簽署</span>' : '';

  else sw.innerHTML = `<span class="wmode ro"><b>● 編輯副本</b><span>按「儲存」以原檔名下載${canPick() ? '' : '（此瀏覽器環境不允許直接覆寫原檔）'}</span></span>`;

/* ====================================================================
   Input: wheel, keyboard, pan
   ==================================================================== */
let flipLock = 0, flipAcc = 0;
viewer.addEventListener('wheel', e => {
  if (!S.pdf) return;
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    let d = e.deltaY; if (e.deltaMode === 1) d *= 33; else if (e.deltaMode === 2) d *= 400;
    d = clamp(d, -160, 160);
    zoomTo(S.scale * Math.exp(-d * 0.0022), e.clientX, e.clientY);
    return;
  }
  if (!isCont()) {
    // single / two-page: wheel past the edge flips to the next spread
    const atBottom = viewer.scrollTop + viewer.clientHeight >= viewer.scrollHeight - 1;
    const atTop = viewer.scrollTop <= 0;
    const now = performance.now();
    if ((e.deltaY > 0 && atBottom) || (e.deltaY < 0 && atTop)) {
      e.preventDefault();
      if (now < flipLock) return;
      flipAcc += e.deltaY;
      if (Math.abs(flipAcc) >= 60) {
        const dir = flipAcc > 0 ? 1 : -1; flipAcc = 0;
        const ri = rowOf(S.current) + dir;
        if (ri >= 0 && ri < S.rows.length) {
          S.current = S.rows[ri][0]; layout();
          viewer.scrollTop = dir > 0 ? 0 : viewer.scrollHeight;
          updatePager(); scheduleRender(0);
          flipLock = now + 350;
        }
      }
    } else flipAcc = 0;
  }
}, {passive:false});
window.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, {passive:false});
viewer.addEventListener('scroll', () => { updateCurrentFromScroll(); scheduleRender(60); hideTip(); });
new ResizeObserver(() => {
  if (!S.pdf) return;
  if (S.zoomMode !== 'custom') { const cur = S.current, off = S.pos[cur] ? (viewer.scrollTop - S.pos[cur].y) / S.scale : 0; S.scale = fitScale(S.zoomMode); layout(); if (S.pos[cur]) viewer.scrollTop = S.pos[cur].y + off * S.scale; updateZoomUI(); }
  else layout();
  scheduleRender(80);
}).observe(viewer);

window.addEventListener('keydown', e => {
  if ($('#mask').classList.contains('show')) { if (e.key === 'Escape') closeModal(undefined); return; }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); actions.open(); return; }
  if (!S.pdf) return;
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); actions.save(); return; }
  if (isTyping(e)) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (!S.spaceDown) { S.spaceDown = true; viewer.classList.add('pan-ready'); }
    return;
  }

function pagePoint(i, e){
  const r = S.els[i].getBoundingClientRect();
  return {x:clamp((e.clientX - r.left) / S.scale, 0, S.pages[i].w), y:clamp((e.clientY - r.top) / S.scale, 0, S.pages[i].h)};
}
pagesEl.addEventListener('pointerdown', e => {
  if (S.panning || S.spaceDown || e.button !== 0) return;
  const pel = e.target.closest('.page'); if (!pel) return;
  const i = +pel.dataset.i;
  if (S.current !== i) { S.current = i; updatePager(); }
  const t = S.tool;
  if (t === 'note') { const p = pagePoint(i, e); addNote(i, p.x, p.y); return; }
  if (t === 'signature') { const p = pagePoint(i, e); placeSignature(i, p.x, p.y); return; }
  if (t === 'textbox' || t === 'highlight' || t === 'digisign' || t === 'extract') {
    e.preventDefault();
    const p0 = pagePoint(i, e);
    const d = document.createElement('div'); d.className = 'draft' + (t === 'highlight' ? ' hl' : '');
    if (t === 'highlight') d.style.background = S.hlColor + '88';
    pel.querySelector('.ovl').appendChild(d);
    let box = {x:p0.x, y:p0.y, w:0, h:0};
    const move = ev => {
      const p = pagePoint(i, ev);
      box = {x:Math.min(p0.x, p.x), y:Math.min(p0.y, p.y), w:Math.abs(p.x - p0.x), h:Math.abs(p.y - p0.y)};
      const pg = S.pages[i];
      d.style.left = box.x / pg.w * 100 + '%'; d.style.top = box.y / pg.h * 100 + '%';
      d.style.width = box.w / pg.w * 100 + '%'; d.style.height = box.h / pg.h * 100 + '%';
    };
    const up = () => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      d.remove();
      const pg = S.pages[i], tiny = box.w < 5 || box.h < 5;
      if (t === 'highlight') { if (!tiny) addHighlight(i, box); return; }
      if (t === 'extract') { if (!tiny) openCrop(i, box, -1); return; }
      if (tiny) { const dw = t === 'digisign' ? 190 : 200, dh = t === 'digisign' ? 64 : 60; box = {x:clamp(p0.x, 0, pg.w - dw), y:clamp(p0.y, 0, pg.h - dh), w:dw, h:dh}; }

});

async function mutate(label, fn, opts = {}){
  if (!S.pdf) return false;

  busy(true, '處理中…');

    const doc = await PDFDocument.load(S.bytes, {ignoreEncryption:true, updateMetadata:false});
    const res = await fn(doc);
    if (res === false) return false;
    const out = await doc.save();
    S.undo.push({bytes:S.bytes, signed:S.signed, cur:S.current}); if (S.undo.length > 30) S.undo.shift();
    S.redo = []; S.signed = false; S.dirty = true;

}

function visToPdf(i, b){
  const pg = S.pages[i], vp = pg.vp1;

/* ---------------- writing back to the opened file ----------------
   When the browser supports the File System Access API, a PDF opened through the
   picker (or dragged in) keeps a handle, and every edit is written straight back
   into that same file. Otherwise saving downloads a file with the original name. */
const canPick = () => !!DESK || typeof window.showOpenFilePicker === 'function';
function desktopHandle(p, name){
  return {kind:'file', name, path:p,
    queryPermission: async () => 'granted', requestPermission: async () => 'granted',
    getFile: async () => { const r = await DESK.readFile(p); return new File([r.data], r.name, {type:'application/pdf'}); },
    createWritable: async () => { const parts = []; return {
      write: async b => { parts.push(b); },
      close: async () => { await DESK.writeFile(p, new Uint8Array(await new Blob(parts).arrayBuffer())); },
    }; },
  };
}
async function openPath(p){
  try {
    const r = await DESK.readFile(p);
    await openFile(new File([r.data], r.name, {type:'application/pdf'}), desktopHandle(p, r.name));
  } catch (e) { toast('無法開啟檔案：' + (e.message || e), 'err'); }
}
let permAsk = null;
function primeWrite(){
  // must run synchronously inside the click so the permission prompt is allowed
  if (!S.handle || !S.autoWrite || !S.handle.requestPermission) return null;
  permAsk = S.handle.queryPermission({mode:'readwrite'})
    .then(st => st === 'granted' ? st : S.handle.requestPermission({mode:'readwrite'}))
    .catch(() => 'denied');
  return permAsk;
}
async function writeBack(bytes, {quiet = false} = {}){
  if (!S.handle) return false;
  const h = S.handle;
  const run = async () => {
    let st = permAsk ? await permAsk : await h.queryPermission({mode:'readwrite'}).catch(() => 'denied');
    permAsk = null;
    if (st !== 'granted') st = await h.requestPermission({mode:'readwrite'}).catch(() => 'denied');
    if (st !== 'granted') throw new Error('沒有寫入原檔的權限');
    const w = await h.createWritable();
    await w.write(new Blob([bytes], {type:'application/pdf'}));
    await w.close();
  };
  // serialize writes so a fast series of edits never interleaves
  const prev = S.writing || Promise.resolve();
  const job = prev.catch(() => {}).then(run);
  S.writing = job;
  try {
    await job;
    if (S.handle === h && S.bytes === bytes) S.dirty = false;
    updateUI();
    if (!quiet) toast('已存回原檔 ' + S.name);
    return true;
  } catch (e) {
    console.error(e);
    toast('無法寫回原檔：' + (e.message || e) + '，可按「儲存」另存', 'err');
    return false;
  }
}
async function afterEdit(){ if (S.handle && S.autoWrite) await writeBack(S.bytes, {quiet:true}); }

/* ---------------- page picker (shared by 減頁 and 插入PDF) ---------------- */
function parseRange(txt, n){
  const out = new Set();
  for (const part of String(txt).replace(/[，、；;\s]+/g, ',').split(',')) {
    if (!part) continue;
    const m = /^(\d*)\s*[-~－–]\s*(\d*)$/.exec(part);
    if (m) {
      const a = m[1] ? +m[1] : 1, b = m[2] ? +m[2] : n;
      for (let k = Math.min(a, b); k <= Math.max(a, b); k++) if (k >= 1 && k <= n) out.add(k - 1);
    } else if (/^\d+$/.test(part)) { const k = +part; if (k >= 1 && k <= n) out.add(k - 1); }
    else return null;
  }
  return out;
}
function rangeText(sel){
  const a = [...sel].sort((x, y) => x - y), out = [];
  for (let k = 0; k < a.length; k++) {
    let j = k; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++;
    out.push(j > k ? `${a[k] + 1}-${a[j] + 1}` : `${a[k] + 1}`); k = j;
  }
  return out.join(', ');
}
async function pagePicker({title, mode, count, initial = [], current = -1, getPage, okLabel, note, validate, footer, sizes}){
  const sel = new Set(initial);
  const body = document.createElement('div');
  body.innerHTML = `${note ? `<div class="note" style="margin-bottom:10px">${esc(note)}</div>` : ''}
    <div class="pp-bar">
      <button class="mini" data-b="all">全選</button><button class="mini" data-b="none">全不選</button><button class="mini" data-b="inv">反向選取</button>
      <span class="sep"></span>
      <input type="text" id="ppRange" placeholder="頁碼範圍，例如 1-3, 5, 8-">
      <button class="mini" data-b="range">套用</button>
      <span class="sep"></span>
      <span class="flab">縮圖</span><input type="range" id="ppSize" min="90" max="240" step="10" value="130">
      <span class="cnt" id="ppCnt"></span>
    </div>
    <div class="pp-grid ${mode === 'delete' ? 'pp-del' : ''}" id="ppGrid"></div>
    ${footer ? `<div class="pp-foot">${footer}</div>` : ''}`;
  const grid = body.querySelector('#ppGrid');
  const cards = [];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div'); c.className = 'pp-card' + (i === current ? ' cur' : ''); c.dataset.i = i;
    const ar = sizes && sizes[i] ? sizes[i].h / sizes[i].w : 1.414;
    c.innerHTML = `<span class="ck">✓</span><div class="th" style="aspect-ratio:${1 / ar}">${i + 1}</div><span class="num">第 ${i + 1} 頁</span>`;
    grid.appendChild(c); cards.push(c);
  }
  let last = -1, okBtn = null;
  const sync = () => {
    cards.forEach((c, i) => c.classList.toggle('on', sel.has(i)));
    body.querySelector('#ppCnt').innerHTML = `已選 <b>${sel.size}</b> / ${count} 頁`;
    if (okBtn) { okBtn.textContent = okLabel(sel.size); okBtn.disabled = !!(validate && validate([...sel])); okBtn.title = validate ? validate([...sel]) : ''; }
    const ri = body.querySelector('#ppRange'); if (document.activeElement !== ri) ri.value = rangeText(sel);
  };
  grid.addEventListener('click', e => {
    const c = e.target.closest('.pp-card'); if (!c) return;
    const i = +c.dataset.i;
    if (e.shiftKey && last >= 0) { const on = !sel.has(i); for (let k = Math.min(last, i); k <= Math.max(last, i); k++) on ? sel.add(k) : sel.delete(k); }
    else sel.has(i) ? sel.delete(i) : sel.add(i);
    last = i; sync();
  });
  const applyRange = () => {
    const r = parseRange(body.querySelector('#ppRange').value, count);
    if (!r) { toast('頁碼範圍格式不正確，例如：1-3, 5, 8-', 'err'); return; }
    sel.clear(); r.forEach(k => sel.add(k)); body.querySelector('#ppRange').blur(); sync();
  };
  body.querySelector('.pp-bar').addEventListener('click', e => {
    const b = e.target.dataset.b; if (!b) return;
    if (b === 'all') for (let k = 0; k < count; k++) sel.add(k);
    if (b === 'none') sel.clear();
    if (b === 'inv') for (let k = 0; k < count; k++) sel.has(k) ? sel.delete(k) : sel.add(k);
    if (b === 'range') { applyRange(); return; }
    sync();
  });
  body.querySelector('#ppRange').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyRange(); } });
  body.querySelector('#ppSize').addEventListener('input', e => grid.style.setProperty('--tw', e.target.value + 'px'));
  // lazy thumbnails
  const done = new Set();
  const obs = new IntersectionObserver(ents => ents.forEach(async en => {
    if (!en.isIntersecting) return;
    const c = en.target, i = +c.dataset.i; obs.unobserve(c); if (done.has(i)) return; done.add(i);
    try {
      const page = await getPage(i), th = c.querySelector('.th');
      const dpr = window.devicePixelRatio || 1, vp1 = page.getViewport({scale:1});
      const vp = page.getViewport({scale:Math.min(3, 240 * dpr / vp1.width)});
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      th.style.aspectRatio = vp1.width / vp1.height;
      await page.render({canvasContext:cv.getContext('2d'), viewport:vp, annotationMode:pdfjsLib.AnnotationMode.ENABLE}).promise;
      th.textContent = ''; th.appendChild(cv);
    } catch (_) {}
  }), {root:grid, rootMargin:'300px'});
  cards.forEach(c => obs.observe(c));
  const res = await openModal({title, body, width:Math.min(1000, innerWidth - 40), buttons:[
    {label:'取消', value:null},
    {label:okLabel(sel.size), primary:true, id:'ppOk', handler:() => {
      const err = validate && validate([...sel]); if (err) { toast(err, 'err'); return; }
      const extra = {}; body.querySelectorAll('[data-x]').forEach(el => extra[el.dataset.x] = el.value);
      return {sel:[...sel].sort((a, b) => a - b), extra};
    }}],
    onOpen:(mb, mf) => {
      okBtn = mf.querySelector('#ppOk'); sync();
      if (current >= 0) setTimeout(() => cards[current] && cards[current].scrollIntoView({block:'center'}), 30);
    }});
  obs.disconnect();
  return res || null;
}

$('#fInsert').addEventListener('change', async e => {

async function insertFromPdf(file){
  if (!S.pdf) return;
  busy(true, '讀取 PDF…');
  let bytes, src, sizes = [];
  try {
    bytes = new Uint8Array(await file.arrayBuffer());
    src = await pdfjsLib.getDocument({...PDF_OPTS, data:bytes.slice()}).promise;
    for (let i = 1; i <= Math.min(src.numPages, 400); i++) { const pg = await src.getPage(i), v = pg.getViewport({scale:1}); sizes.push({w:v.width, h:v.height}); }
  } catch (e) {
    busy(false);
    toast(e && e.name === 'PasswordException' ? '此 PDF 受密碼保護，無法匯入' : '無法讀取此 PDF：' + (e.message || e), 'err'); return;
  }
  busy(false);
  const n = src.numPages, cur = S.current + 1, tot = S.pages.length;
  const footer = `<span class="flab">插入位置</span>
    <select data-x="pos">
      <option value="after" selected>目前頁（第 ${cur} 頁）之後</option>
      <option value="before">目前頁（第 ${cur} 頁）之前</option>
      <option value="start">文件最前面</option>
      <option value="end">文件最後面（第 ${tot} 頁之後）</option>
      <option value="at">指定頁碼之後…</option>
    </select>
    <span id="atWrap" style="display:none">第 <input type="text" data-x="at" value="${cur}" style="width:56px;font:inherit;border:1px solid var(--line2);border-radius:7px;padding:5px 8px;text-align:center"> 頁之後（0 = 最前面）</span>
    <span class="flab" style="margin-left:auto">來源：${esc(file.name)} · 共 ${n} 頁</span>`;
  const picker = pagePicker({
    title:'從其他 PDF 插入頁面', mode:'insert', count:n, initial:[...Array(n).keys()],
    getPage:i => src.getPage(i + 1), sizes,
    okLabel:k => k ? `插入 ${k} 頁` : '插入',
    note:'勾選要匯入的頁面（預設全選，可按住 Shift 連續選取），並選擇要插入的位置。',
    validate:sel => sel.length ? '' : '請至少勾選一頁', footer,
  });
  setTimeout(() => {
    const ps = document.querySelector('select[data-x=pos]');
    if (ps) ps.onchange = () => { $('#atWrap').style.display = ps.value === 'at' ? '' : 'none'; };
  }, 0);
  const res = await picker;
  setTimeout(() => src.destroy(), 300);
  if (!res) return;
  const pos = res.extra.pos;
  let at;
  if (pos === 'after') at = S.current + 1;
  else if (pos === 'before') at = S.current;
  else if (pos === 'start') at = 0;
  else if (pos === 'end') at = tot;
  else { const k = parseInt(res.extra.at, 10); if (!(k >= 0 && k <= tot)) { toast(`頁碼需介於 0 到 ${tot}`, 'err'); return; } at = k; }
  await mutate(`已從「${file.name}」插入 ${res.sel.length} 頁`, async doc => {
    const srcDoc = await PDFDocument.load(bytes, {ignoreEncryption:true, updateMetadata:false});
    const copied = await doc.copyPages(srcDoc, res.sel);
    copied.forEach((pg, k) => doc.insertPage(at + k, pg));
    S.current = clamp(at, 0, doc.getPageCount() - 1);
  }, {scrollToCurrent:true});
}

    return mutate(`已刪除 ${sel.length} 頁（${rangeText(sel)}）`, doc => {
      [...sel].sort((a, b) => b - a).forEach(i => doc.removePage(i));
      const before = sel.filter(i => i < S.current).length;
      S.current = clamp(sel.includes(S.current) ? S.current - before : S.current - before, 0, doc.getPageCount() - 1);
    });
  },
  insertPdf(){ $('#fInsert').click(); },
  rotL(){ return rotate(-90); },
  rotR(){ return rotate(90); },
  attach(){ $('#fAttach').click(); },
  prev(){ goPage(-1); }, next(){ goPage(1); },
  zoomIn(){ zoomTo(nextZoom(1)); }, zoomOut(){ zoomTo(nextZoom(-1)); },
  sidebar(){ $('#side').classList.toggle('hide'); },
};
const STEPS = [10, 25, 33, 50, 67, 75, 90, 100, 110, 125, 150, 175, 200, 250, 300, 400, 500, 600, 800];
function nextZoom(dir){
  const cur = S.scale / PX * 100;
  const v = dir > 0 ? STEPS.find(s => s > cur + 0.5) ?? 800 : [...STEPS].reverse().find(s => s < cur - 0.5) ?? 10;
  return v / 100 * PX;
}
function rotate(delta){
  const i = S.current;
  return mutate(`第 ${i + 1} 頁已${delta < 0 ? '向左' : '向右'}旋轉`, doc => {
    const p = doc.getPage(i); p.setRotation(degrees((((p.getRotation().angle + delta) % 360) + 360) % 360));
  });
}

function wrapText(ctx, text, maxW){
  const lines = [];
  text.split('\n').forEach(par => {
    const toks = par.match(/[A-Za-z0-9_\-.,:;'"!?()@#%&*+=/\\]+|\s+|./gu) || [''];
    let line = '';
    for (const t of toks) {
      const test = line + t;
      if (ctx.measureText(test).width <= maxW || !line) {
        if (ctx.measureText(test).width > maxW && !line) {
          // a single long token: hard-break it
          let part = '';
          for (const ch of t) { if (ctx.measureText(part + ch).width > maxW && part) { lines.push(part); part = ch; } else part += ch; }
          line = part;
        } else line = test;
      } else { lines.push(line.replace(/\s+$/, '')); line = t.trimStart(); }
    }
    lines.push(line);
  });
  return lines;
}
async function textToPng(text, wPt, {size, color, bold, bg}){
  try { await document.fonts.load(`${bold ? 700 : 400} ${size}px "Noto Sans TC"`, text); } catch (_) {}
  const K = 4, pad = 4;
  const m = document.createElement('canvas').getContext('2d');
  m.font = `${bold ? 700 : 400} ${size * K}px ${FONT}`;
  const lines = wrapText(m, text, (wPt - pad * 2) * K);
  const lh = size * 1.4;
  const hPt = Math.max(size * 1.4 + pad * 2, lines.length * lh + pad * 2);
  const c = document.createElement('canvas'); c.width = Math.ceil(wPt * K); c.height = Math.ceil(hPt * K);
  const ctx = c.getContext('2d');
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height); ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = K * 0.75; ctx.strokeRect(K * 0.4, K * 0.4, c.width - K * 0.8, c.height - K * 0.8); }
  ctx.font = m.font; ctx.fillStyle = color; ctx.textBaseline = 'middle';
  lines.forEach((ln, k) => ctx.fillText(ln, pad * K, (pad + lh * k + lh / 2) * K));
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return {png:new Uint8Array(await blob.arrayBuffer()), hPt};
}

async function textToPngFixed(opt, b){
  // re-render at the final box height so the image is not stretched
  try { await document.fonts.load(`${opt.bold ? 700 : 400} ${opt.size}px "Noto Sans TC"`, opt.text); } catch (_) {}

  ctx.font = `${opt.bold ? 700 : 400} ${opt.size * K}px ${FONT}`; ctx.fillStyle = opt.color; ctx.textBaseline = 'middle';

function openSigPad(){
  const f = document.createElement('div');
  f.innerHTML = `<div class="padwrap"><canvas id="pad"></canvas></div>
  <div class="pens"><span class="flab">筆色</span>
    <button class="pen on" data-c="#111111" style="background:#111"></button>
    <button class="pen" data-c="#1c3fa8" style="background:#1c3fa8"></button>
    <button class="pen" data-c="#c8371d" style="background:#c8371d"></button>
    <span class="flab" style="margin-left:10px">粗細</span><input type="range" id="penW" min="1.5" max="7" step="0.5" value="3">
  </div>
  <div class="note" style="margin-top:10px">在框內用滑鼠或觸控筆簽名，完成後點「使用此簽名」，再到頁面上點一下即可放置。</div>`;
  let color = '#111111', drawn = false;
  openModal({title:'手寫簽名', body:f, width:640, buttons:[
    {label:'清除', handler:() => { const c = $('#pad'); c.getContext('2d').clearRect(0, 0, c.width, c.height); drawn = false; }},
    {spacer:true}, {label:'取消', value:false},
    {label:'使用此簽名', primary:true, handler:() => {
      if (!drawn) { toast('請先在框內簽名', 'err'); return; }
      const t = trimCanvas($('#pad')); if (!t) return;
      S.sigImg = t.toDataURL('image/png'); S.sigAspect = t.width / t.height; return true;
    }}],
    onOpen:() => {
      const c = $('#pad'), dpr = window.devicePixelRatio || 1, r = c.getBoundingClientRect();
      c.width = r.width * dpr * 1.5; c.height = r.height * dpr * 1.5;
      const ctx = c.getContext('2d'); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      let last = null, lastW = 3;
      const pt = e => { const b = c.getBoundingClientRect(); return {x:(e.clientX - b.left) * c.width / b.width, y:(e.clientY - b.top) * c.height / b.height, t:performance.now()}; };
      c.onpointerdown = e => { c.setPointerCapture(e.pointerId); last = pt(e); lastW = +$('#penW').value * dpr * 1.5; ctx.beginPath(); ctx.fillStyle = color; ctx.arc(last.x, last.y, lastW / 2, 0, 7); ctx.fill(); drawn = true; };
      c.onpointermove = e => {
        if (!last) return; const p = pt(e);
        const dist = Math.hypot(p.x - last.x, p.y - last.y), v = dist / Math.max(1, p.t - last.t);
        const base = +$('#penW').value * dpr * 1.5, w = clamp(base * (1.25 - Math.min(v, 3) * 0.18), base * 0.45, base * 1.3);
        const nw = lastW * 0.65 + w * 0.35;
        ctx.strokeStyle = color; ctx.lineWidth = nw; ctx.beginPath(); ctx.moveTo(last.x, last.y);
        const mx = (last.x + p.x) / 2, my = (last.y + p.y) / 2; ctx.quadraticCurveTo(last.x, last.y, mx, my); ctx.lineTo(p.x, p.y); ctx.stroke();
        last = p; lastW = nw;
      };
      c.onpointerup = c.onpointercancel = () => { last = null; };
      f.querySelectorAll('.pen').forEach(b => b.onclick = () => { f.querySelectorAll('.pen').forEach(x => x.classList.remove('on')); b.classList.add('on'); color = b.dataset.c; });
    }}).then(v => { if (!v && !S.sigImg && S.tool === 'signature') setTool('select'); else if (v) toast('簽名已準備好，請在頁面上點選放置位置'); });
}
function trimCanvas(c){
  const ctx = c.getContext('2d'), d = ctx.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const pad = 6, o = document.createElement('canvas');
  o.width = x1 - x0 + 1 + pad * 2; o.height = y1 - y0 + 1 + pad * 2;
  o.getContext('2d').drawImage(c, x0 - pad, y0 - pad, o.width, o.height, 0, 0, o.width, o.height);
  return o;
}
const dataUrlBytes = u => Uint8Array.from(atob(u.split(',')[1]), c => c.charCodeAt(0));

  if (!S.sigImg) { openSigPad(); return; }
  const pg = S.pages[i];
  let w = Math.min(160, pg.w * 0.4), h = w / S.sigAspect;
  if (h > 80) { h = 80; w = h * S.sigAspect; }
  const b = {x:clamp(x - w / 2, 0, pg.w - w), y:clamp(y - h / 2, 0, pg.h - h), w, h};
  await mutate('已放置手寫簽名', async doc => {

    doc.getPage(i).drawImage(img, {x:g.origin[0], y:g.origin[1], width:w, height:h, rotate:degrees(g.rot)});

}

async function removeAttachment(name){
  await mutate('已移除附件', doc => {
    const names = doc.catalog.lookupMaybe(PDFName.of('Names'), PDFDict);
    const ef = names && names.lookupMaybe(PDFName.of('EmbeddedFiles'), PDFDict);
    const arr = ef && ef.lookupMaybe(PDFName.of('Names'), PDFArray);
    if (!arr) { toast('此附件位於較複雜的結構中，暫不支援移除', 'err'); return false; }
    for (let k = 0; k < arr.size(); k += 2) {
      const key = arr.lookup(k);
      const s = key && key.decodeText ? key.decodeText() : '';
      if (s === name) { arr.remove(k); arr.remove(k); return; }
    }
    // fall back to matching the file spec's filename
    for (let k = 0; k < arr.size(); k += 2) {
      const spec = arr.lookup(k + 1, PDFDict);
      const uf = spec && (spec.lookupMaybe(PDFName.of('UF'), PDFString, PDFHexString) || spec.lookupMaybe(PDFName.of('F'), PDFString, PDFHexString));
      if (uf && uf.decodeText() === name) { arr.remove(k); arr.remove(k); return; }
    }
    toast('找不到此附件', 'err'); return false;
  });
}

async function openCrop(i, box, k){

  busy(false);
  const W = src.width, H = src.height;
  const maxW = Math.min(760, innerWidth - 120), maxH = Math.max(200, innerHeight - 360);
  const f = Math.min(1, maxW / W, maxH / H), dw = Math.round(W * f), dh = Math.round(H * f);
  const cr = {l:0, t:0, r:0, b:0};
  const body = document.createElement('div');
  body.innerHTML = `<div class="cropstage"><div class="cropwrap" style="width:${dw}px;height:${dh}px">
      <div class="cropclip"><div class="cropbox" id="cbox">
        <div class="g" style="left:33.33%;top:0;bottom:0;border-left-width:1px"></div><div class="g" style="left:66.66%;top:0;bottom:0;border-left-width:1px"></div>
        <div class="g" style="top:33.33%;left:0;right:0;border-top-width:1px"></div><div class="g" style="top:66.66%;left:0;right:0;border-top-width:1px"></div>
        ${['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].map(d => `<div class="h" data-d="${d}"></div>`).join('')}

    <div class="cropctl">

      <div class="field"><label>下裁切 (px)</label><input type="number" min="0" data-s="b" value="0"></div>
      <div class="field"><label>左裁切 (px)</label><input type="number" min="0" data-s="l" value="0"></div>
      <div class="field"><label>右裁切 (px)</label><input type="number" min="0" data-s="r" value="0"></div>
    </div>
    <div class="cropinfo" id="cinfo"></div>`;
  const wrap = body.querySelector('.cropwrap');
  src.style.width = dw + 'px'; src.style.height = dh + 'px';
  wrap.insertBefore(src, wrap.firstChild);
  const cbox = body.querySelector('#cbox');
  const handles = {nw:[0, 0], n:[50, 0], ne:[100, 0], e:[100, 50], se:[100, 100], s:[50, 100], sw:[0, 100], w:[0, 50]};
  body.querySelectorAll('.h').forEach(h => { const [x, y] = handles[h.dataset.d]; h.style.left = x + '%'; h.style.top = y + '%'; });
  const MIN = 4;
  const draw = () => {
    cbox.style.left = cr.l * f + 'px'; cbox.style.top = cr.t * f + 'px';
    cbox.style.width = (W - cr.l - cr.r) * f + 'px'; cbox.style.height = (H - cr.t - cr.b) * f + 'px';
    body.querySelectorAll('input[data-s]').forEach(inp => { if (document.activeElement !== inp) inp.value = Math.round(cr[inp.dataset.s]); });
    body.querySelector('#cinfo').textContent = `來源：第 ${i + 1} 頁${k >= 0 ? ' · 圖片 ' + (k + 1) : ' · 框選區域'}　｜　原始 ${W} × ${H} px　→　輸出 ${Math.round(W - cr.l - cr.r)} × ${Math.round(H - cr.t - cr.b)} px`;
  };
  const fix = () => {
    cr.l = clamp(cr.l, 0, W - MIN); cr.r = clamp(cr.r, 0, W - MIN - cr.l);
    cr.t = clamp(cr.t, 0, H - MIN); cr.b = clamp(cr.b, 0, H - MIN - cr.t);
  };
  body.querySelectorAll('input[data-s]').forEach(inp => inp.addEventListener('input', () => { cr[inp.dataset.s] = Math.max(0, +inp.value || 0); fix(); draw(); }));
  cbox.addEventListener('pointerdown', e => {
    e.preventDefault(); const d = e.target.dataset.d || 'move';
    const s0 = {...cr}, x0 = e.clientX, y0 = e.clientY;
    cbox.setPointerCapture(e.pointerId);
    const mv = ev => {
      const dx = (ev.clientX - x0) / f, dy = (ev.clientY - y0) / f;
      Object.assign(cr, s0);
      if (d === 'move') {
        const mx = clamp(dx, -s0.l, s0.r), my = clamp(dy, -s0.t, s0.b);
        cr.l = s0.l + mx; cr.r = s0.r - mx; cr.t = s0.t + my; cr.b = s0.b - my;
      } else {
        if (d.includes('w')) cr.l = clamp(s0.l + dx, 0, W - s0.r - MIN);
        if (d.includes('e')) cr.r = clamp(s0.r - dx, 0, W - s0.l - MIN);
        if (d.includes('n')) cr.t = clamp(s0.t + dy, 0, H - s0.b - MIN);

    const up = () => { cbox.removeEventListener('pointermove', mv); cbox.removeEventListener('pointerup', up); };

  await openModal({title:'擷取圖片', body, width:Math.max(560, dw + 70), buttons:[

function u8ToBin(u8){ let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return s; }

async function sigAppearancePng(b, {name, reason, location, date, withHand}){

async function signPdf(bytes, {pageIndex, box, cred, name, reason, location, contact, apPng}){

}

    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
