/* ====================================================================
   文字辨識 (OCR): drag a box over the page. The PDF's own text inside it is taken as it is (exact, instant);
   where there is none (scans, pictures) the box is rendered at ~300 dpi and read by Tesseract, offline:
   tesseract.js + the LSTM builds of tesseract.js-core, language data in app/ocr/lang
   (Traditional Chinese, vertical Traditional Chinese, English).
   ==================================================================== */
const OCR = {worker:null, langs:'', job:0, panel:null, mark:null, i:-1, box:null, dir:'h', progress:null};
async function ocrWorker(langs){
  if (OCR.worker && OCR.langs === langs) return OCR.worker;
  if (OCR.worker) { const w = OCR.worker; OCR.worker = null; try { await w.terminate(); } catch (_) {} }
  const u = p => new URL(p, location.href).href;
  OCR.worker = await Tesseract.createWorker(langs.split('+'), 1 /* LSTM only */, {
    workerPath:u('../node_modules/tesseract.js/dist/worker.min.js'), corePath:u('../node_modules/tesseract.js-core'),
    langPath:u('ocr/lang'), gzip:true, cacheMethod:'none', workerBlobURL:false,
    logger:m => OCR.progress && OCR.progress(m)});
  OCR.langs = langs;
  return OCR.worker;
}
// the PDF's own text items inside box (page view coordinates): only the characters inside it (str, a0, a1 cut to them)
async function pickTextIn(i, box){
  const out = [];
  for (const t of await pageTextItems(i)) {
    if (!boxHit(t.v, box)) continue;
    const q = [{x:box.x, y:box.y}, {x:box.x + box.w, y:box.y}, {x:box.x, y:box.y + box.h}, {x:box.x + box.w, y:box.y + box.h}].map(p => unturn(p, t.rot));
    const along = q.map(p => t.vert ? p.y : p.x), across = q.map(p => t.vert ? p.x : p.y);
    const mid = t.vert ? t.base : t.base - t.fs * .35;   // the middle of the line must be inside the box
    if (mid < Math.min(...across) || mid > Math.max(...across)) continue;
    const lo = Math.min(...along), hi = Math.max(...along), chars = [...t.str], step = (t.a1 - t.a0) / chars.length;
    const ks = chars.map((_, k) => k).filter(k => { const c = t.a0 + step * (k + .5); return c >= lo && c <= hi; });
    if (!ks.length) continue;
    out.push({...t, str:chars.slice(ks[0], ks[ks.length - 1] + 1).join(''), a0:t.a0 + step * ks[0], a1:t.a0 + step * (ks[ks.length - 1] + 1)});
  }
  return out;
}
// the PDF's own text inside box, line by line in reading order
async function pdfTextIn(i, box){
  const groups = new Map();
  for (const t of await pickTextIn(i, box)) {
    const key = t.rot + (t.vert ? 'v' : 'h');
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(t);
  }
  const parts = [...groups.values()].map(list => groupLines(list).map(r => joinRow(r.items)).join('\n'));
  const vert = [...groups.keys()].some(k => k.endsWith('v'));
  return {text:parts.join('\n\n').replace(/[ \t]+\n/g, '\n').trim(), vert};
}
// Tesseract puts spaces between Chinese characters: take them out (spaces between Latin words stay);
// punctuation it reads as half-width between Chinese characters becomes full-width again
const OCR_FULL = {':':'：', ',':'，', ';':'；', '?':'？', '!':'！', '(':'（', ')':'）'};
function tidyOcr(s){
  const C = '\\u2E80-\\u9FFF\\uF900-\\uFAFF\\uFF00-\\uFFEF\\u3000-\\u303F', gap = new RegExp(`([${C}])[ \\t]+(?=[${C}])`, 'g');
  s = s.replace(gap, '$1').replace(gap, '$1');
  s = s.replace(new RegExp(`([${C}])[ \\t]*([:,;?!()])[ \\t]*(?=[${C}])`, 'g'), (m, a, p) => a + OCR_FULL[p]);
  return s.replace(gap, '$1').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}
// the box as a picture for Tesseract: about 300 dpi, with a white margin (text at the very edge reads badly)
async function ocrImage(i, box){
  const ppt = Math.max(1, Math.min(300 / 72, 3600 / Math.max(box.w, box.h))), c = await renderRegion(i, box, ppt);
  const m = 24, out = document.createElement('canvas'); out.width = c.width + 2 * m; out.height = c.height + 2 * m;
  const g = out.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, out.width, out.height); g.drawImage(c, m, m);
  return out;
}
// 3×3 median filter on the grey picture: takes the specks out of a poor scan and leaves the strokes
function denoiseCanvas(src){
  const W = src.width, H = src.height, out = document.createElement('canvas'); out.width = W; out.height = H;
  const g = out.getContext('2d'); g.drawImage(src, 0, 0);
  const im = g.getImageData(0, 0, W, H), d = im.data, n = W * H, gray = new Uint8Array(n), med = new Uint8Array(n), v = new Uint8Array(9);
  for (let k = 0, o = 0; k < n; k++, o += 4) gray[k] = (d[o] * 77 + d[o + 1] * 150 + d[o + 2] * 29) >> 8;
  const sw = (a, b) => { if (v[a] > v[b]) { const t = v[a]; v[a] = v[b]; v[b] = t; } };
  for (let y = 0; y < H; y++) {
    const r0 = (y ? y - 1 : 0) * W, r1 = y * W, r2 = (y < H - 1 ? y + 1 : y) * W;
    for (let x = 0; x < W; x++) {
      const x0 = x ? x - 1 : 0, x2 = x < W - 1 ? x + 1 : x;
      v[0] = gray[r0 + x0]; v[1] = gray[r0 + x]; v[2] = gray[r0 + x2]; v[3] = gray[r1 + x0]; v[4] = gray[r1 + x]; v[5] = gray[r1 + x2]; v[6] = gray[r2 + x0]; v[7] = gray[r2 + x]; v[8] = gray[r2 + x2];
      // the median of nine with a sorting network (19 compare-and-swaps)
      sw(1, 2); sw(4, 5); sw(7, 8); sw(0, 1); sw(3, 4); sw(6, 7); sw(1, 2); sw(4, 5); sw(7, 8); sw(0, 3); sw(5, 8); sw(4, 7); sw(3, 6); sw(1, 4); sw(2, 5); sw(4, 7); sw(4, 2); sw(6, 4); sw(4, 2);
      med[r1 + x] = v[4];
    }
  }
  for (let k = 0, o = 0; k < n; k++, o += 4) { d[o] = d[o + 1] = d[o + 2] = med[k]; d[o + 3] = 255; }
  g.putImageData(im, 0, 0);
  return out;
}
function startOcrDraw(i, e){
  closeOcr();
  const pg = S.pages[i], p0 = pagePoint(i, e);
  const d = document.createElement('div'); d.className = 'draft'; S.els[i].querySelector('.ovl').appendChild(d);
  let box = {x:p0.x, y:p0.y, w:0, h:0};
  const move = ev => {
    const p = pagePoint(i, ev);
    box = {x:Math.max(0, Math.min(p0.x, p.x)), y:Math.max(0, Math.min(p0.y, p.y))}; box.w = Math.min(pg.w, Math.max(p0.x, p.x)) - box.x; box.h = Math.min(pg.h, Math.max(p0.y, p.y)) - box.y;
    Object.assign(d.style, {left:box.x / pg.w * 100 + '%', top:box.y / pg.h * 100 + '%', width:box.w / pg.w * 100 + '%', height:box.h / pg.h * 100 + '%'});
  };
  const up = () => {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); d.remove();
    if (box.w < 6 || box.h < 6) return;
    readRegion(i, box);
  };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
}
// read the text in box on page i: the PDF's own text unless `image` is asked for; dir 'h' / 'v' forces the writing direction
async function readRegion(i, box, {image = false, dir = null} = {}){
  const job = ++OCR.job;
  let finished; OCR.readP = new Promise(r => { finished = r; }); OCR.glyphs = null;   // 字型 waits for this reading
  try {
    ocrPanel(i, box);
    setOcr({status:'讀取中…', progress:null, text:'', busy:true});
    if (FONTID.tab === 'font') fontIdStart();
    let res = null;
    if (!image) {
      res = await pdfTextIn(i, box); if (job !== OCR.job) return;
      if (res.text) { OCR.dir = res.vert ? 'v' : 'h'; setOcr({text:res.text, src:'PDF 內的文字（原文，一字不差）', status:'', busy:false, canImage:true}); return; }
    }
    const vert = dir ? dir === 'v' : (res && res.vert) || box.h > box.w * 1.8;   // a tall narrow box is probably vertical text
    OCR.dir = vert ? 'v' : 'h';
    setOcr({status:OCR.worker ? '辨識中…' : '載入辨識引擎…（第一次需要幾秒鐘）', progress:0, src:''});
    try {
      const best = await ocrPasses(await ocrImage(i, box), vert, job, pr => setOcr({status:'辨識中…', progress:pr}));
      if (!best) return;   // a newer box
      OCR.glyphs = {job, img:best.img, symbols:best.symbols};
      const text = tidyOcr(best.text);
      setOcr({text, src:`影像辨識・${vert ? '直書' : '橫書'}・信心度 ${Math.round(best.conf)}%${best.note}`, status:text ? '' : '這個範圍沒有辨識出文字', progress:null, busy:false, canImage:false});
    } catch (err) {
      console.error(err);
      if (job === OCR.job) setOcr({status:'辨識失敗：' + (err && err.message || err), progress:null, busy:false});
    }
  } finally { finished(); }
}
// read the picture twice, as it is and with the specks filtered out, and keep the more confident reading: on poor
// scans the filtered one wins by far, on clean ones the original (measured on noisy, small-print and clean samples).
// Returns {text, conf, note, img, symbols} (img: the picture that was read, symbols: Tesseract's box for each
// character, for 字型) or null when a newer box took over
async function ocrPasses(img, vert, job, onProgress){
  // tried on clean scans: English first reads mixed lines best; automatic layout (3) is the only mode that reads vertical columns
  const w = await ocrWorker(vert ? 'chi_tra_vert' : 'eng+chi_tra'); if (job !== OCR.job) return null;
  await w.setParameters({tessedit_pageseg_mode:'3', preserve_interword_spaces:'1'});
  const passes = [['', img], ['（已去雜點）', denoiseCanvas(img)]];
  let best = null;
  for (let k = 0; k < passes.length; k++) {
    OCR.progress = m => { if (job === OCR.job && m.status === 'recognizing text' && onProgress) onProgress((k + m.progress) / passes.length); };
    const {data} = await w.recognize(passes[k][1], {}, {text:true, blocks:true}); if (job !== OCR.job) return null;
    if (!best || (data.confidence || 0) > best.conf) best = {text:data.text || '', conf:data.confidence || 0, note:passes[k][0], img:passes[k][1], symbols:ocrSymbols(data, vert)};
  }
  return best;
}
// Tesseract's characters in reading order, each with its box, its line (li, line box) and the writing direction. In
// vertical text Tesseract's character boxes are wrong (zero width, all at the same place) while each word's box is
// right: a character whose box lies outside its word gets its share of the word's box instead
function ocrSymbols(data, vert = false){
  const out = []; let li = 0;
  for (const b of data.blocks || []) for (const p of b.paragraphs || []) for (const l of p.lines || []) {
    li++;
    for (const w of l.words || []) {
      const ys = w.symbols || [], W = w.bbox;
      ys.forEach((y, k) => {
        let bb = y.bbox;
        if (!bb || bb.x1 - bb.x0 < 2 || bb.y1 - bb.y0 < 2 || bb.x1 < W.x0 - 2 || bb.x0 > W.x1 + 2 || bb.y1 < W.y0 - 2 || bb.y0 > W.y1 + 2) {
          const f0 = k / ys.length, f1 = (k + 1) / ys.length;
          bb = vert ? {x0:W.x0, x1:W.x1, y0:W.y0 + (W.y1 - W.y0) * f0, y1:W.y0 + (W.y1 - W.y0) * f1} : {x0:W.x0 + (W.x1 - W.x0) * f0, x1:W.x0 + (W.x1 - W.x0) * f1, y0:W.y0, y1:W.y1};
        }
        out.push({text:y.text, confidence:y.confidence, bbox:bb, li, line:l.bbox, vert});
      });
    }
  }
  return out;
}
// the result window, next to the box (and the box stays marked)
function ocrPanel(i, box){
  OCR.i = i; OCR.box = box;
  const pg = S.pages[i];
  if (!OCR.mark || !OCR.mark.isConnected) { OCR.mark = document.createElement('div'); OCR.mark.className = 'ocrmark'; }
  S.els[i].querySelector('.ovl').appendChild(OCR.mark);
  Object.assign(OCR.mark.style, {left:box.x / pg.w * 100 + '%', top:box.y / pg.h * 100 + '%', width:box.w / pg.w * 100 + '%', height:box.h / pg.h * 100 + '%'});
  if (!OCR.panel) {
    const p = document.createElement('div'); p.className = 'ocrp'; p.id = 'ocrPanel';
    p.innerHTML = `<div class="ocr-hd"><b>文字辨識</b><span class="ocr-tabs"><button data-ot="text">文字</button><button data-ot="font">字型</button></span><span class="ocr-src"></span><span class="sp"></span><button class="ocr-x" data-o="close" title="關閉 (Esc)">✕</button></div>
      <div class="ocr-st"><span class="ocr-msg"></span><i class="ocr-bar"><i></i></i></div>
      <textarea class="ocr-tx" spellcheck="false" placeholder="辨識出的文字會出現在這裡，可以直接修改"></textarea>
      <div class="ocr-ft"><span class="tsw" title="文字的書寫方向"><button data-dir="h">橫書</button><button data-dir="v">直書</button></span>
        <button data-o="image" title="不用 PDF 內的文字，改用影像辨識">影像辨識</button><span class="sp"></span><button class="pri" data-o="copy">複製文字</button></div>
      <div class="ocr-fonts"><div class="fi-st idle"><span class="fi-msg"></span><i class="fi-bar"><i></i></i></div><div class="fi-pdf"></div><div class="fi-img"></div><div class="fi-note" hidden>相似度是逐字比對字形的結果，掃描越清楚越準。</div></div>
      <div class="ocr-ft ocr-ft2"><label class="ocr-gf" title="需要網路。只會把要比對的幾個字（打散順序、不重複）送到 Google Fonts 下載字形，不會送出整段文字。"><input type="checkbox" data-o="gf">也比對 Google Fonts</label><span class="sp"></span><button data-o="refont">重新比對</button></div>`;
    document.body.appendChild(p); OCR.panel = p; paintOcrTab();
    p.addEventListener('pointerdown', e => {
      e.stopPropagation();
      if (!e.target.closest('.ocr-hd') || e.target.closest('button')) return;
      const x0 = e.clientX - p.offsetLeft, y0 = e.clientY - p.offsetTop; OCR.moved = true;   // moved by hand: it stays where it is put
      const mv = ev => { p.style.left = clamp(ev.clientX - x0, 0, innerWidth - 60) + 'px'; p.style.top = clamp(ev.clientY - y0, 0, innerHeight - 40) + 'px'; };
      const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };
      window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
    });
    p.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') closeOcr(); });
    p.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || b.disabled) return;
      if (b.dataset.o === 'close') closeOcr();
      if (b.dataset.o === 'copy') copyOcr();
      if (b.dataset.o === 'image') readRegion(OCR.i, OCR.box, {image:true, dir:OCR.dir});
      if (b.dataset.dir) readRegion(OCR.i, OCR.box, {image:true, dir:b.dataset.dir});
      if (b.dataset.ot) showOcrTab(b.dataset.ot);
      if (b.dataset.o === 'refont') fontIdStart();
      if (b.dataset.o === 'byshape') { OCR.panel.dataset.shape = '1'; b.parentNode.remove(); fontIdImage(OCR.job); }
      if (b.dataset.fa === 'apply') applyIdentifiedFont(b.dataset.family || '');
      if (b.dataset.fa === 'download') openFontPage(b.dataset.gf, b.closest('.fi-row'));
    });
    p.addEventListener('change', e => { if (e.target.dataset.o === 'gf') { FONTID.google = e.target.checked; try { localStorage.setItem(FONTID_KEY, JSON.stringify({google:FONTID.google})); } catch (_) {} } });
  }
  placeOcrPanel();
}
function placeOcrPanel(){
  if (OCR.panel && OCR.moved) { const p = OCR.panel; p.style.top = clamp(p.offsetTop, 8, Math.max(8, innerHeight - p.offsetHeight - 8)) + 'px'; return; }   // moved by hand: only kept in view
  if (!OCR.panel || !OCR.mark || !OCR.mark.isConnected) return;
  const r = OCR.mark.getBoundingClientRect(), p = OCR.panel, w = p.offsetWidth, h = p.offsetHeight, gap = 12;
  let x = r.right + gap, y = r.top;
  if (x + w > innerWidth - 8) x = r.left - gap - w;                                  // no room on the right: on the left
  if (x < 8) { x = clamp(r.left, 8, innerWidth - w - 8); y = r.bottom + gap; if (y + h > innerHeight - 8) y = r.top - gap - h; }   // or below / above
  p.style.left = clamp(x, 8, innerWidth - w - 8) + 'px'; p.style.top = clamp(y, 8, innerHeight - h - 8) + 'px';
}
viewer.addEventListener('scroll', () => placeOcrPanel());
// Esc closes the result window wherever the focus is; the tool stays on for the next box
window.addEventListener('keydown', e => { if (OCR.panel && e.key === 'Escape' && !$('#mask').classList.contains('show')) { e.preventDefault(); e.stopPropagation(); closeOcr(); } }, true);
window.addEventListener('resize', () => placeOcrPanel());
function setOcr({text, src, status, progress, busy, canImage}){
  const p = OCR.panel; if (!p) return;
  if (text != null) { const ta = p.querySelector('.ocr-tx'); ta.value = text; if (text) { ta.focus(); ta.select(); } }
  if (src != null) p.querySelector('.ocr-src').textContent = src;
  if (status != null) p.querySelector('.ocr-msg').textContent = status;
  if (progress !== undefined) { const bar = p.querySelector('.ocr-bar'); bar.style.display = progress == null ? 'none' : ''; bar.firstChild.style.width = Math.round((progress || 0) * 100) + '%'; }
  if (busy != null) p.querySelectorAll('.ocr-ft:not(.ocr-ft2) button').forEach(b => b.disabled = busy);
  if (canImage != null) p.querySelector('[data-o="image"]').style.display = canImage ? '' : 'none';
  p.querySelectorAll('[data-dir]').forEach(b => b.classList.toggle('on', b.dataset.dir === OCR.dir));
  const st = p.querySelector('.ocr-st'); st.style.display = p.querySelector('.ocr-msg').textContent || p.querySelector('.ocr-bar').style.display !== 'none' ? '' : 'none';   // no status: no empty row
  placeOcrPanel();
}
async function copyOcr(){
  const ta = OCR.panel && OCR.panel.querySelector('.ocr-tx'); if (!ta) return;
  const t = ta.value; if (!t.trim()) { toast('沒有可以複製的文字', 'err'); return; }
  try { await navigator.clipboard.writeText(t); }
  catch (_) { ta.focus(); ta.select(); document.execCommand('copy'); }
  toast(`已複製 ${[...t.replace(/\s/g, '')].length} 個字`);
}
function closeOcr(){
  OCR.job++; OCR.moved = false; OCR.glyphs = null; FONTID.busy = false;
  if (OCR.panel) { OCR.panel.remove(); OCR.panel = null; }
  if (OCR.mark) { OCR.mark.remove(); OCR.mark = null; }
}

/* ====================================================================
   字型辨識: the 字型 tab of the 文字辨識 window. A scan's glyphs (Tesseract's box for each character) are compared
   with the installed fonts, the bundled 思源黑體 and, online, Google Fonts (app/fontid.js); each result has 套用
   (installed) or 下載 (Google Fonts). Nothing here changes the document.
   ==================================================================== */
const FONTID_KEY = 'pdfeditor.fontid.v1';
const FONTID = {tab:'text', job:-1, run:0, startRun:0, busy:false, recent:[], pdfRecent:[], imgRecent:[], fetchCss:null, timeout:8000, deadline:12000,
  google:(() => { try { const v = JSON.parse(localStorage.getItem(FONTID_KEY)); return !(v && v.google === false); } catch (_) { return true; } })()};
// the window shows the tab FONTID.tab says (a new window opens on the tab last used)
function paintOcrTab(){
  const p = OCR.panel; if (!p) return;
  p.classList.toggle('fonts', FONTID.tab === 'font');
  p.querySelectorAll('[data-ot]').forEach(b => b.classList.toggle('on', b.dataset.ot === FONTID.tab));
  p.querySelector('[data-o="gf"]').checked = FONTID.google;
}
function showOcrTab(t){
  FONTID.tab = t; paintOcrTab();
  if (t === 'font' && FONTID.job !== OCR.job) fontIdStart();
  placeOcrPanel();
}
function fiStatus(msg, progress = null){
  const p = OCR.panel; if (!p) return;
  const st = p.querySelector('.fi-st'), bar = st.querySelector('.fi-bar');
  st.querySelector('.fi-msg').textContent = msg || '';
  bar.style.display = progress == null ? 'none' : ''; bar.firstChild.style.width = Math.round((progress || 0) * 100) + '%';
  st.classList.toggle('idle', !msg && progress == null);
  placeOcrPanel();
}
// identify the font of the current box (again). Each run has its own number: a newer run (重新比對, a new box)
// makes an older one stop quietly
async function fontIdStart(){
  const p = OCR.panel; if (!p) return;
  const job = FONTID.job = OCR.job, run = FONTID.startRun = ++FONTID.run;
  p.querySelector('.fi-pdf').innerHTML = ''; p.querySelector('.fi-img').innerHTML = ''; p.querySelector('.fi-note').hidden = true;
  FONTID.pdfRecent = []; FONTID.imgRecent = []; delete p.dataset.shape;
  // the PDF's own text: the fonts the file records (exact); comparing shapes only when asked
  FONTID.busy = true; fiStatus('讀取中…');
  let pf = {fonts:[], hidden:0};
  try { pf = await pdfFontsIn(OCR.i, OCR.box); } catch (e) { console.error(e); }
  if (job !== OCR.job || run !== FONTID.run || !OCR.panel) { if (run === FONTID.run) FONTID.busy = false; return; }
  if (pf.fonts.length) {
    showPdfFonts(pf.fonts); FONTID.busy = false; fiStatus('');
    // the Chinese names of the installed fonts are still being read (first start): look again once they are known
    if (FONTCAT.busy) {
      fiStatus('正在讀取這台電腦的字型名稱…');
      const again = async () => {
        if (FONTCAT.busy) return;
        FONTCAT.subs.delete(again);
        const same = () => job === OCR.job && run === FONTID.startRun && OCR.panel;
        if (!same()) return;
        let pf2 = null; try { pf2 = await pdfFontsIn(OCR.i, OCR.box); } catch (e) { console.error(e); }
        if (!same()) return;
        if (pf2 && pf2.fonts.length) showPdfFonts(pf2.fonts);
        if (!FONTID.busy) fiStatus('');
      };
      FONTCAT.subs.add(again);
    }
    return;
  }
  await fontIdImage(job, run);
}
// the font menu's 字型辨識結果: the PDF's own fonts of this box first, then the shapes found
function updateRecent(){
  const seen = new Set();

// the candidates on this computer: the bundled 思源黑體 and every installed family
function localCands(){
  const out = [{key:'builtin', css:'"PDFE Sans"', label:'思源黑體（內建）', source:'builtin', family:''}];
  if (FONTCAT.ok) for (const f of FONTCAT.fams) out.push({key:'local:' + f.family, css:cssFamily(f.family), label:f.name || f.family, source:'local', family:f.family});

// the picture of the box read only for its character boxes (when the 文字 tab showed the PDF's own text, or to try
// the other writing direction)
async function ocrGlyphsOnly(job, dir = OCR.dir){
  const img = await ocrImage(OCR.i, OCR.box); if (job !== OCR.job) return null;
  const best = await ocrPasses(img, dir === 'v', job, pr => fiStatus('辨識字形中…', pr));
  if (!best) return null;
  return (OCR.glyphs = {job, img:best.img, symbols:best.symbols});
}
// compare the box's glyphs: Chinese and Latin each on their own when both are there. The installed fonts of every
// group are listed first; Google Fonts come after them, merged into the same lists
async function fontIdImage(job, run = ++FONTID.run){
  const stop = () => job !== OCR.job || run !== FONTID.run || !OCR.panel, p = OCR.panel; if (!p) return;
  const out = p.querySelector('.fi-img'); out.innerHTML = '';
  FONTID.busy = true; fiStatus('讀取中…');
  try {
    await OCR.readP; if (stop()) return;
    let g = OCR.glyphs && OCR.glyphs.job === job ? OCR.glyphs : null;
    if (!g) { fiStatus(OCR.worker ? '辨識字形中…' : '載入辨識引擎…（第一次需要幾秒鐘）', 0); g = await ocrGlyphsOnly(job); if (stop()) return; }
    let set = g ? FontId.glyphsFromImage(g.img, g.symbols) : {cjk:[], latin:[], order:''};
    const enough = x => x.cjk.length >= 3 || x.latin.length >= 5;
    if (!enough(set)) {   // read the wrong way, perhaps (vertical columns in a box wider than tall): once more the other way
      fiStatus('換個書寫方向辨識字形…', 0);
      const g2 = await ocrGlyphsOnly(job, OCR.dir === 'v' ? 'h' : 'v'); if (stop()) return;
      const set2 = g2 ? FontId.glyphsFromImage(g2.img, g2.symbols) : null;
      if (set2 && enough(set2)) set = set2;
    }
    const groups = [];
    if (set.cjk.length >= 3) groups.push({title:'中文', script:'cjk', glyphs:set.cjk});
    if (set.latin.length >= 5) groups.push({title:'英數字', script:'latin', glyphs:set.latin});
    if (!groups.length) { fiStatus('這個範圍能比對的字太少，請框大一點或框清楚的字'); return; }
    await loadFontCatalog(); await FontId.ready(); if (stop()) return;
    const local = localCands();
    for (const grp of groups) {
      grp.el = document.createElement('div'); grp.el.className = 'fi-grp';
      if (groups.length > 1) grp.el.innerHTML = `<div class="fi-h">${grp.title}</div>`;
      out.appendChild(grp.el);
      grp.sample = [...set.order].filter(ch => grp.glyphs.some(x => x.ch === ch)).slice(0, 12).join('');
      fiStatus('比對本機字型…', 0);
      grp.loc = await FontId.identify(grp.glyphs, local, {stop, onProgress:(d, t) => fiStatus(`比對本機字型… ${d}／${t}`, d / t)});
      if (!grp.loc || stop()) return;
      grp.results = grp.loc.results; renderFontRows(grp.el, grp.results, grp.sample);
    }
    let unreachable = false, gotGoogle = false;
    if (FONTID.google) for (const grp of groups) {
      const ents = FontId.GOOGLE.filter(e => e.script === grp.script && !fontInstalled(e.family)); if (!ents.length) continue;
      fiStatus('比對 Google Fonts…');
      const gl = await FontId.loadGoogle(ents, FontId.requestChars(grp.glyphs), {fetchCss:FONTID.fetchCss || undefined, timeout:FONTID.timeout, deadline:FONTID.deadline, stop});
      if (stop()) return;
      if (!gl.cands.length) {   // nothing came: Google (or its font files) could not be reached; offline: not the next group either
        if (gl.offline || gl.failed.length >= ents.length) unreachable = true;
        if (gl.offline) break; else continue;
      }
      gotGoogle = true;   // fonts downloaded earlier still count: then it is not "only this computer's"
      const gr = await FontId.identify(grp.glyphs, gl.cands, {sigma:grp.loc.sigma, keep:grp.loc.keep, stop, onProgress:(d, t) => fiStatus(`比對 Google Fonts… ${d}／${t}`, d / t)});
      if (!gr || stop()) return;
      grp.results = FontId.mergeResults(grp.loc.results, gr.results); renderFontRows(grp.el, grp.results, grp.sample);
    }
    let any = false;
    for (const grp of groups) if (grp.results.length) any = true; else grp.el.remove();
    // the installed fonts found, for the font menu's 字型辨識結果
    const seen = new Set();
    FONTID.imgRecent = groups.flatMap(x => x.results).filter(r => r.cand.source !== 'google').sort((a, b) => b.score - a.score)
      .filter(r => !seen.has(r.cand.family) && seen.add(r.cand.family)).map(r => ({family:r.cand.family, pct:r.pct}));
    updateRecent();
    p.querySelector('.fi-note').hidden = !any;
    fiStatus(!any ? '這台電腦沒有可以比對的字型' : unreachable && !gotGoogle ? '連不上 Google Fonts，只比對了這台電腦的字型' : '');
  } catch (e) {
    console.error(e);
    if (!stop()) fiStatus('辨識失敗：' + (e && e.message || e));
  } finally { if (run === FONTID.run) FONTID.busy = false; }
}

// one row per font: the box's characters in that font, its name (fonts drawn the same way together), where it is
// from, the similarity, and 套用 or 下載
function renderFontRows(el, results, sample){
  el.querySelectorAll('.fi-row').forEach(r => r.remove());
  for (const r of results.slice(0, 8)) {
    const c = r.cand, row = document.createElement('div');
    row.className = 'fi-row'; row.dataset.key = c.key; row.dataset.bold = r.bold ? '1' : '';
    const src = (c.source === 'google' ? 'Google Fonts' : c.source === 'builtin' ? '內建' : '本機') + (r.bold ? '・粗體' : '');
    row.innerHTML = `<div class="fi-sample"></div><div class="fi-name"><span class="fi-label" title="${esc([c, ...r.twins].map(x => x.label).join('／'))}">${esc([c, ...r.twins].slice(0, 3).map(x => x.label).join('／'))}</span><span class="fi-src">${src}</span></div><span class="fi-pct">${r.pct}%</span>`
      + (c.source === 'google' ? `<button data-fa="download" data-gf="${esc(c.entry.family)}">下載</button>` : `<button data-fa="apply" data-family="${esc(c.family || '')}">套用</button>`);
    const sm = row.querySelector('.fi-sample'); sm.textContent = sample; sm.style.fontFamily = c.css + ', "PDFE Blank"'; sm.style.fontWeight = r.bold ? '700' : '400';
    el.appendChild(row);
  }
  placeOcrPanel();
}

let thumbObs = null;
// map: for each page, the index of the same page before the edit (-1 = new); pre: pictures already drawn for new pages
function buildThumbs(map = null, pre = null){
  const panel = $('#p-thumbs');
  const shown = map ? [...panel.querySelectorAll('.thumb canvas.tc')] : [];
  const olds = map ? map.map(j => j >= 0 ? shown[j] : null) : [];
  panel.innerHTML = '';
  thumbObs && thumbObs.disconnect();
  const ver = S.version;
  thumbObs = new IntersectionObserver(ents => ents.forEach(async en => {
    if (!en.isIntersecting) return;
    const t = en.target; thumbObs.unobserve(t);
    const i = +t.dataset.i, pg = S.pages[i]; if (!pg || ver !== S.version) return;
    const shown = t.querySelector('canvas'), dpr = window.devicePixelRatio || 1;
    const c = document.createElement('canvas'); c.className = 'tc'; c.style.cssText = shown.style.cssText;
    const s = (parseFloat(shown.style.width) * dpr) / pg.w, vp = pg.page.getViewport({scale:s});
    c.width = vp.width; c.height = vp.height;
    try { await pg.page.render({canvasContext:c.getContext('2d'), viewport:vp, annotationMode:pdfjsLib.AnnotationMode.ENABLE}).promise; } catch (_) { return; }
    if (ver === S.version && shown.isConnected) shown.replaceWith(c);
  }), {root:panel, rootMargin:'200px'});
  S.pages.forEach((pg, i) => {
    const t = document.createElement('div'); t.className = 'thumb'; t.dataset.i = i;
    const w = 120, h = Math.round(w * pg.h / pg.w);
    const W = h > 170 ? Math.round(170 * pg.w / pg.h) : w, H = Math.min(h, 170);
    t.innerHTML = `<canvas class="tc" style="width:${W}px;height:${H}px"></canvas><span class="tn">${i + 1}</span>`;
    const oc = olds[i]; if (oc && oc.style.width === W + 'px' && oc.style.height === H + 'px') t.querySelector('canvas').replaceWith(oc);
    else if (pre && pre.has(i)) {   // a new page drawn already: shrink that picture until its own thumbnail is ready
      const c = t.querySelector('canvas'), src = pre.get(i).c, dpr = window.devicePixelRatio || 1;
      c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
      try { c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); } catch (_) {}
    }
    t.onclick = e => thumbClick(e, i);
    t.oncontextmenu = e => { e.preventDefault(); if (!S.thumbSel.has(i)) { S.thumbSel = new Set([i]); S.thumbAnchor = i; scrollToPage(i); paintThumbSel(); } showPageMenu(e, i); };
    panel.appendChild(t); thumbObs.observe(t);
  });
  updatePager();
}

async function zipAll(all){
  if (!(await settleEdits())) return;
  busy(true, '打包圖片中…');
  try {
    const files = [];
    for (const {i, b, k} of all) {
      const c = await renderRegion(i, b, nativeScale(b));
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      files.push({name:`p${i + 1}_img${k + 1}.png`, data:new Uint8Array(await blob.arrayBuffer())});
      c.width = c.height = 0;
    }
    busy(false);
    await saveFile(S.name.replace(/\.pdf$/i, '') + '_圖片.zip', new Blob([makeZip(files)], {type:'application/zip'}));
  } catch (e) { toast('打包失敗：' + e.message, 'err'); } finally { busy(false); }
}
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(d){ let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = CRC[(c ^ d[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
// a zip of [{name, data:Uint8Array, deflate}]: UTF-8 names; stored, or deflated with pako when deflate is set
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length, body = f.deflate ? pako.deflateRaw(f.data) : f.data, method = f.deflate ? 8 : 0;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, method, true);
    h.setUint32(14, crc, true); h.setUint32(18, body.length, true); h.setUint32(22, sz, true); h.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(h.buffer), nm, body);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, method, true);
    c.setUint32(16, crc, true); c.setUint32(20, body.length, true); c.setUint32(24, sz, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + body.length;
  }
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)]);
}

/* ====================================================================
   圖層 (layers). Every layer is a PDF optional-content group (OCG) and every
   annotation belongs to one through its /OC entry, so Acrobat and other readers
   see the same layers, names and visibility. Stacking order of the layers is
   reflected in the order of each page's /Annots (upper layers draw on top).
   ==================================================================== */
const N_ = k => PDFName.of(k);
const refId = r => r.objectNumber + 'R' + (r.generationNumber ? r.generationNumber : '');
const LAYER_SKIP = new Set(['Popup', 'Link', 'Widget']);
const LY_FOLD = new Set();   // layers whose list of objects is folded away (the lists are open)
let LM = {bytes:null, p:null}, HL = {pdf:null, p:null};
const txt = v => v && v.decodeText ? v.decodeText() : '';

function ocpOf(doc, create){
  const cat = doc.catalog, ctx = doc.context;
  let ocp = cat.lookupMaybe(N_('OCProperties'), PDFDict);
  if (!ocp && create) { ocp = ctx.obj({OCGs:[], D:{Order:[], ON:[], OFF:[]}}); cat.set(N_('OCProperties'), ocp); }
  if (!ocp) return null;
  let ocgs = ocp.lookupMaybe(N_('OCGs'), PDFArray); if (!ocgs) { ocgs = ctx.obj([]); ocp.set(N_('OCGs'), ocgs); }
  let d = ocp.lookupMaybe(N_('D'), PDFDict); if (!d) { d = ctx.obj({}); ocp.set(N_('D'), d); }
  const arr = k => { let a = d.lookupMaybe(N_(k), PDFArray); if (!a) { a = ctx.obj([]); d.set(N_(k), a); } return a; };

  try { const b = JSON.parse(localStorage.getItem(BIND_KEY)); if (b && typeof b === 'object') return {...structuredClone(DEFAULT_BINDS), ...b}; } catch (_) {}
  return structuredClone(DEFAULT_BINDS);
})();
const MOUSE_NAMES = {1:'滑鼠中鍵', 3:'滑鼠側鍵（後退）', 4:'滑鼠側鍵（前進）'};
function bindLabel(b){
  if (!b) return '';
  if (b.type === 'mouse') return MOUSE_NAMES[b.button] || `滑鼠按鍵 ${b.button + 1}`;
  return [b.ctrl && 'Ctrl', b.alt && 'Alt', b.shift && 'Shift', b.label].filter(Boolean).join(' + ');
}
const sameBind = (a, b) => a && b && a.type === b.type && (a.type === 'mouse' ? a.button === b.button : a.code === b.code && a.ctrl === b.ctrl && a.shift === b.shift && a.alt === b.alt);
const KEY_LABELS = {ArrowLeft:'←', ArrowRight:'→', ArrowUp:'↑', ArrowDown:'↓', PageUp:'Page Up', PageDown:'Page Down', Home:'Home', End:'End',
  Insert:'Insert', Delete:'Delete', Backspace:'Backspace', Enter:'Enter', Tab:'Tab', Space:'空白鍵', Escape:'Esc', Backquote:'`', Minus:'-', Equal:'=',
  BracketLeft:'[', BracketRight:']', Backslash:'\\', Semicolon:';', Quote:"'", Comma:',', Period:'.', Slash:'/'};
function keyFromEvent(e){
  let label = KEY_LABELS[e.code];
  if (!label) {
    if (/^Key[A-Z]$/.test(e.code)) label = e.code.slice(3);
    else if (/^Digit\d$/.test(e.code)) label = e.code.slice(5);
    else if (/^Numpad/.test(e.code)) label = '數字鍵盤 ' + e.code.slice(6);
    else if (/^F\d+$/.test(e.code)) label = e.code;
    else label = e.key && e.key.length === 1 ? e.key.toUpperCase() : (e.key || e.code);
  }
  return K(e.code, label, {ctrl:e.ctrlKey || e.metaKey, shift:e.shiftKey, alt:e.altKey});
}
// shortcuts the app already uses; a custom binding may not take them over
const RESERVED = [K('KeyO', 'O', {ctrl:1}), K('KeyO', 'O', {ctrl:1, shift:1}), K('KeyS', 'S', {ctrl:1}), K('KeyZ', 'Z', {ctrl:1}), K('KeyY', 'Y', {ctrl:1}), K('KeyZ', 'Z', {ctrl:1, shift:1}),
  K('KeyC', 'C', {ctrl:1}), K('KeyX', 'X', {ctrl:1}), K('KeyV', 'V', {ctrl:1}), K('KeyW', 'W', {ctrl:1}), K('KeyA', 'A', {ctrl:1}), K('KeyP', 'P', {ctrl:1}),
  K('Tab', 'Tab', {ctrl:1}), K('Tab', 'Tab', {ctrl:1, shift:1}), K('Digit0', '0', {ctrl:1}), K('Equal', '=', {ctrl:1}), K('Minus', '-', {ctrl:1}),
  K('Space', '空白鍵'), K('Escape', 'Esc'), K('Delete', 'Delete'), K('KeyR', 'R', {ctrl:1}), K('Enter', 'Enter'), K('KeyF', 'F', {ctrl:1}), K('F3', 'F3'), K('F3', 'F3', {shift:1}),
  K('BracketRight', ']', {ctrl:1}), K('BracketRight', ']', {ctrl:1, shift:1}), K('BracketLeft', '[', {ctrl:1}), K('BracketLeft', '[', {ctrl:1, shift:1})];
const isReserved = b => b.type === 'key' && RESERVED.some(r => sameBind(r, b));
// a shortcut set before the program took that key for itself (Ctrl+Shift+O, 從網址開啟, since v1.0.40) would never work: it is
// taken off and the person told once
setTimeout(() => {
  const gone = [];
  for (const a of BIND_ACTIONS) { const l = BINDS[a.id] || [], keep = l.filter(b => !isReserved(b)); if (keep.length < l.length) { gone.push(...l.filter(isReserved).map(b => `${bindLabel(b)}（${a.label}）`)); BINDS[a.id] = keep; } }
  if (!gone.length) return;
  try { localStorage.setItem(BIND_KEY, JSON.stringify(BINDS)); } catch (_) {}
  toast(`自訂的快捷鍵 ${gone.join('、')} 跟程式內建的快捷鍵重複，已經取消，可以到「設定 → 快捷鍵」重新設定`, 'long');
}, 0);
function findBinding(b){ for (const a of BIND_ACTIONS) if ((BINDS[a.id] || []).some(x => sameBind(x, b))) return a; return null; }
const mouseBound = button => !!findBinding(MB(button));

// dispatch: keyboard (called from the main keydown handler) and mouse buttons
function runKeyBinding(e){
  if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return false;
  const a = findBinding(keyFromEvent(e)); if (!a) return false;
  e.preventDefault(); a.run(); return true;
}
let lastMouseBind = 0;
window.addEventListener('mousedown', e => {
  if (capture || !S.pdf || $('#mask').classList.contains('show') || isBusy() || e.button === 0 || e.button === 2) return;
  const a = findBinding(MB(e.button)); if (!a) return;
  e.preventDefault(); e.stopPropagation(); lastMouseBind = performance.now(); a.run();
}, true);
// stop the browser's own back/forward handling of side buttons
window.addEventListener('mouseup', e => { if (e.button === 3 || e.button === 4) e.preventDefault(); }, true);
window.addEventListener('auxclick', e => { if (e.button === 3 || e.button === 4) e.preventDefault(); }, true);
if (DESK && DESK.onAppCommand) DESK.onAppCommand(cmd => {
  const button = cmd === 'browser-backward' ? 3 : cmd === 'browser-forward' ? 4 : -1;
  if (button < 0) return;
  if (capture) { capture(MB(button)); return; }
  if (performance.now() - lastMouseBind < 400 || !S.pdf || $('#mask').classList.contains('show') || isBusy()) return;   // already handled as a mouse event
  const a = findBinding(MB(button)); if (a) a.run();
});

// recording a new binding
let capture = null;
// the key / mouse-button editor shown in 設定 → 按鍵; every change is saved at once
function keyEditor(){
  const work = BINDS, save = () => { try { localStorage.setItem(BIND_KEY, JSON.stringify(BINDS)); } catch (_) {} };
  const body = document.createElement('div');
  body.innerHTML = `<div class="note" style="margin-bottom:12px">點選格子後，按下想要的<b>鍵盤按鍵</b>（可搭配 Ctrl / Alt / Shift）或<b>滑鼠按鍵</b>（例如側鍵、中鍵）即可設定，修改後立即生效。每個動作最多 ${MAX_BINDS} 組。</div>
    <table class="kb"><thead><tr><th>動作</th>${Array.from({length:MAX_BINDS}, (_, k) => `<th>按鍵 ${k + 1}</th>`).join('')}</tr></thead><tbody id="kbBody"></tbody></table>
    <div class="set-btns"><button class="btn" data-kb="reset">恢復預設</button><span class="ex-warn" id="kbMsg"></span></div>`;
  const tb = body.querySelector('#kbBody'), msg = body.querySelector('#kbMsg');
  const draw = () => {
    tb.innerHTML = '';
    BIND_ACTIONS.forEach(a => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="act">${a.label}</td>` + Array.from({length:MAX_BINDS}, (_, k) => {
        const b = (work[a.id] || [])[k];
        return `<td><div class="kcell${b ? '' : ' empty'}" data-a="${a.id}" data-k="${k}" tabindex="0"><span>${b ? esc(bindLabel(b)) : '未設定'}</span>${b ? '<button class="kx" title="清除">×</button>' : ''}</div></td>`;
      }).join('');
      tb.appendChild(tr);
    });
  };
  const stopCapture = () => {
    capture = null;
    window.removeEventListener('keydown', onKey, true); window.removeEventListener('mousedown', onMouse, true);
    window.removeEventListener('contextmenu', onCtx, true);
    body.querySelectorAll('.kcell.rec').forEach(c => c.classList.remove('rec'));
  };
  let target = null;
  const assign = b => {
    const {a, k} = target; stopCapture();
    if (isReserved(b)) { msg.textContent = `「${bindLabel(b)}」是程式內建的快捷鍵，請換一個。`; draw(); return; }
    // a binding belongs to one action only: take it away from wherever it was
    let moved = '';
    BIND_ACTIONS.forEach(x => { const list = work[x.id] || []; const i = list.findIndex(y => sameBind(y, b)); if (i >= 0 && !(x.id === a && i === k)) { list.splice(i, 1); if (x.id !== a) moved = x.label; } });
    const list = work[a] = (work[a] || []);
    if (k < list.length) list[k] = b; else list.push(b);
    work[a] = list.slice(0, MAX_BINDS); save();
    msg.textContent = moved ? `「${bindLabel(b)}」原本設定給「${moved}」，已改為「${BIND_ACTIONS.find(x => x.id === a).label}」。` : '已儲存';
    draw();
  };
  const onKey = e => {
    e.preventDefault(); e.stopPropagation();
    if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;   // wait for the real key
    if (e.key === 'Escape' && !e.ctrlKey && !e.shiftKey && !e.altKey) { stopCapture(); msg.textContent = ''; draw(); return; }
    if (e.key === 'Backspace' && !e.ctrlKey && !e.shiftKey && !e.altKey) { const {a, k} = target; stopCapture(); (work[a] || []).splice(k, 1); save(); msg.textContent = '已儲存'; draw(); return; }
    assign(keyFromEvent(e));
  };
  const onMouse = e => {
    if (e.button === 0) {   // left click: cancel unless it is on the cell being recorded
      if (!e.target.closest('.kcell.rec')) { stopCapture(); draw(); }
      return;
    }
    e.preventDefault(); e.stopPropagation();
    if (e.button === 2) { msg.textContent = '滑鼠右鍵用於選單，無法設定。'; return; }
    assign(MB(e.button));
  };
  const onCtx = e => { e.preventDefault(); e.stopPropagation(); };
  body.addEventListener('click', e => {
    if (e.target.closest('[data-kb="reset"]')) { stopCapture(); Object.keys(work).forEach(k => delete work[k]); Object.assign(work, structuredClone(DEFAULT_BINDS)); save(); msg.textContent = '已恢復預設'; draw(); return; }
    const x = e.target.closest('.kx');
    const c = e.target.closest('.kcell'); if (!c) return;
    const a = c.dataset.a, k = +c.dataset.k;
    if (x) { (work[a] || []).splice(k, 1); save(); msg.textContent = '已儲存'; stopCapture(); draw(); return; }
    stopCapture(); draw();
    const cell = tb.querySelector(`.kcell[data-a="${a}"][data-k="${Math.min(k, (work[a] || []).length)}"]`);
    target = {a, k:Math.min(k, (work[a] || []).length)};
    cell.classList.add('rec'); cell.querySelector('span').textContent = '請按下按鍵或滑鼠按鍵…'; msg.textContent = 'Esc 取消、Backspace 清除這一格';
    capture = assign;
    window.addEventListener('keydown', onKey, true); window.addEventListener('mousedown', onMouse, true);
    window.addEventListener('contextmenu', onCtx, true);
  });
  draw();
  return {body, stop:stopCapture};
}

const RIBBON_KEY = 'pdfeditor.ribbon.v1', RELEASES_URL = 'https://forgejo.taiyopen.com/tsukiinuhibi/PDFEditor/releases';

function applyRibbon(){ $('#ribbon').classList.toggle('icons-only', !!RIBBON.iconsOnly); }
let SET = null;   // the open settings window
/* 設定檔: the program's settings — the localStorage keys starting with pdfeditor. — saved to a .json file as they are
   stored, and read back (importSettings) */
const SETTINGS_SKIP = new Set(['pdfeditor.fontcat.v2', 'pdfeditor.seenversion.v1']);   // this computer's font list cache; which version's notes were seen
function settingsSnapshot(){
  const settings = {};
  try {
    for (let k = 0; k < localStorage.length; k++) { const key = localStorage.key(k); if (key && key.startsWith('pdfeditor.') && !SETTINGS_SKIP.has(key)) settings[key] = localStorage.getItem(key); }
  } catch (_) {}
  return {app:'PDF 工作台', kind:'settings', version:UPD.info ? UPD.info.version : '', exported:new Date().toISOString(), settings};
}
async function exportSettings(){
  const d = new Date(), name = `PDF工作台-設定-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}.json`;
  const bytes = new TextEncoder().encode(JSON.stringify(settingsSnapshot(), null, 2));
  if (DESK) {
    let where = null;
    const avoid = [S.handle, ...docs.filter((d, k) => k !== active).map(d => d.handle)].filter(Boolean).flatMap(h => [h.path, h.orig]).filter(Boolean);   // never over an opened PDF
    try { where = await DESK.saveAs(name, bytes, {avoid}); } catch (err) { toast('匯出失敗：' + (err.message || err), 'err'); return null; }
    if (!where) return null;   // cancelled
    toast('已匯出設定：' + String(where).split(/[\\/]/).pop()); return where;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], {type:'application/json'})); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('已匯出設定：' + name); return name;
}
// a settings file read back: {ok:false} unless it is this program's and holds at least one usable setting (a
// pdfeditor. key, not one of SETTINGS_SKIP, with a text value — anything else in it is ignored)
function parseSettingsFile(text){
  let j = null; try { j = JSON.parse(text); } catch (_) { return {ok:false}; }
  if (!j || j.app !== 'PDF 工作台' || j.kind !== 'settings' || !j.settings || typeof j.settings !== 'object' || Array.isArray(j.settings)) return {ok:false};
  const entries = Object.entries(j.settings).filter(([k, v]) => k.startsWith('pdfeditor.') && !SETTINGS_SKIP.has(k) && typeof v === 'string');
  return entries.length ? {ok:true, version:String(j.version || ''), exported:String(j.exported || ''), entries} : {ok:false};
}
function chooseSettingsFile(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) importSettings(f); };
  inp.click();
}
// asked first; the settings in the file replace the ones there, the others stay; then the program reloads (the usual
// question about unsaved changes comes first)
async function importSettings(file){
  let text = ''; try { text = await file.text(); } catch (_) {}
  const r = parseSettingsFile(text);
  if (!r.ok) { toast('這不是 PDF 工作台的設定檔', 'err'); return false; }
  if (anyDirty()) { toast('有還沒另存的修改：請先另存新檔，再匯入設定（匯入後程式會重新載入）', 'err'); return false; }
  if ($('#mask').classList.contains('show')) closeModal(true);   // the settings window: one window at a time, and the program reloads anyway
  const when = r.exported && !isNaN(Date.parse(r.exported)) ? zhDateTime(new Date(r.exported)) : '';
  const body = `<div style="max-width:440px;line-height:1.7">要匯入「${esc(file.name)}」的設定嗎？<br>這個檔案${r.version ? `由 v${esc(r.version)} ` : ''}${when ? `在 ${esc(when)} ` : ''}匯出，會取代目前的 ${r.entries.length} 項設定。
    <div class="note" style="margin-top:10px">匯入後程式會重新載入，開著的文件會關閉。</div></div>`;
  const ok = await openModal({title:'匯入設定', body, buttons:[{label:'取消', value:false}, {spacer:true}, {label:'匯入並重新載入', value:true, primary:true}]});
  if (!ok) return false;
  try { r.entries.forEach(([k, v]) => localStorage.setItem(k, v)); } catch (err) { toast('匯入失敗：' + (err.message || err), 'err'); return false; }
  location.reload();
  return true;
}

/* ====================================================================

   ==================================================================== */
function parseChangelog(text){
  const t = String(text || ''), heads = [...t.matchAll(/^## PDF 工作台 v(\d+\.\d+\.\d+)\s*$/gm)];

}
function cmpVersion(a, b){
  const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);

}
// the notes as HTML: "###" headings, "- " lists, paragraphs, **bold** and `code`; anything else stays plain text
function notesHTML(sections){
  const inline = v => esc(v).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  return sections.map(sec => {
    let html = `<h3 class="wn-v">v${esc(sec.version)}</h3>`, list = false;
    for (const raw of String(sec.md).split('\n')) {
      const line = raw.trim(), li = /^[-*]\s+(.*)$/.exec(line);
      if (li) { if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(li[1])}</li>`; continue; }
      if (list) { html += '</ul>'; list = false; }
      const h = /^#{3,}\s+(.*)$/.exec(line);
      if (h) html += `<h4>${inline(h[1])}</h4>`;

}
// which versions to show after starting version `current` (versions: newest first): those since the one last seen;

// in between: none
const SEEN_KEY = 'pdfeditor.seenversion.v1';
function whatsNewList({current, seen, used, versions}){
  if (!versions.includes(current)) return [];   // no notes for this version: nothing older under its title either
  const upTo = versions.filter(v => cmpVersion(v, current) <= 0);
  if (seen) return cmpVersion(seen, current) < 0 ? upTo.filter(v => cmpVersion(v, seen) > 0) : [];
