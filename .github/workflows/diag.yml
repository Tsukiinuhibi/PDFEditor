name: Forgejo release text fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag.yml']
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.FORGEJO_TOKEN }}
      H: https://forgejo.taiyopen.com
      R: tsukiinuhibi/PDFEditor
    steps:
      - uses: actions/checkout@v4
      - run: |
          # v1.0.16's title and notes were garbled (Windows command-line encoding); rewrite them as UTF-8
          python3 -c "import json; json.dump({'name':'PDF 工作台 v1.0.16','body':open('RELEASE_NOTES.md',encoding='utf-8').read()}, open('fix.json','w',encoding='utf-8'), ensure_ascii=False)"
          curl -fsS -X PATCH -H "Authorization: token $T" -H "Content-Type: application/json; charset=utf-8" --data-binary @fix.json "$H/api/v1/repos/$R/releases/16" | python3 -c "import json,sys; j=json.load(sys.stdin); print(j['name']); print(j['body'][:120])"
          echo "== anonymous download"; curl -s -o /dev/null -w "%{http_code}\n" "$H/$R/releases/download/v1.0.16/PDFEditor-Setup-1.0.16.exe" -r 0-99
