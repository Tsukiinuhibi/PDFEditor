name: Build & Release

# A new release is built whenever the version in package.json on main changes
# (or when run by hand from the Actions tab). The tag vX.Y.Z is created with the release.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and skip if already released
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="v$(node -p "require('./package.json').version")"
          echo "tag=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "Release $VER already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.ver.outputs.skip == 'false'

      - name: Create release tag
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Build installer and publish to GitHub Releases
        if: steps.ver.outputs.skip == 'false'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.skip == 'false'
        with:
          name: windows-installer-${{ steps.ver.outputs.tag }}
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 14
