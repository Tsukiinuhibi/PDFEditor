name: Build & Release

# A new release is built whenever the version in package.json on main changes
# (or when run by hand from the Actions tab). The tag vX.Y.Z is created with the release.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and skip if already released
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="v$(node -p "require('./package.json').version")"
          echo "tag=$VER" >> "$GITHUB_OUTPUT"
          # a release counts as done only when the updater manifest (latest.yml) is attached
          if gh release view "$VER" --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'latest.yml'; then
            echo "Release $VER is complete, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.ver.outputs.skip == 'false'

      - name: Create tag and release
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            NOTES="RELEASE_NOTES.md"; [ -f "$NOTES" ] || { echo "PDF 工作台 $TAG" > /tmp/notes.md; NOTES=/tmp/notes.md; }
            gh release create "$TAG" --target "$GITHUB_SHA" --title "PDF 工作台 $TAG" --notes-file "$NOTES"
          else
            echo "Release $TAG exists; assets will be (re)uploaded"
          fi

      - name: Build installer and publish to GitHub Releases
        if: steps.ver.outputs.skip == 'false'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.skip == 'false'
        with:
          name: windows-installer-${{ steps.ver.outputs.tag }}
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 14
